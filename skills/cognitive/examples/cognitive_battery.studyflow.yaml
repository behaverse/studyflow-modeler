  Task_WhichOne: 1020 158 120 80
  DataOutput_WhichOne_Data: 1080,238 1200,345
  Survey: 1190 158 120 80
  DataOutput_Survey_Data: 1240,238 1226,330
  Dataset_Battery: {bounds: 1195 330 50 50, label: 1180 385 80 30}
  End: {bounds: 1360 180 36 36, label: 1338 223 82 30}
