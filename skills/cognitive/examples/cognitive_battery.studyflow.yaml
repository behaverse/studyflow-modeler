id: cognitive_battery
schemas:
  behaverse: http://behaverse.org/schemas/studyflow/behaverse
  cognitive: http://behaverse.org/schemas/studyflow/cognitive
  prov: https://w3id.org/studyflow/prov
  studyflow: http://behaverse.org/schemas/studyflow/v1

Cognitive_Battery:
  type: Process
  name: Within-subject cognitive battery
  executable: false
  studyflow:Study: {}
  prov:Activity:
    - {action: created, when: "2026-07-30T22:51:29Z", with: studyflow-modeler/26.0615}
  documentation: Chains N-Back, Digit Span, SART, and Which One tasks with a timed break and a NASA-TLX survey.
  elements:
    Start:
      type: StartEvent
      name: Participant arrives
      consentFormUri: https://example.org/protocols/cognitive-battery/consent.pdf

    Instructions:
      type: Task
      name: Instructions & practice
      checklist: |-
        - [ ] Informed consent signed
        - [ ] Task instructions shown
        - [ ] Practice trials passed

    Task_NBack:
      type: Task
      name: Working memory (N-Back)
      behaverse:Task:
        instrument: NB
        timeline: XCIT_NB_01

    Task_DigitSpan:
      type: Task
      name: Verbal span (Digit Span)
      behaverse:Task:
        instrument: DS
        timeline: XCIT_DS_01

    Break:
      type: IntermediateCatchEvent
      name: Two-minute break
      timer: PT2M

    Task_SART:
      type: Task
      name: Sustained attention (SART)
      behaverse:Task:
        instrument: SART
        timeline: XCIT_SART_01

    Task_WhichOne:
      type: Task
      name: Visual WM (Which One)
      behaverse:Task:
        instrument: WO
        timeline: XCIT_WO_01
      outputs:
        DataOutput_WhichOne_Data:
          target: $Dataset_Battery

    Survey:
      type: Task
      name: Post-battery survey
      exchange: true
      cognitive:Questionnaire:
        instrument: nasa-tlx
      outputs:
        DataOutput_Survey_Data:
          target: $Dataset_Battery

    Dataset_Battery:
      type: DataStoreReference
      name: Battery trial data
      behaverse:BDMDataset:
        dataLevel: trials

    End:
      type: EndEvent
      name: Session complete

    Flow_Start_Instructions:
      source: $Start
      target: $Instructions

    Flow_Instructions_NB:
      source: $Instructions
      target: $Task_NBack

    Flow_NB_DS:
      source: $Task_NBack
      target: $Task_DigitSpan

    Flow_DS_Break:
      source: $Task_DigitSpan
      target: $Break

    Flow_Break_SART:
      source: $Break
      target: $Task_SART

    Flow_SART_WO:
      source: $Task_SART
      target: $Task_WhichOne

    Flow_WO_Survey:
      source: $Task_WhichOne
      target: $Survey

    Flow_Survey_End:
      source: $Survey
      target: $End

layout:
  Start: {bounds: 160 180 36 36, label: 146 223 66 30}
  Instructions: 250 158 120 80
  Task_NBack: 420 158 120 80
  Task_DigitSpan: 590 158 120 80
  Break: {bounds: 762 180 36 36, label: 741 223 78 30}
