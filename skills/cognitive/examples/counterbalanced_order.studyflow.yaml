id: counterbalanced_order
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Counterbalanced_Order_Collaboration:
  type: Collaboration
  name: Counterbalanced task order
  participants:
    Participants:
      name: Participants
      participantMultiplicity:
        maximum: 4
      processRef: Counterbalanced_Order
Counterbalanced_Order:
  type: studyflow:Study
  name: Counterbalanced task order
  documentation: >-
    Two tasks in both orders, one order per arm of a random gateway that deals permuted blocks of two. Every two
    participants take both orders, so the cohort of four takes each order twice, whatever the seed.
  seed: 7
  flowElements:
    Start:
      type: StartEvent
      name: Participant arrives
    Allocate_Order:
      type: cognitive:RandomGateway
      name: Which order?
      algorithm: block
      allocationRatio: "1:1"
      blockSize: 2
    Stroop_First:
      type: Task
      name: Stroop task
      extensionElements:
        - type: cognitive:CognitiveTask
          platform: jspsych
    Flanker_Second:
      type: Task
      name: Flanker task
      extensionElements:
        - type: cognitive:CognitiveTask
          platform: jspsych
    Flanker_First:
      type: Task
      name: Flanker task
      extensionElements:
        - type: cognitive:CognitiveTask
          platform: jspsych
    Stroop_Second:
      type: Task
      name: Stroop task
      extensionElements:
        - type: cognitive:CognitiveTask
          platform: jspsych
    Merge_Order:
      type: ExclusiveGateway
    End:
      type: EndEvent
      name: Session complete
    Flow_Start_Allocate: Start -> Allocate_Order
    Flow_Order_Stroop_First:
      name: Stroop first
      sourceRef: Allocate_Order
      targetRef: Stroop_First
    Flow_Order_Flanker_First:
      name: Flanker first
      sourceRef: Allocate_Order
      targetRef: Flanker_First
    Flow_Stroop_Flanker: Stroop_First -> Flanker_Second
    Flow_Flanker_Stroop: Flanker_First -> Stroop_Second
    Flow_Flanker_Merge: Flanker_Second -> Merge_Order
    Flow_Stroop_Merge: Stroop_Second -> Merge_Order
    Flow_Merge_End: Merge_Order -> End
layout:
