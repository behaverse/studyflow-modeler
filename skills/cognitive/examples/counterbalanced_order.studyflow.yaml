id: counterbalanced_order
schemas:
  cognitive: http://behaverse.org/schemas/studyflow/cognitive
  studyflow: http://behaverse.org/schemas/studyflow/v1

Counterbalanced_Order_Collaboration:
  type: Collaboration
  name: Counterbalanced task order
  pools:
    Participants:
      name: Participants
      multiplicity:
        maximum: 4
      process: $Counterbalanced_Order

Counterbalanced_Order:
  type: Process
  name: Counterbalanced task order
  studyflow:Study:
    seed: 7
  documentation: >-
    Two tasks in both orders, one order per arm of a random gateway that deals permuted blocks of two. Every two
    participants take both orders, so the cohort of four takes each order twice, whatever the seed.
  elements:
    Start:
      type: StartEvent
      name: Participant arrives

    Allocate_Order:
      type: ExclusiveGateway
      name: Which order?
      cognitive:RandomGateway:
        algorithm: block
        allocationRatio: "1:1"
        blockSize: 2

    Stroop_First:
      type: Task
      name: Stroop task
      cognitive:CognitiveTask:
        platform: jspsych

    Flanker_Second:
      type: Task
      name: Flanker task
      cognitive:CognitiveTask:
        platform: jspsych

    Flanker_First:
      type: Task
      name: Flanker task
      cognitive:CognitiveTask:
        platform: jspsych

    Stroop_Second:
      type: Task
      name: Stroop task
      cognitive:CognitiveTask:
        platform: jspsych

    Merge_Order:
      type: ExclusiveGateway

    End:
      type: EndEvent
      name: Session complete

    Flow_Start_Allocate:
      source: $Start
      target: $Allocate_Order

    Flow_Order_Stroop_First:
      name: Stroop first
      source: $Allocate_Order
      target: $Stroop_First

    Flow_Order_Flanker_First:
      name: Flanker first
      source: $Allocate_Order
      target: $Flanker_First

    Flow_Stroop_Flanker:
      source: $Stroop_First
      target: $Flanker_Second

    Flow_Flanker_Stroop:
      source: $Flanker_First
      target: $Stroop_Second

    Flow_Flanker_Merge:
      source: $Flanker_Second
      target: $Merge_Order

    Flow_Stroop_Merge:
      source: $Stroop_Second
      target: $Merge_Order

    Flow_Merge_End:
      source: $Merge_Order
      target: $End

layout:
  Participants: {bounds: 120 60 800 300, horizontal: true}
  Start: {bounds: 182 192 36 36, label: 160 235 80 30}
  Allocate_Order: {bounds: 270 185 50 50, markerVisible: true, label: 225 240 60 15}
  Stroop_First: 380 100 120 80
  Flanker_Second: 550 100 120 80
  Flanker_First: 380 240 120 80
  Stroop_Second: 550 240 120 80
  Merge_Order: {bounds: 720 185 50 50, markerVisible: true}
  End: {bounds: 832 192 36 36, label: 810 235 80 30}
  Flow_Start_Allocate: 218,210 270,210
  Flow_Order_Stroop_First: {waypoint: "295,185 295,140 380,140", label: 302 118 70 15}
  Flow_Order_Flanker_First: {waypoint: "295,235 295,280 380,280", label: 302 258 70 15}
  Flow_Stroop_Flanker: 500,140 550,140
  Flow_Flanker_Stroop: 500,280 550,280
  Flow_Flanker_Merge: 670,140 745,140 745,185
  Flow_Stroop_Merge: 670,280 745,280 745,235
  Flow_Merge_End: 770,210 832,210
