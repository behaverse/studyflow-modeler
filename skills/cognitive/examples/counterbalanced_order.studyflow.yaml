  Flanker_First:
    bounds: 380 240 120 80
  Stroop_Second:
    bounds: 550 240 120 80
  Merge_Order:
    bounds: 720 185 50 50
    isMarkerVisible: true
  End:
    bounds: 832 192 36 36
    label: 810 235 80 30
