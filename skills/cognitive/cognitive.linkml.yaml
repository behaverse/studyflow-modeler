# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json

id: http://behaverse.org/schemas/studyflow/cognitive
name: cognitive
title: Cognitive
description: >-
  Cognitive and behavioral research: tasks, questionnaires, instructions,
  rest periods, screening and allocation gateways, and participant pools.
license: MIT
version: '26.9.1'
rank: 3
default_prefix: cognitive
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  cognitive: http://behaverse.org/schemas/studyflow/cognitive/
  studyflow: http://behaverse.org/schemas/studyflow/v1/
  bpmn: http://www.omg.org/spec/BPMN/20100524/MODEL
imports:
  - linkml:types
  - ../studyflow/studyflow.linkml

enums:
  AllocationAlgorithmEnum:
    description: How participants are allocated to arms.
    permissible_values:
      simple:
        title: Simple randomization
        description: Each participant is drawn independently.
      block:
        title: Block randomization
        description: Permuted blocks keep arm sizes balanced over time.
      minimization:
        title: Minimization
        description: Each allocation minimizes covariate imbalance so far.
      alternation:
        title: Alternation
        description: Arms taken in turn; predictable, so rarely acceptable.
  ExperimentSoftwareEnum:
    description: Software that delivers a task.
    permissible_values:
      psychopy: { title: PsychoPy }
      jspsych: { title: jsPsych }
      labjs: { title: lab.js }
      opensesame: { title: OpenSesame }
      psytoolkit: { title: PsyToolkit }
      gorilla: { title: Gorilla }
      inquisit: { title: Inquisit }
      eprime: { title: E-Prime }
      psychtoolbox: { title: Psychtoolbox }
      presentation: { title: Presentation }
      unity: { title: Unity }
  QuestionnaireInstrumentEnum:
    description: Standardized questionnaires in common use.
    permissible_values:
      phq-9: { title: PHQ-9 (depression) }
      gad-7: { title: GAD-7 (anxiety) }
      bdi-ii: { title: BDI-II (depression) }
      stai: { title: STAI (state-trait anxiety) }
      pss: { title: PSS (perceived stress) }
      dass-21: { title: 'DASS-21 (depression, anxiety, stress)' }
      panas: { title: PANAS (affect) }
      who-5: { title: WHO-5 (well-being) }
      bfi: { title: BFI (Big Five personality) }
      psqi: { title: PSQI (sleep quality) }
      asrs: { title: ASRS (adult ADHD) }
      nasa-tlx: { title: NASA-TLX (workload) }
      sf-36: { title: SF-36 (health-related quality of life) }
  # Coarse on purpose: a skill adds the kinds it knows with `apply_to: [ActorTypeEnum]` (agentic adds `llm`).
  ActorTypeEnum:
    description: What a participant pool stands for.
    permissible_values:
      human:
        title: Human
      software:
        title: Software
        description: A program that takes part, such as an RL policy or a rule-based bot.
      hardware:
        title: Hardware
        description: A device that takes part, such as an amplifier sending triggers.
  RestEyesEnum:
    description: Eye condition during a rest period.
    permissible_values:
      open: { title: Eyes open }
      closed: { title: Eyes closed }
      alternating: { title: Alternating }

classes:
  Configurations:
    description: Settings the delivering software reads, as YAML.
    attributes:
      value:
        range: YAMLString
        annotations:
          element: true
          body: true

  # A cognitive task is an exchange between the software that presents it and the actor who takes it: a human,
  # a model (`Actor`), or a robot (`reachy:Robot`). The actor is what the diagram draws, most explicit first:
  # the participant on the task's receiving band, else the other end of a message flow touching the task, else
  # the pool the task sits in. A task naming no one on its bands is drawn as a plain task. Data edges still
  # apply (`studyflow:ChoreographyData`).
  CognitiveTask:
    description: A cognitive test an actor takes (working memory, attention, ...), presented by the study's software.
    implements:
      - bpmn:ChoreographyTask
    annotations:
      icon: iconify ph--puzzle-piece
      roles:
        value: [instrument]
      # The upper band of the task: a template over its attributes, read raw.
      presenter: "{instrument}"
    attributes:
      instrument:
        description: Software that delivers the task and reads its configurations.
        range: ExperimentSoftwareEnum
        rank: 1
        annotations:
          editable: true
      construct:
        description: What the task measures (`working memory`, `inhibition`).
        rank: 2
        in_subset:
          - Documentation
        annotations:
          optional: true
      implementation:
        description: Where the task's code lives, as `<scheme>://<ref>[@<version>]`.
        in_subset:
          - Execution
      configurations:
        description: Settings the software reads, as YAML (trials, timing, blocks).
        range: Configurations
        in_subset:
          - Execution
        annotations:
          element: true

  Rest:
    description: A break, or a resting-state period (eyes open or closed).
    implements:
      - bpmn:Task
    annotations:
      icon: iconify ph--coffee
    attributes:
      # Not `duration`: the Scheduling trait already puts a Gantt `duration` on every activity.
      restDuration:
        description: How long the rest lasts.
        range: float
        ifabsent: float(60)
        rank: 1
        annotations:
          unit: s
      eyes:
        description: Eyes open, closed, or alternating.
        range: RestEyesEnum
        ifabsent: string(open)
        rank: 2

  Questionnaire:
    description: A self-report form the participant fills in.
    implements:
      - bpmn:Task
    annotations:
      icon: iconify ph--clipboard-text
      roles:
        value: [instrument]
    attributes:
      instrument:
        description: A standard questionnaire, or a name of your own.
        range: QuestionnaireInstrumentEnum
        annotations:
          editable: true

  Instruction:
    description: 'Text the participant reads: instructions, a briefing, a debrief.'
    implements:
      - bpmn:Task
    annotations:
      icon: iconify ph--info
    attributes:
      content:
        description: What the participant reads, in markdown.
        range: MarkdownString

  RandomGateway:
    description: Allocates each participant to one outgoing branch at random.
    implements:
      - bpmn:ExclusiveGateway
    annotations:
      icon: iconify ph--dice-five
      # The runner reads this and picks a branch at random instead of evaluating conditions.
      branching: random
    attributes:
      algorithm:
        description: How participants are allocated to arms.
        range: AllocationAlgorithmEnum
        ifabsent: string(simple)
        rank: 1
      allocationRatio:
        description: Arm sizes relative to each other, in branch order (`1:1`, `2:1`).
        rank: 2
        annotations:
          optional: true
      blockSize:
        description: Participants per permuted block.
        range: integer
        ifabsent: int(4)
        rank: 3
        annotations:
          condition:
            value:
              algorithm: block
      stratifyBy:
        description: Variable to randomize within, so arms stay balanced on it (`age_band`).
        rank: 4
        annotations:
          optional: true
      strata:
        description: 'The strata, one per entry (`age_band: 18-29`).'
        range: MarkdownString
        multivalued: true
        rank: 5
        annotations:
          condition:
            value:
              stratifyBy: $set

  EligibilityGateway:
    description: Lets eligible participants through; everyone else is screened out.
    implements:
      - bpmn:ExclusiveGateway
    annotations:
      icon: iconify ph--funnel
    attributes:
      inclusionCriteria:
        description: What a participant must meet, one per entry (`Age 18 to 65`).
        range: MarkdownString
        multivalued: true
      exclusionCriteria:
        description: What rules a participant out, one per entry.
        range: MarkdownString
        multivalued: true

  Actor:
    description: 'A pool of participants: who or what takes part in the study.'
    implements:
      - bpmn:Participant
    annotations:
      icon: iconify ph--users-three
      # What an actor that only takes bands can be: one kind per literal of this enum attribute.
      participantKind: actorType
    attributes:
      actorType:
        description: Kind of actor this pool represents.
        range: ActorTypeEnum
        ifabsent: string(human)
      implementation:
        description: The program, model, or device, as `<scheme>://<ref>` (`claude://claude-haiku-4-5`, `ollama://gemma4`, `lsl://triggers`).
        annotations:
          condition:
            value:
              actorType:
                $not: human

annotations:
  icon: iconify tabler--hexagon-letter-c
  required: true
  # Palette flyout entries: the elements a drop adds, spelled as in a `.studyflow.yaml` file.
  templates:
    value:
      # Stratified allocation is a RandomGateway with `stratifyBy` set, not its own type.
      - description: Stratified block randomization, balanced within each stratum.
        elements:
          Stratified_allocation:
            type: ExclusiveGateway
            name: Stratified allocation
            documentation: |
              Randomizes within each stratum of `stratifyBy`, in permuted blocks,
              so arms stay balanced on the covariate. List the strata one per entry.
            extensionElements:
              - type: cognitive:RandomGateway
                studyflow:icon: iconify ph--stack
                algorithm: block
                stratifyBy: age_band
                strata:
                  - "age_band: 18-29"
                  - "age_band: 30-44"
                  - "age_band: 45-65"
      # A video game is a CognitiveTask whose instrument is a game engine, not its own type.
      - description: A video game used as a paradigm or measurement instrument.
        elements:
          Video_game:
            type: ChoreographyTask
            name: Video game
            documentation: |
              Set the game engine in `instrument` and its levels, difficulty, and
              scoring in `configurations`.
            extensionElements:
              - type: cognitive:CognitiveTask
                studyflow:icon: iconify ph--game-controller
                instrument: unity
                configurations: |
                  levels:
                  difficulty:
                  scoring:
