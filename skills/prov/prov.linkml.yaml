# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json

id: https://w3id.org/studyflow/prov
name: prov
title: Provenance
description: >-
  The provenance timeline: who acted on this studyflow, with what tool, and when.
  The document-level timeline lives in `state._meta.prov` as plain records with these
  fields; `prov:Activity` elements remain the per-element records.
license: MIT
version: '26.9.1'
rank: 2
default_prefix: prov
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  prov: https://w3id.org/studyflow/prov/
imports:
  - linkml:types

classes:
  # Entries run oldest first. The document-level timeline (created, modified,
  # imported, and one `executed` per run) is the `state._meta.prov` list of the
  # `state` tree, each item a plain record with the fields below.
  # `prov:Activity` elements are the per-element records a runner stamps on
  # flow elements (`executed`, `invalidated`, `reused`).
  Activity:
    description: 'One per-element record: what a run did to this element, and when.'
    attributes:
      action:
        description: What happened (`created`, `modified`, `imported`, `executed`, `invalidated`, `reused`).
      when:
        description: When it happened, as an ISO 8601 timestamp.
      who:
        description: 'Who acted: a name, an email, or an ORCID.'
        annotations:
          optional: true
      with:
        description: The tool that acted, as `name/version`.
        annotations:
          optional: true
      what:
        # For `invalidated` and `reused`, the `when` of the entry it refers to.
        description: Element ids the action touched, space-separated.
        annotations:
          optional: true
      run:
        description: For `executed`, the run id (the repository holding its outputs).
        annotations:
          optional: true
      seed:
        description: For `executed`, the root seed the run used.
        range: integer
        annotations:
          optional: true
      note:
        description: One line of free text.
        annotations:
          optional: true

annotations:
  icon: iconify tabler--history
  optional: false
