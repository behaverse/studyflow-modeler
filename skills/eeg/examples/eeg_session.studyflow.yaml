id: eeg_session
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
EEG_Session:
  type: studyflow:Study
  name: EEG session
  documentation: An EEG session covering cap fitting through data export.
  flowElements:
    Start:
      type: StartEvent
      name: Start
    Mount_Cap:
      type: ManualTask
      name: Mount cap & check impedance
      documentation: |
        Fit the cap, place the electrodes, and check that every one of them
        makes good contact before recording starts.
    Baseline:
      type: cognitive:Rest
      name: Resting baseline
      eyes: closed
      eventDefinitions:
        Baseline_Timer:
          type: TimerEventDefinition
          timeDuration: PT2M
    Cognitive_Task:
      type: Task
      name: Cognitive task
      extensionElements:
        - type: cognitive:CognitiveTask
          platform: psychopy
      dataInputAssociations:
        In_Cognitive_Task_Parameters:
          sourceRef:
            - Cognitive_Task_Parameters
    Cognitive_Task_Parameters:
      type: studyflow:Parameters
      name: Parameters
      values: |
        triggerChannel: markers  # stimulus marker stream sent with biosignals
    Export_Recording:
      type: ServiceTask
      name: Export recording
      documentation: Persist the recording to a structured dataset (BIDS, BDM, or custom).
      additionalArguments:
        output_folder: bids/
      implementation: python://datatrove.pipeline.writers.ParquetWriter
    End:
      type: EndEvent
      name: End
    Flow_Start_Mount: Start -> Mount_Cap
    Flow_Mount_Baseline: Mount_Cap -> Baseline
    Flow_Baseline_Task: Baseline -> Cognitive_Task
    Flow_Task_Export: Cognitive_Task -> Export_Recording
    Flow_Export_End: Export_Recording -> End
