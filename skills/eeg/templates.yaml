- description: An EEG session pool - fit the cap, record a baseline, run a task, export.
  elements:
    EEG_session:
      type: Participant
      name: EEG session
      documentation: An EEG session covering cap fitting through data export.
      processRef: EEG_session_flow
      extensionElements:
        - type: eeg:Session
          studyflow:icon: iconify ph--head-circuit
          device: brainproducts_actichamp
          modalities:
            - eeg
          montage: 10-20
          reference: cz
          lineFrequency: "50"
    EEG_session_flow:
      type: Process
      flowElements:
        eeg_start:
          type: StartEvent
          name: Start
          bounds: 100 200 36 36
        eeg_mount:
          type: ManualTask
          name: Mount cap & check impedance
          documentation: |
            Fit the cap, place the electrodes, and check that every one of them
            makes good contact before recording starts.
          bounds: 200 178 100 80
        eeg_baseline:
          type: Task
          name: Resting baseline
          extensionElements:
            - type: cognitive:Rest
              studyflow:icon: iconify ph--brain
              restDuration: 120
              eyes: closed
          bounds: 360 178 100 80
        eeg_task:
          type: ChoreographyTask
          name: Cognitive task
          extensionElements:
            - type: cognitive:CognitiveTask
              studyflow:icon: iconify ph--puzzle-piece
              instrument: psychopy
              configurations: |
                triggerChannel: markers  # stimulus marker stream sent with biosignals
          bounds: 520 178 100 80
        eeg_export:
          type: ServiceTask
          name: Export recording
          documentation: Persist the recording to a structured dataset (BIDS, BDM, or custom).
          implementation: python://datatrove.pipeline.writers.ParquetWriter
          additionalArguments: "output_folder: bids/"
          bounds: 680 178 100 80
        eeg_end:
          type: EndEvent
          name: End
          bounds: 840 200 36 36
        Flow_eeg_start_eeg_mount: eeg_start -> eeg_mount
        Flow_eeg_mount_eeg_baseline: eeg_mount -> eeg_baseline
        Flow_eeg_baseline_eeg_task: eeg_baseline -> eeg_task
        Flow_eeg_task_eeg_export: eeg_task -> eeg_export
        Flow_eeg_export_eeg_end: eeg_export -> eeg_end

- description: Filter EEG data and remove artifacts in one step.
  elements:
    EEGPrep:
      type: ServiceTask
      name: EEGPrep
      studyflow:icon: iconify ph--wave-sine
      documentation: Filters, cleans, and normalizes BIDS EEG data (EEGLAB clean_rawdata, ASR, ICA + ICLabel).
      implementation: docker://sccn/eegprep
      additionalArguments: |
        flatline_criterion: 5    # seconds of flatline tolerated per channel
        highpass_hz: 1
        lowpass_hz: 100
        asr_criterion: 20        # ASR burst-removal cutoff
        ica: true                # run ICA + ICLabel artifact classification

- description: Preprocess a BIDS EEG or MEG dataset with the MNE-BIDS-Pipeline.
  elements:
    MNE_BIDS_Pipeline:
      type: ServiceTask
      name: MNE-BIDS-Pipeline
      studyflow:icon: iconify ph--wave-sine
      documentation: Filtering, epoching, SSP/ICA artifact removal, and evoked responses, driven by one config file.
      implementation: python://mne_bids_pipeline@1.9.0
      additionalArguments: |
        config: config.py                  # bids_root, task, subjects, filters, ICA
        steps: preprocessing               # init | preprocessing | sensor | source | all

- description: Preprocess fMRI data for a single subject.
  elements:
    fMRIPrep:
      type: ServiceTask
      name: fMRIPrep
      studyflow:icon: iconify ph--brain
      documentation: Preprocesses BIDS fMRI data into normalized, denoised images.
      implementation: docker://nipreps/fmriprep@23.2.0
      additionalArguments: |
        output_spaces: MNI152NLin2009cAsym   # normalized-output space(s)
        skull_strip_t1w: force               # auto | force | skip
        use_aroma: false                     # ICA-AROMA denoising
        use_syn_sdc: false                   # fieldmap-less SDC (SyN)
