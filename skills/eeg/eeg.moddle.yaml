# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: EEG & Biosignals
prefix: eeg
description: >-
  EEG and biosignal acquisition: sessions, recordings, and preprocessing presets.
uri: https://w3id.org/studyflow/eeg
icon: iconify tabler--hexagon-letter-e
order: 101
xml:
  tagAlias: lowerCase
version: 26.0902

enumerations:
  # Amplifiers and headsets in common use; the attribute is editable, so any
  # other system name is accepted as free text.
  - name: DeviceEnum
    description: Amplifier or headset the session is recorded with.
    literalValues:
      - name: Brain Products actiCHamp
        value: brainproducts_actichamp
      - name: Brain Products BrainAmp
        value: brainproducts_brainamp
      - name: Biosemi ActiveTwo
        value: biosemi_activetwo
      - name: EGI / Magstim GES
        value: egi_ges
      - name: ANT Neuro eego
        value: ant_eego
      - name: g.tec g.USBamp
        value: gtec_usbamp
      - name: Neuroelectrics Enobio
        value: neuroelectrics_enobio
      - name: Compumedics Neuroscan
        value: neuroscan
      - name: Bittium NeurOne
        value: bittium_neurone
      - name: Emotiv EPOC
        value: emotiv_epoc
      - name: InteraXon Muse
        value: muse
      - name: OpenBCI Cyton
        value: openbci_cyton
      - name: OpenBCI Ganglion
        value: openbci_ganglion
      - name: OpenBCI Galea
        value: openbci_galea
      - name: Simulated
        value: simulated
        description: Synthetic signal for testing a pipeline without hardware.
  - name: ReferenceEnum
    description: Reference scheme the channels are recorded against.
    literalValues:
      - name: Cz
        value: cz
      - name: FCz
        value: fcz
      - name: Linked mastoids
        value: linked_mastoids
      - name: Average reference
        value: average
      - name: REST (infinity reference)
        value: rest
      - name: CMS/DRL (Biosemi)
        value: cms_drl
  - name: MontageEnum
    description: Electrode layout the channel names follow.
    literalValues:
      - name: 10-20
        value: 10-20
      - name: 10-10
        value: 10-10
      - name: 10-5
        value: 10-5
      - name: Biosemi 64
        value: biosemi64
      - name: EGI HydroCel GSN 128
        value: gsn-hydrocel-128
      - name: EGI HydroCel GSN 256
        value: gsn-hydrocel-256
      - name: Custom
        value: custom
  - name: LineFrequencyEnum
    description: Mains frequency the recording site runs on.
    literalValues:
      - name: 50 Hz (Europe, Asia, Africa, Australia)
        value: "50"
      - name: 60 Hz (Americas)
        value: "60"

types:
  - name: Session
    description: One acquisition session, with the amplifier settings shared by every phase in it.
    superClass:
      - bpmn:Participant
    meta:
      icon: iconify mdi--head-flash-outline
    properties:
      # `device` infers the `acquisition` role; keep the name.
      - name: device
        description: Amplifier or headset used; any other system name is accepted.
        isAttr: true
        type: DeviceEnum
        default: brainproducts_actichamp
        meta:
          order: 0
          editable: true
      # Plain strings, one per entry: a non-attribute enum list cannot serialize through moddle.
      # Vocabulary: eeg, meg, ieeg, emg, ecg, eog, eda, ppg, respiration, nirs,
      # eye_tracking, head_imu, motion, audio.
      - name: modalities
        description: Signals recorded in this session, one per entry (`eeg`, `ecg`, `eog`, `eye_tracking`).
        isAttr: false
        isMany: true
        type: String
        meta:
          order: 1
      - name: montage
        description: Electrode layout the channel names follow.
        isAttr: true
        type: MontageEnum
        default: 10-20
        meta:
          order: 2
          editable: true
      - name: reference
        description: Reference scheme the channels are recorded against.
        isAttr: true
        type: ReferenceEnum
        default: cz
        meta:
          order: 3
          editable: true
      - name: ground
        description: Electrode position used as ground (`AFz`, `Fpz`).
        isAttr: true
        type: String
        meta:
          order: 4
          optional: true
      - name: lineFrequency
        description: Mains frequency at the recording site, for notch filtering.
        isAttr: true
        type: LineFrequencyEnum
        default: "50"
        meta:
          order: 5
      - name: impedanceThreshold
        description: Highest electrode impedance accepted before recording.
        isAttr: true
        type: Real
        default: 10
        meta:
          order: 6
          unit: kΩ

  # Sampling rate, channel count, units, duration, and on-disk format come
  # from `studyflow:Timeseries`; `samplingRate` already infers the `signal` role.
  - name: Recording
    description: The biosignal recording a session produces.
    superClass:
      - studyflow:Timeseries
    meta:
      roles:
        - acquisition
      icon: iconify mdi--waveform
    properties:
      # Same vocabulary as Session#modalities.
      - name: modalities
        description: Signals in this recording, one per entry (`eeg`, `ecg`, `eog`, `eye_tracking`).
        isAttr: false
        isMany: true
        type: String
        meta:
          order: 6
          categories:
            - Data
      - name: eventChannel
        description: Name of the trigger channel or marker stream (`Status`, `TRIGGER`, an LSL stream).
        isAttr: true
        type: String
        meta:
          order: 7
          optional: true
          categories:
            - Data

examples:
  - title: EEG session
    description: An EEG session - fit the cap, record a baseline, run a task, export.
    icon: iconify mdi--head-flash-outline
    studyflow:
      id: eeg_session
      definitions:
        targetNamespace: http://bpmn.io/schema/bpmn
      EEG_Session:
        type: bpmn:Process
        name: EEG session
        documentation: An EEG session covering cap fitting through data export.
        extensionElements:
          - type: studyflow:Study
        flowElements:
          Start:
            type: bpmn:StartEvent
            name: Start
          Mount_Cap:
            type: bpmn:ManualTask
            name: Mount cap & check impedance
            documentation: |
              Fit the cap, place the electrodes, and check that every one of them
              makes good contact before recording starts.
          Baseline:
            type: bpmn:Task
            name: Resting baseline
            extensionElements:
              - type: cognitive:Rest
                restDuration: 120
                eyes: closed
          Cognitive_Task:
            type: bpmn:Task
            name: Cognitive task
            extensionElements:
              - type: cognitive:CognitiveTask
                instrument: psychopy
                configurations: |
                  triggerChannel: markers  # stimulus marker stream sent with biosignals
          Export_Recording:
            type: bpmn:ServiceTask
            name: Export recording
            documentation: Persist the recording to a structured dataset (BIDS, BDM, or custom).
            implementation: python://datatrove.pipeline.writers.ParquetWriter
            additionalArguments: "output_folder: bids/"
          End:
            type: bpmn:EndEvent
            name: End
          Flow_Start_Mount:
            type: bpmn:SequenceFlow
            sourceRef: Start
            targetRef: Mount_Cap
          Flow_Mount_Baseline:
            type: bpmn:SequenceFlow
            sourceRef: Mount_Cap
            targetRef: Baseline
          Flow_Baseline_Task:
            type: bpmn:SequenceFlow
            sourceRef: Baseline
            targetRef: Cognitive_Task
          Flow_Task_Export:
            type: bpmn:SequenceFlow
            sourceRef: Cognitive_Task
            targetRef: Export_Recording
          Flow_Export_End:
            type: bpmn:SequenceFlow
            sourceRef: Export_Recording
            targetRef: End

templates:
  - description: An EEG session pool - fit the cap, record a baseline, run a task, export.
    object:
      type: Session
      bpmn:name: EEG session
      bpmn:documentation: An EEG session covering cap fitting through data export.
      icon: iconify mdi--head-flash-outline
      keywords:
        - eeg
        - session
        - biosignal
        - acquisition
        - amplifier
      device: brainproducts_actichamp
      modalities:
        - eeg
      montage: 10-20
      reference: cz
      lineFrequency: "50"
      flowElements:
        - id: eeg_start
          type: bpmn:StartEvent
          bpmn:name: Start
          x: 100
          y: 200
        - id: eeg_mount
          type: bpmn:ManualTask
          bpmn:name: Mount cap & check impedance
          icon: iconify mdi--head-plus-outline
          bpmn:documentation: |
            Fit the cap, place the electrodes, and check that every one of them
            makes good contact before recording starts.
          x: 200
          y: 178
        - id: eeg_baseline
          type: cognitive:Rest
          bpmn:name: Resting baseline
          icon: iconify mdi--brain
          restDuration: 120
          eyes: closed
          x: 360
          y: 178
        - id: eeg_task
          type: cognitive:CognitiveTask
          bpmn:name: Cognitive task
          icon: iconify mdi--puzzle-outline
          instrument: psychopy
          configurations: |
            triggerChannel: markers  # stimulus marker stream sent with biosignals
          x: 520
          y: 178
        - id: eeg_export
          type: bpmn:ServiceTask
          bpmn:name: Export recording
          icon: iconify mdi--database-arrow-down-outline
          bpmn:documentation: Persist the recording to a structured dataset (BIDS, BDM, or custom).
          implementation: python://datatrove.pipeline.writers.ParquetWriter
          additionalArguments: "output_folder: bids/"
          x: 680
          y: 178
        - id: eeg_end
          type: bpmn:EndEvent
          bpmn:name: End
          x: 840
          y: 200
        - type: bpmn:SequenceFlow
          sourceRef: eeg_start
          targetRef: eeg_mount
        - type: bpmn:SequenceFlow
          sourceRef: eeg_mount
          targetRef: eeg_baseline
        - type: bpmn:SequenceFlow
          sourceRef: eeg_baseline
          targetRef: eeg_task
        - type: bpmn:SequenceFlow
          sourceRef: eeg_task
          targetRef: eeg_export
        - type: bpmn:SequenceFlow
          sourceRef: eeg_export
          targetRef: eeg_end

  - description: Filter EEG data and remove artifacts in one step.
    object:
      bpmn:name: EEGPrep
      type: bpmn:ServiceTask
      bpmn:documentation: Filters, cleans, and normalizes BIDS EEG data (EEGLAB clean_rawdata, ASR, ICA + ICLabel).
      icon: iconify mdi--sine-wave
      keywords:
        - eeg
        - eegprep
        - preprocess
        - cleanartifacts
        - neuroimaging
      implementation: docker://sccn/eegprep
      additionalArguments: |
        flatline_criterion: 5    # seconds of flatline tolerated per channel
        highpass_hz: 1
        lowpass_hz: 100
        asr_criterion: 20        # ASR burst-removal cutoff
        ica: true                # run ICA + ICLabel artifact classification

  - description: Preprocess a BIDS EEG or MEG dataset with the MNE-BIDS-Pipeline.
    object:
      bpmn:name: MNE-BIDS-Pipeline
      type: bpmn:ServiceTask
      bpmn:documentation: Filtering, epoching, SSP/ICA artifact removal, and evoked responses, driven by one config file.
      icon: iconify mdi--sine-wave
      keywords:
        - eeg
        - meg
        - mne
        - preprocess
        - bids
      implementation: python://mne_bids_pipeline@1.9.0
      additionalArguments: |
        config: config.py                  # bids_root, task, subjects, filters, ICA
        steps: preprocessing               # init | preprocessing | sensor | source | all

  - description: Preprocess fMRI data for a single subject.
    object:
      bpmn:name: fMRIPrep
      type: bpmn:ServiceTask
      bpmn:documentation: Preprocesses BIDS fMRI data into normalized, denoised images.
      icon: iconify mdi--brain
      keywords:
        - fmri
        - fmriprep
        - preprocess
        - bids
        - neuroimaging
      implementation: docker://nipreps/fmriprep@23.2.0
      additionalArguments: |
        output_spaces: MNI152NLin2009cAsym   # normalized-output space(s)
        skull_strip_t1w: force               # auto | force | skip
        use_aroma: false                     # ICA-AROMA denoising
        use_syn_sdc: false                   # fieldmap-less SDC (SyN)
