# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: EEG & Biosignals
prefix: eeg
description: >-
  EEG and biosignal acquisition: time series, event tables, BIDS datasets, sessions, recordings, and
  preprocessing presets.
uri: https://w3id.org/studyflow/eeg
icon: iconify tabler--hexagon-letter-e
order: 101
xml:
  tagAlias: lowerCase
version: '26.9.1'

enumerations:
  - extends: studyflow:DatasetFormatEnum
    description: Adds the neuroimaging and neurophysiology standards to the dataset formats.
    literalValues:
      - name: BIDS (Brain Imaging Data Structure)
        value: bids
        # The BIDS logotype, which a data store draws across its body.
        icon: &bids-logotype "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 135 43.461' fill='%2378716c'%3E%3Cpath d='m29.99,21.107l-0.961,-0.458l0.814,-0.702a10.755,10.755 0 0 0 3.827,-8.452c0,-6.731 -4.513,-10.019 -13.782,-10.019l-18.051,0l0,40.517l17.542,0c5.843,0 15.644,-1.525 15.644,-11.747c0.013,-4.535 -1.638,-7.519 -5.032,-9.138m-11.673,-12.353c5.048,0 7.106,1.404 7.106,4.836c0,1.282 -0.616,4.231 -6.33,4.231l-9.388,0l0,-6.919l-4.993,-2.148l13.605,0zm0.116,25.961l-8.727,0l0,-9.903l9.208,0c3.872,0 7.83,0.58 7.83,4.891c0.007,4.398 -3.993,5 -8.311,5l0,0.012z'/%3E%3Cpath d='m42.724,1.476l7.875,0l0,40.506l-7.875,0l0,-40.506z'/%3E%3Cpath d='m72.676,1.476l-12.593,0l0,40.516l11.692,0c8.195,0 14.356,-1.949 18.311,-5.789s6.009,-8.866 6.009,-15.003c0.003,-7.372 -3.039,-19.725 -23.42,-19.725m-0.122,33.227l-4.59,0l0,-23.627l-5.638,-2.321l10.237,0c10.202,0 15.384,4.167 15.384,12.436c-0.019,8.971 -5.192,13.513 -15.394,13.513'/%3E%3Cpath d='m133.16,30.351a10.255,10.255 0 0 0 -1.602,-5.715c-2.144,-3.132 -5.324,-4.394 -9.58,-5.833c-1.509,-0.513 -3.007,-0.914 -4.455,-1.298c-4.128,-1.1 -7.692,-2.048 -7.692,-5.055c0,-2.122 1.211,-4.654 6.987,-4.654c4.003,0 7.465,1.548 10.577,4.734l5.227,-5.058c-3.75,-4.676 -8.817,-6.952 -15.465,-6.952c-4.596,0 -8.372,1.211 -11.218,3.606s-4.301,5.128 -4.301,8.442c0,7.138 5.375,9.766 11.18,11.539c1.417,0.477 2.734,0.836 4.007,1.186c2.414,0.664 4.487,1.234 6.116,2.311c1.308,0.872 2.058,2.134 2.058,3.465s-0.705,2.513 -1.923,3.333c-1.164,0.84 -2.904,1.253 -5.301,1.253c-5.009,0 -9.542,-2.481 -12.548,-6.843l-5.718,4.763c3.356,5.961 10.064,9.366 18.507,9.366c4.384,0 7.936,-1.199 10.862,-3.667c2.84,-2.352 4.285,-5.352 4.285,-8.923'/%3E%3C/svg%3E"
      - name: NWB (Neurodata Without Borders)
        value: nwb
  - name: BIDSDataTypeEnum
    description: BIDS data type (the modality folder).
    literalValues:
      - name: anat (anatomical MRI)
        value: anat
      - name: beh (behavioral)
        value: beh
      - name: dwi (diffusion MRI)
        value: dwi
      - name: eeg (electroencephalography)
        value: eeg
      - name: func (functional MRI)
        value: func
      - name: ieeg (intracranial EEG)
        value: ieeg
      - name: meg (magnetoencephalography)
        value: meg
      - name: micr (microscopy)
        value: micr
      - name: motion (motion capture)
        value: motion
      - name: mrs (magnetic resonance spectroscopy)
        value: mrs
      - name: nirs (near-infrared spectroscopy)
        value: nirs
      - name: perf (arterial spin labeling)
        value: perf
      - name: pet (positron emission tomography)
        value: pet
  - name: TimeseriesFormatEnum
    description: On-disk format of a time-series recording.
    literalValues:
      - name: NWB (Neurodata Without Borders)
        value: nwb
      - name: Parquet
        value: parquet
      - name: Zarr
        value: zarr
      - name: EDF (European Data Format)
        value: edf
      - name: BDF (Biosemi Data Format)
        value: bdf
      - name: BrainVision (vhdr/vmrk/eeg)
        value: brainvision
      - name: FIF (MNE/Elekta)
        value: fif
      - name: SET (EEGLAB)
        value: set
      - name: XDF (Lab Streaming Layer)
        value: xdf
  - name: TimeUnitEnum
    description: Unit that event times are expressed in.
    literalValues:
      - name: Seconds
        value: seconds
      - name: Milliseconds
        value: milliseconds
      - name: Samples
        value: samples
  # Amplifiers and headsets in common use; the attribute is editable, so any
  # other system name is accepted as free text.
  - name: DeviceEnum
    description: Amplifier or headset the session is recorded with.
    literalValues:
      - name: Brain Products actiCHamp
        value: brainproducts_actichamp
      - name: Brain Products BrainAmp
        value: brainproducts_brainamp
      - name: Biosemi ActiveTwo
        value: biosemi_activetwo
      - name: EGI / Magstim GES
        value: egi_ges
      - name: ANT Neuro eego
        value: ant_eego
      - name: g.tec g.USBamp
        value: gtec_usbamp
      - name: Neuroelectrics Enobio
        value: neuroelectrics_enobio
      - name: Compumedics Neuroscan
        value: neuroscan
      - name: Bittium NeurOne
        value: bittium_neurone
      - name: Emotiv EPOC
        value: emotiv_epoc
      - name: InteraXon Muse
        value: muse
      - name: OpenBCI Cyton
        value: openbci_cyton
      - name: OpenBCI Ganglion
        value: openbci_ganglion
      - name: OpenBCI Galea
        value: openbci_galea
      - name: Simulated
        value: simulated
        description: Synthetic signal for testing a pipeline without hardware.
  - name: ReferenceEnum
    description: Reference scheme the channels are recorded against.
    literalValues:
      - name: Cz
        value: cz
      - name: FCz
        value: fcz
      - name: Linked mastoids
        value: linked_mastoids
      - name: Average reference
        value: average
      - name: REST (infinity reference)
        value: rest
      - name: CMS/DRL (Biosemi)
        value: cms_drl
  - name: MontageEnum
    description: Electrode layout the channel names follow.
    literalValues:
      - name: 10-20
        value: 10-20
      - name: 10-10
        value: 10-10
      - name: 10-5
        value: 10-5
      - name: Biosemi 64
        value: biosemi64
      - name: EGI HydroCel GSN 128
        value: gsn-hydrocel-128
      - name: EGI HydroCel GSN 256
        value: gsn-hydrocel-256
      - name: Custom
        value: custom
  - name: LineFrequencyEnum
    description: Mains frequency the recording site runs on.
    literalValues:
      - name: 50 Hz (Europe, Asia, Africa, Australia)
        value: "50"
      - name: 60 Hz (Americas)
        value: "60"

types:
  - name: Session
    description: One acquisition session, with the amplifier settings shared by every phase in it.
    superClass:
      - bpmn:Participant
    meta:
      icon: iconify ph--head-circuit
      roles:
        - acquisition
    properties:
      - name: device
        description: Amplifier or headset used; any other system name is accepted.
        isAttr: true
        type: DeviceEnum
        default: brainproducts_actichamp
        meta:
          order: 0
          editable: true
      # Vocabulary: eeg, meg, ieeg, emg, ecg, eog, eda, ppg, respiration, nirs,
      # eye_tracking, head_imu, motion, audio.
      - name: modalities
        description: Signals recorded in this session, one per entry (`eeg`, `ecg`, `eog`, `eye_tracking`).
        isAttr: false
        isMany: true
        type: String
        meta:
          order: 1
      - name: montage
        description: Electrode layout the channel names follow.
        isAttr: true
        type: MontageEnum
        default: 10-20
        meta:
          order: 2
          editable: true
      - name: reference
        description: Reference scheme the channels are recorded against.
        isAttr: true
        type: ReferenceEnum
        default: cz
        meta:
          order: 3
          editable: true
      - name: ground
        description: Electrode position used as ground (`AFz`, `Fpz`).
        isAttr: true
        type: String
        meta:
          order: 4
          optional: true
      - name: lineFrequency
        description: Mains frequency at the recording site, for notch filtering.
        isAttr: true
        type: LineFrequencyEnum
        default: "50"
        meta:
          order: 5
      - name: impedanceThreshold
        description: Highest electrode impedance accepted before recording.
        isAttr: true
        type: Real
        default: 10
        meta:
          order: 6
          unit: kΩ

  - name: Timeseries
    description: A signal sampled over time (EEG, eye tracking, accelerometer).
    superClass:
      - bpmn:DataObjectReference
    isAbstract: false
    meta:
      icon: iconify ph--chart-line
      roles:
        - signal
    properties:
      - name: samplingRate
        description: Samples per second.
        isAttr: true
        type: Real
        meta:
          order: 1
          unit: Hz
          categories:
            - Data
      - name: channelCount
        description: Number of channels.
        isAttr: true
        type: Integer
        meta:
          order: 2
          categories:
            - Data
      - name: units
        description: Physical unit of the values (`uV`, `deg`, `g`).
        isAttr: true
        type: String
        meta:
          order: 3
          categories:
            - Data
      - name: recordingDuration
        description: Length of the recording.
        isAttr: true
        type: Real
        meta:
          order: 4
          unit: s
          categories:
            - Data
      - name: format
        description: On-disk format of the recording.
        isAttr: true
        type: TimeseriesFormatEnum
        meta:
          order: 5
          categories:
            - Data
  - name: EventMarker
    # An events table (BIDS `events.tsv`): one row per time-stamped occurrence.
    description: 'Time-stamped occurrences in a recording: stimuli, responses, triggers.'
    superClass:
      - bpmn:DataObjectReference
    isAbstract: false
    meta:
      icon: iconify ph--lightning
    properties:
      - name: eventTypes
        description: Kinds of event the table holds, one per entry (`stimulus`, `response`).
        isAttr: false
        isMany: true
        type: String
        meta:
          order: 1
          categories:
            - Data
      - name: timeUnit
        description: Unit the onsets are expressed in.
        isAttr: true
        type: TimeUnitEnum
        default: seconds
        meta:
          order: 2
          categories:
            - Data
      - name: format
        description: On-disk format of the events table.
        isAttr: true
        type: studyflow:TableFormatEnum
        default: tsv
        meta:
          order: 3
          categories:
            - Data
      - name: schema
        description: Schema describing the table's columns.
        isAttr: true
        type: studyflow:Schema
        meta:
          order: 4
          categories:
            - Data
  - name: BIDSDataset
    description: A dataset laid out by BIDS, one modality folder per data type.
    superClass:
      - studyflow:Dataset
    meta:
      icon: *bids-logotype
    properties:
      - name: format
        default: bids
        type: studyflow:DatasetFormatEnum
        isAttr: true
        redefines: studyflow:Dataset#format
        meta:
          pinned: true
      - name: dataType
        description: BIDS data type (the modality folder).
        isAttr: true
        type: BIDSDataTypeEnum
        default: beh
        meta:
          order: 2
          categories:
            - Data
  # Sampling rate, channel count, units, duration, on-disk format, and the
  # `signal` role come from `Timeseries`.
  - name: Recording
    description: The biosignal recording a session produces.
    superClass:
      - Timeseries
    meta:
      roles:
        - acquisition
      icon: iconify ph--waveform
    properties:
      # Same vocabulary as Session#modalities.
      - name: modalities
        description: Signals in this recording, one per entry (`eeg`, `ecg`, `eog`, `eye_tracking`).
        isAttr: false
        isMany: true
        type: String
        meta:
          order: 6
          categories:
            - Data
      - name: eventChannel
        description: Name of the trigger channel or marker stream (`Status`, `TRIGGER`, an LSL stream).
        isAttr: true
        type: String
        meta:
          order: 7
          optional: true
          categories:
            - Data

# Palette flyout entries: the elements a drop adds, spelled as in a `.studyflow.yaml` file.
templates:
  - description: An EEG session pool - fit the cap, record a baseline, run a task, export.
    elements:
      EEG_session:
        type: Participant
        name: EEG session
        documentation: An EEG session covering cap fitting through data export.
        processRef: EEG_session_flow
        icon: iconify ph--head-circuit
        extensionElements:
          - type: eeg:Session
            device: brainproducts_actichamp
            modalities:
              - eeg
            montage: 10-20
            reference: cz
            lineFrequency: "50"
      EEG_session_flow:
        type: Process
        flowElements:
          eeg_start:
            type: StartEvent
            name: Start
            bounds: 100 200 36 36
          eeg_mount:
            type: ManualTask
            name: Mount cap & check impedance
            documentation: |
              Fit the cap, place the electrodes, and check that every one of them
              makes good contact before recording starts.
            bounds: 200 178 100 80
          eeg_baseline:
            type: cognitive:Rest
            name: Resting baseline
            icon: iconify ph--brain
            eyes: closed
            eventDefinitions:
              eeg_baseline_timer:
                type: TimerEventDefinition
                timeDuration: PT2M
            bounds: 392 200 36 36
          eeg_task:
            type: ChoreographyTask
            name: Cognitive task
            icon: iconify ph--puzzle-piece
            extensionElements:
              - type: cognitive:CognitiveTask
                platform: psychopy
            dataInputAssociations:
              In_eeg_task_parameters:
                sourceRef:
                  - eeg_task_parameters
            bounds: 520 178 100 80
          eeg_task_parameters:
            type: DataObjectReference
            name: Parameters
            extensionElements:
              - type: studyflow:Parameters
                values: |
                  triggerChannel: markers  # stimulus marker stream sent with biosignals
            bounds: 552 308 36 50
          eeg_export:
            type: ServiceTask
            name: Export recording
            documentation: Persist the recording to a structured dataset (BIDS, BDM, or custom).
            implementation: python://datatrove.pipeline.writers.ParquetWriter
            additionalArguments: "output_folder: bids/"
            bounds: 680 178 100 80
          eeg_end:
            type: EndEvent
            name: End
            bounds: 840 200 36 36
          Flow_eeg_start_eeg_mount: eeg_start -> eeg_mount
          Flow_eeg_mount_eeg_baseline: eeg_mount -> eeg_baseline
          Flow_eeg_baseline_eeg_task: eeg_baseline -> eeg_task
          Flow_eeg_task_eeg_export: eeg_task -> eeg_export
          Flow_eeg_export_eeg_end: eeg_export -> eeg_end

  - description: Filter EEG data and remove artifacts in one step.
    elements:
      EEGPrep:
        type: ServiceTask
        name: EEGPrep
        icon: iconify ph--wave-sine
        documentation: Filters, cleans, and normalizes BIDS EEG data (EEGLAB clean_rawdata, ASR, ICA + ICLabel).
        implementation: docker://sccn/eegprep
        additionalArguments: |
          flatline_criterion: 5    # seconds of flatline tolerated per channel
          highpass_hz: 1
          lowpass_hz: 100
          asr_criterion: 20        # ASR burst-removal cutoff
          ica: true                # run ICA + ICLabel artifact classification

  - description: Preprocess a BIDS EEG or MEG dataset with the MNE-BIDS-Pipeline.
    elements:
      MNE_BIDS_Pipeline:
        type: ServiceTask
        name: MNE-BIDS-Pipeline
        icon: iconify ph--wave-sine
        documentation: Filtering, epoching, SSP/ICA artifact removal, and evoked responses, driven by one config file.
        implementation: python://mne_bids_pipeline@1.9.0
        additionalArguments: |
          config: config.py                  # bids_root, task, subjects, filters, ICA
          steps: preprocessing               # init | preprocessing | sensor | source | all

  - description: Preprocess fMRI data for a single subject.
    elements:
      fMRIPrep:
        type: ServiceTask
        name: fMRIPrep
        icon: iconify ph--brain
        documentation: Preprocesses BIDS fMRI data into normalized, denoised images.
        implementation: docker://nipreps/fmriprep:23.2.0
        additionalArguments: |
          output_spaces: MNI152NLin2009cAsym   # normalized-output space(s)
          skull_strip_t1w: force               # auto | force | skip
          use_aroma: false                     # ICA-AROMA denoising
          use_syn_sdc: false                   # fieldmap-less SDC (SyN)
