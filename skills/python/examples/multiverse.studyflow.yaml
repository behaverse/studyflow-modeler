id: multiverse_doc
schemas:
  studyflow: http://behaverse.org/schemas/studyflow/v1

multiverse:
  type: Process
  name: Multiverse analysis
  extensions:
    studyflow:Study:
      seed: 42
      dependencies:
        - scikit-learn>=1.4
  documentation: |
    A specification curve in its smallest form: one estimator, one data set,
    one analytic choice left open, and every value of that choice scored.

    The choice here is the regularization strength `C` of a support vector
    classifier on scikit-learn's digits. The values it may take are the
    study's `cs` data store, and `each_c` carries BPMN's multi-instance
    marker over that list: it runs once per value, binds the value as its
    `C`, and after each pass takes what its `score` property holds. The
    marker collects those, in the order of the list, into the study's
    `scores` data store, so the curve is a value the study keeps rather
    than a table someone assembles afterwards.

    Nothing is computed by code of the study's own: loading the data,
    building the estimator and scoring it are library calls, named by their
    `python://` paths.
  elements:
    start:
      type: StartEvent
      name: start

    load_digits:
      type: ServiceTask
      name: load_digits
      additionalArguments:
        return_X_y: true
      implementation: python://sklearn.datasets.load_digits
      documentation: >-
        `load_digits(return_X_y=True)`: the 8x8 images as 64 features, and the digit each shows. One call fills both
        data stores, each output taking its half of the pair.
      outputs:
        Out_Features:
          target: $features_ref
          transformation: result[1]

        Out_Labels:
          target: $labels_ref
          transformation: result[2]

    features_ref:
      type: DataStoreReference
      dataStore: $features

    labels_ref:
      type: DataStoreReference
      dataStore: $labels

    each_c:
      type: SubProcess
      name: each_c
      loopCharacteristics:
        type: MultiInstanceLoopCharacteristics
        dataInput: $cs
        dataOutput: $scores
        inputDataItem:
          id: each_c_C
          name: C
        outputDataItem:
          id: each_c_score
          name: score
      documentation: >-
        One universe per value of `cs`: the value is this sub-process's `C` while a pass runs, and the pass's `score`
        joins `scores` when it ends.
      properties:
        score:
          name: score
      elements:
        universe_start:
          type: StartEvent

        score_svc:
          type: ServiceTask
          name: score_svc
          additionalArguments:
            estimator:
              implementation: python://sklearn.svm.SVC
              arguments:
                C: "{C}"
            cv: 5
          implementation: python://sklearn.model_selection.cross_val_score
          documentation: >-
            `cross_val_score(SVC(C=C), features, labels, cv=5)`: the mean of its five fold accuracies is the universe's
            `score`.
          inputs:
            In_Features:
              source: $features_ref
              parameter: X

            In_Labels:
              source: $labels_ref
              parameter: "y"
          outputs:
            Out_Score:
              target: $score
              transformation: mean(result)

        universe_end:
          type: EndEvent

        flow_universe_score:
          source: $universe_start
          target: $score_svc

        flow_universe_end:
          source: $score_svc
          target: $universe_end

    done:
      type: EndEvent
      name: done

    flow_load:
      source: $start
      target: $load_digits

    flow_each:
      source: $load_digits
      target: $each_c

    flow_done:
      source: $each_c
      target: $done

cs:
  type: DataStore
  name: cs
  value: "[0.1, 1, 10]"

features:
  type: DataStore
  name: features
  uri: features.joblib

labels:
  type: DataStore
  name: labels
  uri: labels.joblib

scores:
  type: DataStore
  name: scores

layout:
  start: 80 252 36 36
  load_digits: 156 230 120 80
  Out_Features: 196,310 196,385
  Out_Labels: 256,310 256,385
  features_ref: {bounds: 178 385 36 50, label: 112 402 60 15}
  labels_ref: {bounds: 238 385 36 50, label: 280 402 44 15}
  each_c: {bounds: 316 190 320 160, expanded: true}
  universe_start: 346 252 36 36
  score_svc: 422 230 120 80
  In_Features: 196,435 196,470 512,470 512,310
  In_Labels: 256,435 256,455 482,455 482,310
  universe_end: 582 252 36 36
  flow_universe_score: 382,270 422,270
  flow_universe_end: 542,270 582,270
  done: 676 252 36 36
  flow_load: 116,270 156,270
  flow_each: 276,270 316,270
  flow_done: 636,270 676,270
