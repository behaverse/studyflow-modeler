        split_train_test:
          type: ServiceTask
          documentation: |
            `train_test_split(features, target, test_size=0.25, stratify=target,
            random_state=42)`. This is the first thing that touches the data, and
            everything downstream is arranged so the test quarter takes no part in
            choosing the model: it is not cross-validated, not fitted on, and read
            exactly once, at the end.

            Two things about the call are worth reading off the diagram. Its arrays
            are positional - `train_test_split(*arrays)` gives them no names - so
            both wires bind with `parameter: "*"`, in wire order. And one call fills
            four properties: `train_test_split` returns the four parts as a list, so
            each output association narrows the return value with a
            `transformation` that indexes it. `stratify` keeps the class balance of
            the whole set in both halves, and `random_state` makes the partition
            reproducible - the study's own `seed`, written where the call reads it.
          extensionElements:
            - type: prov:Activity
              action: executed
              when: "2026-08-20T12:28:27.430+02:00"
              run: sklearn-demo
            - type: prov:Activity
              action: reused
              when: "2026-08-20T12:28:57.235+02:00"
              what: "2026-08-20T12:28:27.430+02:00"
              run: sklearn-demo
          name: split_train_test
          dataInputAssociations:
            DataInput_Features_Split:
              sourceRef:
                - features
              transformation: "*"
            DataInput_Target_Split:
              sourceRef:
                - target
              transformation: "*"
            DataInput_Stratify:
              sourceRef:
                - target
              transformation: stratify
          dataOutputAssociations:
            DataOutput_X_Train:
              targetRef: x_train
              transformation: result[0]
            DataOutput_X_Test:
              targetRef: x_test
              transformation: result[1]
            DataOutput_Y_Train:
              targetRef: y_train
              transformation: result[2]
            DataOutput_Y_Test:
              targetRef: y_test
              transformation: result[3]
          additionalArguments:
            test_size: 0.25
            random_state: 42
          implementation: python://sklearn.model_selection.train_test_split
          bounds: 582 230 120 80
        prepare_end:
