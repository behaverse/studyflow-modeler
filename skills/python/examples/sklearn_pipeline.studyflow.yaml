id: sklearn_pipeline_doc
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Item_Table:
  type: ItemDefinition
  structureRef: pandas.DataFrame
Item_Series:
  type: ItemDefinition
  structureRef: pandas.Series
Item_Estimator:
  type: ItemDefinition
  structureRef: sklearn.pipeline.Pipeline
Item_Scores:
  type: ItemDefinition
  structureRef: dict
Item_Number:
  type: ItemDefinition
  structureRef: number
Item_Labels:
  type: ItemDefinition
  structureRef: numpy.ndarray
sklearn_pipeline:
  type: Process
  documentation: |
    A runnable scikit-learn classification workflow, drawn the way the
    method is actually done: split first, report last.

    Nothing downstream of the split touches the test quarter until the end:
    the model is selected on the training half alone, and every reported
    number comes from data the model has never seen.

    The input is an external CSV table, not a call to a bundled sample-data
    loader: one row per observation, numeric feature columns, and a `target`
    column. Its `uri` is the run-time binding an engine resolves before the
    first consumer; change that URI to run the same workflow on a real study
    dataset.

    The order of the steps is the claim. `train_test_split` runs before
    anything looks at the data, so the test half takes no part in choosing the
    model; cross-validation runs on the training half only, and its mean
    accuracy is what the promotion gate reads; the fit that follows sees the
    training half; and every number in the final report comes from predicting
    the test half once. Nothing is scored on data it was fitted on - which is
    why the held-out report, not the cross-validation summary, is the result of
    this workflow.

    What is drawn follows one rule: the canvas carries the artifacts a reader
    is meant to see, and everything else is declared rather than drawn. The
    shapes are the boundary input and the five files this workflow leaves
    behind - two cross-validation reports, the held-out metrics, the confusion
    matrix as a figure, and the fitted model. The values that only pass between
    steps - the feature matrix, the label vector, the four split parts, the
    unfitted estimator, the raw scores, the accuracy the gate tests, the
    predictions - are `bpmn:Property` declarations on the process. BPMN
    specifies that properties are never rendered, so they cost nothing visually
    while staying fully explicit in the file, typed by an item definition and
    readable by any BPMN 2.0 tool.

    The executable contract is small enough to state in a paragraph. Before an
    activity the engine materializes every wired input (loading a `uri` when
    necessary) and binds it to the callable parameter named on its association,
    defaulting to the wired element's name; `parameter: self` binds the
    receiver of an unbound method and `parameter: "*"` appends positionally, for
    a callable like `train_test_split` whose arguments have no names. It
    resolves `{Element}` placeholders in `arguments`, evaluates CEL conditions over
    the properties in scope, calls what `implementation` names, binds the return
    value to the wired outputs - narrowed by a `transformation` over `result`
    where one is declared, which is how one call fills four properties - and
    persists any output that declares a `uri` through its `codec`.
  extensionElements:
    - type: studyflow:Study
      seed: 42
      dependencies:
        - scikit-learn>=1.4
        - pandas>=2.0
        - joblib>=1.3
        - matplotlib>=3.8
