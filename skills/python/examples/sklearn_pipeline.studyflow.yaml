    is_good_enough:
      type: ExclusiveGateway
      documentation: |
        The promotion criterion, as BPMN's own branch rule: the pass flow
        carries the `conditionExpression` and the reject flow is the gateway's
        native `default`, so a run that fails the bar still ends cleanly with
        its cross-validation reports written.

        The threshold is stated once, here, where a reviewer reads it: a mean
        cross-validated accuracy of 0.90 on the training half is what it takes
        to spend the held-out quarter. Spending it is the point - the test set
        can only be read once to mean anything, so the gate decides whether
        this run is worth reading it for.
      extensionElements:
