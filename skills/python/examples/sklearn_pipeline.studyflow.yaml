id: sklearn_pipeline_doc
schemas:
  prov: https://w3id.org/studyflow/prov
  studyflow: http://behaverse.org/schemas/studyflow/v1

Item_Table:
  type: ItemDefinition
  structure: pandas.DataFrame

Item_Series:
  type: ItemDefinition
  structure: pandas.Series

Item_Estimator:
  type: ItemDefinition
  structure: sklearn.pipeline.Pipeline

Item_Scores:
  type: ItemDefinition
  structure: dict

Item_Number:
  type: ItemDefinition
  structure: number

Item_Labels:
  type: ItemDefinition
  structure: numpy.ndarray

sklearn_pipeline:
  type: Process
  name: sklearn_pipeline
  extensions:
    studyflow:Study:
      seed: 42
      dependencies:
        - scikit-learn>=1.4
        - pandas>=2.0
        - joblib>=1.3
        - matplotlib>=3.8
    prov:Activity:
      - {action: executed, when: "2026-08-20T12:28:24.591+02:00", who: morteza, with: studyflow_run.py, run: sklearn-demo, seed: 42}
      - {action: executed, when: "2026-08-20T12:28:40.659+02:00", who: morteza, with: studyflow_run.py, run: sklearn-demo, seed: 42}
      - {action: executed, when: "2026-08-20T12:28:56.471+02:00", who: morteza, with: studyflow_run.py, run: sklearn-demo, seed: 42}
  documentation: |
    A runnable scikit-learn classification workflow, drawn the way the
    method is actually done: split first, report last.

    Nothing downstream of the split touches the test quarter until the end:
    the model is selected on the training half alone, and every reported
    number comes from data the model has never seen.

    The input is an external CSV table, not a call to a bundled sample-data
    loader: one row per observation, numeric feature columns, and a `target`
    column. Its `uri` is the run-time binding an engine resolves before the
    first consumer; change that URI to run the same workflow on a real study
    dataset.

    The order of the steps is the claim. `train_test_split` runs before
    anything looks at the data, so the test half takes no part in choosing the
    model; cross-validation runs on the training half only, and its mean
    accuracy is what the promotion gate reads; the fit that follows sees the
    training half; and every number in the final report comes from predicting
    the test half once. Nothing is scored on data it was fitted on - which is
    why the held-out report, not the cross-validation summary, is the result of
    this workflow.

    What is drawn follows one rule: the canvas carries the artifacts a reader
    is meant to see, and everything else is declared rather than drawn. The
    shapes are the boundary input and the five files this workflow leaves
    behind - two cross-validation reports, the held-out metrics, the confusion
    matrix as a figure, and the fitted model. The values that only pass between
    steps - the feature matrix, the label vector, the four split parts, the
    unfitted estimator, the raw scores, the accuracy the gate tests, the
    predictions - are `bpmn:Property` declarations on the process. BPMN
    specifies that properties are never rendered, so they cost nothing visually
    while staying fully explicit in the file, typed by an item definition and
    readable by any BPMN 2.0 tool.

    The executable contract is small enough to state in a paragraph. Before an
    activity the engine materializes every wired input (loading a `uri` when
    necessary) and binds it to the callable parameter named on its association,
    defaulting to the wired element's name; `parameter: self` binds the
    receiver of an unbound method and `parameter: "*"` appends positionally, for
    a callable like `train_test_split` whose arguments have no names. It
    resolves `{Element}` placeholders in `arguments`, evaluates CEL conditions over
    the properties in scope, calls what `implementation` names, binds the return
    value to the wired outputs - narrowed by a `transformation` over `result`
    where one is declared, which is how one call fills four properties - and
    persists any output that declares a `uri` through its `codec`.
  properties:
    x_train:
      name: x_train
      item: $Item_Table

    x_test:
      name: x_test
      item: $Item_Table
      uri: x_test.joblib

    y_train:
      name: y_train
      item: $Item_Series

    y_test:
      name: y_test
      item: $Item_Series
      uri: y_test.joblib

    estimator:
      name: estimator
      item: $Item_Estimator

    mean_cv_accuracy:
      name: mean_cv_accuracy
      item: $Item_Number
  elements:
    start_analysis:
      type: StartEvent
      name: start_analysis
      extensions:
        prov:Activity:
          - {action: executed, when: "2026-08-20T12:28:25.275+02:00", run: sklearn-demo}
          - {action: executed, when: "2026-08-20T12:28:41.267+02:00", run: sklearn-demo}
          - {action: executed, when: "2026-08-20T12:28:56.906+02:00", run: sklearn-demo}

    is_good_enough:
      type: ExclusiveGateway
      name: is_good_enough
      default: $needs_work
      extensions:
        prov:Activity:
          - {action: executed, when: "2026-08-20T12:28:28.520+02:00", what: report, run: sklearn-demo}
          - {action: reused, when: "2026-08-20T12:28:57.771+02:00", what: "2026-08-20T12:28:28.520+02:00", run: sklearn-demo}
      documentation: |
        The promotion criterion, as BPMN's own branch rule: the pass flow
        carries the `conditionExpression` and the reject flow is the gateway's
        native `default`, so a run that fails the bar still ends cleanly with
        its cross-validation reports written.

        The threshold is stated once, here, where a reviewer reads it: a mean
        cross-validated accuracy of 0.90 on the training half is what it takes
        to spend the held-out quarter. Spending it is the point - the test set
        can only be read once to mean anything, so the gate decides whether
        this run is worth reading it for.

    done:
      type: EndEvent
      name: done
      extensions:
        prov:Activity:
          - {action: executed, when: "2026-08-20T12:28:30.069+02:00", run: sklearn-demo}
          - {action: executed, when: "2026-08-20T12:28:44.110+02:00", run: sklearn-demo}
          - {action: executed, when: "2026-08-20T12:28:59.170+02:00", run: sklearn-demo}

    failed_to_fit:
      type: EndEvent
      name: failed_to_fit
      documentation: |
        The run stops before the split's test half is read at all, so nothing
        has been spent: fix the estimator and run again against the same
        held-out data.

    prepare_data:
      type: SubProcess
      name: prepare_data
      extensions:
        prov:Activity:
          - {action: executed, when: "2026-08-20T12:28:57.314+02:00", run: sklearn-demo}
      documentation: >-
        Everything that happens before a model sees anything: pull the feature matrix and the label vector out of the
        input table, then split off a quarter of the rows and set them aside.
      properties:
        features:
          name: features
          item: $Item_Table

        target:
          name: target
          item: $Item_Series
      elements:
        prepare_start:
          type: StartEvent
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:25.275+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:41.267+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:56.906+02:00", run: sklearn-demo}

        select_features:
          type: ServiceTask
          name: select_features
          additionalArguments:
            columns:
              - target
          implementation: python://pandas.DataFrame.drop
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:27.082+02:00", run: sklearn-demo}
              - {action: reused, when: "2026-08-20T12:28:56.906+02:00", what: "2026-08-20T12:28:27.082+02:00", run: sklearn-demo}
          documentation: |
            `DataFrame.drop(input_dataset, columns=["target"])` - the input
            association names the unbound method's receiver with `parameter: self`,
            so the value binds positionally and the diagram does not depend on what
            pandas calls that parameter. The result lands on the `features`
            property: a value this run carries, not a file anyone reads.
          inputs:
            DataInput_Input_Features:
              source: $input_dataset
              parameter: self
          outputs:
            DataOutput_Features:
              target: $features

        select_target:
          type: ServiceTask
          name: select_target
          additionalArguments:
            key: target
          implementation: python://pandas.DataFrame.get
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:27.183+02:00", run: sklearn-demo}
              - {action: reused, when: "2026-08-20T12:28:57.060+02:00", what: "2026-08-20T12:28:27.183+02:00", run: sklearn-demo}
          documentation: |
            `DataFrame.get(input_dataset, key="target")` - the one-dimensional
            label vector the estimator is trained against.
          inputs:
            DataInput_Input_Target:
              source: $input_dataset
              parameter: self
          outputs:
            DataOutput_Target:
              target: $target

        split_train_test:
          type: ServiceTask
          name: split_train_test
          additionalArguments:
            test_size: 0.25
            random_state: 42
          implementation: python://sklearn.model_selection.train_test_split
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:27.430+02:00", run: sklearn-demo}
              - {action: reused, when: "2026-08-20T12:28:57.235+02:00", what: "2026-08-20T12:28:27.430+02:00", run: sklearn-demo}
          documentation: |
            `train_test_split(features, target, test_size=0.25, stratify=target,
            random_state=42)`. This is the first thing that touches the data, and
            everything downstream is arranged so the test quarter takes no part in
            choosing the model: it is not cross-validated, not fitted on, and read
            exactly once, at the end.

            Two things about the call are worth reading off the diagram. Its arrays
            are positional - `train_test_split(*arrays)` gives them no names - so
            both wires bind with `parameter: "*"`, in wire order. And one call fills
            four properties: `train_test_split` returns the four parts as a list, so
            each output association narrows the return value with a
            `transformation` that indexes it. `stratify` keeps the class balance of
            the whole set in both halves, and `random_state` makes the partition
            reproducible - the study's own `seed`, written where the call reads it.
          inputs:
            DataInput_Features_Split:
              source: $features
              parameter: "*"

            DataInput_Target_Split:
              source: $target
              parameter: "*"

            DataInput_Stratify:
              source: $target
              parameter: stratify
          outputs:
            DataOutput_X_Train:
              target: $x_train
              transformation: result[1]

            DataOutput_X_Test:
              target: $x_test
              transformation: result[2]

            DataOutput_Y_Train:
              target: $y_train
              transformation: result[3]

            DataOutput_Y_Test:
              target: $y_test
              transformation: result[4]

        prepare_end:
          type: EndEvent
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:27.599+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:41.891+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:57.314+02:00", run: sklearn-demo}

        Flow_Prepare_Start_Select_Features:
          source: $prepare_start
          target: $select_features

        Flow_Select_Features_Select_Target:
          source: $select_features
          target: $select_target

        Flow_Select_Target_Split:
          source: $select_target
          target: $split_train_test

        Flow_Split_Prepare_End:
          source: $split_train_test
          target: $prepare_end

        input_dataset:
          type: DataObjectReference
          name: input_dataset
          uri: digits.csv
          extensions:
            studyflow:Table: {}
            prov:Activity:
              - {action: imported, when: "2026-08-20T12:28:27.077+02:00", run: sklearn-demo}
          documentation: |
            Required input. A CSV table with one numeric feature column per
            predictor and one label column named `target`. The engine loads it from
            `uri`; this is a boundary artifact, not an output created by the
            workflow.

    select_model:
      type: SubProcess
      name: select_model
      extensions:
        prov:Activity:
          - {action: executed, when: "2026-08-20T12:28:57.696+02:00", run: sklearn-demo}
      documentation: >-
        Model selection, on the training half only. The cross-validated mean is what the gate reads; it is not the
        result of the workflow, and nothing here touches the held-out quarter.
      properties:
        cv_scores:
          name: cv_scores
          item: $Item_Scores
      elements:
        select_start:
          type: StartEvent
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:27.767+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:42.058+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:57.391+02:00", run: sklearn-demo}

        build_pipeline:
          type: ServiceTask
          name: build_pipeline
          additionalArguments:
            args:
              - implementation: python://sklearn.decomposition.PCA
                arguments:
                  n_components: 16
              - implementation: python://sklearn.svm.SVC
                arguments:
                  kernel: rbf
                  C: 1
          implementation: python://sklearn.pipeline.make_pipeline
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:27.923+02:00", run: sklearn-demo}
              - {action: reused, when: "2026-08-20T12:28:57.391+02:00", what: "2026-08-20T12:28:27.923+02:00", run: sklearn-demo}
          documentation: |
            `make_pipeline(PCA(n_components=16), SVC(kernel="rbf", C=1))`. The two
            estimators are nested calls inside `arguments`: a mapping carrying its
            own `implementation` is resolved before the outer call, so the whole
            estimator is declared here rather than hidden in a script.

            PCA is built *inside* the pipeline on purpose. `cross_validate` clones
            the complete estimator and fits PCA separately in every training fold,
            so the projection cannot leak information from the fold it is scored on
            - the same reason the split above comes first.
          outputs:
            DataOutput_Estimator:
              target: $estimator

        cross_validate:
          type: ServiceTask
          name: cross_validate
          additionalArguments:
            cv: 5
            scoring:
              - accuracy
              - precision_macro
              - recall_macro
              - f1_macro
            return_train_score: false
          implementation: python://sklearn.model_selection.cross_validate
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:28.180+02:00", run: sklearn-demo}
              - {action: reused, when: "2026-08-20T12:28:57.468+02:00", what: "2026-08-20T12:28:28.180+02:00", run: sklearn-demo}
          documentation: |
            `cross_validate(estimator, X=x_train, y=y_train, cv=5, scoring=[...])`
            - five folds over the training half only. This is model selection, so
            it is the number the gate reads; it is not the reported result.
          inputs:
            DataInput_Estimator_CV:
              source: $estimator

            DataInput_X_Train_CV:
              source: $x_train
              parameter: X

            DataInput_Y_Train_CV:
              source: $y_train
              parameter: "y"
          outputs:
            DataOutput_CV_Result:
              target: $cv_scores

        build_fold_report:
          type: ServiceTask
          name: build_fold_report
          implementation: python://pandas.DataFrame
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:28.264+02:00", run: sklearn-demo}
              - {action: reused, when: "2026-08-20T12:28:57.546+02:00", what: "2026-08-20T12:28:28.264+02:00", run: sklearn-demo}
          documentation: |
            `DataFrame(data=cv_scores)` - one row per fold, one column per
            requested metric. The CSV output is a durable record of the selection
            step, not of the model's performance.
          inputs:
            DataInput_CV_Result_Report:
              source: $cv_scores
              parameter: data
          outputs:
            DataOutput_Fold_Report:
              target: $cv_fold_report

        summarize_cv:
          type: ServiceTask
          name: summarize_cv
          implementation: python://pandas.DataFrame.describe
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:28.346+02:00", run: sklearn-demo}
              - {action: reused, when: "2026-08-20T12:28:57.620+02:00", what: "2026-08-20T12:28:28.346+02:00", run: sklearn-demo}
          documentation: |
            `DataFrame.describe(cv_fold_report)`: count, mean, standard deviation,
            quantiles, and extrema per metric. It writes twice from one return
            value - the whole summary to the persisted report, and, through the
            output wire's `transformation`, the single number the gate tests to the
            `mean_cv_accuracy` property. The decision therefore reads a declared
            name, not a path into a file.

            `describe` puts the statistics on the index, so the transformation
            indexes that axis - `result.test_accuracy['mean']`, the mean of the
            `test_accuracy` column over the folds. Reaching for `.mean` instead
            would name the method, not the number.
          inputs:
            DataInput_Fold_Report_Summary:
              source: $cv_fold_report
              parameter: self
          outputs:
            DataOutput_CV_Summary:
              target: $cv_summary

            DataOutput_Mean_CV_Accuracy:
              target: $mean_cv_accuracy
              transformation: result.test_accuracy.mean

        select_end:
          type: EndEvent
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:28.440+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:42.431+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:57.695+02:00", run: sklearn-demo}

        cv_fold_report:
          type: DataObjectReference
          name: cv_fold_report
          uri: cv_fold_metrics.csv
          extensions:
            studyflow:Table: {}
            prov:Activity:
              - {action: created, when: "2026-08-20T12:28:28.264+02:00", run: sklearn-demo}
          documentation: Per-fold metrics from the training-set cross-validation, persisted as CSV.

        cv_summary:
          type: DataObjectReference
          name: cv_summary
          uri: cv_metric_summary.csv
          extensions:
            studyflow:Table: {}
            prov:Activity:
              - {action: created, when: "2026-08-20T12:28:28.346+02:00", run: sklearn-demo}
          documentation: Descriptive summary of the cross-validation metrics, persisted for review.

        Flow_Select_Start_Build_Pipeline:
          source: $select_start
          target: $build_pipeline

        Flow_Build_Pipeline_Cross_Validate:
          source: $build_pipeline
          target: $cross_validate

        Flow_Cross_Validate_Build_Fold_Report:
          source: $cross_validate
          target: $build_fold_report

        Flow_Build_Fold_Report_Summarize_CV:
          source: $build_fold_report
          target: $summarize_cv

        Flow_Summarize_CV_Select_End:
          source: $summarize_cv
          target: $select_end

    evaluate_and_report:
      type: SubProcess
      name: evaluate_and_report
      extensions:
        prov:Activity:
          - {action: executed, when: "2026-08-20T12:28:59.091+02:00", run: sklearn-demo}
      documentation: >-
        The single pass over the held-out quarter: fit on the training half, predict the test half once, and report what
        came out — as numbers and as a figure. Every number a reader quotes comes from here.
      properties:
        predictions:
          name: predictions
          item: $Item_Labels
          uri: predictions.joblib

        test_metrics:
          name: test_metrics
          item: $Item_Scores
      elements:
        report_start:
          type: StartEvent
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:28.598+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:42.599+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:57.847+02:00", run: sklearn-demo}

        fit_model:
          type: ServiceTask
          name: fit_model
          implementation: python://sklearn.pipeline.Pipeline.fit
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:28.610+02:00", run: sklearn-demo}
              - {action: reused, when: "2026-08-20T12:28:58.295+02:00", what: "2026-08-20T12:28:28.610+02:00", run: sklearn-demo}
          documentation: |
            `Pipeline.fit(estimator, X=x_train, y=y_train)` - the selected
            estimator fitted on the training half, and only that half. The fitted
            pipeline is persisted with joblib: the artifact a later run loads to
            predict, and the one the held-out numbers below describe.
          inputs:
            DataInput_Estimator_Fit:
              source: $estimator
              parameter: self

            DataInput_X_Train_Fit:
              source: $x_train
              parameter: X

            DataInput_Y_Train_Fit:
              source: $y_train
              parameter: "y"
          outputs:
            DataOutput_Fitted_Model:
              target: $fitted_model

        predict_test:
          type: ServiceTask
          name: predict_test
          implementation: python://sklearn.pipeline.Pipeline.predict
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:28.777+02:00", run: sklearn-demo}
              - {action: reused, when: "2026-08-20T12:28:58.377+02:00", what: "2026-08-20T12:28:28.777+02:00", run: sklearn-demo}
          documentation: |
            `Pipeline.predict(fitted_model, X=x_test)` - the single pass over the
            test quarter. Its predictions feed both of the reports below, so the
            held-out data is read once and everything reported about the model
            comes from that one read.
          inputs:
            DataInput_Model_Predict:
              source: $fitted_model
              parameter: self

            DataInput_X_Test_Predict:
              source: $x_test
              parameter: X
          outputs:
            DataOutput_Predictions:
              target: $predictions

        score_test:
          type: ServiceTask
          name: score_test
          additionalArguments:
            output_dict: true
            zero_division: 0
          implementation: python://sklearn.metrics.classification_report
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:28.938+02:00", run: sklearn-demo}
              - {action: reused, when: "2026-08-20T12:28:43.292+02:00", what: "2026-08-20T12:28:28.938+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:58.462+02:00", run: sklearn-demo}
          documentation: |
            `classification_report(y_true=y_test, y_pred=predictions,
            output_dict=True)` - per-class precision, recall, and F1 on data the
            estimator never saw, plus the macro and weighted averages. Returned as
            a mapping so the next step can shape it into a table.
          inputs:
            DataInput_Y_Test_Score:
              source: $y_test
              parameter: y_true

            DataInput_Predictions_Score:
              source: $predictions
              parameter: y_pred
          outputs:
            DataOutput_Test_Metrics:
              target: $test_metrics

        write_test_report:
          type: ServiceTask
          name: write_test_report
          implementation: python://pandas.DataFrame
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:29.096+02:00", run: sklearn-demo}
              - {action: reused, when: "2026-08-20T12:28:43.375+02:00", what: "2026-08-20T12:28:29.096+02:00", run: sklearn-demo}
              - {action: invalidated, when: "2026-08-20T12:28:54.375+02:00", who: morteza, with: studyflow-modeler/26.0615, what: "2026-08-20T12:28:29.096+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:58.542+02:00", run: sklearn-demo}
          documentation: |
            `DataFrame(data=test_metrics)` - the held-out report as a table, one
            column per class and per average, one row per metric. This is the
            result of the workflow: the numbers that describe the persisted model
            on data that had no part in producing it.
          inputs:
            DataInput_Test_Metrics_Report:
              source: $test_metrics
              parameter: data
          outputs:
            DataOutput_Test_Report:
              target: $test_report

        plot_confusion:
          type: ServiceTask
          name: plot_confusion
          additionalArguments:
            cmap: Blues
            colorbar: false
          implementation: python://sklearn.metrics.ConfusionMatrixDisplay.from_predictions
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:29.730+02:00", run: sklearn-demo}
              - {action: invalidated, when: "2026-08-20T12:28:38.564+02:00", who: morteza, with: studyflow-modeler/26.0615, what: "2026-08-20T12:28:29.730+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:43.797+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:58.931+02:00", run: sklearn-demo}
          documentation: |
            `ConfusionMatrixDisplay.from_predictions(y_true=y_test,
            y_pred=predictions)` - the held-out errors as a figure, from the same
            single pass over the test set. A figure is an artifact like any other:
            the step returns scikit-learn's display object, the output wire narrows
            it to the matplotlib figure with `result.figure_`, and the `png` codec
            writes it. Nothing about plotting is a studyflow concept.
          inputs:
            DataInput_Y_Test_Plot:
              source: $y_test
              parameter: y_true

            DataInput_Predictions_Plot:
              source: $predictions
              parameter: y_pred
          outputs:
            DataOutput_Confusion_Matrix:
              target: $confusion_matrix
              transformation: result.figure_

        report_end:
          type: EndEvent
          extensions:
            prov:Activity:
              - {action: executed, when: "2026-08-20T12:28:29.890+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:43.974+02:00", run: sklearn-demo}
              - {action: executed, when: "2026-08-20T12:28:59.091+02:00", run: sklearn-demo}

        fitted_model:
          type: DataObjectReference
          name: fitted_model
          uri: digits_pca_svc.joblib
          extensions:
            prov:Activity:
              - {action: created, when: "2026-08-20T12:28:28.609+02:00", run: sklearn-demo}
          documentation: |
            The fitted estimator, persisted with joblib. Fitted on the training
            half, so the held-out report describes this exact artifact.

        test_report:
          type: DataObjectReference
          name: test_report
          uri: holdout_metrics.csv
          extensions:
            studyflow:Table: {}
            prov:Activity:
              - {action: created, when: "2026-08-20T12:28:29.096+02:00", run: sklearn-demo}
              - {action: created, when: "2026-08-20T12:28:58.542+02:00", run: sklearn-demo}
          documentation: |
            Precision, recall, and F1 per class on the held-out test set, with the
            macro and weighted averages. Persisted as CSV; the metric names are the
            rows.

        confusion_matrix:
          type: DataObjectReference
          name: confusion_matrix
          uri: confusion_matrix.png
          extensions:
            prov:Activity:
              - {action: created, when: "2026-08-20T12:28:29.730+02:00", run: sklearn-demo}
              - {action: created, when: "2026-08-20T12:28:43.797+02:00", run: sklearn-demo}
              - {action: created, when: "2026-08-20T12:28:58.931+02:00", run: sklearn-demo}
          documentation: |
            The held-out confusion matrix as a PNG, written by the `png` codec from
            the figure the plotting step returned.

        Flow_Report_Start_Fit_Model:
          source: $report_start
          target: $fit_model

        Flow_Fit_Model_Predict_Test:
          source: $fit_model
          target: $predict_test

        Flow_Predict_Test_Score_Test:
          source: $predict_test
          target: $score_test

        Flow_Score_Test_Write_Test_Report:
          source: $score_test
          target: $write_test_report

        Flow_Write_Test_Report_Plot_Confusion:
          source: $write_test_report
          target: $plot_confusion

        Flow_Plot_Confusion_Report_End:
          source: $plot_confusion
          target: $report_end

    flow_start:
      source: $start_analysis
      target: $prepare_data

    flow_prepare_done:
      source: $prepare_data
      target: $select_model

    flow_select_done:
      source: $select_model
      target: $is_good_enough

    report:
      name: report
      condition: mean_cv_accuracy >= 0.90
      source: $is_good_enough
      target: $evaluate_and_report

    needs_work:
      name: needs_work
      source: $is_good_enough
      target: $failed_to_fit

    flow_report_done:
      source: $evaluate_and_report
      target: $done

