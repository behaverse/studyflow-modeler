id: within_subject_tests_doc
schemas:
  studyflow: http://behaverse.org/schemas/studyflow/v1

within_subject_tests:
  type: Process
  name: within_subject_tests
  extensions:
    studyflow:Study:
      dependencies:
        - pingouin==0.7.0
  documentation: |
    Two within-subject questions asked of one table as it loads, one decided
    by p and the other by a Bayes factor. A gateway asks the question, its
    flows are the answers, and each answer ends in the state of the claim.

    The table is pingouin's `rm_anova` (Ryan et al. 2013): how much each
    participant would want to kill an insect, rated for insects high or low in
    disgustingness and high or low in frighteningness, so every participant
    has several rows. A test that names the measure (`dv`), the factor
    (`within`) and the participant (`subject`) averages those rows per
    participant and level before it compares the levels, so no step of the
    study reshapes the table first.

    The first question is decided by p: a one-sided paired t test, supported
    when p is below `alpha`. The second is decided by a Bayes factor:
    supported when BF10 is above `evidence`, not supported when it is below
    its inverse, and inconclusive in between. Both thresholds are the decision
    rules, fixed before the run.
  elements:
    Start:
      type: StartEvent

    Load_Ratings:
      type: ServiceTask
      name: Load the ratings
      additionalArguments:
        dname: rm_anova
      implementation: python://pingouin.read_dataset@0.7
      outputs:
        Out_Ratings:
          target: $Ratings

    Ratings:
      type: DataObjectReference
      name: Ratings
      uri: data/ratings.csv
      extensions:
        studyflow:Table:
          schema: $Ratings_Schema
      documentation: >-
        One row per participant and insect, as pingouin ships it; `validate` checks every column a test names against
        its schema.

    Ratings_Schema:
      type: DataObjectReference
      name: Ratings schema
      extensions:
        studyflow:Schema:
          body:
            "@context": http://www.w3.org/ns/csvw
            tableSchema:
              columns:
                - name: Subject
                  datatype: integer
                - name: Gender
                  datatype: string
                - name: Region
                  datatype: string
                - name: Education
                  datatype: string
                - name: DesireToKill
                  datatype: number
                - name: Disgustingness
                  datatype: string
                - name: Frighteningness
                  datatype: string

    Decision_Rules:
      type: DataObjectReference
      name: Decision rules
      extensions:
        studyflow:Parameters:
          values:
            alpha: 0.05
            evidence: 3
      documentation: The alpha of the t test, and the Bayes factor beyond which, either way, the data count as evidence.

    Disgust:
      type: SubProcess
      name: Disgust
      documentation: Do people want to kill a disgusting insect more than one that is not?
      properties:
        disgust_test:
          name: disgust_test
      inputs:
        In_Rules_Disgust:
          source: $Decision_Rules
      elements:
        Disgust_Start:
          type: StartEvent

        Disgust_Test:
          type: ServiceTask
          name: One-sided paired t test
          additionalArguments:
            dv: DesireToKill
            within: Disgustingness
            subject: Subject
            alternative: greater
          implementation: python://pingouin.pairwise_tests@0.7
          documentation: >-
            Each participant's mean rating of the high and of the low level, compared across participants, high above
            low.
          inputs:
            In_Ratings_Disgust:
              source: $Ratings
              parameter: data
          outputs:
            Out_Disgust_Test:
              target: $disgust_test
              transformation: "{statistic: result.T[1], pvalue: result.p_unc[1], subjects: result.dof[1] + 1}"

        Disgust_Decision:
          type: ExclusiveGateway
          name: Wanted dead more when disgusting?
          default: $Disgust_No

        Disgust_Supported:
          type: EndEvent
          name: Supported

        Disgust_Not_Supported:
          type: EndEvent
          name: Not supported

        DF_0:
          source: $Disgust_Start
          target: $Disgust_Test

        DF_1:
          source: $Disgust_Test
          target: $Disgust_Decision

        Disgust_Yes:
          name: "yes"
          condition: disgust_test.pvalue < alpha
          source: $Disgust_Decision
          target: $Disgust_Supported

        Disgust_No:
          name: "no"
          source: $Disgust_Decision
          target: $Disgust_Not_Supported

    Fear:
      type: SubProcess
      name: Fear
      documentation: Does how frightening an insect is change how much people want to kill it, either way?
      properties:
        fear_test:
          name: fear_test

        bf10:
          name: bf10
      inputs:
        In_Rules_Fear:
          source: $Decision_Rules
      elements:
        Fear_Start:
          type: StartEvent

        Fear_Test:
          type: ServiceTask
          name: Paired t test
          additionalArguments:
            dv: DesireToKill
            within: Frighteningness
            subject: Subject
          implementation: python://pingouin.pairwise_tests@0.7
          documentation: The same test, two-sided, for the t and the number of participants the Bayes factor reads.
          inputs:
            In_Ratings_Fear:
              source: $Ratings
              parameter: data
          outputs:
            Out_Fear_Test:
              target: $fear_test
              transformation: "{statistic: result.T[1], subjects: result.dof[1] + 1}"

        Fear_Bayes_Factor:
          type: ServiceTask
          name: Bayes factor
          additionalArguments:
            t: "{fear_test.statistic}"
            nx: "{fear_test.subjects}"
            paired: true
          implementation: python://pingouin.bayesfactor_ttest@0.7
          documentation: >-
            The JZS Bayes factor of that t for a paired design, BF10: how much more likely the data are if the levels
            differ than if they do not. The test's own table carries it as text, so it is computed here as a number.
          outputs:
            Out_BF10:
              target: $bf10

        Fear_Decision:
          type: ExclusiveGateway
          name: Evidence either way?
          default: $Fear_Neither

        Fear_Supported:
          type: EndEvent
          name: Supported

        Fear_Inconclusive:
          type: EndEvent
          name: Inconclusive

        Fear_Not_Supported:
          type: EndEvent
          name: Not supported

        FF_0:
          source: $Fear_Start
          target: $Fear_Test

        FF_1:
          source: $Fear_Test
          target: $Fear_Bayes_Factor

        FF_2:
          source: $Fear_Bayes_Factor
          target: $Fear_Decision

        Fear_For:
          name: for a difference
          condition: bf10 > evidence
          source: $Fear_Decision
          target: $Fear_Supported

        Fear_Against:
          name: for none
          condition: bf10 < 1 / evidence
          source: $Fear_Decision
          target: $Fear_Not_Supported

        Fear_Neither:
          name: neither
          source: $Fear_Decision
          target: $Fear_Inconclusive

    Done:
      type: EndEvent
      name: Done

    F_Start_Load:
      source: $Start
      target: $Load_Ratings

    F_Load_Disgust:
      source: $Load_Ratings
      target: $Disgust

    F_Disgust_Fear:
      source: $Disgust
      target: $Fear

    F_Fear_Done:
      source: $Fear
      target: $Done

