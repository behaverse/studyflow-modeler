id: trial_list_doc
schemas:
  studyflow: http://behaverse.org/schemas/studyflow/v1

registered_trials:
  type: Collaboration
  name: Registered trial list
  extensions:
    studyflow:Study:
      seed: 42
      dependencies:
        - pandas>=2.0
  documentation: |
    A trial list made outside Studyflow, registered by its content and played one trial at a time.

    Its file, `trials.csv`, is the kind of list SweetPea writes for a Simon task: colour and side crossed, twice, in
    an order fixed before the study runs. The study holds it as a Table bound to a CSVW schema, and its `digest` is
    the file's SHA-256, so the list is part of the registered protocol: the protocol digest covers the digest,
    `studyflow validate` checks the file against it, and `studyflow run` refuses to start once the file has changed.
    A new list is registered by pasting the digest `validate` reports.

    The first step loads the list as one record per trial; the schema's `separator` makes each trial's
    `ResponseOptions` a list. `each_trial` carries BPMN's multi-instance marker over those records: each pass
    hands its trial to the participant pool and keeps the answer, and the marker collects the answers, in the
    order of the list, into the session's `answers` property.

    The pool is a simulated participant (`simulate://random`), so the study runs on this machine; with
    `ollama://<model>` in its place a language model plays the same list.
  participants:
    Pool_Session:
      name: Session
      process: $Session

    Pool_Participant:
      name: Simulated participant
      extensions:
        studyflow:Actor:
          implementation: simulate://random
  messageFlows:
    Msg_Trial:
      name: the trial
      source: $answer_trial
      target: $Pool_Participant

    Msg_Answer:
      name: the answer
      source: $Pool_Participant
      target: $answer_trial

Session:
  type: Process
  name: Session
  properties:
    trials:
      name: trials

    answers:
      name: answers
  elements:
    start:
      type: StartEvent

    read_trials:
      type: ServiceTask
      name: Read the trial list
      additionalArguments:
        orient: records
      implementation: python://pandas.DataFrame.to_dict
      documentation: >-
        `DataFrame.to_dict` with `orient: records`: the registered list, one record per trial, into the session's
        `trials`.
      inputs:
        In_Trial_List:
          source: $trial_list
          parameter: self
      outputs:
        Out_Trials:
          target: $trials

    trial_list:
      type: DataObjectReference
      name: Trial list
      uri: trials.csv
      digest: sha256:4dd32eb0c384de2e69e1b15cf6b1f59b19914ea765f3e685990b5e0992bf47b0
      extensions:
        studyflow:Table:
          schema: $trial_schema

    trial_schema:
      type: DataObjectReference
      name: Trial schema
      extensions:
        studyflow:Schema:
          body:
            "@context": http://www.w3.org/ns/csvw
            tableSchema:
              columns:
                - name: Task
                  datatype: string
                - name: Trial
                  datatype: integer
                - name: Colour
                  datatype: string
                - name: Side
                  datatype: string
                - name: Stimulus
                  datatype: string
                - name: ResponseOptions
                  datatype: string
                  separator: " "

    each_trial:
      type: SubProcess
      name: Each trial
      multiInstance:
        sequential: true
        dataInput: $trials
        dataOutput: $answers
        inputDataItem:
          id: each_trial_item
          name: trial
        outputDataItem:
          id: each_trial_answer
          name: answer
      properties:
        trial:
          name: trial

        answer:
          name: answer
      elements:
        trial_start:
          type: StartEvent

        answer_trial:
          type: Task
          name: Answer the trial
          inputs:
            In_Trial:
              source: $trial
          outputs:
            Out_Answer:
              target: $answer

        trial_end:
          type: EndEvent

        flow_trial_answer:
          source: $trial_start
          target: $answer_trial

        flow_trial_end:
          source: $answer_trial
          target: $trial_end

    done:
      type: EndEvent

    flow_read:
      source: $start
      target: $read_trials

    flow_each:
      source: $read_trials
      target: $each_trial

    flow_done:
      source: $each_trial
      target: $done

layout:
  Pool_Session: 120 80 800 330
  Pool_Participant: 120 450 800 100
  Msg_Trial: 580,240 580,450
  Msg_Answer: 600,450 600,240
  start: 170 182 36 36
  read_trials: 250 160 120 80
  In_Trial_List: 310,300 310,240
  trial_list: 292 300 36 50
  each_trial: {bounds: 420 120 340 160, expanded: true}
  trial_start: 450 182 36 36
  answer_trial: 530 160 120 80
  trial_end: 694 182 36 36
  flow_trial_answer: 486,200 530,200
  flow_trial_end: 650,200 694,200
  done: 830 182 36 36
  flow_read: 206,200 250,200
  flow_each: 370,200 420,200
  flow_done: 760,200 830,200
