id: kitchensink
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Kitchen_Sink:
  type: Process
  documentation: >-
    Element catalog: one live instance of every palette-visible element type, one labelled band per schema. Read top to
    bottom: the BPMN 2.0 base that Studyflow inherits (events, gateways, activities, data), then the studyflow core and
    the domain extensions that specialize it. Attribute values echo the paper's example study (consent form, completion
    code, eligibility criteria, N-back scene, BDM trials dataset). The loops band's For-each is a native sub-process
    carrying BPMN's own multi-instance marker, and Retry-until-good a task carrying the standard-loop marker. Data steps
    are plain service tasks whose implementation names what runs. Pool/choreography types (cognitive:Actor, eeg:Session,
    studyflow:ChoreographyTask) and the template presets (cognitive/agentic/eeg) are covered in kitchensink.md; the
    sklearn_pipeline example shows an analysis pipeline live.
  extensionElements:
    - type: studyflow:Study
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:34Z"
      with: studyflow-modeler/26.0615
  name: Studyflow element catalog (kitchen sink)
