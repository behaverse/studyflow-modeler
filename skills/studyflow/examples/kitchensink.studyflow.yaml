id: kitchensink
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Kitchen_Sink:
  type: studyflow:Study
  name: Studyflow element catalog (kitchen sink)
  documentation: >-
    Element catalog: one live instance of every palette-visible element type, one labelled band per schema. Read top to
    bottom: the BPMN 2.0 base that Studyflow inherits (events, gateways, activities, data), then the studyflow core and
    the domain extensions that specialize it. Attribute values echo the paper's example study (consent form, completion
    code, eligibility criteria, N-back task, BDM trials dataset). The loops band's For-each is a native sub-process
    carrying BPMN's own multi-instance marker, and Retry-until-good a task carrying the standard-loop marker. Data steps
    are plain service tasks whose implementation names what runs. Pool/choreography types (studyflow:Actor, eeg:Session,
    studyflow:ChoreographyTask) and the template presets (cognitive/eeg) are covered in kitchensink.md; the
    sklearn_pipeline example shows an analysis pipeline live.
  extensionElements:
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:34Z"
      with: studyflow-modeler/26.0615
  flowElements:
    Ev_Start:
      type: StartEvent
      name: Start
      consentFormUri: consent.md
    Ev_End:
      type: EndEvent
      name: End
      redirectTo: https://app.prolific.com/submissions/complete?cc={COMPLETION_CODE}
      completionCodeType: dynamic
    Ev_Throw:
      type: IntermediateThrowEvent
      name: Intermediate throw
    Ev_Catch:
      type: IntermediateCatchEvent
      name: Intermediate catch
    Ev_Boundary:
      type: BoundaryEvent
      name: Boundary
      attachedToRef: Act_Task
    Gw_Exclusive:
      type: ExclusiveGateway
      name: Exclusive
    Gw_Parallel:
      type: ParallelGateway
      name: Parallel
    Gw_Inclusive:
      type: InclusiveGateway
      name: Inclusive
    Gw_EventBased:
      type: EventBasedGateway
      name: Event-based
    Gw_Complex:
      type: ComplexGateway
      name: Complex
    Act_Task:
      type: Task
      name: Task
    Act_UserTask:
      type: UserTask
      name: User task
    Act_ServiceTask:
      type: ServiceTask
      name: Service task
    Act_ScriptTask:
      type: ScriptTask
      name: Script task
    Act_ManualTask:
      type: ManualTask
      name: Manual task
    Act_SendTask:
      type: SendTask
      name: Send task
    Act_ReceiveTask:
      type: ReceiveTask
      name: Receive task
    Act_BusinessRuleTask:
      type: BusinessRuleTask
      name: Business rule task
    Act_CallActivity:
      type: CallActivity
      name: Call activity
    Act_SubProcess:
      type: SubProcess
      name: Sub-process
    Act_Transaction:
      type: Transaction
      name: Transaction
    Act_AdHoc:
      type: AdHocSubProcess
      name: Ad-hoc sub-process
    Bd_DataObject:
      type: DataObjectReference
      name: Data object
    Bd_DataStore:
      type: DataStoreReference
      name: Data store
    Sf_Dataset:
      type: behaverse:BDMDataset
      name: Dataset
      dataLevel: trials
    Sf_Schema:
      type: studyflow:Schema
      name: Schema
    Sf_Table:
      type: studyflow:Table
      name: Table
      format: parquet
    Sf_Timeseries:
      type: studyflow:Timeseries
      name: Timeseries
      format: edf
    Sf_EventMarker:
      type: studyflow:EventMarker
      name: Event marker
      eventTypes:
        - stimulus
    Ex_Parameters:
      type: studyflow:Parameters
      name: Parameters
    Fn_ForEach:
      type: SubProcess
      name: For-each (fan-out)
      loopCharacteristics:
        type: MultiInstanceLoopCharacteristics
    Fn_Retry:
      type: Task
      name: Retry-until-good (loop)
      loopCharacteristics:
        type: StandardLoopCharacteristics
        loopCondition: score < 0.9
        loopMaximum: 5
    Cg_CognitiveTask:
      type: Task
      name: Cognitive task
      extensionElements:
        - type: cognitive:CognitiveTask
          platform: jspsych
          implementation: https://github.com/jspsych/jspsych-contrib@v0.4.0#flanker
    Cg_Rest:
      type: cognitive:Rest
      name: Rest
    Cg_Questionnaire:
      type: cognitive:Questionnaire
      name: Questionnaire
      instrument: phq-9
    Cg_Instruction:
      type: cognitive:Instruction
      name: Instruction
    Cg_Behaverse:
      type: Task
      name: Behaverse task
      extensionElements:
        - type: behaverse:Task
          instrument: NB
          timeline: XCIT_NB_01
    Cg_Random:
      type: cognitive:RandomGateway
      name: Random gateway
    Cg_Stratified:
      type: cognitive:RandomGateway
      name: Stratified allocation
      stratifyBy: age_band
    Cg_Eligibility:
      type: cognitive:EligibilityGateway
      name: Eligibility gateway
      inclusionCriteria:
        - Aged 18 to 65 years
        - Normal or corrected-to-normal vision
      exclusionCriteria:
        - Prior exposure to the battery
        - Failed comprehension check
    Ob_Recording:
      type: DataStoreReference
      name: EEG recording
      extensionElements:
        - type: eeg:Recording
          format: bdm
    Ag_Prompt:
      type: agentic:Prompt
      name: Prompt
    Dt_Reader:
      type: ServiceTask
      name: Read data
      additionalArguments:
        data_folder: data/raw/
      implementation: python://datatrove.pipeline.readers.CsvReader
    Dt_Writer:
      type: ServiceTask
      name: Write data
      additionalArguments:
        output_folder: data/out/
      implementation: python://datatrove.pipeline.writers.ParquetWriter
  artifacts:
    Bd_Annotation:
      text: A free-form note. Groups (these labelled bands) are artifacts too.
    Group_BpmnEvents:
      type: Group
      categoryValueRef: CategoryValue_BpmnEvents
    Group_BpmnGateways:
      type: Group
      categoryValueRef: CategoryValue_BpmnGateways
    Group_BpmnActivities:
      type: Group
      categoryValueRef: CategoryValue_BpmnActivities
    Group_BpmnData:
      type: Group
      categoryValueRef: CategoryValue_BpmnData
    Group_Studyflow:
      type: Group
      categoryValueRef: CategoryValue_Studyflow
    Group_Exec:
      type: Group
      categoryValueRef: CategoryValue_Exec
    Group_Cognitive:
      type: Group
      categoryValueRef: CategoryValue_Cognitive
    Group_OpenBCI:
      type: Group
      categoryValueRef: CategoryValue_OpenBCI
    Group_Agentic:
      type: Group
      categoryValueRef: CategoryValue_Agentic
    Group_Functional:
      type: Group
      categoryValueRef: CategoryValue_Functional
    Group_Datatrove:
      type: Group
      categoryValueRef: CategoryValue_Datatrove
  isExecutable: false
Category_BpmnEvents:
  type: Category
  categoryValue:
    CategoryValue_BpmnEvents:
      value: BPMN · Events
Category_BpmnGateways:
  type: Category
  categoryValue:
    CategoryValue_BpmnGateways:
      value: BPMN · Gateways
Category_BpmnActivities:
  type: Category
  categoryValue:
    CategoryValue_BpmnActivities:
      value: BPMN · Activities
Category_BpmnData:
  type: Category
  categoryValue:
    CategoryValue_BpmnData:
      value: BPMN · Data & artifacts
Category_Studyflow:
  type: Category
  categoryValue:
    CategoryValue_Studyflow:
      value: studyflow · Core data elements (BDM, BIDS, Psych-DS, CSVW)
Category_Exec:
  type: Category
  categoryValue:
    CategoryValue_Exec:
      value: exec · Execution & scope
Category_Cognitive:
  type: Category
  categoryValue:
    CategoryValue_Cognitive:
      value: cognitive · Domain activities & research gateways (incl. Behaverse)
Category_OpenBCI:
  type: Category
  categoryValue:
    CategoryValue_OpenBCI:
      value: eeg · EEG biosignals
Category_Agentic:
  type: Category
  categoryValue:
    CategoryValue_Agentic:
      value: agentic · Prompts
Category_Functional:
  type: Category
  categoryValue:
    CategoryValue_Functional:
      value: bpmn · loops
Category_Datatrove:
  type: Category
  categoryValue:
    CategoryValue_Datatrove:
      value: bpmn · data IO
