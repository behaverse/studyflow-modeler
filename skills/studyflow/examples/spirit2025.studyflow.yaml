id: spirit2025-example
schemas:
  behaverse: http://behaverse.org/schemas/studyflow/behaverse
  cognitive: http://behaverse.org/schemas/studyflow/cognitive
  prov: https://w3id.org/studyflow/prov
  studyflow: http://behaverse.org/schemas/studyflow/v1
definitions:
  xsi:schemaLocation: http://www.omg.org/spec/BPMN/20100524/MODEL BPMN20.xsd

SPIRIT_2025_Collaboration:
  type: Collaboration
  name: SPIRIT 2025 trial protocol
  prov:Activity:
    - {action: created, when: "2026-07-30T22:51:40Z", with: studyflow-modeler/26.0615}
  pools:
    Participant_SPIRIT:
      name: SPIRIT 2025 trial protocol
      process: $SPIRIT_2025

SPIRIT_2025:
  type: Process
  name: SPIRIT 2025 trial protocol
  executable: false
  studyflow:Study: {}
  documentation: >-
    A SPIRIT 2025 trial protocol in lanes from enrolment to close-out, with per-visit SPIRIT item checklists.
  laneSets:
    LaneSet_SPIRIT:
      lanes:
        Lane_Enrolment:
          name: Enrolment
          nodes:
            - $Protocol_Start
            - $Visit_Screening
            - $Eligibility_Gate
            - $ScreenFail
            - $Visit_Baseline

        Lane_Allocation:
          name: Allocation
          nodes: $Allocate_Gate

        Lane_PostAllocation:
          name: Post-allocation
          nodes:
            - $Activity_Intervention
            - $Activity_Control
            - $Visit_T1
            - $Visit_T2

        Lane_Closeout:
          name: Close-out
          nodes:
            - $Visit_Closeout
            - $Protocol_End
  elements:
    Protocol_Start:
      type: StartEvent
      name: Recruitment
      onset: T0
      progress: done
      consentFormUri: https://example.org/protocols/spirit2025/consent.pdf

    Visit_Screening:
      type: SubProcess
      name: Screening visit (t = -t1)
      checklist: |-
        - [ ] SPIRIT 11a: eligibility screen
        - [ ] SPIRIT 11b: who recruits
        - [ ] SPIRIT 14: settings and locations
        - [ ] SPIRIT 26a: informed consent obtained
        - [ ] SPIRIT 27: confidentiality & data handling
      onset: T0
      duration: 1 week
      progress: done

    Eligibility_Gate:
      type: ExclusiveGateway
      name: Eligible?
      default: $Flow_Eligible_Yes
      cognitive:EligibilityGateway:
        inclusionCriteria:
          - Adults aged 18 to 65 years
          - DSM-5 diagnosis of attentional disorder
          - Stable medication regimen for 3 months
        exclusionCriteria:
          - Comorbid neurological condition
          - Pregnancy or lactation
          - Participation in another interventional trial within 30 days

    ScreenFail:
      type: EndEvent
      name: Screen failure
      error: true

    Visit_Baseline:
      type: SubProcess
      name: Baseline visit (t = 0)
      checklist: |-
        - [ ] SPIRIT 12: baseline demographics
        - [ ] SPIRIT 12: medical history
        - [ ] SPIRIT 12: vitals & physical exam
        - [ ] SPIRIT 18a: primary outcome at baseline
        - [ ] SPIRIT 18b: secondary outcomes at baseline
      onset: T0+2 weeks
      duration: 1 week
      progress: done

    Allocate_Gate:
      type: ExclusiveGateway
      name: Stratified allocation
      cognitive:RandomGateway:
        algorithm: block
        stratifyBy: age_band
        strata:
          - "age_band: 18-29"
          - "age_band: 30-44"
          - "age_band: 45-65"

    Activity_Intervention:
      type: Task
      name: "Intervention: cognitive training"
      checklist: |-
        - [ ] SPIRIT 17a: intervention dose & schedule
        - [ ] SPIRIT 17b: criteria for modification
        - [ ] SPIRIT 19: adherence monitoring
      onset: T0+3 weeks
      duration: 4 weeks
      progress: 60%
      cognitive:CognitiveTask:
        platform: jspsych

    Activity_Control:
      type: Task
      name: "Control: active sham"
      checklist: |-
        - [ ] SPIRIT 17a: control dose matched to intervention
        - [ ] SPIRIT 17b: criteria for modification
        - [ ] SPIRIT 19: adherence monitoring
      onset: T0+3 weeks
      duration: 4 weeks
      progress: 60%

    Visit_T1:
      type: SubProcess
      name: Follow-up visit (t = t1, week 4)
      outputs:
        DataOutput_T1_AE:
          target: $Dataset_AE
      elements:
        T1_Start:
          type: StartEvent

        T1_Outcomes:
          type: Task
          name: Outcome assessment
          checklist: |-
            - [x] SPIRIT 18a: primary outcome reassessed
            - [x] SPIRIT 18b: secondary outcomes reassessed
          onset: T0+6 weeks
          duration: 3 days

        T1_AE_Review:
          type: Task
          name: Adverse-event review
          checklist: |-
            - [x] SPIRIT 22: adverse-event review
            - [ ] SPIRIT 22: serious AE reporting
          onset: T0+6 weeks+3 days
          duration: 2 days

        T1_Adherence:
          type: Task
          name: Adherence check
          checklist: "- [ ] SPIRIT 19: adherence check"
          onset: T0+6 weeks+4 days
          duration: 3 days

        T1_End:
          type: EndEvent

        Flow_T1_Start_Outcomes:
          source: $T1_Start
          target: $T1_Outcomes

        Flow_T1_Outcomes_AE:
          source: $T1_Outcomes
          target: $T1_AE_Review

        Flow_T1_AE_Adherence:
          source: $T1_AE_Review
          target: $T1_Adherence

        Flow_T1_Adherence_End:
          source: $T1_Adherence
          target: $T1_End

    Visit_T2:
      type: SubProcess
      name: Primary endpoint visit (t = t2, week 12)
      checklist: |-
        - [ ] SPIRIT 18a: primary outcome - endpoint analysis
        - [ ] SPIRIT 18b: secondary outcomes
        - [ ] SPIRIT 22: adverse events
        - [ ] SPIRIT 27: data lock for primary analysis
      onset: T0+14 weeks
      duration: 1 week
      progress: todo
      outputs:
        DataOutput_T2_Primary:
          target: $Dataset_Primary

        DataOutput_T2_AE:
          target: $Dataset_AE

    Visit_Closeout:
      type: SubProcess
      name: Close-out (t = tx, week 24)
      checklist: |-
        - [ ] SPIRIT 13: participant retention plan executed
        - [ ] SPIRIT 18a: durability of primary outcome
        - [ ] SPIRIT 22: adverse events final review
        - [ ] SPIRIT 31: results dissemination plan
        - [ ] SPIRIT 32: data sharing per plan
      onset: T0+26 weeks
      duration: 1 week
      progress: todo
      outputs:
        DataOutput_Closeout_Primary:
          target: $Dataset_Primary

        DataOutput_Closeout_AE:
          target: $Dataset_AE

    Schema_Outcomes:
      type: DataObjectReference
      name: Outcome data dictionary
      dataObject: $DataObject_Outcomes
      studyflow:Schema: {}

    DataObject_Outcomes:
      type: DataObject

    Dataset_Primary:
      type: DataStoreReference
      name: Primary & secondary outcomes
      behaverse:BDMDataset:
        dataLevel: trials

    Dataset_AE:
      type: DataStoreReference
      name: Adverse events register
      studyflow:Dataset:
        format: psych-ds

    Protocol_End:
      type: EndEvent
      name: Trial complete

    Flow_Start_Screen:
      source: $Protocol_Start
      target: $Visit_Screening

    Flow_Screen_Eligibility:
      source: $Visit_Screening
      target: $Eligibility_Gate

    Flow_Eligible_Yes:
      name: eligible
      source: $Eligibility_Gate
      target: $Visit_Baseline

    Flow_Eligible_No:
      name: not eligible
      source: $Eligibility_Gate
      target: $ScreenFail

    Flow_Baseline_Allocate:
      source: $Visit_Baseline
      target: $Allocate_Gate

    Flow_Arm_Treatment:
      name: treatment
      source: $Allocate_Gate
      target: $Activity_Intervention

    Flow_Arm_Control:
      name: control
      source: $Allocate_Gate
      target: $Activity_Control

    Flow_Treatment_Visit1:
      source: $Activity_Intervention
      target: $Visit_T1

    Flow_Control_Visit1:
      source: $Activity_Control
      target: $Visit_T1

    Flow_Visit1_Visit2:
      source: $Visit_T1
      target: $Visit_T2

    Flow_Visit2_Closeout:
      source: $Visit_T2
      target: $Visit_Closeout

    Flow_Closeout_End:
      source: $Visit_Closeout
      target: $Protocol_End
  artifacts:
    Assoc_Schema_Primary:
      associationDirection: One
      source: $Schema_Outcomes
      target: $Dataset_Primary

