id: lablink_demo
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
  xmlns:bpmn2: http://www.omg.org/spec/BPMN/20100524/MODEL
LabLink_Demo_Actors:
  type: Collaboration
  name: EPSYLON LabLink - Study orchestration
  participants:
    Actor_Random_bot:
      extensionElements:
        - type: studyflow:Actor
          actorType: software
          implementation: behaverse://bot
      name: Random bot
LabLink_Demo:
  type: Process
  documentation: A LabLink session with questionnaires, a 1-back warm-up, and random allocation across three N-back arms.
  extensionElements:
    - type: studyflow:Study
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:37Z"
      with: studyflow-modeler/26.0615
  name: EPSYLON LabLink - Study orchestration
  flowElements:
    Start:
      type: StartEvent
      name: Welcome
      consentFormUri: https://example.org/protocols/lablink/consent.md
    Welcome_Instruction:
      type: Task
      extensionElements:
        - type: cognitive:Instruction
          content: >-
            # Welcome to the LabLink demo


            You will complete two short questionnaires (PHQ-9 and GAD-7), a 1-back warm-up, and one randomly-assigned
            N-back arm. The session takes about 15 minutes.


            Press **Continue** when you are ready.
      name: Welcome
    PHQ_9_baseline:
      type: Task
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: phq-9
      name: PHQ-9
    GAD_7_baseline:
      type: Task
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: gad-7
      name: GAD-7
    Warmup_1Back:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          instrument: NB
          timeline: LabLink_Inline
      name: |-
        1-Back
        (warm-up)
      participantRef:
        - Actor_Random_bot
      dataInputAssociations:
        In_Warmup_1Back_Parameters:
          sourceRef:
            - Warmup_1Back_Parameters
    Warmup_1Back_Parameters:
      type: DataObjectReference
      extensionElements:
        - type: studyflow:Parameters
          values:
            Blocks:
              LabLink_InlineBlock:
                Name: LabLink_InlineBlock
                Inherits: Default
                Parameters:
                  NValue: 1
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                  StreamSize: 8
                  FeatureValuesCount: 3
                  MaxResponseTime: 3
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 2.2
            Timelines:
              LabLink_Inline:
                Name: LabLink_Inline
                blocks:
                  - name: LabLink_InlineBlock
      name: Parameters
    Allocate:
      type: ExclusiveGateway
      extensionElements:
        - type: cognitive:RandomGateway
      name: Random allocation
    Arm_Dual2Back:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          instrument: NB
      name: |-
        2-Back
        (Symbols)
      participantRef:
        - Actor_Random_bot
      dataInputAssociations:
        In_Arm_Dual2Back_Parameters:
          sourceRef:
            - Arm_Dual2Back_Parameters
    Arm_Dual2Back_Parameters:
      type: DataObjectReference
      extensionElements:
        - type: studyflow:Parameters
          values:
            timeline: XCIT_NB_05
      name: Parameters
    Arm_XCIT_NB_03:
      type: Task
      extensionElements:
        - type: behaverse:Task
          instrument: NB
      name: |-
        2-Back
        (Digits, human)
      dataInputAssociations:
        In_Arm_XCIT_NB_03_Parameters:
          sourceRef:
            - Arm_XCIT_NB_03_Parameters
    Arm_XCIT_NB_03_Parameters:
      type: DataObjectReference
      extensionElements:
        - type: studyflow:Parameters
          values:
            timeline: XCIT_NB_02
      name: Parameters
    Arm_Demo:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          instrument: NB
          timeline: LabLink_Inline
      name: 1-Back
      participantRef:
        - Actor_Random_bot
      dataInputAssociations:
        In_Arm_Demo_Parameters:
          sourceRef:
            - Arm_Demo_Parameters
    Arm_Demo_Parameters:
      type: DataObjectReference
      extensionElements:
        - type: studyflow:Parameters
          values:
            Blocks:
              LabLink_InlineBlock:
                Name: LabLink_InlineBlock
                Inherits: Default
                Parameters:
                  NValue: 1
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                  StreamSize: 8
                  FeatureValuesCount: 3
                  MaxResponseTime: 3
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 2.2
            Timelines:
              LabLink_Inline:
                Name: LabLink_Inline
                blocks:
                  - name: LabLink_InlineBlock
      name: Parameters
    BDI_II:
      type: Task
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: bdi-ii
      name: BDI-II
    PHQ_9_followup:
      type: Task
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: phq-9
      name: PHQ-9
      dataOutputAssociations:
        DataOutput_Session:
          targetRef: SessionData
    End:
      type: EndEvent
      name: End
      redirectTo: https://behaverse.org/studyflow-modeler/docs/
      completionCodeType: dynamic
    SessionData:
      type: DataStoreReference
      extensionElements:
        - type: behaverse:BDMDataset
      name: Session data
    Flow_Start_Welcome: Start -> Welcome_Instruction
    Flow_Welcome_PHQ9: Welcome_Instruction -> PHQ_9_baseline
    Flow_PHQ9_GAD7: PHQ_9_baseline -> GAD_7_baseline
    Flow_GAD7_Warmup: GAD_7_baseline -> Warmup_1Back
    Flow_Warmup_Allocate: Warmup_1Back -> Allocate
    Flow_To_Dual:
      name: Difficult
      sourceRef: Allocate
      targetRef: Arm_Dual2Back
    Flow_To_XCIT:
      name: Easy
      sourceRef: Allocate
      targetRef: Arm_XCIT_NB_03
    Flow_To_Demo:
      name: Control
      sourceRef: Allocate
      targetRef: Arm_Demo
    Flow_Dual_PostPHQ9: Arm_Dual2Back -> PHQ_9_followup
    Flow_XCIT_PostPHQ9: Arm_XCIT_NB_03 -> PHQ_9_followup
    Flow_Demo_BDI2: Arm_Demo -> BDI_II
    Flow_BDI2_PostPHQ9: BDI_II -> PHQ_9_followup
    Flow_PostPHQ9_End: PHQ_9_followup -> End
