id: lablink_demo
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
  xmlns:bpmn2: http://www.omg.org/spec/BPMN/20100524/MODEL
LabLink_Demo_Actors:
  type: Collaboration
  name: EPSYLON LabLink - Study orchestration
  participants:
    Actor_Random_bot:
      extensionElements:
        - type: studyflow:Actor
          actorType: software
          implementation: random
      name: Random bot
LabLink_Demo:
  type: Process
  documentation: A LabLink session with questionnaires, a 1-back warm-up, and random allocation across three N-back arms.
  extensionElements:
    - type: studyflow:Study
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:37Z"
      with: studyflow-modeler/26.0615
  name: EPSYLON LabLink - Study orchestration
  flowElements:
    Start:
      type: StartEvent
      name: Welcome
      consentFormUri: https://example.org/protocols/lablink/consent.md
      bounds: 180 200 36 36
      label: 186 243 24 15
    Welcome_Instruction:
      type: Task
      extensionElements:
        - type: cognitive:Instruction
          content: >-
            # Welcome to the LabLink demo


            You will complete two short questionnaires (PHQ-9 and GAD-7), a 1-back warm-up, and one randomly-assigned
            N-back arm. The session takes about 15 minutes.


            Press **Continue** when you are ready.
      name: Welcome
      bounds: 270 178 120 80
    PHQ_9_baseline:
      type: Task
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: phq-9
      name: PHQ-9
      bounds: 420 178 120 80
    GAD_7_baseline:
      type: Task
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: gad-7
      name: GAD-7
      bounds: 570 178 120 80
    Warmup_1Back:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          configurations:
            Blocks:
              LabLink_InlineBlock:
                Name: LabLink_InlineBlock
                Inherits: Default
                Parameters:
                  NValue: 1
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                  StreamSize: 8
                  FeatureValuesCount: 3
                  MaxResponseTime: 3
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 2.2
            Timelines:
              LabLink_Inline:
                Name: LabLink_Inline
                blocks:
                  - name: LabLink_InlineBlock
          scene: NB
      name: |-
        1-Back
        (warm-up)
      participantRef:
        - Actor_Random_bot
      bounds: 720 158 120 120
    Allocate:
      type: ExclusiveGateway
      extensionElements:
        - type: cognitive:RandomGateway
      name: Random allocation
      bounds: 905 193 50 50
      isMarkerVisible: true
      label: 865 176 49 30
    Arm_Dual2Back:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          configurations:
            Timelines:
              XCIT_NB_05: null
          scene: NB
      name: |-
        2-Back
        (Symbols)
      participantRef:
        - Actor_Random_bot
      bounds: 1050 40 120 120
    Arm_XCIT_NB_03:
      type: Task
      extensionElements:
        - type: behaverse:Task
          configurations:
            Timelines:
              XCIT_NB_02: null
          scene: NB
      name: |-
        2-Back
        (Digits, human)
      bounds: 1050 178 120 80
    Arm_Demo:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          configurations:
            Blocks:
              LabLink_InlineBlock:
                Name: LabLink_InlineBlock
                Inherits: Default
                Parameters:
                  NValue: 1
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                  StreamSize: 8
                  FeatureValuesCount: 3
                  MaxResponseTime: 3
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 2.2
            Timelines:
              LabLink_Inline:
                Name: LabLink_Inline
                blocks:
                  - name: LabLink_InlineBlock
          scene: NB
      name: 1-Back
      participantRef:
        - Actor_Random_bot
      bounds: 1050 275 120 120
    BDI_II:
      type: Task
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: bdi-ii
      name: BDI-II
      bounds: 1200 295 120 80
    PHQ_9_followup:
      type: Task
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: phq-9
      name: PHQ-9
      dataOutputAssociations:
        DataOutput_Session:
          targetRef: SessionData
          waypoint: 1450,258 1450,430
      bounds: 1390 178 120 80
    End:
      type: EndEvent
      name: End
      redirectTo: https://behaverse.org/studyflow-modeler/docs/
      completionCodeType: dynamic
      bounds: 1572 200 36 36
      label: 1580 243 20 15
    SessionData:
      type: DataStoreReference
      extensionElements:
        - type: behaverse:BDMDataset
      name: Session data
      bounds: 1425 430 50 50
      label: 1413 485 74 30
    Flow_Start_Welcome:
      sourceRef: Start
      targetRef: Welcome_Instruction
      waypoint: 216,218 270,218
    Flow_Welcome_PHQ9:
      sourceRef: Welcome_Instruction
      targetRef: PHQ_9_baseline
      waypoint: 390,218 420,218
    Flow_PHQ9_GAD7:
      sourceRef: PHQ_9_baseline
      targetRef: GAD_7_baseline
      waypoint: 540,218 570,218
    Flow_GAD7_Warmup:
      sourceRef: GAD_7_baseline
      targetRef: Warmup_1Back
      waypoint: 690,218 720,218
    Flow_Warmup_Allocate:
      sourceRef: Warmup_1Back
      targetRef: Allocate
      waypoint: 840,218 905,218
    Flow_To_Dual:
      name: Difficult
      sourceRef: Allocate
      targetRef: Arm_Dual2Back
      waypoint: 930,193 930,100 1050,100
      label: 961 83 39 15
    Flow_To_XCIT:
      name: Easy
      sourceRef: Allocate
      targetRef: Arm_XCIT_NB_03
      waypoint: 955,218 1050,218
      label: 969 200 23 15
    Flow_To_Demo:
      name: Control
      sourceRef: Allocate
      targetRef: Arm_Demo
      waypoint: 930,243 930,335 1050,335
      label: 962 319 37 15
    Flow_Dual_PostPHQ9:
      sourceRef: Arm_Dual2Back
      targetRef: PHQ_9_followup
      waypoint: 1170,100 1350,100 1350,218 1390,218
    Flow_XCIT_PostPHQ9:
      sourceRef: Arm_XCIT_NB_03
      targetRef: PHQ_9_followup
      waypoint: 1170,218 1390,218
    Flow_Demo_BDI2:
      sourceRef: Arm_Demo
      targetRef: BDI_II
      waypoint: 1170,335 1200,335
    Flow_BDI2_PostPHQ9:
      sourceRef: BDI_II
      targetRef: PHQ_9_followup
      waypoint: 1320,335 1350,335 1350,218 1390,218
    Flow_PostPHQ9_End:
      sourceRef: PHQ_9_followup
      targetRef: End
      waypoint: 1510,218 1572,218
