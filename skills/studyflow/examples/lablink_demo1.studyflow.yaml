id: lablink_demo
schemas:
  behaverse: http://behaverse.org/schemas/studyflow/behaverse
  cognitive: http://behaverse.org/schemas/studyflow/cognitive
  prov: https://w3id.org/studyflow/prov
  studyflow: http://behaverse.org/schemas/studyflow/v1

LabLink_Demo_Actors:
  type: Collaboration
  name: EPSYLON LabLink - Study orchestration
  studyflow:Study: {}
  prov:Activity:
    - {action: created, when: "2026-07-30T22:51:37Z", with: studyflow-modeler/26.0615}
  documentation: >-
    A LabLink session with questionnaires, a 1-back warm-up, and random allocation across three N-back arms.
  participants:
    Actor_Random_bot:
      name: Random bot
      studyflow:Actor:
        actorType: software
        implementation: behaverse://bot

    Pool_Session:
      name: LabLink session
      process: $LabLink_Demo

LabLink_Demo:
  type: Process
  elements:
    Start:
      type: StartEvent
      name: Welcome
      consentFormUri: https://example.org/protocols/lablink/consent.md

    Welcome_Instruction:
      type: Task
      name: Welcome
      cognitive:Instruction:
        content: >-
          $# Welcome to the LabLink demo


          You will complete two short questionnaires (PHQ-9 and GAD-7), a 1-back warm-up, and one randomly-assigned
          N-back arm. The session takes about 15 minutes.


          Press **Continue** when you are ready.

    PHQ_9_baseline:
      type: Task
      name: PHQ-9
      exchange: true
      cognitive:Questionnaire:
        instrument: phq-9

    GAD_7_baseline:
      type: Task
      name: GAD-7
      exchange: true
      cognitive:Questionnaire:
        instrument: gad-7

    Warmup_1Back:
      type: Task
      name: |-
        1-Back
        (warm-up)
      exchange: true
      participants: $Actor_Random_bot
      behaverse:Task:
        instrument: NB
        timeline: LabLink_Inline
      inputs:
        In_Warmup_1Back_Parameters:
          source: $Warmup_1Back_Parameters

    Warmup_1Back_Parameters:
      type: DataObjectReference
      name: Parameters
      studyflow:Parameters:
        values:
          Blocks:
            LabLink_InlineBlock:
              Name: LabLink_InlineBlock
              Inherits: Default
              Parameters:
                NValue: 1
                Feature: Letters
                Streams:
                  - Feature:
                      Reference: Feature
                    StimulusValue:
                      Generate: OncePerBlock
                      Sequence:
                        Type: Ordered
                        Values:
                          - 3
                          - 1
                          - 2
                          - 1
                          - 3
                          - 2
                          - 3
                          - 2
                StreamSize: 8
                FeatureValuesCount: 3
                MaxResponseTime: 3
                StimulusDisplayDuration: 0.5
                InterStimulusInterval: 2.2
          Timelines:
            LabLink_Inline:
              Name: LabLink_Inline
              blocks:
                - name: LabLink_InlineBlock

    Allocate:
      type: ExclusiveGateway
      name: Random allocation
      cognitive:RandomGateway: {}

    Arm_Dual2Back:
      type: Task
      name: |-
        2-Back
        (Symbols)
      exchange: true
      participants: $Actor_Random_bot
      behaverse:Task:
        instrument: NB
      inputs:
        In_Arm_Dual2Back_Parameters:
          source: $Arm_Dual2Back_Parameters

    Arm_Dual2Back_Parameters:
      type: DataObjectReference
      name: Parameters
      studyflow:Parameters:
        values:
          timeline: XCIT_NB_05

    Arm_XCIT_NB_03:
      type: Task
      name: |-
        2-Back
        (Digits, human)
      behaverse:Task:
        instrument: NB
      inputs:
        In_Arm_XCIT_NB_03_Parameters:
          source: $Arm_XCIT_NB_03_Parameters

    Arm_XCIT_NB_03_Parameters:
      type: DataObjectReference
      name: Parameters
      studyflow:Parameters:
        values:
          timeline: XCIT_NB_02

    Arm_Demo:
      type: Task
      name: 1-Back
      exchange: true
      participants: $Actor_Random_bot
      behaverse:Task:
        instrument: NB
        timeline: LabLink_Inline
      inputs:
        In_Arm_Demo_Parameters:
          source: $Arm_Demo_Parameters

    Arm_Demo_Parameters:
      type: DataObjectReference
      name: Parameters
      studyflow:Parameters:
        values:
          Blocks:
            LabLink_InlineBlock:
              Name: LabLink_InlineBlock
              Inherits: Default
              Parameters:
                NValue: 1
                Feature: Letters
                Streams:
                  - Feature:
                      Reference: Feature
                    StimulusValue:
                      Generate: OncePerBlock
                      Sequence:
                        Type: Ordered
                        Values:
                          - 3
                          - 1
                          - 2
                          - 1
                          - 3
                          - 2
                          - 3
                          - 2
                StreamSize: 8
                FeatureValuesCount: 3
                MaxResponseTime: 3
                StimulusDisplayDuration: 0.5
                InterStimulusInterval: 2.2
          Timelines:
            LabLink_Inline:
              Name: LabLink_Inline
              blocks:
                - name: LabLink_InlineBlock

    BDI_II:
      type: Task
      name: BDI-II
      exchange: true
      cognitive:Questionnaire:
        instrument: bdi-ii

    PHQ_9_followup:
      type: Task
      name: PHQ-9
      exchange: true
      cognitive:Questionnaire:
        instrument: phq-9
      outputs:
        DataOutput_Session:
          target: $SessionData

    End:
      type: EndEvent
      name: End
      redirectTo: https://behaverse.org/studyflow-modeler/docs/
      completionCodeType: dynamic

    SessionData:
      type: DataStoreReference
      name: Session data
      behaverse:BDMDataset: {}

    Flow_Start_Welcome:
      source: $Start
      target: $Welcome_Instruction

    Flow_Welcome_PHQ9:
      source: $Welcome_Instruction
      target: $PHQ_9_baseline

    Flow_PHQ9_GAD7:
      source: $PHQ_9_baseline
      target: $GAD_7_baseline

    Flow_GAD7_Warmup:
      source: $GAD_7_baseline
      target: $Warmup_1Back

    Flow_Warmup_Allocate:
      source: $Warmup_1Back
      target: $Allocate

    Flow_To_Dual:
      name: Difficult
      source: $Allocate
      target: $Arm_Dual2Back

    Flow_To_XCIT:
      name: Easy
      source: $Allocate
      target: $Arm_XCIT_NB_03

    Flow_To_Demo:
      name: Control
      source: $Allocate
      target: $Arm_Demo

    Flow_Dual_PostPHQ9:
      source: $Arm_Dual2Back
      target: $PHQ_9_followup

    Flow_XCIT_PostPHQ9:
      source: $Arm_XCIT_NB_03
      target: $PHQ_9_followup

    Flow_Demo_BDI2:
      source: $Arm_Demo
      target: $BDI_II

    Flow_BDI2_PostPHQ9:
      source: $BDI_II
      target: $PHQ_9_followup

    Flow_PostPHQ9_End:
      source: $PHQ_9_followup
      target: $End

