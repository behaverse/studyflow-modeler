id: lablink_demo
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
  xmlns:bpmn2: http://www.omg.org/spec/BPMN/20100524/MODEL
LabLink_Demo_Actors:
  type: Collaboration
  name: EPSYLON LabLink - Study orchestration
  participants:
    Actor_Random_bot:
      extensionElements:
        - type: studyflow:Actor
          actorType: software
          implementation: random
      name: Random bot
LabLink_Demo:
  type: Process
  documentation: A LabLink session with questionnaires, a 1-back warm-up, and random allocation across three N-back arms.
  extensionElements:
    - type: studyflow:Study
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:37Z"
      with: studyflow-modeler/26.0615
  name: EPSYLON LabLink - Study orchestration
  flowElements:
    Start:
      type: StartEvent
      name: Welcome
      consentFormUri: https://example.org/protocols/lablink/consent.md
      bounds: 180 310 36 36
      label: 186 353 24 15
    Welcome_Instruction:
      type: Task
      extensionElements:
        - type: cognitive:Instruction
          content: >-
            # Welcome to the LabLink demo


            You will complete two short questionnaires (PHQ-9 and GAD-7), a 1-back warm-up, and one randomly-assigned
            N-back arm. The session takes about 15 minutes.


            Press **Continue** when you are ready.
      name: Welcome
      bounds: 270 288 120 80
    PHQ_9_baseline:
      type: Task
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: phq-9
      name: PHQ-9
      bounds: 420 288 120 80
    GAD_7_baseline:
      type: Task
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: gad-7
      name: GAD-7
      bounds: 570 288 120 80
    Warmup_1Back:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          instrument: NB
          timeline: LabLink_Inline
      name: |-
        1-Back
        (warm-up)
      participantRef:
        - Actor_Random_bot
      dataInputAssociations:
        In_Warmup_1Back_Parameters:
          sourceRef:
            - Warmup_1Back_Parameters
          waypoint: 780,438 780,388
      bounds: 720 268 120 120
    Warmup_1Back_Parameters:
      type: DataObjectReference
      extensionElements:
        - type: studyflow:Parameters
          values:
            Blocks:
              LabLink_InlineBlock:
                Name: LabLink_InlineBlock
                Inherits: Default
                Parameters:
                  NValue: 1
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                  StreamSize: 8
                  FeatureValuesCount: 3
                  MaxResponseTime: 3
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 2.2
            Timelines:
              LabLink_Inline:
                Name: LabLink_Inline
                blocks:
                  - name: LabLink_InlineBlock
      name: Parameters
      bounds: 762 438 36 50
    Allocate:
      type: ExclusiveGateway
      extensionElements:
        - type: cognitive:RandomGateway
      name: Random allocation
      bounds: 905 303 50 50
      isMarkerVisible: true
      label: 865 286 49 30
    Arm_Dual2Back:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          instrument: NB
      name: |-
        2-Back
        (Symbols)
      participantRef:
        - Actor_Random_bot
      dataInputAssociations:
        In_Arm_Dual2Back_Parameters:
          sourceRef:
            - Arm_Dual2Back_Parameters
          waypoint: 1110,210 1110,160
      bounds: 1050 40 120 120
    Arm_Dual2Back_Parameters:
