    label: 922 245 34 15
  Flow_Start_Consent:
    waypoint: 196,220 260,220
  Flow_Consent_Round:
    waypoint: 410,220 480,220
  Flow_Round_Round2:
    waypoint: 630,220 700,220
  Flow_Round2_End:
    waypoint: 850,220 920,220
