id: choreography_demo
schemas:
  prov: https://w3id.org/studyflow/prov
  studyflow: http://behaverse.org/schemas/studyflow/v1

Dyadic_Study_Actors:
  type: Collaboration
  name: Dyadic decision study
  extensions:
    studyflow:Study: {}
    prov:Activity:
      - {action: created, when: "2026-07-30T22:51:28Z", with: studyflow-modeler/26.0615}
  documentation: A two-participant choreography where subject and experimenter exchange consent and two decision rounds.
  participants:
    Participant_Subject:
      name: Subject

    Participant_Experimenter:
      name: Experimenter

    Pool_Session:
      name: Dyadic session
      process: $Dyadic_Study

Dyadic_Study:
  type: Process
  executable: false
  elements:
    Start:
      type: StartEvent
      name: Both arrive

    Consent:
      type: Task
      name: Give consent
      exchange: true
      participants:
        - $Participant_Subject
        - $Participant_Experimenter
      initiator: $Participant_Subject

    Round:
      type: Task
      name: First decision round
      exchange: true
      participants:
        - $Participant_Subject
        - $Participant_Experimenter
      initiator: $Participant_Experimenter

    Round2:
      type: Task
      name: Second decision round
      exchange: true
      participants:
        - $Participant_Subject
        - $Participant_Experimenter
      initiator: $Participant_Subject

    End:
      type: EndEvent
      name: Debrief

    Flow_Start_Consent:
      source: $Start
      target: $Consent

    Flow_Consent_Round:
      source: $Consent
      target: $Round

    Flow_Round_Round2:
      source: $Round
      target: $Round2

    Flow_Round2_End:
      source: $Round2
      target: $End

layout:
  Participant_Subject: {bounds: 110 385 866 60, expanded: false}
  Participant_Experimenter: {bounds: 110 485 866 60, expanded: false}
  Pool_Session: 110 95 866 250
  Start: {bounds: 160 202 36 36, label: 150 245 56 30}
  Consent: 260 175 150 90
  Round: 480 175 150 90
  Round2: 700 175 150 90
  End: {bounds: 920 202 36 36, label: 922 245 34 15}
  Flow_Start_Consent: 196,220 260,220
  Flow_Consent_Round: 410,220 480,220
  Flow_Round_Round2: 630,220 700,220
  Flow_Round2_End: 850,220 920,220
