id: choreography_demo
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Dyadic_Study:
  type: Choreography
  name: Dyadic decision study
  documentation: A two-participant choreography where subject and experimenter exchange consent and two decision rounds.
  extensionElements:
    - type: studyflow:Study
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:28Z"
      with: studyflow-modeler/26.0615
  participants:
    Participant_Subject:
      name: Subject
    Participant_Experimenter:
      name: Experimenter
  messageFlows:
    MessageFlow_Consent: Participant_Subject -> Participant_Experimenter
    MessageFlow_Round: Participant_Experimenter -> Participant_Subject
    MessageFlow_Round2: Participant_Subject -> Participant_Experimenter
  flowElements:
    Start:
      type: StartEvent
      name: Both arrive
    Consent:
      type: ChoreographyTask
      name: Give consent
      participantRef:
        - Participant_Subject
        - Participant_Experimenter
      initiatingParticipantRef: Participant_Subject
      messageFlowRef:
        - MessageFlow_Consent
    Round:
      type: ChoreographyTask
      name: First decision round
      participantRef:
        - Participant_Subject
        - Participant_Experimenter
      initiatingParticipantRef: Participant_Experimenter
      messageFlowRef:
        - MessageFlow_Round
    Round2:
      type: ChoreographyTask
      name: Second decision round
      participantRef:
        - Participant_Subject
        - Participant_Experimenter
      initiatingParticipantRef: Participant_Subject
      messageFlowRef:
        - MessageFlow_Round2
    End:
      type: EndEvent
      name: Debrief
    Flow_Start_Consent: Start -> Consent
    Flow_Consent_Round: Consent -> Round
    Flow_Round_Round2: Round -> Round2
    Flow_Round2_End: Round2 -> End
layout:
  Start:
    bounds: 160 202 36 36
    label: 150 245 56 30
  Consent:
    bounds: 260 175 150 90
  Round:
    bounds: 480 175 150 90
  Round2:
    bounds: 700 175 150 90
  End:
