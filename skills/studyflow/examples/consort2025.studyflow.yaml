id: consort2025-example
schemas:
  cognitive: http://behaverse.org/schemas/studyflow/cognitive
  prov: https://w3id.org/studyflow/prov
  studyflow: http://behaverse.org/schemas/studyflow/v1
definitions:
  xsi:schemaLocation: http://www.omg.org/spec/BPMN/20100524/MODEL BPMN20.xsd

CONSORT_2025:
  type: Process
  name: CONSORT 2025
  executable: false
  extensions:
    studyflow:Study: {}
    prov:Activity:
      - {action: created, when: "2026-07-30T22:51:30Z", with: studyflow-modeler/26.0615}
  documentation: A CONSORT 2025 participant flow from enrollment to analysis, with attrition as boundary error events.
  elements:
    Enrollment_Start:
      type: StartEvent
      name: Enrollment
      consentFormUri: https://example.org/protocols/consort2025/consent.pdf

    Activity_Screening:
      type: Task
      name: Screening assessment
      checklist: |-
        - [ ] Demographic intake
        - [ ] Medical history
        - [ ] Vital signs
        - [ ] Baseline cognitive screen
      exchange: true
      extensions:
        cognitive:Questionnaire:
          instrument: screening

    Eligibility_Gateway:
      type: ExclusiveGateway
      name: Assessed for eligibility
      default: $Flow_Eligible
      extensions:
        cognitive:EligibilityGateway: {}

    Excluded_Pre:
      type: EndEvent
      name: Excluded (n=...)
      error: true

    Randomize_Gateway:
      type: ExclusiveGateway
      name: Randomization
      extensions:
        cognitive:RandomGateway: {}

    Activity_Allocation_A:
      type: Task
      name: Allocated to intervention (n=...)
      checklist: |-
        - [ ] Allocation concealed until enrollment
        - [ ] Intervention delivered as protocol
        - [ ] Adverse events recorded

    DidNotReceive_A:
      type: BoundaryEvent
      name: Did not receive (n=...)
      error: true
      attachedTo: $Activity_Allocation_A

    Activity_Followup_A:
      type: Task
      name: Follow-up
      checklist: |-
        - [ ] Adherence visit
        - [ ] Outcome assessment 1
        - [ ] Outcome assessment 2
        - [ ] Adverse events review
      extensions:
        cognitive:CognitiveTask:
          platform: jspsych

    LostFollowup_A:
      type: BoundaryEvent
      name: Lost to follow-up (n=...)
      error: true
      attachedTo: $Activity_Followup_A

    Discontinued_A:
      type: BoundaryEvent
      name: Discontinued (n=...)
      error: true
      attachedTo: $Activity_Followup_A

    Activity_Analysis_A:
      type: Task
      name: Analyzed (n=...)
      checklist: |-
        - [ ] Intention-to-treat dataset
        - [ ] Per-protocol dataset
        - [ ] Sensitivity analyses
        - [ ] Pre-registered statistical plan applied

    ExcludedFromAnalysis_A:
      type: BoundaryEvent
      name: Excluded from analysis (n=...)
      error: true
      attachedTo: $Activity_Analysis_A

    Activity_Allocation_B:
      type: Task
      name: Allocated to control (n=...)
      checklist: |-
        - [ ] Allocation concealed until enrollment
        - [ ] Sham/usual-care delivered as protocol
        - [ ] Adverse events recorded

    DidNotReceive_B:
      type: BoundaryEvent
      name: Did not receive (n=...)
      error: true
      attachedTo: $Activity_Allocation_B

    Activity_Followup_B:
      type: Task
      name: Follow-up
      checklist: |-
        - [ ] Adherence visit
        - [ ] Outcome assessment 1
        - [ ] Outcome assessment 2
        - [ ] Adverse events review

    LostFollowup_B:
      type: BoundaryEvent
      name: Lost to follow-up (n=...)
      error: true
      attachedTo: $Activity_Followup_B

    Discontinued_B:
      type: BoundaryEvent
      name: Discontinued (n=...)
      error: true
      attachedTo: $Activity_Followup_B

    Activity_Analysis_B:
      type: Task
      name: Analyzed (n=...)
      checklist: |-
        - [ ] Intention-to-treat dataset
        - [ ] Per-protocol dataset
        - [ ] Sensitivity analyses
        - [ ] Pre-registered statistical plan applied

    ExcludedFromAnalysis_B:
      type: BoundaryEvent
      name: Excluded from analysis (n=...)
      error: true
      attachedTo: $Activity_Analysis_B

    Trial_Complete:
      type: EndEvent
      name: Completed
      redirectTo: https://app.prolific.com/submissions/complete?cc={COMPLETION_CODE}
      completionCodeType: dynamic

    Excluded_Post:
      type: EndEvent
      name: Excluded (n=...)
      error: true

    Flow_Start_Screening:
      source: $Enrollment_Start
      target: $Activity_Screening

    Flow_Screening_Eligibility:
      source: $Activity_Screening
      target: $Eligibility_Gateway

    Flow_Eligible:
      name: eligible
      source: $Eligibility_Gateway
      target: $Randomize_Gateway

    Flow_Excluded_Pre:
      name: not eligible
      source: $Eligibility_Gateway
      target: $Excluded_Pre

    Flow_Allocate_A:
      name: intervention
      source: $Randomize_Gateway
      target: $Activity_Allocation_A

    Flow_Allocate_B:
      name: control
      source: $Randomize_Gateway
      target: $Activity_Allocation_B

    Flow_A_Followup:
      source: $Activity_Allocation_A
      target: $Activity_Followup_A

    Flow_A_Analysis:
      source: $Activity_Followup_A
      target: $Activity_Analysis_A

    Flow_A_Done:
      source: $Activity_Analysis_A
      target: $Trial_Complete

    Flow_B_Followup:
      source: $Activity_Allocation_B
      target: $Activity_Followup_B

    Flow_B_Analysis:
      source: $Activity_Followup_B
      target: $Activity_Analysis_B

    Flow_B_Done:
      source: $Activity_Analysis_B
      target: $Trial_Complete

    Flow_DidNotReceive_A:
      name: reason
      source: $DidNotReceive_A
      target: $Excluded_Post

    Flow_LostFollowup_A:
      name: reason
      source: $LostFollowup_A
      target: $Excluded_Post

    Flow_Discontinued_A:
      source: $Discontinued_A
      target: $Excluded_Post

    Flow_ExcludedAnalysis_A:
      name: reason
      source: $ExcludedFromAnalysis_A
      target: $Excluded_Post

    Flow_DidNotReceive_B:
      name: reason
      source: $DidNotReceive_B
      target: $Excluded_Post

    Flow_LostFollowup_B:
      name: reason
      source: $LostFollowup_B
      target: $Excluded_Post

    Flow_Discontinued_B:
      name: reason
      source: $Discontinued_B
      target: $Excluded_Post

    Flow_ExcludedAnalysis_B:
      name: reason
      source: $ExcludedFromAnalysis_B
      target: $Excluded_Post
  artifacts:
    Group_Enrollment:
      type: Group
      categoryValue: $CategoryValue_Enrollment

    Group_Allocation:
      type: Group
      categoryValue: $CategoryValue_Allocation

    Group_Followup:
      type: Group
      categoryValue: $CategoryValue_Followup

    Group_Analysis:
      type: Group
      categoryValue: $CategoryValue_Analysis

Category_Enrollment:
  type: Category
  categoryValue:
    CategoryValue_Enrollment:
      value: Enrollment

Category_Allocation:
  type: Category
  categoryValue:
    CategoryValue_Allocation:
      value: Allocation

Category_Followup:
  type: Category
  categoryValue:
    CategoryValue_Followup:
      value: Follow-up

Category_Analysis:
  type: Category
  categoryValue:
    CategoryValue_Analysis:
      value: Analysis

