id: consort2025-example
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
  xmlns:bpmn2: http://www.omg.org/spec/BPMN/20100524/MODEL
  xsi:schemaLocation: http://www.omg.org/spec/BPMN/20100524/MODEL BPMN20.xsd
CONSORT_2025:
  type: studyflow:Study
  documentation: A CONSORT 2025 participant flow from enrollment to analysis, with attrition as boundary error events.
  extensionElements:
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:30Z"
      with: studyflow-modeler/26.0615
  name: CONSORT 2025
  flowElements:
    Enrollment_Start:
      type: StartEvent
      name: Enrollment
      consentFormUri: https://example.org/protocols/consort2025/consent.pdf
    Activity_Screening:
      type: cognitive:Questionnaire
      checklist: |-
        - [ ] Demographic intake
        - [ ] Medical history
        - [ ] Vital signs
        - [ ] Baseline cognitive screen
      instrument: screening
      name: Screening assessment
    Eligibility_Gateway:
      type: cognitive:EligibilityGateway
      name: Assessed for eligibility
      default: Flow_Eligible
    Excluded_Pre:
      type: EndEvent
      name: Excluded (n=...)
      eventDefinitions:
        ErrorDef_ExcludedPre:
          type: ErrorEventDefinition
    Randomize_Gateway:
      type: cognitive:RandomGateway
      name: Randomization
    Activity_Allocation_A:
      type: Task
      checklist: |-
        - [ ] Allocation concealed until enrollment
        - [ ] Intervention delivered as protocol
        - [ ] Adverse events recorded
      name: Allocated to intervention (n=...)
    DidNotReceive_A:
      type: BoundaryEvent
      name: Did not receive (n=...)
      eventDefinitions:
        ErrorDef_DidNotReceive_A:
          type: ErrorEventDefinition
      attachedToRef: Activity_Allocation_A
    Activity_Followup_A:
      type: Task
      checklist: |-
        - [ ] Adherence visit
        - [ ] Outcome assessment 1
        - [ ] Outcome assessment 2
        - [ ] Adverse events review
      extensionElements:
        - type: cognitive:CognitiveTask
          platform: jspsych
      name: Follow-up
    LostFollowup_A:
      type: BoundaryEvent
      name: Lost to follow-up (n=...)
      eventDefinitions:
        ErrorDef_Lost_A:
          type: ErrorEventDefinition
      attachedToRef: Activity_Followup_A
    Discontinued_A:
      type: BoundaryEvent
      name: Discontinued (n=...)
      eventDefinitions:
        ErrorDef_Discont_A:
          type: ErrorEventDefinition
      attachedToRef: Activity_Followup_A
    Activity_Analysis_A:
      type: Task
      checklist: |-
        - [ ] Intention-to-treat dataset
        - [ ] Per-protocol dataset
        - [ ] Sensitivity analyses
        - [ ] Pre-registered statistical plan applied
      name: Analyzed (n=...)
    ExcludedFromAnalysis_A:
      type: BoundaryEvent
      name: Excluded from analysis (n=...)
      eventDefinitions:
        ErrorDef_AnalysisExcluded_A:
          type: ErrorEventDefinition
      attachedToRef: Activity_Analysis_A
    Activity_Allocation_B:
      type: Task
      checklist: |-
        - [ ] Allocation concealed until enrollment
        - [ ] Sham/usual-care delivered as protocol
        - [ ] Adverse events recorded
      name: Allocated to control (n=...)
    DidNotReceive_B:
      type: BoundaryEvent
      name: Did not receive (n=...)
      eventDefinitions:
        ErrorDef_DidNotReceive_B:
          type: ErrorEventDefinition
      attachedToRef: Activity_Allocation_B
    Activity_Followup_B:
      type: cognitive:Rest
      checklist: |-
        - [ ] Adherence visit
        - [ ] Outcome assessment 1
        - [ ] Outcome assessment 2
        - [ ] Adverse events review
      name: Follow-up
    LostFollowup_B:
      type: BoundaryEvent
      name: Lost to follow-up (n=...)
      eventDefinitions:
        ErrorDef_Lost_B:
          type: ErrorEventDefinition
      attachedToRef: Activity_Followup_B
    Discontinued_B:
      type: BoundaryEvent
      name: Discontinued (n=...)
      eventDefinitions:
        ErrorDef_Discont_B:
          type: ErrorEventDefinition
      attachedToRef: Activity_Followup_B
    Activity_Analysis_B:
      type: Task
      checklist: |-
        - [ ] Intention-to-treat dataset
        - [ ] Per-protocol dataset
        - [ ] Sensitivity analyses
        - [ ] Pre-registered statistical plan applied
      name: Analyzed (n=...)
    ExcludedFromAnalysis_B:
      type: BoundaryEvent
      name: Excluded from analysis (n=...)
      eventDefinitions:
        ErrorDef_AnalysisExcluded_B:
          type: ErrorEventDefinition
      attachedToRef: Activity_Analysis_B
    Trial_Complete:
      type: EndEvent
      name: Completed
      redirectTo: https://app.prolific.com/submissions/complete?cc={COMPLETION_CODE}
      completionCodeType: dynamic
    Excluded_Post:
      type: EndEvent
      name: Excluded (n=...)
      eventDefinitions:
        ErrorDef_ExcludedPost:
          type: ErrorEventDefinition
    Flow_Start_Screening: Enrollment_Start -> Activity_Screening
    Flow_Screening_Eligibility: Activity_Screening -> Eligibility_Gateway
    Flow_Eligible:
      name: eligible
      sourceRef: Eligibility_Gateway
      targetRef: Randomize_Gateway
    Flow_Excluded_Pre:
      name: not eligible
      sourceRef: Eligibility_Gateway
      targetRef: Excluded_Pre
    Flow_Allocate_A:
      name: intervention
      sourceRef: Randomize_Gateway
      targetRef: Activity_Allocation_A
    Flow_Allocate_B:
      name: control
      sourceRef: Randomize_Gateway
      targetRef: Activity_Allocation_B
    Flow_A_Followup: Activity_Allocation_A -> Activity_Followup_A
    Flow_A_Analysis: Activity_Followup_A -> Activity_Analysis_A
    Flow_A_Done: Activity_Analysis_A -> Trial_Complete
    Flow_B_Followup: Activity_Allocation_B -> Activity_Followup_B
    Flow_B_Analysis: Activity_Followup_B -> Activity_Analysis_B
    Flow_B_Done: Activity_Analysis_B -> Trial_Complete
    Flow_DidNotReceive_A:
      name: reason
      sourceRef: DidNotReceive_A
      targetRef: Excluded_Post
    Flow_LostFollowup_A:
      name: reason
      sourceRef: LostFollowup_A
      targetRef: Excluded_Post
    Flow_Discontinued_A: Discontinued_A -> Excluded_Post
    Flow_ExcludedAnalysis_A:
      name: reason
      sourceRef: ExcludedFromAnalysis_A
      targetRef: Excluded_Post
    Flow_DidNotReceive_B:
      name: reason
      sourceRef: DidNotReceive_B
      targetRef: Excluded_Post
    Flow_LostFollowup_B:
      name: reason
      sourceRef: LostFollowup_B
      targetRef: Excluded_Post
    Flow_Discontinued_B:
      name: reason
      sourceRef: Discontinued_B
      targetRef: Excluded_Post
    Flow_ExcludedAnalysis_B:
      name: reason
      sourceRef: ExcludedFromAnalysis_B
      targetRef: Excluded_Post
  artifacts:
    Group_Enrollment:
      type: Group
      categoryValueRef: CategoryValue_Enrollment
    Group_Allocation:
      type: Group
      categoryValueRef: CategoryValue_Allocation
    Group_Followup:
      type: Group
      categoryValueRef: CategoryValue_Followup
    Group_Analysis:
      type: Group
      categoryValueRef: CategoryValue_Analysis
  isExecutable: false
Category_Enrollment:
  type: Category
  categoryValue:
    CategoryValue_Enrollment:
      value: Enrollment
Category_Allocation:
  type: Category
  categoryValue:
    CategoryValue_Allocation:
      value: Allocation
Category_Followup:
  type: Category
  categoryValue:
    CategoryValue_Followup:
      value: Follow-up
Category_Analysis:
  type: Category
  categoryValue:
    CategoryValue_Analysis:
      value: Analysis
