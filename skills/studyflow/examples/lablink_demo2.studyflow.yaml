id: omniprocess_lablink_demo
schemas:
  behaverse: http://behaverse.org/schemas/studyflow/behaverse
  prov: https://w3id.org/studyflow/prov
  studyflow: http://behaverse.org/schemas/studyflow/v1

OmniProcessLabLinkDemo:
  type: Process
  name: EPSYLON LabLink - Modeling pipeline
  executable: true
  extensions:
    studyflow:Study: {}
    prov:Activity:
      - {action: created, when: "2026-07-30T22:51:38Z", with: studyflow-modeler/26.0615}
  documentation: Reads BIDS data, preprocesses fMRI and EEG in parallel, fits a model, and renders manuscript outputs.
  elements:
    Start:
      type: StartEvent
      name: Canonical request

    CacheCheck:
      type: ExclusiveGateway
      name: Cached?
      default: $Flow_Cache_Miss

    ServeCached:
      type: Task
      name: Serve cached derivative

    EndCached:
      type: EndEvent
      name: Cache hit

    ReadBIDS:
      type: ServiceTask
      name: Read BIDS dataset
      implementation: python://datatrove.pipeline.readers.ParquetReader
      inputs:
        DataInput_RawBIDS_Read:
          source: $RawBIDSDataset

    QCFilter:
      type: ServiceTask
      name: Drop QC failures

    SplitModalities:
      type: ParallelGateway
      name: fan out by modality

    fMRIPrep:
      type: ServiceTask
      name: fMRIPrep

    EEGPrep:
      type: SubProcess
      name: EEGPrep
      elements:
        EEG_Start:
          type: StartEvent
          name: Start

        EEG_FilterSignal:
          type: ServiceTask
          name: Filter signal

        EEG_RemoveArtifacts:
          type: ServiceTask
          name: Remove artifacts

        EEG_End:
          type: EndEvent
          name: End

        Flow_EEG_Filter:
          source: $EEG_Start
          target: $EEG_FilterSignal

        Flow_EEG_Clean:
          source: $EEG_FilterSignal
          target: $EEG_RemoveArtifacts

        Flow_EEG_End:
          source: $EEG_RemoveArtifacts
          target: $EEG_End

    JoinModalities:
      type: ParallelGateway
      name: merge modalities

    CollectStats:
      type: ServiceTask
      name: Collect features

    FitModel:
      type: ServiceTask
      name: Fit model

    GenerateFigures:
      type: ServiceTask
      name: Generate figures

    RenderManuscript:
      type: ServiceTask
      name: Render manuscript table
      implementation: python://datatrove.pipeline.writers.ParquetWriter
      outputs:
        DataOutput_Manuscript:
          target: $ManuscriptArtifacts

    EndMaterialized:
      type: EndEvent
      name: Manuscript ready

    Flow_Start_Cache:
      source: $Start
      target: $CacheCheck

    Flow_Cache_Hit:
      name: hit
      source: $CacheCheck
      target: $ServeCached

    Flow_Cache_Miss:
      name: miss
      source: $CacheCheck
      target: $ReadBIDS

    Flow_Cached_End:
      source: $ServeCached
      target: $EndCached

    Flow_Read_Filter:
      source: $ReadBIDS
      target: $QCFilter

    Flow_Filter_Split:
      source: $QCFilter
      target: $SplitModalities

    Flow_Split_fMRI:
      source: $SplitModalities
      target: $fMRIPrep

    Flow_Split_EEG:
      source: $SplitModalities
      target: $EEGPrep

    Flow_fMRI_Join:
      source: $fMRIPrep
      target: $JoinModalities

    Flow_EEG_Join:
      source: $EEGPrep
      target: $JoinModalities

    Flow_Join_Stats:
      source: $JoinModalities
      target: $CollectStats

    Flow_Features_FitModel:
      source: $CollectStats
      target: $FitModel

    Flow_FitModel_Figures:
      source: $FitModel
      target: $GenerateFigures

    Flow_Figures_Manuscript:
      source: $GenerateFigures
      target: $RenderManuscript

    Flow_Manuscript_End:
      source: $RenderManuscript
      target: $EndMaterialized

    RawBIDSDataset:
      type: DataStoreReference
      name: Raw BIDS data
      extensions:
        studyflow:Dataset:
          format: bids

    ManuscriptArtifacts:
      type: DataStoreReference
      name: Manuscript artifacts (figures, tables)
      extensions:
        behaverse:BDMDataset: {}

