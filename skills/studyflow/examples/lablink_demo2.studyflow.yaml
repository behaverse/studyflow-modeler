id: omniprocess_lablink_demo
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
OmniProcessLabLinkDemo:
  type: studyflow:Study
  documentation: Reads BIDS data, preprocesses fMRI and EEG in parallel, fits a model, and renders manuscript outputs.
  extensionElements:
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:38Z"
      with: studyflow-modeler/26.0615
  name: EPSYLON LabLink - Modeling pipeline
  flowElements:
    Start:
      type: StartEvent
      name: Canonical request
    CacheCheck:
      type: ExclusiveGateway
      name: Cached?
      default: Flow_Cache_Miss
    ServeCached:
      type: Task
      name: Serve cached derivative
    EndCached:
      type: EndEvent
      name: Cache hit
    ReadBIDS:
      type: ServiceTask
      name: Read BIDS dataset
      dataInputAssociations:
        DataInput_RawBIDS_Read:
          sourceRef:
            - RawBIDSDataset
      implementation: python://datatrove.pipeline.readers.ParquetReader
    QCFilter:
      type: ServiceTask
      name: Drop QC failures
    SplitModalities:
      type: ParallelGateway
      name: fan out by modality
    fMRIPrep:
      type: ServiceTask
      name: fMRIPrep
    EEGPrep:
      type: SubProcess
      name: EEGPrep
      flowElements:
        EEG_Start:
          type: StartEvent
          name: Start
        EEG_FilterSignal:
          type: ServiceTask
          name: Filter signal
        EEG_RemoveArtifacts:
          type: ServiceTask
          name: Remove artifacts
        EEG_End:
          type: EndEvent
          name: End
        Flow_EEG_Filter: EEG_Start -> EEG_FilterSignal
        Flow_EEG_Clean: EEG_FilterSignal -> EEG_RemoveArtifacts
        Flow_EEG_End: EEG_RemoveArtifacts -> EEG_End
    JoinModalities:
      type: ParallelGateway
      name: merge modalities
    CollectStats:
      type: ServiceTask
      name: Collect features
    FitModel:
      type: ServiceTask
      name: Fit model
    GenerateFigures:
      type: ServiceTask
      name: Generate figures
    RenderManuscript:
      type: ServiceTask
      name: Render manuscript table
      dataOutputAssociations:
        DataOutput_Manuscript:
          targetRef: ManuscriptArtifacts
      implementation: python://datatrove.pipeline.writers.ParquetWriter
    EndMaterialized:
      type: EndEvent
      name: Manuscript ready
    Flow_Start_Cache: Start -> CacheCheck
    Flow_Cache_Hit:
      name: hit
      sourceRef: CacheCheck
      targetRef: ServeCached
    Flow_Cache_Miss:
      name: miss
      sourceRef: CacheCheck
      targetRef: ReadBIDS
    Flow_Cached_End: ServeCached -> EndCached
    Flow_Read_Filter: ReadBIDS -> QCFilter
    Flow_Filter_Split: QCFilter -> SplitModalities
    Flow_Split_fMRI: SplitModalities -> fMRIPrep
    Flow_Split_EEG: SplitModalities -> EEGPrep
    Flow_fMRI_Join: fMRIPrep -> JoinModalities
    Flow_EEG_Join: EEGPrep -> JoinModalities
    Flow_Join_Stats: JoinModalities -> CollectStats
    Flow_Features_FitModel: CollectStats -> FitModel
    Flow_FitModel_Figures: FitModel -> GenerateFigures
    Flow_Figures_Manuscript: GenerateFigures -> RenderManuscript
    Flow_Manuscript_End: RenderManuscript -> EndMaterialized
    RawBIDSDataset:
      type: studyflow:Dataset
      format: bids
      name: Raw BIDS data
    ManuscriptArtifacts:
      type: behaverse:BDMDataset
      name: Manuscript artifacts (figures, tables)
  isExecutable: true
