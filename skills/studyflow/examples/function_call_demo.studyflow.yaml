id: function_call_demo
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
FunctionCallDemo:
  type: studyflow:Study
  name: Function calls demo
  documentation: Demonstrates function references by binding a Map to a python callable and fetching a script by URL.
  extensionElements:
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:33Z"
      with: studyflow-modeler/26.0615
  flowElements:
    Start:
      type: StartEvent
      name: Start
    MapRT:
      type: ServiceTask
      name: Median RT per block
      additionalArguments:
        column: rt
        fn: median
      implementation: python://pkg_for_st.do_map@1.2
    FetchScript:
      type: ServiceTask
      name: Fetch cleaning script
      implementation: https://example.org/scripts/clean.py@v2
    End:
      type: EndEvent
      name: Done
    Flow_Start_Map: Start -> MapRT
    Flow_Map_Fetch: MapRT -> FetchScript
    Flow_Fetch_End: FetchScript -> End
  isExecutable: true
layout:
  Start:
    bounds: 162 182 36 36
    label: 168 225 24 15
  MapRT:
    bounds: 260 160 100 80
  FetchScript:
    bounds: 420 160 100 80
  End:
    bounds: 582 182 36 36
    label: 589 225 24 15
  Flow_Start_Map:
    waypoint: 198,200 260,200
  Flow_Map_Fetch:
    waypoint: 360,200 420,200
  Flow_Fetch_End:
    waypoint: 520,200 582,200
