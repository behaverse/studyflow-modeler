id: function_call_demo
schemas:
  prov: https://w3id.org/studyflow/prov
  studyflow: http://behaverse.org/schemas/studyflow/v1

FunctionCallDemo:
  type: Process
  name: Function calls demo
  executable: true
  studyflow:Study: {}
  prov:Activity:
    - {action: created, when: "2026-07-30T22:51:33Z", with: studyflow-modeler/26.0615}
  documentation: Demonstrates function references by binding a Map to a python callable and fetching a script by URL.
  elements:
    Start:
      type: StartEvent
      name: Start

    MapRT:
      type: ServiceTask
      name: Median RT per block
      additionalArguments:
        column: rt
        fn: median
      implementation: python://pkg_for_st.do_map@1.2

    FetchScript:
      type: ServiceTask
      name: Fetch cleaning script
      implementation: https://example.org/scripts/clean.py@v2

    End:
      type: EndEvent
      name: Done

    Flow_Start_Map:
      source: $Start
      target: $MapRT

    Flow_Map_Fetch:
      source: $MapRT
      target: $FetchScript

    Flow_Fetch_End:
      source: $FetchScript
      target: $End

layout:
  Start: {bounds: 162 182 36 36, label: 168 225 24 15}
  MapRT: 260 160 100 80
  FetchScript: 420 160 100 80
  End: {bounds: 582 182 36 36, label: 589 225 24 15}
  Flow_Start_Map: 198,200 260,200
  Flow_Map_Fetch: 360,200 420,200
  Flow_Fetch_End: 520,200 582,200
