# yaml-language-server: $schema=https://w3id.org/linkml/meta.schema.json

# The authoring conventions, and what every key means: skills/SCHEMAS.md.

id: http://behaverse.org/schemas/studyflow/v1
name: studyflow
title: Core
description: >-
  The building blocks every studyflow uses: the study, its events, flows,
  activities, data elements, and what an engine needs to run them.
license: MIT
version: '26.9.1'
rank: 1
default_prefix: studyflow
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  studyflow: http://behaverse.org/schemas/studyflow/v1/
  bpmn: http://www.omg.org/spec/BPMN/20100524/MODEL
imports:
  - linkml:types

# Inspector tabs, in the order they appear; an attribute joins one by naming it in `in_subset`.
# A `synthetic` tab is drawn by its own section rather than from attributes.
subsets:
  General:
    rank: 10
    description: Identity, and the fields particular to this element's type.
  Documentation:
    rank: 20
    description: Notes, checklist, tags, and registration records.
  Gantt:
    rank: 30
    description: Where the element sits on the schedule.
  Data:
    rank: 40
    description: 'How a value is laid out: format, schema, and location.'
  Execution:
    rank: 50
    description: 'What runs and how: software, arguments, data in and out, state.'
    annotations:
      synthetic: true

types:
  MarkdownString:
    typeof: string
    description: Text with markdown formatting.
    annotations:
      # Attributes of this type get the markdown editor unless they name their own.
      editor: markdown
  YAMLString:
    typeof: string
    description: Text holding a YAML document.
    annotations:
      editor: code

enums:
  DatasetFormatEnum:
    description: Data standard the dataset is organized by.
    permissible_values:
      bids:
        title: BIDS (Brain Imaging Data Structure)
        annotations:
          icon: bids-dataset-icon
      psych-ds:
        title: Psych-DS
        annotations:
          icon: iconify ph--flask
      nwb:
        title: NWB (Neurodata Without Borders)
  BIDSDataTypeEnum:
    description: BIDS data type (the modality folder).
    permissible_values:
      anat: { title: anat (anatomical MRI) }
      beh: { title: beh (behavioral) }
      dwi: { title: dwi (diffusion MRI) }
      eeg: { title: eeg (electroencephalography) }
      func: { title: func (functional MRI) }
      ieeg: { title: ieeg (intracranial EEG) }
      meg: { title: meg (magnetoencephalography) }
      micr: { title: micr (microscopy) }
      motion: { title: motion (motion capture) }
      mrs: { title: mrs (magnetic resonance spectroscopy) }
      nirs: { title: nirs (near-infrared spectroscopy) }
      perf: { title: perf (arterial spin labeling) }
      pet: { title: pet (positron emission tomography) }
  TableFormatEnum:
    description: On-disk format of a table.
    permissible_values:
      csv: { title: CSV }
      tsv: { title: TSV }
      parquet: { title: Parquet }
      arrow: { title: Arrow }
      jsonl: { title: JSON Lines }
      xlsx: { title: Excel (xlsx) }
  # The general-purpose formats; the biosignal ones (EDF, BrainVision, XDF, …) come from `eeg` by `apply_to`.
  TimeseriesFormatEnum:
    description: On-disk format of a time-series recording.
    permissible_values:
      nwb: { title: NWB (Neurodata Without Borders) }
      parquet: { title: Parquet }
      zarr: { title: Zarr }
  SchemaFormatEnum:
    description: Language the schema is written in.
    permissible_values:
      csvw: { title: CSVW (CSV on the Web) }
      linkml: { title: LinkML }
      jsonschema: { title: JSON Schema }
      frictionless: { title: Frictionless Table Schema }
  TimeUnitEnum:
    description: Unit that event times are expressed in.
    permissible_values:
      seconds: { title: Seconds }
      milliseconds: { title: Milliseconds }
      samples: { title: Samples }
  CompletionCodeTypeEnum:
    description: How the completion code is produced when the study ends.
    permissible_values:
      none:
        title: None
        description: No completion code is issued.
      static:
        title: Static
        description: One fixed code, typed in by the researcher.
      dynamic:
        title: Dynamic
        description: A code the platform supplies at run time (Prolific, MTurk).
  # The hosted environments; each runtime skill adds its own by `apply_to` (`browser`, `local`).
  RuntimeEnum:
    description: Environment the study runs in.
    permissible_values:
      cloud:
        title: Cloud
        description: On a hosted engine.
      hpc:
        title: HPC
        description: On a cluster, through a job scheduler.
  ItemTypeEnum:
    description: Common value types offered for a state item; any other type name is accepted.
    permissible_values:
      string: { title: string }
      integer: { title: integer }
      number: { title: number }
      boolean: { title: boolean }

classes:
  BaseElement:
    description: What every element of a studyflow carries.
    mixin: true
    implements:
      - bpmn:BaseElement
    attributes:
      documentation:
        description: Notes about this element, in markdown.
        slot_uri: bpmn:documentation
        implements:
          - bpmn:Documentation
        multivalued: true
        in_subset:
          - Documentation
        annotations:
          redefines: bpmn:BaseElement#documentation
          editor: markdown
  ChecklistDocumentation:
    # A documentation entry whose body is markdown task items (`- [ ]` / `- [x]`).
    description: Marks a documentation entry as the element's checklist.
    mixin: true
    implements:
      - bpmn:Documentation
    attributes:
      checklist:
        description: True reads this entry as a checklist reviewers tick off.
        range: boolean

  Study:
    description: The study a diagram describes, and how it is run.
    implements:
      - bpmn:Process
    attributes:
      seed:
        # Pinned in the plan, read by both runners, echoed on the archived copy.
        description: Root seed every step derives its own from; unset, the engine draws one.
        range: integer
        in_subset:
          - Execution
        annotations:
          optional: true
      runtime:
        description: Environment the study runs in.
        range: RuntimeEnum
        ifabsent: string(local)
        in_subset:
          - Execution
      dependencies:
        # One entry per package, in the ecosystem's own spelling (`pandas>=2.0`, PEP 508 for Python). The
        # reference runner installs them into every partial runner's environment (`uv run --with`).
        description: Software the study needs, one package per entry (`pandas>=2.0`).
        multivalued: true
        in_subset:
          - Execution
      authors:
        description: Who designed the study, one per entry.
        multivalued: true
      version:
        description: Version label of the study (`1.2`, a git tag).
        annotations:
          optional: true
      registration:
        description: Pre-registration or trial-registry id (OSF, NCT number).
        in_subset:
          - Documentation
        annotations:
          optional: true
      ethicsApproval:
        description: Ethics or IRB approval reference.
        in_subset:
          - Documentation
        annotations:
          optional: true
      isExecutable:
        description: Always true; a studyflow is meant to run.
        range: boolean
        ifabsent: 'true'
        annotations:
          redefines: bpmn:Process#isExecutable
          pinned: true
      state:
        # A JSON string (not YAML) so a runner without a YAML library can read it; the
        # `.studyflow` file lifts it to the top-level `state:` mapping. `pinned` keeps it
        # out of the inspector: it is written by runners and never drawn.
        description: Retrospective run state, a JSON tree keyed by element id.
        annotations:
          element: true
          pinned: true
  # BPMN gives a choreography task no data of its own. A cognitive task is one (the study's software presents,
  # the actor on the lower band responds), and it reads settings and writes records, so here it may.
  ChoreographyData:
    description: A choreography task that reads and writes data through data associations, as a cognitive task does.
    mixin: true
    implements:
      - bpmn:ChoreographyTask
    attributes:
      dataInputAssociations:
        description: The data this exchange reads.
        implements:
          - bpmn:DataInputAssociation
        multivalued: true
      dataOutputAssociations:
        description: The data this exchange writes.
        implements:
          - bpmn:DataOutputAssociation
        multivalued: true
      ioSpecification:
        description: The standard BPMN form of the same, written on export.
        implements:
          - bpmn:InputOutputSpecification

  PropertyValue:
    description: The initial value of a declared property; names starting with `_` are reserved for the runner.
    mixin: true
    implements:
      - bpmn:Property
    attributes:
      value:
        description: Initial value, as a literal; read when the declaring scope starts.
  Classification:
    description: What kind of study a diagram is, declared by the diagram itself.
    mixin: true
    implements:
      - bpmn:Process
      - bpmn:Collaboration
      - bpmn:Choreography
    attributes:
      tags:
        description: Short labels for the kind of study (`pilot`, `fMRI`, `longitudinal`).
        multivalued: true
        in_subset:
          - Documentation

  StartEvent:
    description: Lets a start event show a consent form before entry.
    mixin: true
    implements:
      - bpmn:StartEvent
    annotations:
      icon: iconify bpmn--start-event
    attributes:
      consentFormUri:
        description: Consent form shown before entry; untick to skip consent.
        annotations:
          # Overlay icon drawn on the event when this attribute is set.
          icon: iconify ph--shield-check
          optional: true
  SequenceFlow:
    description: Lets a flow carry the condition it is taken on.
    mixin: true
    implements:
      - bpmn:SequenceFlow
    attributes:
      conditionExpression:
        description: Take this flow when the expression holds (`accuracy >= 0.9`).
        slot_uri: bpmn:conditionExpression
        implements:
          - bpmn:Expression
        annotations:
          redefines: bpmn:SequenceFlow#conditionExpression
  EndEvent:
    description: Where a participant lands when the study ends, and the code they get.
    mixin: true
    implements:
      - bpmn:EndEvent
    annotations:
      icon: iconify bpmn--end-event
    attributes:
      redirectTo:
        description: URL the participant lands on; `{COMPLETION_CODE}` is filled in.
        annotations:
          optional: true
          # Overlay icon drawn on the event when this attribute is set.
          icon: iconify ph--sign-out
      completionCodeType:
        description: How the completion code is produced.
        range: CompletionCodeTypeEnum
        ifabsent: string(none)
        annotations:
          condition:
            value:
              redirectTo: $set
      completionCode:
        description: The fixed completion code.
        annotations:
          condition:
            value:
              redirectTo: $set
              completionCodeType: static

  Scheduling:
    description: Where an activity or event sits on the study schedule.
    mixin: true
    implements:
      - bpmn:Activity
      - bpmn:Event
    attributes:
      onset:
        description: 'When it starts: a date, an offset (`T0+30min`), or a label.'
        in_subset:
          - Gantt
      duration:
        description: How long it lasts (`30min`, `PT1H`).
        in_subset:
          - Gantt
      progress:
        description: 'How far along it is: a percentage or a label (`done`).'
        in_subset:
          - Gantt
  ChoreographyTask:
    description: One interaction between two participants.
    mixin: true
    implements:
      - bpmn:ChoreographyTask
    annotations:
      icon: iconify ph--users

  # ===========================================================================
  # Data elements. Each is a BPMN data reference with a layout: what kind of
  # data it is and how it is laid out. Where the bytes live is `uri`, mixed
  # onto every data element by the Artifact trait further down.
  # ===========================================================================
  Schema:
    description: 'How a table or array is structured: columns, types, dimensions.'
    implements:
      - bpmn:DataObjectReference
    annotations:
      icon: iconify ph--columns
      # An attribute that references a Schema (`Dataset#schema`) edits it as text.
      editor: code
    attributes:
      format:
        description: Language the schema is written in.
        range: SchemaFormatEnum
        ifabsent: string(csvw)
        in_subset:
          - Data
        annotations:
          editable: true
      body:
        description: The schema itself, or a path or URL to it.
        range: YAMLString
        in_subset:
          - Data
        annotations:
          editor: csvw-table
  Dataset:
    description: A structured collection of data organized by a data standard.
    implements:
      - bpmn:DataStoreReference
    attributes:
      format:
        description: Data standard the dataset follows.
        range: DatasetFormatEnum
        rank: 1
        in_subset:
          - Data
      bidsDataType:
        description: BIDS data type.
        range: BIDSDataTypeEnum
        ifabsent: string(beh)
        rank: 2
        in_subset:
          - Data
        annotations:
          condition:
            value:
              format: bids
      schema:
        description: Schema describing the dataset's structure.
        range: Schema
        rank: 3
        in_subset:
          - Data
      catalog:
        description: Registry the dataset is published in.
        range: DataCatalog
        rank: 5
        in_subset:
          - Data
  DataCatalog:
    description: A registry datasets are published in (OpenNeuro, Behaverse).
    implements:
      - bpmn:BaseElement
    attributes:
      uri:
        description: Where the registry is (`https://openneuro.org`).
        in_subset:
          - Data
  Table:
    description: 'Tabular data: rows and columns.'
    implements:
      - bpmn:DataObjectReference
    annotations:
      icon: iconify ph--table
    attributes:
      format:
        description: On-disk format of the table.
        range: TableFormatEnum
        ifabsent: string(csv)
        in_subset:
          - Data
      schema:
        description: Schema describing the table's columns.
        range: Schema
        in_subset:
          - Data
  Timeseries:
    description: A signal sampled over time (EEG, eye tracking, accelerometer).
    implements:
      - bpmn:DataObjectReference
    annotations:
      icon: iconify ph--chart-line
      roles:
        value: [signal]
    attributes:
      samplingRate:
        description: Samples per second.
        range: float
        rank: 1
        in_subset:
          - Data
        annotations:
          unit: Hz
      channelCount:
        description: Number of channels.
        range: integer
        rank: 2
        in_subset:
          - Data
      units:
        description: Physical unit of the values (`uV`, `deg`, `g`).
        rank: 3
        in_subset:
          - Data
      recordingDuration:
        description: Length of the recording.
        range: float
        rank: 4
        in_subset:
          - Data
        annotations:
          unit: s
      format:
        description: On-disk format of the recording.
        range: TimeseriesFormatEnum
        rank: 5
        in_subset:
          - Data
  EventMarker:
    # An events table (BIDS `events.tsv`): one row per time-stamped occurrence.
    description: 'Time-stamped occurrences in a recording: stimuli, responses, triggers.'
    implements:
      - bpmn:DataObjectReference
    annotations:
      icon: iconify ph--lightning
    attributes:
      eventTypes:
        description: Kinds of event the table holds, one per entry (`stimulus`, `response`).
        multivalued: true
        rank: 1
        in_subset:
          - Data
      timeUnit:
        description: Unit the onsets are expressed in.
        range: TimeUnitEnum
        ifabsent: string(seconds)
        rank: 2
        in_subset:
          - Data
      format:
        description: On-disk format of the events table.
        range: TableFormatEnum
        ifabsent: string(tsv)
        rank: 3
        in_subset:
          - Data
      schema:
        description: Schema describing the table's columns.
        range: Schema
        rank: 4
        in_subset:
          - Data

  # ===========================================================================
  # The executable layer: what an engine reads to run a diagram.
  # ===========================================================================
  Implementation:
    description: Lets a task name the software it runs.
    mixin: true
    implements:
      - bpmn:ServiceTask
      - bpmn:UserTask
      - bpmn:SendTask
      - bpmn:ReceiveTask
      - bpmn:BusinessRuleTask
    attributes:
      implementation:
        description: Software to run, as `<scheme>://<ref>[@<version>]` (`python://`, `shell://`, `docker://`).
        slot_uri: bpmn:implementation
        rank: 1
        in_subset:
          - Execution
        annotations:
          # One ref is enough: moddle resolves it per type the trait implements.
          redefines: bpmn:ServiceTask#implementation

  Script:
    description: Lets a script task carry its code in the diagram.
    mixin: true
    implements:
      - bpmn:ScriptTask
    attributes:
      script:
        description: The code this task runs, in the language picked in the editor.
        slot_uri: bpmn:script
        rank: 1
        in_subset:
          - Execution
        annotations:
          redefines: bpmn:ScriptTask#script
          element: true
          editor: code
          languageAttr: bpmn:scriptFormat

  Arguments:
    description: Lets an activity carry literal arguments for the software it calls.
    mixin: true
    implements:
      - bpmn:Activity
    attributes:
      additionalArguments:
        description: Arguments for the software, as a YAML mapping; `args` lists positional ones.
        range: YAMLString
        rank: 3
        in_subset:
          - Execution
        annotations:
          element: true
          condition:
            value:
              implementation: $set

  # ===========================================================================
  # Bindings. Inputs and outputs are never listed on a task: they are the data
  # associations drawn on the canvas. BPMN's own `transformation` element on
  # the association refines that detection; its body is `slot = selection`,
  # each half optional. Nothing to declare here.
  # ===========================================================================

  # ===========================================================================
  # Triggers, sensors, and delays are native BPMN: a timer start event is a
  # schedule, a message start event an external event, a conditional catch
  # event a sensor, a timer catch event a delay, a plain start event a manual
  # run. The traits below only make their expressions authorable as flat
  # strings, stored in BPMN's own expression-element form (`xsi:type`
  # tFormalExpression).
  # ===========================================================================
  Timer:
    description: Schedules and delays, authored as flat strings on timer events.
    mixin: true
    implements:
      - bpmn:TimerEventDefinition
    attributes:
      timeCycle:
        description: 'Fire repeatedly: cron (`0 6 * * 1`) or ISO 8601 interval (`R/PT24H`).'
        slot_uri: bpmn:timeCycle
        implements:
          - bpmn:Expression
        in_subset:
          - Execution
        annotations:
          redefines: bpmn:TimerEventDefinition#timeCycle
      timeDuration:
        description: Wait this long, as an ISO 8601 duration (`PT1H`).
        slot_uri: bpmn:timeDuration
        implements:
          - bpmn:Expression
        in_subset:
          - Execution
        annotations:
          redefines: bpmn:TimerEventDefinition#timeDuration
      timeDate:
        description: Fire once, at a fixed time (`2026-09-01T06:00Z`).
        slot_uri: bpmn:timeDate
        implements:
          - bpmn:Expression
        in_subset:
          - Execution
        annotations:
          redefines: bpmn:TimerEventDefinition#timeDate

  Condition:
    # A conditional catch event is the workflow sensor: the token waits until
    # the condition over the run's variables holds, then passes.
    description: The sensor condition, authored as a flat string on a conditional event.
    mixin: true
    implements:
      - bpmn:ConditionalEventDefinition
    attributes:
      condition:
        description: Fire when this holds over the run's variables (`raw.rowCount > 0`).
        slot_uri: bpmn:condition
        implements:
          - bpmn:Expression
        in_subset:
          - Execution
        annotations:
          redefines: bpmn:ConditionalEventDefinition#condition

  # Cycles come in two interchangeable BPMN forms. The compact form is the
  # standard-loop marker (`loopCondition`, `loopMaximum`, `testBefore`): one
  # activity retried in place, the canvas ↻. The drawn form is a gateway whose
  # conditioned back-edge returns upstream, bounded with the engine's run
  # state (`state.trace.count('<gateway-id>')`). The traits below keep the
  # marker's condition and the ad-hoc sub-process's exit test authorable as
  # flat strings.
  CompletionCondition:
    description: The exit test of an ad-hoc sub-process, authored as a flat string.
    mixin: true
    implements:
      - bpmn:AdHocSubProcess
    attributes:
      completionCondition:
        description: Done when this holds, checked after each turn (`answer is not None`).
        slot_uri: bpmn:completionCondition
        implements:
          - bpmn:Expression
        in_subset:
          - Execution
        annotations:
          redefines: bpmn:AdHocSubProcess#completionCondition

  LoopCondition:
    description: The standard-loop marker's condition, authored as a flat string.
    mixin: true
    implements:
      - bpmn:StandardLoopCharacteristics
    attributes:
      loopCondition:
        description: Keep looping while this holds (`score < 0.9`); `loopMaximum` still caps it.
        slot_uri: bpmn:loopCondition
        implements:
          - bpmn:Expression
        in_subset:
          - Execution
        annotations:
          redefines: bpmn:StandardLoopCharacteristics#loopCondition

  # ===========================================================================
  # Artifacts. One field on every BPMN data element: where the bytes live.
  # How they are laid out is the element's own `format`; the engine reads it
  # wherever the schema put it and falls back to the `uri`'s file extension.
  # Unset `uri` means the value only flows in memory between steps.
  # ===========================================================================
  Artifact:
    description: Storage location, mixed onto every data element.
    mixin: true
    implements:
      - bpmn:ItemAwareElement
    attributes:
      uri:
        description: Where the data lives (`data/raw/`, `results/model.joblib`, `s3://bucket/study`, a DOI or URL); unset stays in memory.
        rank: 1
        in_subset:
          - Data

  # ===========================================================================
  # A named configuration group the engine passes to steps like any other
  # associated data, so a study varies by editing data, not the flow.
  # ===========================================================================
  Parameters:
    description: A named group of configuration values, passed to the steps that read it.
    implements:
      - bpmn:DataObjectReference
    annotations:
      icon: iconify ph--sliders-horizontal
    attributes:
      values:
        description: The configuration, as a YAML mapping.
        range: YAMLString
        rank: 1
        in_subset:
          - Data
        annotations:
          element: true

annotations:
  icon: iconify tabler--hexagon-letter-s
  required: true
