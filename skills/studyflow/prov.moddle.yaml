# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Provenance
prefix: prov
description: >-
  The provenance timeline: who acted on this studyflow, with what tool, and when. Studyflow's own vocabulary,
  not W3C PROV; `studyflow prov` writes a run's record as W3C PROV-O.
  Each record is a `prov:Activity` entry on the element it is about; the study's own (created, modified, and one
  `executed` per run) are on its root.
uri: https://w3id.org/studyflow/prov
icon: iconify tabler--history
order: 2
required: true
xml:
  tagAlias: lowerCase
version: '26.9.2'

enumerations: []

types:
  # Records run oldest first. The study's own (created, modified, and one `executed` per run) are on its root;
  # a runner stamps the rest on the elements they are about (`executed`, `invalidated`, `reused`).
  - name: Activity
    description: 'One record: what was done to this element, by whom, and when.'
    superClass:
      - Element
    properties:
      - name: action
        description: What happened (`created`, `modified`, `imported`, `executed`, `invalidated`, `reused`).
        isAttr: true
        type: String
      - name: when
        description: When it happened, as an ISO 8601 timestamp.
        isAttr: true
        type: String
      - name: who
        description: 'Who acted: a name, an email, or an ORCID.'
        isAttr: true
        type: String
        meta:
          optional: true
      - name: with
        description: The tool that acted, as `name/version`.
        isAttr: true
        type: String
        meta:
          optional: true
      - name: what
        # For `invalidated` and `reused`, the `when` of the entry it refers to.
        description: Element ids the action touched, space-separated.
        isAttr: true
        type: String
        meta:
          optional: true
      - name: run
        description: For `executed`, the run id (the repository holding its outputs).
        isAttr: true
        type: String
        meta:
          optional: true
      - name: seed
        description: For `executed`, the root seed the run used.
        isAttr: true
        type: Integer
        meta:
          optional: true
      - name: allocationSeed
        description: >-
          For `executed` on a random gateway that conceals its allocation, the seed it drew from, which the run
          reveals once it has drawn; its SHA-256 is the gateway's `seedDigest`.
        isAttr: true
        type: String
        meta:
          optional: true
      - name: plan
        description: >-
          For `executed`, the digest of the protocol the run walked (`sha256:…`): the study without its
          state, its provenance and its drawing. `studyflow validate` recomputes it, so a protocol edited
          after the run no longer matches the record.
        isAttr: true
        type: String
        meta:
          optional: true
      - name: clock
        description: >-
          For `executed`, the clock the run's timers waited on, when it was not the machine's: `virtual`, a clock
          that jumps ahead to the next timer whenever the run is idle (`studyflow run --clock virtual`), so the
          times the run recorded are virtual ones.
        isAttr: true
        type: String
        meta:
          optional: true
      - name: commit
        description: >-
          For `executed`, the commit of the run repository that holds the step as it ran: its own
          drawing, and every artifact it read or made. A run re-runs a step whose files or drawing
          differ from what that commit holds.
        isAttr: true
        type: String
        meta:
          optional: true
      - name: note
        description: One line of free text.
        isAttr: true
        type: String
        meta:
          optional: true
