id: agent_eval
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Agent_Eval:
  type: Process
  documentation: |
    An agent-evaluation harness: run a tool-using agent over an eval set, judge
    it, and refit its prompt. Every item's output is checked, scored, and
    collected, with a sample routed to human raters, and the whole eval is
    wrapped in a drawn loop that refits the agent's instructions until the score
    clears the bar.

    The point of the diagram is the line down the middle of it. Everything outside
    the Agent follows a path the diagram fixes: fan out, guard, judge, collect.
    Inside the Agent, nothing does - the model picks which tool to call and when,
    and stops when it decides it is done. That is the difference between a workflow
    and an agent, and here it is the difference between a plain sub-process and an
    ad-hoc one, which is the element BPMN has always used to mean "order decided at
    run time".

    Three consequences follow from drawing it this way:

    - The agent's tools are the activities inside it. A tool that is not drawn is a
      capability nobody reviewed.
    - Every step is one call the engine makes - a model request, a tool
      function, a judge - with its data arriving over the wires.
    - The eval is also the fitness function. The optimization loop is drawn
      control flow: a gateway routes back to the optimizer - a plain service
      task bound to `python://dspy.MIPROv2`, whose trainable is a Prompt
      artifact - while the mean judge score is under the bar, so "evaluate
      the agent" and "improve the agent" are the same diagram.
  extensionElements:
    - type: studyflow:Study
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:22Z"
      with: studyflow-modeler/26.0615
  name: Agent evaluation harness
  flowElements:
    Start:
      type: StartEvent
      name: Start eval
      bounds: 57 52 36 36
    Eval_Set:
      type: DataStoreReference
      extensionElements:
        - type: studyflow:Dataset
      name: Eval set
      bounds: 200 260 50 50
    Rubric:
      type: DataObjectReference
      extensionElements:
        - type: agentic:Prompt
          template: |
            Score the answer 1-5 on: factual support from the retrieved passages,
            completeness against the question, and absence of unsupported claims.
            A 5 requires every claim to be traceable to a passage.
      name: Scoring rubric
      bounds: 57 325 36 50
    Agent_Prompt:
      type: DataObjectReference
      documentation: |
        The agent's instructions as an artifact - the trainable of this flow.
        The first wording is written by hand; each optimizer round overwrites
        it with a better one.
      extensionElements:
        - type: agentic:Prompt
          template: |
            Answer the question using the corpus. Search before you answer, cite
            the passages you used, and say so plainly when the corpus does not
            support an answer.
      name: Agent instructions
      bounds: 57 160 36 50
    Improve:
      type: SubProcess
      documentation: |
        The optimization body: refit the agent's instructions from the last
        round's scores, then re-run the eval. The loop around it is drawn
        control flow - the `Good enough?` gateway routes back here while the
        mean judge score is under the bar, bounded by the engine's visit
        count - so the cycle, its exit rule, and its budget are all visible
        on the diagram. Nothing about the eval changes when it is used to
        improve the thing it measures.
      name: Eval-optimize round
      flowElements:
        Optimize_Prompt:
          type: ServiceTask
          documentation: |
            The fitting step: last round's scored items are the trainset, the
            judge's score is the objective, and the agent's instructions are
            the trainable - `MIPROv2(metric, num_trials,
            max_bootstrapped_demos)` compiling the wired Prompt. On the first
            turn there are no scores yet, so the optimizer passes the
            hand-written prompt through and the baseline gets evaluated first.
          name: Optimize prompt
          dataInputAssociations:
            DataInput_Prompt_In:
              sourceRef:
                - Agent_Prompt
              waypoint: 93,186.74 180,195.16
            DataInput_Trainset:
              sourceRef:
                - Scores
              transformation: trainset
              waypoint: 233.33,210 216.67,160
          dataOutputAssociations:
            DataOutput_Prompt_Out:
              targetRef: Agent_Prompt
              waypoint: 180,195.16 93,186.74
          additionalArguments:
            metric: judge_score
            num_trials: 30
            max_bootstrapped_demos: 4
          implementation: python://dspy.MIPROv2
          bounds: 180 160 100 80
        Per_Item:
          type: SubProcess
          documentation: |
            BPMN's own multi-instance marker fans this body out: one instance
            per item of the wired eval set, the current item bound as
            `question` by the input association, and the per-instance scores
            assembled in instance order into the wired scores collection. The
            instances are independent, so this is also the unit of
            parallelism.
          name: For each eval item
          dataInputAssociations:
            DataInput_Items:
              sourceRef:
                - Eval_Set
              transformation: question
              waypoint: 250,271.29 330,227.42
          dataOutputAssociations:
            DataOutput_Scores:
              targetRef: Scores
              waypoint: 330,195.16 243,186.74
          loopCharacteristics:
            type: MultiInstanceLoopCharacteristics
          flowElements:
            Research_Agent:
              type: AdHocSubProcess
              documentation: |
                An ad-hoc sub-process: the model chooses which of the tools below to call,
                and how many times, until it can answer. `deterministic` is pinned false -
                the engine records each choice rather than assuming it can re-derive it.

                The instructions are wired in from the Agent instructions element by a
                plain data association - so the agent always runs whatever version the
                optimizer last wrote. That element is declared by the process, two
                levels out, because it has to outlive each round of the loop; BPMN
                draws a collapsed sub-process on its parent's plane and its contents on
                another, so this wire has no line to be. The inspector names the scope
                it reaches into instead.
              extensionElements:
                - type: agentic:Agent
                  model: claude-opus-4-8
                  systemPrompt: "{Agent_Prompt}"
                  maxTurns: 8
              name: Research agent
              dataInputAssociations:
                DataInput_Prompt_Agent:
                  sourceRef:
                    - Agent_Prompt
                  waypoint: 93,186.74 180,195.16
              flowElements:
                Search:
                  type: ServiceTask
                  extensionElements:
                    - type: agentic:Tool
                      kind: search
                      purpose: |
                        Look up background facts. Use it when the question needs
                        knowledge you do not already have.
                  name: Search Wikipedia
                  additionalArguments:
                    results: 8
                  implementation: python://wikipedia.search
                  bounds: 180 160 100 80
                Compute:
                  type: ServiceTask
                  extensionElements:
                    - type: agentic:Tool
                      kind: code
                      purpose: |
                        Evaluate a pandas expression over the trial table to check a
                        claim numerically. Use it when the question turns on a statistic.
                  name: Run analysis
                  implementation: python://pandas.eval
                  bounds: 180 300 100 80
              completionCondition: answer != null
              bounds: 180 160 100 80
            Check_Output:
              type: ServiceTask
              documentation: |
                A model checks the answer before it is scored: every claim must
                be supported by a retrieved passage. A guardrail is an ordinary
                model call with a strict prompt, not a special element.
              extensionElements:
                - type: agentic:LLMCall
                  model: claude-haiku-4-5
                  prompt: |
                    Check the answer against the retrieved passages. Every claim
                    must be supported by one; reject answers that cite passages
                    the retriever never returned. Reply `pass` or `fail: <why>`.
              name: Groundedness check
              bounds: 330 160 100 80
            Score:
              type: ServiceTask
              documentation: |
                The judge model is named on the diagram: it is part of the
                measuring instrument, and swapping it moves the numbers.
              extensionElements:
                - type: agentic:LLMCall
                  model: claude-opus-4-8
                  prompt: |
                    Apply the scoring rubric ({Rubric}). Give the score 1-5 and
                    one sentence of justification naming the deciding criterion.
                    Reply as `score: <n>` on the first line.
              name: Judge answer
              dataInputAssociations:
                DataInput_Rubric:
                  sourceRef:
                    - Rubric
                  transformation: rubric
                  waypoint: 93,344.07 480,216.48
              bounds: 480 160 100 80
            Sample:
              type: ExclusiveGateway
              extensionElements:
                - type: cognitive:RandomGateway
              name: Sample for human review?
              bounds: 655 175 50 50
              isMarkerVisible: true
            Human_Rating:
              type: UserTask
              documentation: |
                The human half of the evaluation. Two raters per sampled item, so
                agreement between them - and between them and the model judge - is
                computable rather than assumed.
              extensionElements:
                - type: agentic:HumanApproval
                  question: |
                    Rate this answer against the rubric.
              name: Human rating
              additionalArguments:
                rubric: |
                  Score the answer against the same rubric the model judge used.
                scale: 1-5 Likert
                raters: 2
              bounds: 780 160 100 80
            Item_Done:
              type: EndEvent
              name: Item scored
              bounds: 962 182 36 36
            Flow_Agent_Check:
              sourceRef: Research_Agent
              targetRef: Check_Output
              waypoint: 280,200 330,200
            Flow_Check_Score:
              sourceRef: Check_Output
              targetRef: Score
              waypoint: 430,200 480,200
            Flow_Score_Sample:
              sourceRef: Score
              targetRef: Sample
              waypoint: 580,200 655,200
            Flow_Sample_Human:
              name: sampled
              sourceRef: Sample
              targetRef: Human_Rating
              waypoint: 705,200 780,200
            Flow_Sample_Done:
              name: not sampled
              sourceRef: Sample
              targetRef: Item_Done
              waypoint: 680,225 680,270 980,270 980,218
            Flow_Human_Done:
              sourceRef: Human_Rating
              targetRef: Item_Done
              waypoint: 880,200 962,200
          bounds: 330 160 100 80
        Agreement:
          type: ServiceTask
          documentation: |
            Reduces the collected per-item scores to the round's mean judge
            score - the objective the optimizer maximizes and the loop's
            gateway reads.
          name: Score the eval
          dataInputAssociations:
            DataInput_Scores_Mean:
              sourceRef:
                - Scores
              transformation: a
              waypoint: 243,185.89 480,197.54
          dataOutputAssociations:
            DataOutput_Mean:
              targetRef: Mean_Score
              waypoint: 480,195.16 393,186.74
          implementation: python://numpy.mean
          bounds: 480 160 100 80
        Flow_Optimize_Each:
          sourceRef: Optimize_Prompt
          targetRef: Per_Item
          waypoint: 280,200 330,200
        Flow_Each_Agreement:
          sourceRef: Per_Item
          targetRef: Agreement
          waypoint: 430,200 480,200
      bounds: 175 30 100 80
    Scores:
      type: DataObjectReference
      documentation: |
        Per-item judge scores, one entry per instance of the fan-out,
        assembled in instance order by BPMN's own multi-instance output.
        Also next round's trainset.
      name: Per-item scores
      bounds: 207 160 36 50
    Mean_Score:
      type: DataObjectReference
      documentation: The round's objective; the loop gateway reads it by name.
      name: Mean judge score
      bounds: 357 160 36 50
    Good_Enough:
      type: ExclusiveGateway
      documentation: |
        The drawn optimization loop: while the mean judge score is under the
        bar, the `refit` back-edge returns to the eval-optimize round, and
        the engine-provided visit count bounds it at three rounds. The exit
        is the gateway's native `default`, so a spent budget still ends the
        eval cleanly.
      name: Good enough?
      default: Flow_Improve_Done
      bounds: 350 45 50 50
      isMarkerVisible: true
    Done:
      type: EndEvent
      name: Eval complete
      bounds: 507 52 36 36
    Flow_Start_Improve:
      sourceRef: Start
      targetRef: Improve
      waypoint: 93,70 175,70
    Flow_Improve_Gate:
      sourceRef: Improve
      targetRef: Good_Enough
      waypoint: 275,70 350,70
    Flow_Refit:
      name: refit
      conditionExpression:
        type: FormalExpression
        body: Mean_Score < 4 and state.trace.count('Good_Enough') < 3
        language: python
        xsi:type: bpmn:tFormalExpression
      sourceRef: Good_Enough
      targetRef: Improve
      waypoint: 375,95 375,140 225,140 225,110
    Flow_Improve_Done:
      name: good enough
      sourceRef: Good_Enough
      targetRef: Done
      waypoint: 400,70 507,70
