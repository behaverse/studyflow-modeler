# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

# A model is an actor. The rest is BPMN:
#   - a model call is a task with message flows to the model's pool,
#   - a tool is a service task with an `implementation`,
#   - an agent loop is an ad-hoc sub-process,
#   - a human approval is a user task or manual task with a timer.
# This schema declares a model as a kind of actor, the request and the reply that message flows carry, and a prompt
# template as a data object.

name: Agentic
prefix: agentic
description: |
  Language models as actors in an experiment, with the request and response
  message flows, and a prompt template as data for the elements that ask one.
uri: https://w3id.org/studyflow/agentic
icon: iconify tabler--hexagon-letter-a
order: 102
xml:
  tagAlias: lowerCase
version: '26.9.2'

enumerations:
  - name: PromptDeliveryEnum
    description: How often a prompt rides with the messages of a step it is wired into.
    literalValues:
      - name: With every message
        value: every
      - name: With the first message only
        value: once
  - extends: studyflow:ActorTypeEnum
    description: Extends what a pool can be, beyond human, software, and hardware.
    literalValues:
      - name: Large language model
        value: llm
        # Named by `implementation` (`claude://claude-haiku-4-5`, `ollama://gemma4:12b-it-qat`). As a pool of its own it
        # answers what the other sender elements send it; on a choreography task's band it participates in the task.
        description: A language model, as a pool that answers what it is sent or on a task's band.
  - extends: studyflow:MessageStructureEnum
    description: What a message flow to or from a model's pool carries over.
    literalValues:
      - name: One Request
        value: agentic:Request
        description: One request to the model, a prompt or an image from the task or sub-process that asks.
      - name: One Reply
        value: agentic:Reply
        # A single message, which can have several parts (text, image, audio, etc.) in one flow.
        description: The model's reply, back to the step that asked (image or text).

types:
  - name: Prompt
    description: A prompt kept as data, wired into the elements that send it to a model or receive it.
    superClass:
      - bpmn:DataObjectReference
    meta:
      icon: iconify ph--article
    properties:
      - name: template
        description: The prompt text, in markdown.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 1
      - name: delivery
        # `every` message (the default; a reminder of the rule before each trial), or `once`, with the step's first
        # message only (a task's instructions, which an actor that keeps the conversation still holds).
        description: How often the prompt rides with the messages of a step it is wired into.
        isAttr: true
        type: PromptDeliveryEnum
        default: every
        meta:
          order: 2
