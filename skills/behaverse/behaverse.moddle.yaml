# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Behaverse
prefix: behaverse
description: |
  The Behaverse assessment battery and the Behaverse Data Model.
uri: http://behaverse.org/schemas/studyflow/behaverse
icon: iconify tabler--hexagon-letter-b
order: 4
xml:
  tagAlias: lowerCase
version: '26.9.1'

enumerations:
  - extends: cognitive:ExperimentSoftwareEnum
    description: Adds Behaverse to the list of softwares.
    literalValues:
      - name: Behaverse
        value: behaverse
  - extends: studyflow:DatasetFormatEnum
    description: Adds the Behaverse Data Model to the dataset formats.
    literalValues:
      - name: BDM (Behaverse Data Model)
        value: bdm
        icon: iconify bi--hexagon
  - extends: studyflow:MessageStructureEnum
    description: Add trial and reponse messages to the list of message structures.
    literalValues:
      - name: One Trial
        value: behaverse:Trial
        description: One awaiting trial, from the task to participants (contains stimulus, response options, response window, and screenshot).
      - name: One Response
        value: behaverse:Response
        description: The response to a trial, from participant to task.
  - name: InstrumentEnum
    description: A task of the Behaverse battery, by its id (BDM `instrument_id`).
    literalValues:
      - name: Belval Card Sorting (BCS)
        value: BCS
      - name: Belval Matrices (BM)
        value: BM
      - name: Button Spatial Attention Cueing (BSAC)
        value: BSAC
      - name: Digit Span (DS)
        value: DS
      - name: Monkey Ladder (ML)
        value: ML
      - name: Multiple Object Tracking (MOT)
        value: MOT
      - name: N-Back (NB)
        value: NB
      - name: Ordered Click (OC)
        value: OC
      - name: Odd One Out (OOO)
        value: OOO
      - name: Polygon Comparison (PC)
        value: PC
      - name: Regular Expression (RE)
        value: RE
      - name: Reflexive Spatial Attention Cueing (RSAC)
        value: RSAC
      - name: Sustained Attention to Response Task (SART)
        value: SART
      - name: Symbolic Matrix Comparison (SMC)
        value: SMC
      - name: Self-Ordered Search (SOS)
        value: SOS
      - name: Stimulus-Response Mapping (SRM)
        value: SRM
      - name: Serial Reaction Time (SRT)
        value: SRT
      - name: Spatial Span (SS)
        value: SS
      - name: Target Hit (TH)
        value: TH
      - name: Test of Variable Attention (TOVA)
        value: TOVA
      - name: Useful Field of View (UFOV)
        value: UFOV
      - name: Which One (WO)
        value: WO
  - name: DataLevelEnum
    description: |
        Level of the BDM hierarchy the data is formatted in. The BDM is a three-level hierarchy: events, trials, and models. Each level is derived from the one below it.
    literalValues:
      - name: Events
        value: events
        description: Every recorded occurrence, as it happened.
      - name: Trials
        value: trials
        description: One opportunity to respond and a single interaction, derived from events.
      - name: Models
        value: models
        description: Fitted parameters and scores, derived from events or trials.

  # Which build plays a task: Behaverse's word, so not the study's `runtime` (local, browser), which says where it runs.
  - name: BehaverseRuntimeEnum
    description: A build of the Behaverse battery.
    literalValues:
      - name: Unity
        value: unity
      - name: Godot (task_builder)
        value: godot
      - name: Simulated
        value: simulated
        description: A stand-in for the Unity build that plays the battery's AX-CPT (RE), Which One (WO) and N-back (NB) from the timelines the Parameters wired into the task define, without Unity, so a study's pipeline can be checked where the truth is known. It has no screen, so its trials go along the task's message flows.

types:
  - name: Task
    description: 'A task from the Behaverse assessment battery. Its `instrument` says which, its `timeline` what runs, and the "Parameters" wired into it configure it.'
    superClass:
      - cognitive:CognitiveTask
    meta:
      icon: iconify bi--hexagon
      presenter: "Behaverse - <instrument>"
      glyph: instrument
      # What a played task hands back, which a data edge's `transformation` reads as `result`.
      result: TaskResult
    properties:
      - name: platform
        default: behaverse
        type: String
        isAttr: true
        redefines: cognitive:CognitiveTask#platform
        meta:
          order: 0
          pinned: true
      - name: implementation
        description: 'The build a release of the battery is (`behaverse://assessment-unity@26.10.1`), for the record: the instrument and the timeline say what runs, and `runtime` which build plays it. One naming another skill''s scheme hands the task to that skill.'
        isAttr: true
        type: String
        redefines: cognitive:CognitiveTask#implementation
        meta:
          pinned: true
      - name: instrument
        description: Which task of the battery runs (`NB`, `UFOV`, `DS`), the wire's `scene` and BDM's `instrument_id`.
        isAttr: true
        type: InstrumentEnum
        meta:
          order: 1
          categories:
            - Execution
      - name: timeline
        description: 'The one timeline that runs: one the build ships for the instrument (`XCIT_NB_01`), or one the Parameters wired into the task define under `Timelines`.'
        isAttr: true
        type: String
        meta:
          order: 2
          categories:
            - Execution
      - name: runtime
        description: 'Which build plays the task: the Unity build, the Godot one (task_builder), or the simulated build, which plays the battery''s timelines without Unity to check a study''s pipeline. No runner plays the Godot build yet, so a study with a task set to it stops before its first step.'
        isAttr: true
        type: BehaverseRuntimeEnum
        default: unity
        meta:
          order: 3
          categories:
            - Execution

  - name: TaskResult
    description: What a played task hands back, which a data edge's `transformation` reads as `result`.
    properties:
      - name: TaskId
        description: The instrument that ran (`NB`).
        type: String
      - name: TimelineId
        description: The timeline that ran.
        type: String
      - name: IsCompleted
        description: Whether the task ran to its end.
        type: Boolean
      - name: trials
        description: How many trials were answered.
        type: Integer
      - name: blocks
        description: What the task's trials came to, block by block in the order played.
        type: BlockCounts
        isMany: true
      - name: events
        description: The file the task's records went to.
        type: String
  - name: BlockCounts
    description: 'One block''s trials, as the build recorded them: how many it presented, recorded a valid response for, recorded none for, and scored correct (null when its records say nothing of correctness). A trial the build presents only so the responder sees every stimulus (an N-back burn-in digit) is not counted.'
    properties:
      - name: block
        description: The block's name (`XCIT_NB_02_Test_A`).
        type: String
      - name: trials
        type: Integer
      - name: answered
        type: Integer
      - name: unanswered
        type: Integer
      - name: correct
        type: Integer

  - name: SimulatedTaker
    description: 'A simulated taker of the battery''s tasks: a pool that answers each trial it is sent as a person would read it, right with the probability the study plants, so a pipeline check knows the truth its analysis should recover.'
    superClass:
      - studyflow:Actor
    meta:
      icon: iconify bi--hexagon
    properties:
      - name: actorType
        default: software
        type: studyflow:ActorTypeEnum
        isAttr: true
        redefines: studyflow:Actor#actorType
      - name: implementation
        default: behaverse://simulated-taker
        type: String
        isAttr: true
        redefines: studyflow:Actor#implementation
      - name: accuracy
        description: 'The planted probability of a right answer, by instrument and condition (`RE: {BX: 0.70}`), with `default` for any other; a condition is the one the taker reads from the trial (AX-CPT `Cue`, `AX`, `AY`, `BX`, `BY`, `Distractor`; Which One `Congruent`, `Incongruent`, `Neutral`; N-back `1-back`, `2-back`, `BurnIn`).'
        isAttr: false
        type: studyflow:YAMLString
      - name: prompted
        description: 'Accuracies that hold instead when a text sent with the trial has a line beginning with the key (`"Reminder:": {RE: {BX: 0.88}}`): how the taker plants an effect of what the study tells it.'
        isAttr: false
        type: studyflow:YAMLString
      - name: missRate
        description: The share of trials it leaves unanswered.
        isAttr: true
        type: Real
        default: 0

  - name: BDMDataset
    description: A dataset in the Behaverse Data Model (BDM).
    superClass:
      - studyflow:Dataset
    meta:
      icon: iconify bi--hexagon
    properties:
      - name: format
        default: bdm
        type: String
        isAttr: true
        redefines: studyflow:Dataset#format
        meta:
          pinned: true
      - name: dataLevel
        description: Level of the BDM hierarchy (events, trials, models).
        isAttr: true
        type: DataLevelEnum
        default: events
        meta:
          order: 2
          categories:
            - Data

templates:
  - description: The parameters of an N-Back task running a timeline that ships with the Behaverse build; wire it into the task.
    elements:
      NBack_XCIT_NB_01:
        type: DataObjectReference
        name: N-Back (XCIT_NB_01)
        extensionElements:
          - type: studyflow:Parameters
            values: |
              timeline: XCIT_NB_01
  - description: The parameters of an N-Back task with an inline timeline.
    elements:
      NBack_inline:
        type: DataObjectReference
        name: N-Back (inline)
        extensionElements:
          - type: studyflow:Parameters
            values: |
              timeline: LabLink_Inline
              Blocks:
                LabLink_InlineBlock:
                  Name: LabLink_InlineBlock
                  Inherits: Default
                  Parameters:
                    NValue: 1
                    Feature: Letters
                    Streams:
                      - Feature:
                          Reference: Feature
                        StimulusValue:
                          Generate: OncePerBlock
                          Sequence:
                            Type: Ordered
                            Values: [3, 1, 2, 1, 3, 2, 3, 2]
                    StreamSize: 8
                    FeatureValuesCount: 3
                    MaxResponseTime: 3
                    StimulusDisplayDuration: 0.5
                    InterStimulusInterval: 2.2
              Timelines:
                LabLink_Inline:
                  Name: LabLink_Inline
                  blocks:
                    - name: LabLink_InlineBlock
