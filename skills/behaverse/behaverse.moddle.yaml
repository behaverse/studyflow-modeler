# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Behaverse
prefix: behaverse
description: >-
  The Behaverse assessment battery: its tasks, the trials and responses they
  exchange, and datasets in the Behaverse Data Model.
uri: http://behaverse.org/schemas/studyflow/behaverse
icon: iconify tabler--hexagon-letter-b
order: 4
xml:
  tagAlias: lowerCase
version: 26.0910

enumerations:
  - extends: cognitive:ExperimentSoftwareEnum
    literalValues:
      - name: Behaverse
        value: behaverse
  - extends: studyflow:DatasetFormatEnum
    literalValues:
      - name: BDM (Behaverse Data Model)
        value: bdm
        icon: iconify bi--hexagon
  # Offered on a message flow's Message field; any other item definition's `structureRef` is accepted too.
  - name: MessageStructureEnum
    description: What a message flow to or from a Behaverse task carries, as the structure its message is an item of.
    literalValues:
      - name: A trial
        value: behaverse:Trial
        description: One awaiting trial, out of the task to whoever answers it (its options, response window, and screenshot).
      - name: A response
        value: behaverse:Response
        description: The answer to a trial, back into the task.
  - name: SceneEnum
    description: Behaverse assessment delivered by a Behaverse task.
    literalValues:
      - name: Belval Card Sorting (BCS)
        value: BCS
      - name: Belval Matrices (BM)
        value: BM
      - name: Button Spatial Attention Cueing (BSAC)
        value: BSAC
      - name: Digit Span (DS)
        value: DS
      - name: Monkey Ladder (ML)
        value: ML
      - name: Multiple Object Tracking (MOT)
        value: MOT
      - name: N-Back (NB)
        value: NB
      - name: Ordered Click (OC)
        value: OC
      - name: Odd One Out (OOO)
        value: OOO
      - name: Polygon Comparison (PC)
        value: PC
      - name: Regular Expression (RE)
        value: RE
      - name: Reflexive Spatial Attention Cueing (RSAC)
        value: RSAC
      - name: Sustained Attention to Response Task (SART)
        value: SART
      - name: Symbolic Matrix Comparison (SMC)
        value: SMC
      - name: Self-Ordered Search (SOS)
        value: SOS
      - name: Stimulus-Response Mapping (SRM)
        value: SRM
      - name: Serial Reaction Time (SRT)
        value: SRT
      - name: Spatial Span (SS)
        value: SS
      - name: Target Hit (TH)
        value: TH
      - name: Test of Variable Attention (TOVA)
        value: TOVA
      - name: Useful Field of View (UFOV)
        value: UFOV
      - name: Which One (WO)
        value: WO
  - name: DataLevelEnum
    description: Level of the BDM hierarchy the data sits at.
    literalValues:
      - name: Events
        value: events
        description: Every recorded occurrence, as it happened.
      - name: Trials
        value: trials
        description: One row per trial, derived from events.
      - name: Models
        value: models
        description: Fitted parameters and scores, derived from trials.

types:
  - name: Task
    description: A task from the Behaverse assessment battery.
    superClass:
      - cognitive:CognitiveTask
    meta:
      icon: iconify bi--hexagon
      presenter: "Behaverse · {scene}"
      # The attribute drawn as text over the icon: the hex alone does not say which assessment.
      glyph: scene
    properties:
      - name: instrument
        default: behaverse
        type: String
        isAttr: true
        redefines: cognitive:CognitiveTask#instrument
        meta:
          order: 0
          pinned: true
      - name: implementation
        description: Unused here; the scene says what runs.
        isAttr: true
        type: String
        redefines: cognitive:CognitiveTask#implementation
        meta:
          pinned: true
      - name: scene
        description: Which Behaverse assessment runs (`NB`, `UFOV`, `DS`).
        isAttr: true
        type: SceneEnum
        meta:
          order: 1
          categories:
            - Execution
      - name: configurations
        description: 'The task''s `GameConfig` as YAML: a shipped timeline, or one defined inline. `Bot:` says how a bot plays it (`Speed: 20`), read when the participant taking the task is not a person.'
        type: cognitive:Configurations
        redefines: cognitive:CognitiveTask#configurations
        meta:
          order: 2
          categories:
            - Execution

  # The browser runner performs only simple randomization with equal odds; it
  # warns about anything else (packages/runner/src/allocation.ts).
  - name: Dataset
    description: A dataset in the Behaverse Data Model (BDM).
    superClass:
      - studyflow:Dataset
    meta:
      icon: iconify bi--hexagon
    properties:
      - name: format
        default: bdm
        type: String
        isAttr: true
        redefines: studyflow:Dataset#format
        meta:
          pinned: true
      - name: dataLevel
        description: Level of the BDM hierarchy.
        isAttr: true
        type: DataLevelEnum
        default: events
        meta:
          order: 2
          categories:
            - Data

templates:
  - description: N-Back running a timeline that ships with the Behaverse build.
    elements:
      NBack_XCIT_NB_01:
        type: ChoreographyTask
        name: N-Back (XCIT_NB_01)
        extensionElements:
          - type: behaverse:Task
            scene: NB
            configurations: |
              Timelines:
                XCIT_NB_01:
  - description: N-Back with an inline timeline; author only the blocks that differ from the defaults.
    elements:
      NBack_inline:
        type: ChoreographyTask
        name: N-Back (inline)
        extensionElements:
          - type: behaverse:Task
            scene: NB
            configurations: |
              Blocks:
                LabLink_InlineBlock:
                  Name: LabLink_InlineBlock
                  Inherits: Default
                  Parameters:
                    NValue: 1
                    Feature: Letters
                    Streams:
                      - Feature:
                          Reference: Feature
                        StimulusValue:
                          Generate: OncePerBlock
                          Sequence:
                            Type: Ordered
                            Values: [3, 1, 2, 1, 3, 2, 3, 2]
                    StreamSize: 8
                    FeatureValuesCount: 3
                    MaxResponseTime: 3
                    StimulusDisplayDuration: 0.5
                    InterStimulusInterval: 2.2
              Timelines:
                LabLink_Inline:
                  Name: LabLink_Inline
                  blocks:
                    - name: LabLink_InlineBlock
