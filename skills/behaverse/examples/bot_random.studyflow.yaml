id: demo3_external_bot
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Demo3_ExternalBot_Actors:
  type: Collaboration
  name: Random bot
  participants:
    Actor_Random_bot:
      type: studyflow:Actor
      name: Random bot
      actorType: software
      implementation: behaverse://bot
Demo3_ExternalBot:
  type: studyflow:Study
  name: Random bot
  documentation: A 1-back warm-up and a 2-back block played by the Behaverse build's own random bot.
  extensionElements:
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:26Z"
      with: studyflow-modeler/26.0615
  flowElements:
    Start:
      type: StartEvent
      name: Start
    Warmup_1Back:
      type: behaverse:Task
      name: 1-Back warm-up
      instrument: NB
      timeline: Demo3_Warmup
      participantRef:
        - Actor_Random_bot
      dataInputAssociations:
        In_Warmup_1Back_Parameters:
          sourceRef:
            - Warmup_1Back_Parameters
    Warmup_1Back_Parameters:
      type: studyflow:Parameters
      name: Parameters
      values:
        Blocks:
          Demo3_Warmup:
            Name: Demo3_Warmup
            Inherits: Default
            Parameters:
              NValue: 1
              Feature: Letters
              Streams:
                - Feature:
                    Reference: Feature
                  StimulusValue:
                    Generate: OncePerBlock
                    Sequence:
                      Type: Ordered
                      Values:
                        - 3
                        - 1
                        - 2
                        - 1
                        - 3
                        - 2
                        - 3
                        - 2
              StreamSize: 8
              FeatureValuesCount: 3
              MaxResponseTime: 2
              StimulusDisplayDuration: 0.5
              InterStimulusInterval: 1.5
        Timelines:
          Demo3_Warmup:
            Name: Demo3_Warmup
            blocks:
              - name: Demo3_Warmup
        Bot:
          Speed: 20
          SkipInstructions: true
          AutoClickInstructions: true
          SkipFocusArea: true
          OverrideTemporalParameters: true
          StimulusDisplayDuration: 0.3
          InterStimulusInterval: 0.3
          TrialForeperiod: 0.1
    Main_2Back:
      type: behaverse:Task
      name: 2-Back main
      instrument: NB
      timeline: Demo3_Main
      participantRef:
        - Actor_Random_bot
      dataInputAssociations:
        In_Main_2Back_Parameters:
          sourceRef:
            - Main_2Back_Parameters
    Main_2Back_Parameters:
      type: studyflow:Parameters
      name: Parameters
      values:
        Blocks:
          Demo3_Main:
            Name: Demo3_Main
            Inherits: Default
            Parameters:
              NValue: 2
              Feature: Letters
              Streams:
                - Feature:
                    Reference: Feature
                  StimulusValue:
                    Generate: OncePerBlock
                    Sequence:
                      Type: Ordered
                      Values:
                        - 3
                        - 1
                        - 2
                        - 1
                        - 3
                        - 2
                        - 3
                        - 2
                        - 1
                        - 2
                        - 3
                        - 1
              StreamSize: 12
              FeatureValuesCount: 3
              MaxResponseTime: 2
              StimulusDisplayDuration: 0.5
              InterStimulusInterval: 1.5
        Timelines:
          Demo3_Main:
            Name: Demo3_Main
            blocks:
              - name: Demo3_Main
        Bot:
          Speed: 20
          SkipInstructions: true
          AutoClickInstructions: true
          SkipFocusArea: true
          OverrideTemporalParameters: true
          StimulusDisplayDuration: 0.3
          InterStimulusInterval: 0.3
          TrialForeperiod: 0.1
    End:
      type: EndEvent
      name: Done
    Flow_Start_Warmup: Start -> Warmup_1Back
    Flow_Warmup_Main: Warmup_1Back -> Main_2Back
    Flow_Main_End: Main_2Back -> End
