id: demo3_external_bot
schemas:
  behaverse: http://behaverse.org/schemas/studyflow/behaverse
  prov: https://w3id.org/studyflow/prov
  studyflow: http://behaverse.org/schemas/studyflow/v1

Demo3_ExternalBot_Actors:
  type: Collaboration
  name: Random bot
  pools:
    Actor_Random_bot:
      name: Random bot
      studyflow:Actor:
        actorType: software
        implementation: behaverse://bot

Demo3_ExternalBot:
  type: Process
  name: Random bot
  studyflow:Study: {}
  prov:Activity:
    - {action: created, when: "2026-07-30T22:51:26Z", with: studyflow-modeler/26.0615}
  documentation: A 1-back warm-up and a 2-back block played by the Behaverse build's own random bot.
  elements:
    Start:
      type: StartEvent
      name: Start

    Warmup_1Back:
      type: Task
      name: 1-Back warm-up
      exchange: true
      pools: $Actor_Random_bot
      behaverse:Task:
        instrument: NB
        timeline: Demo3_Warmup
      inputs:
        In_Warmup_1Back_Parameters:
          source: $Warmup_1Back_Parameters

    Warmup_1Back_Parameters:
      type: DataObjectReference
      name: Parameters
      studyflow:Parameters:
        values:
          Blocks:
            Demo3_Warmup:
              Name: Demo3_Warmup
              Inherits: Default
              Parameters:
                NValue: 1
                Feature: Letters
                Streams:
                  - Feature:
                      Reference: Feature
                    StimulusValue:
                      Generate: OncePerBlock
                      Sequence:
                        Type: Ordered
                        Values:
                          - 3
                          - 1
                          - 2
                          - 1
                          - 3
                          - 2
                          - 3
                          - 2
                StreamSize: 8
                FeatureValuesCount: 3
                MaxResponseTime: 2
                StimulusDisplayDuration: 0.5
                InterStimulusInterval: 1.5
          Timelines:
            Demo3_Warmup:
              Name: Demo3_Warmup
              blocks:
                - name: Demo3_Warmup
          Bot:
            Speed: 20
            SkipInstructions: true
            AutoClickInstructions: true
            SkipFocusArea: true
            OverrideTemporalParameters: true
            StimulusDisplayDuration: 0.3
            InterStimulusInterval: 0.3
            TrialForeperiod: 0.1

    Main_2Back:
      type: Task
      name: 2-Back main
      exchange: true
      pools: $Actor_Random_bot
      behaverse:Task:
        instrument: NB
        timeline: Demo3_Main
      inputs:
        In_Main_2Back_Parameters:
          source: $Main_2Back_Parameters

    Main_2Back_Parameters:
      type: DataObjectReference
      name: Parameters
      studyflow:Parameters:
        values:
          Blocks:
            Demo3_Main:
              Name: Demo3_Main
              Inherits: Default
              Parameters:
                NValue: 2
                Feature: Letters
                Streams:
                  - Feature:
                      Reference: Feature
                    StimulusValue:
                      Generate: OncePerBlock
                      Sequence:
                        Type: Ordered
                        Values:
                          - 3
                          - 1
                          - 2
                          - 1
                          - 3
                          - 2
                          - 3
                          - 2
                          - 1
                          - 2
                          - 3
                          - 1
                StreamSize: 12
                FeatureValuesCount: 3
                MaxResponseTime: 2
                StimulusDisplayDuration: 0.5
                InterStimulusInterval: 1.5
          Timelines:
            Demo3_Main:
              Name: Demo3_Main
              blocks:
                - name: Demo3_Main
          Bot:
            Speed: 20
            SkipInstructions: true
            AutoClickInstructions: true
            SkipFocusArea: true
            OverrideTemporalParameters: true
            StimulusDisplayDuration: 0.3
            InterStimulusInterval: 0.3
            TrialForeperiod: 0.1

    End:
      type: EndEvent
      name: Done

    Flow_Start_Warmup:
      source: $Start
      target: $Warmup_1Back

    Flow_Warmup_Main:
      source: $Warmup_1Back
      target: $Main_2Back

    Flow_Main_End:
      source: $Main_2Back
      target: $End

layout:
  Start: {bounds: 160 180 36 36, label: 166 223 24 15}
  Warmup_1Back: 260 138 120 120
  In_Warmup_1Back_Parameters: 320,308 320,258
  Warmup_1Back_Parameters: 302 308 36 50
  Main_2Back: 450 138 120 120
  In_Main_2Back_Parameters: 510,308 510,258
  Main_2Back_Parameters: 492 308 36 50
  End: {bounds: 640 180 36 36, label: 647 223 22 15}
  Flow_Start_Warmup: 196,198 260,198
  Flow_Warmup_Main: 380,198 450,198
  Flow_Main_End: 570,198 640,198

state:
  _meta:
    prov:
      - action: created
        when: "2026-09-14T10:07:20+02:00"
        with: studyflow-modeler/26.9.18
