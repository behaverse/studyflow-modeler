id: demo4_llm_bot
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
  xmlns:bpmn2: http://www.omg.org/spec/BPMN/20100524/MODEL
Demo4_LLMBot_Actors:
  type: Collaboration
  name: LLM bot (Claude Code)
  participants:
    Claude:
      extensionElements:
        - type: cognitive:Actor
          actorType: llm
          implementation: claude://claude-haiku-4-5
      name: Claude
Demo4_LLMBot:
  type: Process
  documentation: A Claude bot plays a tired 1-back warm-up, an expert 2-back block, and a vision-based WhichOne task.
  extensionElements:
    - type: studyflow:Study
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:25Z"
      with: studyflow-modeler/26.0615
  name: LLM bot (Claude Code)
  flowElements:
    Start:
      type: StartEvent
      name: Start
      bounds: 160 180 36 36
      label: 154 223 48 15
    Warmup_1Back:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          configurations:
            Blocks:
              Demo4_Warmup:
                Name: Demo4_Warmup
                Inherits: Default
                Parameters:
                  NValue: 1
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                  StreamSize: 8
                  FeatureValuesCount: 3
                  MaxResponseTime: 30
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 1.5
            Timelines:
              Demo4_Warmup:
                Name: Demo4_Warmup
                blocks:
                  - name: Demo4_Warmup
            Bot:
              Speed: 20
              SkipInstructions: true
              AutoClickInstructions: true
              SkipFocusArea: true
              OverrideTemporalParameters: true
              StimulusDisplayDuration: 0.3
              InterStimulusInterval: 0.3
              TrialForeperiod: 0.1
              overrideUserInputParameters: true
              playerPaced: true
              useNonMatchButton: true
              maxResponseTime: 120
          scene: NB
      name: 1-Back warm-up (tired)
      participantRef:
        - Claude
      dataInputAssociations:
        In_Warmup_1Back:
          sourceRef:
            - Instructions_Warmup_1Back
          waypoint: 320,308 320,258
      bounds: 260 138 120 120
    Instructions_Warmup_1Back:
      type: DataObjectReference
      extensionElements:
        - type: agentic:Prompt
          template: |
            You are a tired participant near the end of a long 1-back session.
            Aim for about 80% accuracy. Occasionally miss matches when your
            attention drifts. Never explain; reply with exactly Match or NonMatch.
      name: Instructions
      bounds: 302 308 36 50
      label: 280 363 80 15
    Main_2Back:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          configurations:
            Blocks:
              Demo4_Main:
                Name: Demo4_Main
                Inherits: Default
                Parameters:
                  NValue: 2
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                            - 1
                            - 2
                            - 3
                            - 1
                  StreamSize: 12
                  FeatureValuesCount: 3
                  MaxResponseTime: 30
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 1.5
            Timelines:
              Demo4_Main:
                Name: Demo4_Main
                blocks:
                  - name: Demo4_Main
            Bot:
              Speed: 20
              SkipInstructions: true
              AutoClickInstructions: true
              SkipFocusArea: true
              OverrideTemporalParameters: true
              StimulusDisplayDuration: 0.3
              InterStimulusInterval: 0.3
              TrialForeperiod: 0.1
              overrideUserInputParameters: true
              playerPaced: true
              useNonMatchButton: true
              maxResponseTime: 120
          scene: NB
      name: 2-Back main (expert)
      participantRef:
        - Claude
      dataInputAssociations:
        In_Main_2Back:
          sourceRef:
            - Instructions_Main_2Back
          waypoint: 510,308 510,258
      bounds: 450 138 120 120
    Instructions_Main_2Back:
      type: DataObjectReference
      extensionElements:
        - type: agentic:Prompt
          template: |
            You are an attentive, expert participant in a 2-back task.
            Respond Match if the current letter is identical to the letter shown
            exactly two trials ago, otherwise NonMatch. Aim for near-perfect
            accuracy. Reply with exactly Match or NonMatch; no explanation.
      name: Instructions
      bounds: 492 308 36 50
      label: 470 363 80 15
    Visual_WhichOne:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          configurations:
            Timelines:
              SimonTask: null
            Bot:
              IncludeScreenshot: true
              Speed: 5
              SkipInstructions: true
              AutoClickInstructions: true
              SkipFocusArea: true
          scene: WO
      name: WhichOne (vision)
      participantRef:
        - Claude
      dataInputAssociations:
        In_Visual_WhichOne:
          sourceRef:
            - Instructions_Visual_WhichOne
          waypoint: 700,308 700,258
      bounds: 640 138 120 120
    Instructions_Visual_WhichOne:
      type: DataObjectReference
      extensionElements:
        - type: agentic:Prompt
          template: |
            You will see a screenshot from the WhichOne task. Two stimuli appear
            on the left and right of the screen; one matches a target shown above.
            Reply with exactly `Left` or `Right`; nothing else.
      name: Instructions
      bounds: 682 308 36 50
      label: 660 363 80 15
    End:
      type: EndEvent
      name: Done
      bounds: 830 180 36 36
      label: 825 223 46 15
    Flow_Start_Warmup:
      sourceRef: Start
      targetRef: Warmup_1Back
      waypoint: 196,198 260,198
    Flow_Warmup_Main:
      sourceRef: Warmup_1Back
      targetRef: Main_2Back
      waypoint: 380,198 450,198
    Flow_Main_Visual:
      sourceRef: Main_2Back
      targetRef: Visual_WhichOne
      waypoint: 570,198 640,198
    Flow_Visual_End:
      sourceRef: Visual_WhichOne
      targetRef: End
      waypoint: 760,198 830,198
