id: demo4_llm_bot
schemas:
  agentic: https://w3id.org/studyflow/agentic
  behaverse: http://behaverse.org/schemas/studyflow/behaverse
  prov: https://w3id.org/studyflow/prov
  studyflow: http://behaverse.org/schemas/studyflow/v1

Demo4_LLMBot_Actors:
  type: Collaboration
  name: LLM bot (Claude Code)
  studyflow:Study: {}
  prov:Activity:
    - {action: created, when: "2026-07-30T22:51:25Z", with: studyflow-modeler/26.0615}
  documentation: A Claude bot plays a tired 1-back warm-up, an expert 2-back block, and a vision-based WhichOne task.
  participants:
    Claude:
      name: Claude
      studyflow:Actor:
        actorType: llm
        implementation: claude://claude-haiku-4-5

    Pool_Session:
      name: Task session
      process: $Demo4_LLMBot

Demo4_LLMBot:
  type: Process
  elements:
    Start:
      type: StartEvent
      name: Start

    Warmup_1Back:
      type: Task
      name: 1-Back warm-up (tired)
      exchange: true
      participants: $Claude
      behaverse:Task:
        instrument: NB
        timeline: Demo4_Warmup
      inputs:
        In_Warmup_1Back:
          source: $Instructions_Warmup_1Back

        In_Warmup_1Back_Parameters:
          source: $Warmup_1Back_Parameters

    Warmup_1Back_Parameters:
      type: DataObjectReference
      name: Parameters
      studyflow:Parameters:
        values:
          Blocks:
            Demo4_Warmup:
              Name: Demo4_Warmup
              Inherits: Default
              Parameters:
                NValue: 1
                Feature: Letters
                Streams:
                  - Feature:
                      Reference: Feature
                    StimulusValue:
                      Generate: OncePerBlock
                      Sequence:
                        Type: Ordered
                        Values:
                          - 3
                          - 1
                          - 2
                          - 1
                          - 3
                          - 2
                          - 3
                          - 2
                StreamSize: 8
                FeatureValuesCount: 3
                MaxResponseTime: 30
                StimulusDisplayDuration: 0.5
                InterStimulusInterval: 1.5
          Timelines:
            Demo4_Warmup:
              Name: Demo4_Warmup
              blocks:
                - name: Demo4_Warmup
          Bot:
            Speed: 20
            SkipInstructions: true
            AutoClickInstructions: true
            SkipFocusArea: true
            OverrideTemporalParameters: true
            StimulusDisplayDuration: 0.3
            InterStimulusInterval: 0.3
            TrialForeperiod: 0.1
            overrideUserInputParameters: true
            playerPaced: true
            useNonMatchButton: true
            maxResponseTime: 120

    Instructions_Warmup_1Back:
      type: DataObjectReference
      name: Instructions
      agentic:Prompt:
        template: |
          You are a tired participant near the end of a long 1-back session.
          Aim for about 80% accuracy. Occasionally miss matches when your
          attention drifts. Never explain; reply with exactly Match or NonMatch.

    Main_2Back:
      type: Task
      name: 2-Back main (expert)
      exchange: true
      participants: $Claude
      behaverse:Task:
        instrument: NB
        timeline: Demo4_Main
      inputs:
        In_Main_2Back:
          source: $Instructions_Main_2Back

        In_Main_2Back_Parameters:
          source: $Main_2Back_Parameters

    Main_2Back_Parameters:
      type: DataObjectReference
      name: Parameters
      studyflow:Parameters:
        values:
          Blocks:
            Demo4_Main:
              Name: Demo4_Main
              Inherits: Default
              Parameters:
                NValue: 2
                Feature: Letters
                Streams:
                  - Feature:
                      Reference: Feature
                    StimulusValue:
                      Generate: OncePerBlock
                      Sequence:
                        Type: Ordered
                        Values:
                          - 3
                          - 1
                          - 2
                          - 1
                          - 3
                          - 2
                          - 3
                          - 2
                          - 1
                          - 2
                          - 3
                          - 1
                StreamSize: 12
                FeatureValuesCount: 3
                MaxResponseTime: 30
                StimulusDisplayDuration: 0.5
                InterStimulusInterval: 1.5
          Timelines:
            Demo4_Main:
              Name: Demo4_Main
              blocks:
                - name: Demo4_Main
          Bot:
            Speed: 20
            SkipInstructions: true
            AutoClickInstructions: true
            SkipFocusArea: true
            OverrideTemporalParameters: true
            StimulusDisplayDuration: 0.3
            InterStimulusInterval: 0.3
            TrialForeperiod: 0.1
            overrideUserInputParameters: true
            playerPaced: true
            useNonMatchButton: true
            maxResponseTime: 120

    Instructions_Main_2Back:
      type: DataObjectReference
      name: Instructions
      agentic:Prompt:
        template: |
          You are an attentive, expert participant in a 2-back task.
          Respond Match if the current letter is identical to the letter shown
          exactly two trials ago, otherwise NonMatch. Aim for near-perfect
          accuracy. Reply with exactly Match or NonMatch; no explanation.

    Visual_WhichOne:
      type: Task
      name: WhichOne (vision)
      exchange: true
      participants: $Claude
      behaverse:Task:
        instrument: WO
        timeline: SimonTask
      inputs:
        In_Visual_WhichOne:
          source: $Instructions_Visual_WhichOne

        In_Visual_WhichOne_Parameters:
          source: $Visual_WhichOne_Parameters

    Visual_WhichOne_Parameters:
      type: DataObjectReference
      name: Parameters
      studyflow:Parameters:
        values:
          Bot:
            IncludeScreenshot: true
            Speed: 5
            SkipInstructions: true
            AutoClickInstructions: true
            SkipFocusArea: true

    Instructions_Visual_WhichOne:
      type: DataObjectReference
      name: Instructions
      agentic:Prompt:
        template: |
          You will see a screenshot from the WhichOne task. Two stimuli appear
          on the left and right of the screen; one matches a target shown above.
          Reply with exactly `Left` or `Right`; nothing else.

    End:
      type: EndEvent
      name: Done

    Flow_Start_Warmup:
      source: $Start
      target: $Warmup_1Back

    Flow_Warmup_Main:
      source: $Warmup_1Back
      target: $Main_2Back

    Flow_Main_Visual:
      source: $Main_2Back
      target: $Visual_WhichOne

    Flow_Visual_End:
      source: $Visual_WhichOne
      target: $End

