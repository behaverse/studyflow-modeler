id: agent_eval_pool
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
  xmlns:bpmn2: http://www.omg.org/spec/BPMN/20100524/MODEL
Agent_Eval_Pool_Actors:
  type: Collaboration
  name: LLM evaluation — agent actor pool
  participants:
    Actor_Random_bot:
      extensionElements:
        - type: studyflow:Actor
          actorType: software
          implementation: random
      name: Random bot
    Actor_Claude__claude_haiku_4_5:
      extensionElements:
        - type: studyflow:Actor
          actorType: llm
          implementation: claude://claude-haiku-4-5
      name: Claude (claude-haiku-4-5)
    Actor_Ollama__gemma4_e2b_mlx:
      extensionElements:
        - type: studyflow:Actor
          actorType: llm
          implementation: ollama://gemma4:e2b-mlx
      name: Ollama (gemma4:e2b-mlx)
Agent_Eval_Pool:
  type: Process
  documentation: Runs one 2-back protocol on random, Claude, and Ollama agents in parallel and compares their accuracy.
  extensionElements:
    - type: studyflow:Study
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:23Z"
      with: studyflow-modeler/26.0615
  name: LLM evaluation — agent actor pool
  flowElements:
    Start:
      type: StartEvent
      name: Load N-Back protocol
      bounds: 160 280 36 36
      label: 140 323 78 30
    Fork:
      type: ParallelGateway
      name: Dispatch to agent pool
      bounds: 250 273 50 50
      label: 236 330 80 30
    Agent_Random:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          configurations:
            Blocks:
              Eval_2Back:
                Name: Eval_2Back
                Inherits: Default
                Parameters:
                  NValue: 2
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                            - 1
                            - 2
                            - 3
                            - 1
                  StreamSize: 12
                  FeatureValuesCount: 3
                  MaxResponseTime: 2
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 1.5
            Timelines:
              Eval_2Back:
                Name: Eval_2Back
                blocks:
                  - name: Eval_2Back
            Bot:
              Speed: 20
              SkipInstructions: true
              AutoClickInstructions: true
              SkipFocusArea: true
              OverrideTemporalParameters: true
              StimulusDisplayDuration: 0.3
              InterStimulusInterval: 0.3
              TrialForeperiod: 0.1
          scene: NB
      name: Random baseline agent
      participantRef:
        - Actor_Random_bot
      bounds: 380 80 120 120
    Agent_Claude:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          configurations:
            Blocks:
              Eval_2Back:
                Name: Eval_2Back
                Inherits: Default
                Parameters:
                  NValue: 2
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                            - 1
                            - 2
                            - 3
                            - 1
                  StreamSize: 12
                  FeatureValuesCount: 3
                  MaxResponseTime: 30
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 1.5
            Timelines:
              Eval_2Back:
                Name: Eval_2Back
                blocks:
                  - name: Eval_2Back
            Bot:
              Speed: 20
              SkipInstructions: true
              AutoClickInstructions: true
              SkipFocusArea: true
              OverrideTemporalParameters: true
              StimulusDisplayDuration: 0.3
              InterStimulusInterval: 0.3
              TrialForeperiod: 0.1
              overrideUserInputParameters: true
              playerPaced: true
              useNonMatchButton: true
              maxResponseTime: 120
          scene: NB
      name: Claude LLM agent
      participantRef:
        - Actor_Claude__claude_haiku_4_5
      dataInputAssociations:
        In_Agent_Claude:
          sourceRef:
            - Instructions_Agent_Claude
          waypoint: 440,408 440,358
      bounds: 380 238 120 120
    Instructions_Agent_Claude:
      type: DataObjectReference
      extensionElements:
        - type: agentic:Prompt
          template: |
            You are an attentive, expert participant in a 2-back task.
            Respond Match if the current letter is identical to the letter shown
            exactly two trials ago, otherwise NonMatch. Aim for near-perfect
            accuracy. Reply with exactly Match or NonMatch; no explanation.
      name: Instructions
      bounds: 422 408 36 50
      label: 400 463 80 15
    Agent_Ollama:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          configurations:
            Blocks:
              Eval_2Back:
                Name: Eval_2Back
                Inherits: Default
                Parameters:
                  NValue: 2
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                            - 1
                            - 2
                            - 3
                            - 1
                  StreamSize: 12
                  FeatureValuesCount: 3
                  MaxResponseTime: 15
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 1.5
            Timelines:
              Eval_2Back:
                Name: Eval_2Back
                blocks:
                  - name: Eval_2Back
            Bot:
              Speed: 20
              SkipInstructions: true
              AutoClickInstructions: true
              SkipFocusArea: true
              OverrideTemporalParameters: true
              StimulusDisplayDuration: 0.3
              InterStimulusInterval: 0.3
              TrialForeperiod: 0.1
              overrideUserInputParameters: true
              playerPaced: true
              useNonMatchButton: true
              maxResponseTime: 15
          scene: NB
      name: Ollama LLM agent (local)
      participantRef:
        - Actor_Ollama__gemma4_e2b_mlx
      dataInputAssociations:
        In_Agent_Ollama:
          sourceRef:
            - Instructions_Agent_Ollama
          waypoint: 440,570 440,520
      bounds: 380 400 120 120
    Instructions_Agent_Ollama:
      type: DataObjectReference
      extensionElements:
        - type: agentic:Prompt
          template: |
            You are an attentive, expert participant in a 2-back task.
            Respond Match if the current letter is identical to the letter shown
            exactly two trials ago, otherwise NonMatch. Aim for near-perfect
            accuracy. Reply with exactly Match or NonMatch; no explanation.
      name: Instructions
      bounds: 422 570 36 50
      label: 400 625 80 15
    Join:
      type: ParallelGateway
      name: Collect responses
      bounds: 560 273 50 50
      label: 548 330 76 30
    Score:
      type: Task
      checklist: |-
        - [ ] Compute hit rate / false-alarm rate per agent
        - [ ] Compute d-prime per agent
        - [ ] Compare each model to the random baseline
        - [ ] Compare models to human norms
      name: Aggregate & compare accuracy
      dataOutputAssociations:
        DataOutput_Score_Responses:
          targetRef: Dataset_Responses
          waypoint: 730,338 730,430
      bounds: 660 258 140 80
    Dataset_Responses:
      type: DataStoreReference
      extensionElements:
        - type: behaverse:BDMDataset
          dataLevel: trials
      name: Agent response set
      bounds: 705 430 50 50
      label: 688 485 84 30
    End:
      type: EndEvent
      name: Evaluation report
      bounds: 860 280 36 36
      label: 838 323 82 30
    Flow_Start_Fork:
      sourceRef: Start
      targetRef: Fork
      waypoint: 196,298 250,298
    Flow_Fork_Random:
      sourceRef: Fork
      targetRef: Agent_Random
      waypoint: 300,298 340,298 340,140 380,140
    Flow_Fork_Claude:
      sourceRef: Fork
      targetRef: Agent_Claude
      waypoint: 300,298 380,298
    Flow_Fork_Ollama:
      sourceRef: Fork
      targetRef: Agent_Ollama
      waypoint: 300,298 340,298 340,460 380,460
    Flow_Random_Join:
      sourceRef: Agent_Random
      targetRef: Join
      waypoint: 500,140 540,140 540,298 560,298
    Flow_Claude_Join:
      sourceRef: Agent_Claude
      targetRef: Join
      waypoint: 500,298 560,298
    Flow_Ollama_Join:
      sourceRef: Agent_Ollama
      targetRef: Join
      waypoint: 500,460 540,460 540,298 560,298
    Flow_Join_Score:
      sourceRef: Join
      targetRef: Score
      waypoint: 610,298 660,298
    Flow_Score_End:
      sourceRef: Score
      targetRef: End
      waypoint: 800,298 860,298
  isExecutable: false
state:
  _meta:
    prov:
      - action: created
        when: "2026-09-14T10:07:21+02:00"
        with: studyflow-modeler/26.9.18
