id: agent_eval_pool
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Agent_Eval_Pool_Actors:
  type: Collaboration
  name: LLM evaluation — agent actor pool
  participants:
    Actor_Random_bot:
      type: studyflow:Actor
      name: Random bot
      actorType: software
      implementation: behaverse://bot
    Actor_Claude__claude_haiku_4_5:
      type: studyflow:Actor
      name: Claude (claude-haiku-4-5)
      actorType: llm
      implementation: claude://claude-haiku-4-5
    Actor_Ollama__gemma4_e2b_mlx:
      type: studyflow:Actor
      name: Ollama (gemma4:e2b-mlx)
      actorType: llm
      implementation: ollama://gemma4:e2b-mlx
Agent_Eval_Pool:
  type: studyflow:Study
  name: LLM evaluation — agent actor pool
  documentation: Runs one 2-back protocol on random, Claude, and Ollama agents in parallel and compares their accuracy.
  extensionElements:
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:23Z"
      with: studyflow-modeler/26.0615
  flowElements:
    Start:
      type: StartEvent
      name: Load N-Back protocol
    Fork:
      type: ParallelGateway
      name: Dispatch to agent pool
    Agent_Random:
      type: behaverse:Task
      name: Random baseline agent
      instrument: NB
      timeline: Eval_2Back
      participantRef:
        - Actor_Random_bot
      dataInputAssociations:
        In_Agent_Random_Parameters:
          sourceRef:
            - Agent_Random_Parameters
    Agent_Random_Parameters:
      type: studyflow:Parameters
      name: Parameters
      values:
        Blocks:
          Eval_2Back:
            Name: Eval_2Back
            Inherits: Default
            Parameters:
              NValue: 2
              Feature: Letters
              Streams:
                - Feature:
                    Reference: Feature
                  StimulusValue:
                    Generate: OncePerBlock
                    Sequence:
                      Type: Ordered
                      Values:
                        - 3
                        - 1
                        - 2
                        - 1
                        - 3
                        - 2
                        - 3
                        - 2
                        - 1
                        - 2
                        - 3
                        - 1
              StreamSize: 12
              FeatureValuesCount: 3
              MaxResponseTime: 2
              StimulusDisplayDuration: 0.5
              InterStimulusInterval: 1.5
        Timelines:
          Eval_2Back:
            Name: Eval_2Back
            blocks:
              - name: Eval_2Back
        Bot:
          Speed: 20
          SkipInstructions: true
          AutoClickInstructions: true
          SkipFocusArea: true
          OverrideTemporalParameters: true
          StimulusDisplayDuration: 0.3
          InterStimulusInterval: 0.3
          TrialForeperiod: 0.1
    Agent_Claude:
      type: behaverse:Task
      name: Claude LLM agent
      instrument: NB
      timeline: Eval_2Back
      participantRef:
        - Actor_Claude__claude_haiku_4_5
      dataInputAssociations:
        In_Agent_Claude:
          sourceRef:
            - Instructions_Agent_Claude
        In_Agent_Claude_Parameters:
          sourceRef:
            - Agent_Claude_Parameters
    Agent_Claude_Parameters:
      type: studyflow:Parameters
      name: Parameters
      values:
        Blocks:
          Eval_2Back:
            Name: Eval_2Back
            Inherits: Default
            Parameters:
              NValue: 2
              Feature: Letters
              Streams:
                - Feature:
                    Reference: Feature
                  StimulusValue:
                    Generate: OncePerBlock
                    Sequence:
                      Type: Ordered
                      Values:
                        - 3
                        - 1
                        - 2
                        - 1
                        - 3
                        - 2
                        - 3
                        - 2
                        - 1
                        - 2
                        - 3
                        - 1
              StreamSize: 12
              FeatureValuesCount: 3
              MaxResponseTime: 30
              StimulusDisplayDuration: 0.5
              InterStimulusInterval: 1.5
        Timelines:
          Eval_2Back:
            Name: Eval_2Back
            blocks:
              - name: Eval_2Back
        Bot:
          Speed: 20
          SkipInstructions: true
          AutoClickInstructions: true
          SkipFocusArea: true
          OverrideTemporalParameters: true
          StimulusDisplayDuration: 0.3
          InterStimulusInterval: 0.3
          TrialForeperiod: 0.1
          overrideUserInputParameters: true
          playerPaced: true
          useNonMatchButton: true
          maxResponseTime: 120
    Instructions_Agent_Claude:
      type: agentic:Prompt
      name: Instructions
      template: |
        You are an attentive, expert participant in a 2-back task.
        Respond Match if the current letter is identical to the letter shown
        exactly two trials ago, otherwise NonMatch. Aim for near-perfect
        accuracy. Reply with exactly Match or NonMatch; no explanation.
    Agent_Ollama:
      type: behaverse:Task
      name: Ollama LLM agent (local)
      instrument: NB
      timeline: Eval_2Back
      participantRef:
        - Actor_Ollama__gemma4_e2b_mlx
      dataInputAssociations:
        In_Agent_Ollama:
          sourceRef:
            - Instructions_Agent_Ollama
        In_Agent_Ollama_Parameters:
          sourceRef:
            - Agent_Ollama_Parameters
    Agent_Ollama_Parameters:
      type: studyflow:Parameters
      name: Parameters
      values:
        Blocks:
          Eval_2Back:
            Name: Eval_2Back
            Inherits: Default
            Parameters:
              NValue: 2
              Feature: Letters
              Streams:
                - Feature:
                    Reference: Feature
                  StimulusValue:
                    Generate: OncePerBlock
                    Sequence:
                      Type: Ordered
                      Values:
                        - 3
                        - 1
                        - 2
                        - 1
                        - 3
                        - 2
                        - 3
                        - 2
                        - 1
                        - 2
                        - 3
                        - 1
              StreamSize: 12
              FeatureValuesCount: 3
              MaxResponseTime: 15
              StimulusDisplayDuration: 0.5
              InterStimulusInterval: 1.5
        Timelines:
          Eval_2Back:
            Name: Eval_2Back
            blocks:
              - name: Eval_2Back
        Bot:
          Speed: 20
          SkipInstructions: true
          AutoClickInstructions: true
          SkipFocusArea: true
          OverrideTemporalParameters: true
          StimulusDisplayDuration: 0.3
          InterStimulusInterval: 0.3
          TrialForeperiod: 0.1
          overrideUserInputParameters: true
          playerPaced: true
          useNonMatchButton: true
          maxResponseTime: 15
    Instructions_Agent_Ollama:
      type: agentic:Prompt
      name: Instructions
      template: |
        You are an attentive, expert participant in a 2-back task.
        Respond Match if the current letter is identical to the letter shown
        exactly two trials ago, otherwise NonMatch. Aim for near-perfect
        accuracy. Reply with exactly Match or NonMatch; no explanation.
    Join:
      type: ParallelGateway
      name: Collect responses
    Score:
      type: Task
      name: Aggregate & compare accuracy
      checklist: |-
        - [ ] Compute hit rate / false-alarm rate per agent
        - [ ] Compute d-prime per agent
        - [ ] Compare each model to the random baseline
        - [ ] Compare models to human norms
      dataOutputAssociations:
        DataOutput_Score_Responses:
          targetRef: Dataset_Responses
    Dataset_Responses:
      type: behaverse:BDMDataset
      name: Agent response set
      dataLevel: trials
    End:
      type: EndEvent
      name: Evaluation report
    Flow_Start_Fork: Start -> Fork
    Flow_Fork_Random: Fork -> Agent_Random
    Flow_Fork_Claude: Fork -> Agent_Claude
    Flow_Fork_Ollama: Fork -> Agent_Ollama
    Flow_Random_Join: Agent_Random -> Join
    Flow_Claude_Join: Agent_Claude -> Join
    Flow_Ollama_Join: Agent_Ollama -> Join
    Flow_Join_Score: Join -> Score
    Flow_Score_End: Score -> End
  isExecutable: false
