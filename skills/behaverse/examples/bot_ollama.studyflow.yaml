id: demo5_ollama_bot
schemas:
  agentic: https://w3id.org/studyflow/agentic
  behaverse: http://behaverse.org/schemas/studyflow/behaverse
  cognitive: http://behaverse.org/schemas/studyflow/cognitive
  prov: https://w3id.org/studyflow/prov
  studyflow: http://behaverse.org/schemas/studyflow/v1

Demo5_OllamaBot_Actors:
  type: Collaboration
  name: LLM bot (Ollama)
  extensions:
    studyflow:Study: {}
    prov:Activity:
      - {action: created, when: "2026-07-30T22:51:27Z", with: studyflow-modeler/26.0615}
  participants:
    Pool_Session:
      name: N-Back session
      process: $Demo5_OllamaBot

    Actor_Ollama__gemma4_e2b_mlx:
      name: Ollama (gemma4:e2b-mlx)
      extensions:
        studyflow:Actor:
          actorType: llm
          implementation: ollama://gemma4:e2b-mlx
  messageFlows:
    Msg_Warmup_Trial:
      name: one trial
      source: $Warmup_1Back
      target: $Actor_Ollama__gemma4_e2b_mlx
      message: $Trial

    Msg_Warmup_Response:
      name: the response
      source: $Actor_Ollama__gemma4_e2b_mlx
      target: $Warmup_1Back
      message: $Response

    Msg_Main_Trial:
      name: one trial
      source: $Main_2Back
      target: $Actor_Ollama__gemma4_e2b_mlx
      message: $Trial

    Msg_Main_Response:
      name: the response
      source: $Actor_Ollama__gemma4_e2b_mlx
      target: $Main_2Back
      message: $Response

Trial:
  type: Message
  item: $Trial_Item

Response:
  type: Message
  item: $Response_Item

Trial_Item:
  type: ItemDefinition
  structure: cognitive:Trial

Response_Item:
  type: ItemDefinition
  structure: cognitive:Response

Demo5_OllamaBot:
  type: Process
  name: LLM bot (Ollama)
  documentation: A tired 1-back warm-up and an expert 2-back block played by a local Ollama LLM bot.
  elements:
    Start:
      type: StartEvent
      name: Start

    Warmup_1Back:
      type: ChoreographyTask
      name: 1-Back warm-up (tired)
      extensions:
        behaverse:Task:
          instrument: NB
          timeline: Demo5_Warmup
      inputs:
        In_Warmup_1Back:
          source: $Instructions_Warmup_1Back

        In_Warmup_1Back_Parameters:
          source: $Warmup_1Back_Parameters

    Warmup_1Back_Parameters:
      type: DataObjectReference
      name: Parameters
      extensions:
        studyflow:Parameters:
          values:
            Blocks:
              Demo5_Warmup:
                Name: Demo5_Warmup
                Inherits: Default
                Parameters:
                  NValue: 1
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                  StreamSize: 8
                  FeatureValuesCount: 3
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 1.5
            Timelines:
              Demo5_Warmup:
                Name: Demo5_Warmup
                blocks:
                  - name: Demo5_Warmup
            Bot:
              Speed: 20
              SkipInstructions: true
              AutoClickInstructions: true
              SkipFocusArea: true
              OverrideTemporalParameters: true
              StimulusDisplayDuration: 0.3
              InterStimulusInterval: 0.3
              TrialForeperiod: 0.1
              overrideUserInputParameters: true
              playerPaced: true
              useNonMatchButton: true
              maxResponseTime: 15

    Instructions_Warmup_1Back:
      type: DataObjectReference
      name: Instructions
      extensions:
        agentic:Prompt:
          template: |
            You are a tired participant near the end of a long 1-back session.
            Aim for about 80% accuracy. Occasionally miss matches when your
            attention drifts. Never explain; reply with exactly Match or NonMatch.

    Main_2Back:
      type: ChoreographyTask
      name: 2-Back main (expert)
      extensions:
        behaverse:Task:
          instrument: NB
          timeline: Demo5_Main
      inputs:
        In_Main_2Back:
          source: $Instructions_Main_2Back

        In_Main_2Back_Parameters:
          source: $Main_2Back_Parameters

    Main_2Back_Parameters:
      type: DataObjectReference
      name: Parameters
      extensions:
        studyflow:Parameters:
          values:
            Blocks:
              Demo5_Main:
                Name: Demo5_Main
                Inherits: Default
                Parameters:
                  NValue: 2
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                            - 1
                            - 2
                            - 3
                            - 1
                  StreamSize: 12
                  FeatureValuesCount: 3
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 1.5
            Timelines:
              Demo5_Main:
                Name: Demo5_Main
                blocks:
                  - name: Demo5_Main
            Bot:
              Speed: 20
              SkipInstructions: true
              AutoClickInstructions: true
              SkipFocusArea: true
              OverrideTemporalParameters: true
              StimulusDisplayDuration: 0.3
              InterStimulusInterval: 0.3
              TrialForeperiod: 0.1
              overrideUserInputParameters: true
              playerPaced: true
              useNonMatchButton: true
              maxResponseTime: 15

    Instructions_Main_2Back:
      type: DataObjectReference
      name: Instructions
      extensions:
        agentic:Prompt:
          template: |
            You are an attentive, expert participant in a 2-back task.
            Respond Match if the current letter is identical to the letter shown
            exactly two trials ago, otherwise NonMatch. Aim for near-perfect
            accuracy. Reply with exactly Match or NonMatch; no explanation.

    End:
      type: EndEvent
      name: Done

    Flow_Start_Warmup:
      source: $Start
      target: $Warmup_1Back

    Flow_Warmup_Main:
      source: $Warmup_1Back
      target: $Main_2Back

    Flow_Main_End:
      source: $Main_2Back
      target: $End

