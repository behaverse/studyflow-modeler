id: demo5_ollama_bot
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
  xmlns:bpmn2: http://www.omg.org/spec/BPMN/20100524/MODEL
Demo5_OllamaBot_Actors:
  type: Collaboration
  name: LLM bot (Ollama)
  participants:
    Actor_Ollama__gemma4_e2b_mlx:
      extensionElements:
        - type: studyflow:Actor
          actorType: llm
          implementation: ollama://gemma4:e2b-mlx
      name: Ollama (gemma4:e2b-mlx)
Demo5_OllamaBot:
  type: Process
  documentation: A tired 1-back warm-up and an expert 2-back block played by a local Ollama LLM bot.
  extensionElements:
    - type: studyflow:Study
    - type: prov:Activity
      action: created
      when: "2026-07-30T22:51:27Z"
      with: studyflow-modeler/26.0615
  name: LLM bot (Ollama)
  flowElements:
    Start:
      type: StartEvent
      name: Start
      bounds: 160 180 36 36
      label: 166 223 24 15
    Warmup_1Back:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          instrument: NB
          timeline: Demo5_Warmup
      name: 1-Back warm-up (tired)
      participantRef:
        - Actor_Ollama__gemma4_e2b_mlx
      dataInputAssociations:
        In_Warmup_1Back:
          sourceRef:
            - Instructions_Warmup_1Back
          waypoint: 290,308 290,258
        In_Warmup_1Back_Parameters:
          sourceRef:
            - Warmup_1Back_Parameters
          waypoint: 358,308 358,258
      bounds: 260 138 120 120
    Warmup_1Back_Parameters:
      type: DataObjectReference
      extensionElements:
        - type: studyflow:Parameters
          values:
            Blocks:
              Demo5_Warmup:
                Name: Demo5_Warmup
                Inherits: Default
                Parameters:
                  NValue: 1
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                  StreamSize: 8
                  FeatureValuesCount: 3
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 1.5
            Timelines:
              Demo5_Warmup:
                Name: Demo5_Warmup
                blocks:
                  - name: Demo5_Warmup
            Bot:
              Speed: 20
              SkipInstructions: true
              AutoClickInstructions: true
              SkipFocusArea: true
              OverrideTemporalParameters: true
              StimulusDisplayDuration: 0.3
              InterStimulusInterval: 0.3
              TrialForeperiod: 0.1
              overrideUserInputParameters: true
              playerPaced: true
              useNonMatchButton: true
              maxResponseTime: 15
      name: Parameters
      bounds: 340 308 36 50
    Instructions_Warmup_1Back:
      type: DataObjectReference
      extensionElements:
        - type: agentic:Prompt
          template: |
            You are a tired participant near the end of a long 1-back session.
            Aim for about 80% accuracy. Occasionally miss matches when your
            attention drifts. Never explain; reply with exactly Match or NonMatch.
      name: Instructions
      bounds: 272 308 36 50
      label: 250 363 80 15
    Main_2Back:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          instrument: NB
          timeline: Demo5_Main
      name: 2-Back main (expert)
      participantRef:
        - Actor_Ollama__gemma4_e2b_mlx
      dataInputAssociations:
        In_Main_2Back:
          sourceRef:
            - Instructions_Main_2Back
          waypoint: 480,308 480,258
        In_Main_2Back_Parameters:
          sourceRef:
            - Main_2Back_Parameters
          waypoint: 548,308 548,258
      bounds: 450 138 120 120
    Main_2Back_Parameters:
      type: DataObjectReference
      extensionElements:
        - type: studyflow:Parameters
          values:
            Blocks:
              Demo5_Main:
                Name: Demo5_Main
                Inherits: Default
                Parameters:
                  NValue: 2
                  Feature: Letters
                  Streams:
                    - Feature:
                        Reference: Feature
                      StimulusValue:
                        Generate: OncePerBlock
                        Sequence:
                          Type: Ordered
                          Values:
                            - 3
                            - 1
                            - 2
                            - 1
                            - 3
                            - 2
                            - 3
                            - 2
                            - 1
                            - 2
                            - 3
                            - 1
                  StreamSize: 12
                  FeatureValuesCount: 3
                  StimulusDisplayDuration: 0.5
                  InterStimulusInterval: 1.5
            Timelines:
              Demo5_Main:
                Name: Demo5_Main
                blocks:
                  - name: Demo5_Main
            Bot:
              Speed: 20
              SkipInstructions: true
              AutoClickInstructions: true
              SkipFocusArea: true
              OverrideTemporalParameters: true
              StimulusDisplayDuration: 0.3
              InterStimulusInterval: 0.3
              TrialForeperiod: 0.1
              overrideUserInputParameters: true
              playerPaced: true
              useNonMatchButton: true
              maxResponseTime: 15
      name: Parameters
      bounds: 530 308 36 50
    Instructions_Main_2Back:
      type: DataObjectReference
      extensionElements:
        - type: agentic:Prompt
          template: |
            You are an attentive, expert participant in a 2-back task.
            Respond Match if the current letter is identical to the letter shown
            exactly two trials ago, otherwise NonMatch. Aim for near-perfect
            accuracy. Reply with exactly Match or NonMatch; no explanation.
      name: Instructions
      bounds: 462 308 36 50
      label: 440 363 80 15
    End:
      type: EndEvent
      name: Done
      bounds: 640 180 36 36
      label: 647 223 22 15
    Flow_Start_Warmup:
      sourceRef: Start
      targetRef: Warmup_1Back
      waypoint: 196,198 260,198
    Flow_Warmup_Main:
      sourceRef: Warmup_1Back
      targetRef: Main_2Back
      waypoint: 380,198 450,198
    Flow_Main_End:
      sourceRef: Main_2Back
      targetRef: End
      waypoint: 570,198 640,198
