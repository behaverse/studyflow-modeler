id: reachy_session
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Reachy_Session:
  type: Process
  documentation: >-
    A Reachy Mini collects data from a human participant. The participant's verbal feedback stores as the interaction
    recording.
  extensionElements:
    - type: studyflow:Study
    - type: prov:Activity
      action: created
      when: "2026-08-21T15:27:59+02:00"
      with: studyflow-modeler/26.0615
    - type: prov:Activity
      action: modified
      when: "2026-08-21T15:29:15+02:00"
      with: studyflow-modeler/26.0615
  name: Reachy Researcher
  flowElements:
    Enrolled:
      type: StartEvent
      name: Enrolled and consented
      consentFormUri: https://example.org/protocols/reachy-session/consent.md
      bounds: 57 52 36 36
    Wake:
      type: IntermediateCatchEvent
      extensionElements:
        - type: reachy:SenseEvent
          wakeWord: Hey Reachy
      name: Wake word
      bounds: 207 52 36 36
    Seated:
      type: ExclusiveGateway
      extensionElements:
        - type: reachy:PerceptionGateway
      name: Anyone there?
      default: Flow_Seated_Greet
      bounds: 350 45 50 50
      isMarkerVisible: true
    Ask_To_Sit:
      type: ServiceTask
      extensionElements:
        - type: reachy:Interact
          text: Please take a seat in front of me and say my wake word again.
      name: Ask them to sit down
      bounds: 475 30 100 80
    Greet:
      type: ServiceTask
      extensionElements:
        - type: reachy:Interact
          text: >-
            Hello! I'm Reachy. You'll now see a short memory task on the screen; press the key whenever the current
            letter matches the one before it.
      name: Greet & instruct
      bounds: 475 170 100 80
    Watch:
      type: ServiceTask
      extensionElements:
        - type: reachy:LookAt
      name: Face the participant
      bounds: 625 170 100 80
    NBack:
      type: Task
      extensionElements:
        - type: behaverse:Task
          configurations:
            Timelines:
              XCIT_NB_01: null
          scene: NB
      name: N-Back
      bounds: 775 170 100 80
    Celebrate:
      type: ServiceTask
      extensionElements:
        - type: reachy:Interact
          move: cheerful1
      name: Celebrate completion
      bounds: 925 170 100 80
    Feedback:
      type: ReceiveTask
      extensionElements:
        - type: reachy:Listen
          timeout: 20
      name: Verbal feedback
      dataOutputAssociations:
        Feedback_To_Recording:
          targetRef: Recording
          waypoint: 1125,250 1125,300
      bounds: 1075 170 100 80
    Recording:
      type: DataStoreReference
      extensionElements:
        - type: reachy:InteractionRecording
          streams:
            - audio
            - transcript
      name: Interaction recording
      bounds: 1100 300 50 50
    Done:
      type: EndEvent
      name: Done
      bounds: 1257 192 36 36
    Flow_Enrolled_Wake:
      sourceRef: Enrolled
      targetRef: Wake
      waypoint: 93,70 207,70
    Flow_Wake_Seated:
      sourceRef: Wake
      targetRef: Seated
      waypoint: 243,70 350,70
    Flow_Seated_Ask:
      name: no one seated
      conditionExpression: face_count == 0
      sourceRef: Seated
      targetRef: Ask_To_Sit
      waypoint: 400,70 475,70
    Flow_Ask_Wake:
      sourceRef: Ask_To_Sit
      targetRef: Wake
      waypoint: 525,110 525,140 225,140 225,88
    Flow_Seated_Greet:
      sourceRef: Seated
      targetRef: Greet
      waypoint: 375,95 375,210 475,210
    Flow_Greet_Watch:
      sourceRef: Greet
      targetRef: Watch
      waypoint: 575,210 625,210
    Flow_Watch_NBack:
      sourceRef: Watch
      targetRef: NBack
      waypoint: 725,210 775,210
    Flow_NBack_Celebrate:
      sourceRef: NBack
      targetRef: Celebrate
      waypoint: 875,210 925,210
    Flow_Celebrate_Feedback:
      sourceRef: Celebrate
      targetRef: Feedback
      waypoint: 1025,210 1075,210
    Flow_Feedback_Done:
      sourceRef: Feedback
      targetRef: Done
      waypoint: 1175,210 1257,210
state:
  _meta:
    prov:
      - action: created
        when: "2026-09-14T10:21:03+02:00"
        with: studyflow-modeler/26.9.18
