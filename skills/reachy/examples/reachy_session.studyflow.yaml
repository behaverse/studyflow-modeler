id: reachy_session
schemas:
  behaverse: http://behaverse.org/schemas/studyflow/behaverse
  prov: https://w3id.org/studyflow/prov
  reachy: https://w3id.org/studyflow/reachy
  studyflow: http://behaverse.org/schemas/studyflow/v1

Reachy_Session:
  type: Process
  name: Reachy Researcher
  extensions:
    studyflow:Study: {}
    prov:Activity:
      - {action: created, when: "2026-08-21T15:27:59+02:00", with: studyflow-modeler/26.0615}
      - {action: modified, when: "2026-08-21T15:29:15+02:00", with: studyflow-modeler/26.0615}
  documentation: >-
    A Reachy Mini collects data from a human participant. The participant's verbal feedback stores as the interaction
    recording.
  elements:
    Enrolled:
      type: StartEvent
      name: Enrolled and consented
      consentFormUri: https://example.org/protocols/reachy-session/consent.md

    Wake:
      type: IntermediateCatchEvent
      name: Wake word
      extensions:
        reachy:SenseEvent:
          wakeWord: Hey Reachy

    Seated:
      type: ExclusiveGateway
      name: Anyone there?
      default: $Flow_Seated_Greet
      extensions:
        reachy:PerceptionGateway: {}

    Ask_To_Sit:
      type: ServiceTask
      name: Ask them to sit down
      extensions:
        reachy:Interact:
          text: Please take a seat in front of me and say my wake word again.

    Greet:
      type: ServiceTask
      name: Greet & instruct
      extensions:
        reachy:Interact:
          text: >-
            Hello! I'm Reachy. You'll now see a short memory task on the screen; press the key whenever the current
            letter matches the one before it.

    Watch:
      type: ServiceTask
      name: Face the participant
      extensions:
        reachy:LookAt: {}

    NBack:
      type: Task
      name: N-Back
      extensions:
        behaverse:Task:
          instrument: NB
      inputs:
        In_NBack_Parameters:
          source: $NBack_Parameters

    NBack_Parameters:
      type: DataObjectReference
      name: Parameters
      extensions:
        studyflow:Parameters:
          values:
            timeline: XCIT_NB_01

    Celebrate:
      type: ServiceTask
      name: Celebrate completion
      extensions:
        reachy:Interact:
          move: cheerful1

    Feedback:
      type: ReceiveTask
      name: Verbal feedback
      extensions:
        reachy:Listen:
          timeout: 20
      outputs:
        Feedback_To_Recording:
          target: $Recording

    Recording:
      type: DataStoreReference
      name: Interaction recording
      extensions:
        reachy:InteractionRecording:
          streams:
            - audio
            - transcript

    Done:
      type: EndEvent
      name: Done

    Flow_Enrolled_Wake:
      source: $Enrolled
      target: $Wake

    Flow_Wake_Seated:
      source: $Wake
      target: $Seated

    Flow_Seated_Ask:
      name: no one seated
      condition: face_count = 0
      source: $Seated
      target: $Ask_To_Sit

    Flow_Ask_Wake:
      source: $Ask_To_Sit
      target: $Wake

    Flow_Seated_Greet:
      source: $Seated
      target: $Greet

    Flow_Greet_Watch:
      source: $Greet
      target: $Watch

    Flow_Watch_NBack:
      source: $Watch
      target: $NBack

    Flow_NBack_Celebrate:
      source: $NBack
      target: $Celebrate

    Flow_Celebrate_Feedback:
      source: $Celebrate
      target: $Feedback

    Flow_Feedback_Done:
      source: $Feedback
      target: $Done

layout:
  Enrolled: 57 52 36 36
  Wake: 207 52 36 36
  Seated: {bounds: 350 45 50 50, markerVisible: true}
  Ask_To_Sit: 475 30 100 80
  Greet: 475 170 100 80
  Watch: 625 170 100 80
  NBack: 775 170 100 80
  In_NBack_Parameters: 825,300 825,250
  NBack_Parameters: 807 300 36 50
  Celebrate: 925 170 100 80
  Feedback: 1075 170 100 80
  Feedback_To_Recording: 1125,250 1125,300
  Recording: 1100 300 50 50
  Done: 1257 192 36 36
  Flow_Enrolled_Wake: 93,70 207,70
  Flow_Wake_Seated: 243,70 350,70
  Flow_Seated_Ask: 400,70 475,70
  Flow_Ask_Wake: 525,110 525,140 225,140 225,88
  Flow_Seated_Greet: 375,95 375,210 475,210
  Flow_Greet_Watch: 575,210 625,210
  Flow_Watch_NBack: 725,210 775,210
  Flow_NBack_Celebrate: 875,210 925,210
  Flow_Celebrate_Feedback: 1025,210 1075,210
  Flow_Feedback_Done: 1175,210 1257,210

state:
  _meta:
    prov:
      - action: created
        when: "2026-09-14T10:21:03+02:00"
        with: studyflow-modeler/26.9.18
