id: reachy_session
schemas:
  behaverse: http://behaverse.org/schemas/studyflow/behaverse
  prov: https://w3id.org/studyflow/prov
  reachy: https://w3id.org/studyflow/reachy
  studyflow: http://behaverse.org/schemas/studyflow/v1

Reachy_Session:
  type: Process
  name: Reachy Researcher
  extensions:
    studyflow:Study: {}
    prov:Activity:
      - {action: created, when: "2026-08-21T15:27:59+02:00", with: studyflow-modeler/26.0615}
      - {action: modified, when: "2026-08-21T15:29:15+02:00", with: studyflow-modeler/26.0615}
  documentation: >-
    A Reachy Mini collects data from a human participant. The participant's verbal feedback stores as the interaction
    recording. A robot action that fails, a line it cannot say or a move it cannot play, ends the session with the robot
    at the error boundary event.
  elements:
    Enrolled:
      type: StartEvent
      name: Enrolled and consented
      consentFormUri: https://example.org/protocols/reachy-session/consent.md

    With_Robot:
      type: SubProcess
      name: Session with the robot
      elements:
        Robot_Start:
          type: StartEvent

        Wake:
          type: IntermediateCatchEvent
          name: Wake word
          extensions:
            reachy:SenseEvent:
              wakeWord: Hey Reachy

        Seated:
          type: ExclusiveGateway
          name: Anyone there?
          default: $Flow_Seated_Greet
          extensions:
            reachy:PerceptionGateway: {}

        Ask_To_Sit:
          type: ServiceTask
          name: Ask them to sit down
          extensions:
            reachy:Interact:
              text: Please take a seat in front of me and say my wake word again.

        Greet:
          type: ServiceTask
          name: Greet & instruct
          extensions:
            reachy:Interact:
              text: >-
                Hello! I'm Reachy. You'll now see a short memory task on the screen; press the key whenever the current
                letter matches the one before it.

        Watch:
          type: ServiceTask
          name: Face the participant
          extensions:
            reachy:LookAt: {}

        NBack:
          type: Task
          name: N-Back
          extensions:
            behaverse:Task:
              instrument: NB
          inputs:
            In_NBack_Parameters:
              source: $NBack_Parameters

        NBack_Parameters:
          type: DataObjectReference
          name: Parameters
          extensions:
            studyflow:Parameters:
              values:
                timeline: XCIT_NB_01

        Celebrate:
          type: ServiceTask
          name: Celebrate completion
          extensions:
            reachy:Interact:
              move: cheerful1

        Feedback:
          type: ReceiveTask
          name: Verbal feedback
          extensions:
            reachy:Listen:
              timeout: 20
          outputs:
            Feedback_To_Recording:
              target: $Recording

        Recording:
          type: DataStoreReference
          name: Interaction recording
          extensions:
            reachy:InteractionRecording:
              streams:
                - audio
                - transcript

        Flow_Wake_Seated:
          source: $Wake
          target: $Seated

        Flow_Ask_Wake:
          source: $Ask_To_Sit
          target: $Wake

        Flow_Seated_Ask:
          name: no one seated
          condition: face_count = 0
          source: $Seated
          target: $Ask_To_Sit

        Flow_Seated_Greet:
          source: $Seated
          target: $Greet

        Flow_Greet_Watch:
          source: $Greet
          target: $Watch

        Flow_Watch_NBack:
          source: $Watch
          target: $NBack

        Flow_NBack_Celebrate:
          source: $NBack
          target: $Celebrate

        Flow_Celebrate_Feedback:
          source: $Celebrate
          target: $Feedback

        Robot_End:
          type: EndEvent

        Flow_Start_Wake:
          source: $Robot_Start
          target: $Wake

        Flow_Feedback_End:
          source: $Feedback
          target: $Robot_End

    Robot_Failed:
      type: BoundaryEvent
      name: The robot failed
      error: true
      attachedTo: $With_Robot

    Done:
      type: EndEvent
      name: Done

    Stopped:
      type: EndEvent
      name: Stopped

    Flow_Enrolled_Session:
      source: $Enrolled
      target: $With_Robot

    Flow_Session_Done:
      source: $With_Robot
      target: $Done

    Flow_Failed_Stopped:
      source: $Robot_Failed
      target: $Stopped

