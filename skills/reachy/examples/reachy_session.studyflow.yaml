id: reachy_session
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Reachy_Session:
  type: studyflow:Study
  name: Reachy Researcher
  documentation: >-
    A Reachy Mini collects data from a human participant. The participant's verbal feedback stores as the interaction
    recording.
  extensionElements:
    - type: prov:Activity
      action: created
      when: "2026-08-21T15:27:59+02:00"
      with: studyflow-modeler/26.0615
    - type: prov:Activity
      action: modified
      when: "2026-08-21T15:29:15+02:00"
      with: studyflow-modeler/26.0615
  flowElements:
    Enrolled:
      type: StartEvent
      name: Enrolled and consented
      consentFormUri: https://example.org/protocols/reachy-session/consent.md
    Wake:
      type: reachy:SenseEvent
      name: Wake word
      wakeWord: Hey Reachy
    Seated:
      type: reachy:PerceptionGateway
      name: Anyone there?
      default: Flow_Seated_Greet
    Ask_To_Sit:
      type: reachy:Interact
      name: Ask them to sit down
      text: Please take a seat in front of me and say my wake word again.
    Greet:
      type: reachy:Interact
      name: Greet & instruct
      text: >-
        Hello! I'm Reachy. You'll now see a short memory task on the screen; press the key whenever the current letter
        matches the one before it.
    Watch:
      type: reachy:LookAt
      name: Face the participant
    NBack:
      type: Task
      name: N-Back
      extensionElements:
        - type: behaverse:Task
          instrument: NB
      dataInputAssociations:
        In_NBack_Parameters:
          sourceRef:
            - NBack_Parameters
    NBack_Parameters:
      type: studyflow:Parameters
      name: Parameters
      values:
        timeline: XCIT_NB_01
    Celebrate:
      type: reachy:Interact
      name: Celebrate completion
      move: cheerful1
    Feedback:
      type: reachy:Listen
      name: Verbal feedback
      timeout: 20
      dataOutputAssociations:
        Feedback_To_Recording:
          targetRef: Recording
    Recording:
      type: reachy:InteractionRecording
      name: Interaction recording
      streams:
        - audio
        - transcript
    Done:
      type: EndEvent
      name: Done
    Flow_Enrolled_Wake: Enrolled -> Wake
    Flow_Wake_Seated: Wake -> Seated
    Flow_Seated_Ask:
      name: no one seated
      conditionExpression: face_count = 0
      sourceRef: Seated
      targetRef: Ask_To_Sit
    Flow_Ask_Wake: Ask_To_Sit -> Wake
    Flow_Seated_Greet: Seated -> Greet
    Flow_Greet_Watch: Greet -> Watch
    Flow_Watch_NBack: Watch -> NBack
    Flow_NBack_Celebrate: NBack -> Celebrate
    Flow_Celebrate_Feedback: Celebrate -> Feedback
    Flow_Feedback_Done: Feedback -> Done
