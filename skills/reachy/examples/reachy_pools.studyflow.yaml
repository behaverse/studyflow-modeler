id: reachy_pools
schemas:
  agentic: https://w3id.org/studyflow/agentic
  behaverse: http://behaverse.org/schemas/studyflow/behaverse
  cognitive: http://behaverse.org/schemas/studyflow/cognitive
  reachy: https://w3id.org/studyflow/reachy
  studyflow: http://behaverse.org/schemas/studyflow/v1

Collab_Pools:
  type: Collaboration
  name: Reachy plays WhichOne, a model deciding
  extensions:
    studyflow:Study: {}
  documentation: >-
    Three actors: Behaverse presents the WhichOne task and records the trials, the Reachy Mini looks, speaks, and moves,
    and a vision-language model decides. Run `studyflow run --runtime local` on this diagram: the robot finds the
    screen, asking the model about each view, greets, and tells the task it is ready. Then each trial the task sends,
    the robot takes a picture of the screen, asks the model with the instructions, passes the model's answer to the
    task, and shows it with its antennas. Then it waits for whichever comes first, the next trial or the task saying it
    is over. Every exchange is a message flow, and no step or pool names a model but the model's own pool. The robot's
    lines name their renderer, this machine's `say`, as `shell://say` with the sentence as its argument; the sound plays
    on the unit. What fails leaves by an error boundary event. A trial the robot cannot see or the model cannot answer
    is passed on: the task counts it as unanswered, and the robot waits for the next. A line or a move that fails on
    arriving does not keep the task waiting, since the robot still says it is ready. One that fails after an answer
    leaves the answer as sent, and one that fails while wrapping up ends the robot's part.
  participants:
    Pool_Behaverse:
      name: Behaverse (WhichOne on the screen)
      process: $WhichOne_Task
      extensions:
        studyflow:Actor:
          actorType: software

    Pool_Reachy:
      name: Reachy Mini
      process: $Reachy_Participant
      extensions:
        reachy:Robot:
          volume: 10

    Pool_Model:
      name: Model, gemma4 on Ollama
      extensions:
        studyflow:Actor:
          actorType: llm
          implementation: ollama://gemma4:12b-it-qat
  messageFlows:
    Msg_Ready:
      name: ready
      source: $Ready_Sent
      target: $Participant_Ready

    Msg_Trial:
      name: one trial
      source: $Play
      target: $Receive
      message: $Trial

    Msg_Answer:
      name: the response
      source: $Answer
      target: $Play
      message: $Response

    Msg_Over:
      name: task over
      source: $Task_Done
      target: $Over

    Msg_Look_Frame:
      name: a view
      source: $Look
      target: $Pool_Model
      message: $Request

    Msg_Look_Where:
      name: where the screen is
      source: $Pool_Model
      target: $Look
      message: $Reply

    Msg_Ask:
      name: frame and instructions
      source: $Ask
      target: $Pool_Model
      message: $Request

    Msg_Reply:
      name: seen, rule, answer
      source: $Pool_Model
      target: $Ask
      message: $Reply

    Msg_Pass:
      name: no response
      source: $Pass
      target: $Play

Trial:
  type: Message
  item: $Trial_Item

Response:
  type: Message
  item: $Response_Item

Trial_Item:
  type: ItemDefinition
  structure: cognitive:Trial

Response_Item:
  type: ItemDefinition
  structure: cognitive:Response

Request:
  type: Message
  item: $Request_Item

Reply:
  type: Message
  item: $Reply_Item

Request_Item:
  type: ItemDefinition
  structure: agentic:Request

Reply_Item:
  type: ItemDefinition
  structure: agentic:Reply

Reachy_Participant:
  type: Process
  name: Reachy plays WhichOne, a model deciding
  elements:
    Seated:
      type: StartEvent
      name: Seated at the screen

    Ready_Sent:
      type: IntermediateThrowEvent
      name: Ready
      message: true

    Next_Trial:
      type: EventBasedGateway
      name: Next trial, or task over?
      documentation: >-
        Waits for whichever message comes first: the task's next trial goes on to Receive the trial, its "task over" to
        the finale. A trial answered, the robot is back here.

    Receive:
      type: ReceiveTask
      name: Receive the trial

    Take:
      type: ServiceTask
      name: Take a camera frame
      extensions:
        reachy:Snapshot: {}
      outputs:
        Out_Frame:
          target: $Frame

    Frame:
      type: DataObjectReference
      name: Frame
      uri: reachy/frames/

    Ask:
      type: ServiceTask
      name: Ask the model
      inputs:
        In_Frame:
          source: $Frame

        In_Instructions:
          source: $Instructions
      outputs:
        Out_Choice:
          target: $Choice
          transformation: substring after(result, "Answer:")

    Instructions:
      type: DataObjectReference
      name: Instructions
      extensions:
        agentic:Prompt:
          template: |
            You are a Reachy Mini robot seated in front of the WhichOne task
            screen, playing a Simon task. The attached image is your view of
            the screen. On each trial one coloured disk appears on the left or
            the right inside the dark panel at the top of the game; the two
            large circles below it are the response buttons (yellow on the
            left, blue on the right), not the stimulus. Answer by the disk's
            colour, not its position: Left when the disk is yellow, Right
            when it is blue.

            Reply with exactly three lines:
            Seen: <the stimulus you see on the screen>
            Rule: <what the instructions say that stimulus calls for>
            Answer: <Left or Right>

    Choice:
      type: DataObjectReference
      name: Choice

    Answer:
      type: SendTask
      name: Answer the task
      inputs:
        In_Choice:
          source: $Choice

    Show:
      type: ServiceTask
      name: Show it with the antennas
      extensions:
        reachy:Interact:
          side: "{Choice}"

    Over:
      type: IntermediateCatchEvent
      name: Task over
      message: true

    Flow_Next_Receive:
      source: $Next_Trial
      target: $Receive

    Flow_Receive_Take:
      source: $Receive
      target: $Take

    Flow_Take_Ask:
      source: $Take
      target: $Ask

    Flow_Ask_Answer:
      source: $Ask
      target: $Answer

    Flow_Answer_Show:
      source: $Answer
      target: $Show

    Flow_Show_Next:
      source: $Show
      target: $Next_Trial

    Flow_Next_Over:
      source: $Next_Trial
      target: $Over

    Done:
      type: EndEvent
      name: Done

    Flow_Sent_Trials:
      source: $Ready_Sent
      target: $Next_Trial

    No_Picture:
      type: BoundaryEvent
      name: No picture
      error: true
      attachedTo: $Take

    No_Reply:
      type: BoundaryEvent
      name: No reply
      error: true
      attachedTo: $Ask

    Pass:
      type: SendTask
      name: Pass on the trial

    Flow_NoPicture_Pass:
      source: $No_Picture
      target: $Pass

    Flow_NoReply_Pass:
      source: $No_Reply
      target: $Pass

    Flow_Pass_Next:
      source: $Pass
      target: $Next_Trial

    Arrive:
      type: SubProcess
      name: Arrive
      elements:
        Look:
          type: ServiceTask
          name: Find the screen
          extensions:
            reachy:LookAt:
              target: screen

        Greet:
          type: ServiceTask
          name: Greet
          additionalArguments:
            args:
              - Hello! I am Reachy. I will be your participant today.
          implementation: shell://say
          extensions:
            reachy:Interact: {}

        Wave:
          type: ServiceTask
          name: Welcome
          extensions:
            reachy:Interact:
              move: welcoming1

        Announce:
          type: ServiceTask
          name: Announce readiness
          additionalArguments:
            args:
              - Ready when you are — I'll play this one.
          implementation: shell://say
          extensions:
            reachy:Interact: {}

        Flow_Look_Greet:
          source: $Look
          target: $Greet

        Flow_Greet_Wave:
          source: $Greet
          target: $Wave

        Flow_Wave_Announce:
          source: $Wave
          target: $Announce

        Arrive_Start:
          type: StartEvent

        Arrive_End:
          type: EndEvent

        Flow_Arrive_Look:
          source: $Arrive_Start
          target: $Look

        Flow_Announce_Arrived:
          source: $Announce
          target: $Arrive_End

    Flow_Seated_Arrive:
      source: $Seated
      target: $Arrive

    Flow_Arrive_Sent:
      source: $Arrive
      target: $Ready_Sent

    Arrival_Failed:
      type: BoundaryEvent
      name: Arrival failed
      error: true
      attachedTo: $Arrive

    Flow_ArrivalFailed_Sent:
      source: $Arrival_Failed
      target: $Ready_Sent

    No_Move:
      type: BoundaryEvent
      name: No move
      error: true
      attachedTo: $Show

    Flow_NoMove_Next:
      source: $No_Move
      target: $Next_Trial

    Wrap_Up:
      type: SubProcess
      name: Wrap up
      elements:
        Proud:
          type: ServiceTask
          name: Proud of it
          extensions:
            reachy:Interact:
              move: proud1

        Thanks:
          type: ServiceTask
          name: Ask for feedback
          additionalArguments:
            args:
              - That was fun. How did I do?
          implementation: shell://say
          extensions:
            reachy:Interact: {}

        Celebrate:
          type: ServiceTask
          name: Celebrate
          extensions:
            reachy:Interact:
              move: cheerful1

        LookBack:
          type: ServiceTask
          name: Back to the screen
          extensions:
            reachy:LookAt:
              target: screen

        Flow_Proud_Thanks:
          source: $Proud
          target: $Thanks

        Flow_Thanks_Celebrate:
          source: $Thanks
          target: $Celebrate

        Flow_Celebrate_LookBack:
          source: $Celebrate
          target: $LookBack

        Wrap_Up_Start:
          type: StartEvent

        Wrap_Up_End:
          type: EndEvent

        Flow_WrapUp_Proud:
          source: $Wrap_Up_Start
          target: $Proud

        Flow_LookBack_Wrapped:
          source: $LookBack
          target: $Wrap_Up_End

    Flow_Over_WrapUp:
      source: $Over
      target: $Wrap_Up

    Flow_WrapUp_Done:
      source: $Wrap_Up
      target: $Done

    Wrap_Up_Failed:
      type: BoundaryEvent
      name: Wrap-up failed
      error: true
      attachedTo: $Wrap_Up

    Flow_WrapUpFailed_Done:
      source: $Wrap_Up_Failed
      target: $Done

WhichOne_Task:
  type: Process
  name: WhichOne on the screen
  elements:
    Task_Start:
      type: StartEvent
      name: Task loaded

    Participant_Ready:
      type: IntermediateCatchEvent
      name: Participant ready
      message: true

    Play:
      type: ChoreographyTask
      name: WhichOne, 5 Simon trials
      extensions:
        behaverse:Task:
          instrument: WO
          timeline: SimonTask
      inputs:
        In_Play_Parameters:
          source: $Play_Parameters
      outputs:
        Out_Trials:
          target: $Trials

    Play_Parameters:
      type: DataObjectReference
      name: Parameters
      extensions:
        studyflow:Parameters:
          values:
            Timelines:
              SimonTask:
                Blocks:
                  - Name: Simon
                    ExitRules:
                      - Trials: 5
            Blocks:
              Simon:
                Parameters:
                  StimulusDisplayDuration: 5
                  MaxResponseTime: 8

    Trials:
      type: DataStoreReference
      name: Trial records
      uri: Play.events.jsonl
      extensions:
        behaverse:BDMDataset:
          dataLevel: trials

    Task_Done:
      type: EndEvent
      name: Task over
      message: true

    Flow_Start_Ready:
      source: $Task_Start
      target: $Participant_Ready

    Flow_Ready_Play:
      source: $Participant_Ready
      target: $Play

    Flow_Play_Done:
      source: $Play
      target: $Task_Done

