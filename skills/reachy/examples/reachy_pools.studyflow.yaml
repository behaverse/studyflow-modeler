id: reachy_pools
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Collab_Pools:
  type: Collaboration
  documentation: >-
    Three actors. Behaverse presents the WhichOne task and records the trials, the Reachy Mini looks, speaks, and moves,
    and a vision-language model decides. Run `studyflow run --runtime local` on this diagram: the robot finds the
    screen, asking the model about each view, greets, and tells the task it is ready. Then each trial the task sends,
    the robot takes a picture of the screen, asks the model with the instructions, passes the model's answer to the
    task, and shows it with its antennas. Then it waits for whichever comes first, the next trial or the task saying it
    is over. Every exchange is a message flow, and no step or pool names a model but the model's own pool. The robot's
    lines name their renderer, this machine's `say`, as `shell://say` with the sentence as its argument; the sound plays
    on the unit.
  extensionElements:
    - type: studyflow:Study
  name: Reachy plays WhichOne, a model deciding
  participants:
    Pool_Behaverse:
      extensionElements:
        - type: studyflow:Actor
          actorType: software
      name: Behaverse (WhichOne on the screen)
      processRef: WhichOne_Task
    Pool_Reachy:
      extensionElements:
        - type: reachy:Robot
          volume: 10
      name: Reachy Mini
      processRef: Reachy_Participant
    Pool_Model:
      extensionElements:
        - type: studyflow:Actor
          actorType: llm
          implementation: ollama://gemma4:12b-it-qat
      name: Model, gemma4 on Ollama
  messageFlows:
    Msg_Ready:
      name: ready
      sourceRef: Ready_Sent
      targetRef: Participant_Ready
    Msg_Trial:
      name: one trial
      sourceRef: Play
      targetRef: Receive
      messageRef: Trial
    Msg_Answer:
      name: the response
      sourceRef: Answer
      targetRef: Play
      messageRef: Response
    Msg_Over:
      name: task over
      sourceRef: Task_Done
      targetRef: Over
    Msg_Look_Frame:
      name: a view
      sourceRef: Look
      targetRef: Pool_Model
      messageRef: Request
    Msg_Look_Where:
      name: where the screen is
      sourceRef: Pool_Model
      targetRef: Look
      messageRef: Reply
    Msg_Ask:
      name: frame and instructions
      sourceRef: Ask
      targetRef: Pool_Model
      messageRef: Request
    Msg_Reply:
      name: seen, rule, answer
      sourceRef: Pool_Model
      targetRef: Ask
      messageRef: Reply
Trial:
  type: Message
  itemRef: Trial_Item
Response:
  type: Message
  itemRef: Response_Item
Trial_Item:
  type: ItemDefinition
  structureRef: behaverse:Trial
Response_Item:
  type: ItemDefinition
  structureRef: behaverse:Response
Request:
  type: Message
  itemRef: Request_Item
Reply:
  type: Message
  itemRef: Reply_Item
Request_Item:
  type: ItemDefinition
  structureRef: agentic:Request
Reply_Item:
  type: ItemDefinition
  structureRef: agentic:Reply
Reachy_Participant:
  type: Process
  name: Reachy plays WhichOne, a model deciding
  flowElements:
    Seated:
      type: StartEvent
      name: Seated at the screen
    Look:
      type: ServiceTask
      extensionElements:
        - type: reachy:LookAt
          target: screen
      name: Find the screen
    Greet:
      type: ServiceTask
      extensionElements:
        - type: reachy:Interact
      name: Greet
      additionalArguments:
        args:
          - Hello! I am Reachy. I will be your participant today.
      implementation: shell://say
    Wave:
      type: ServiceTask
      extensionElements:
        - type: reachy:Interact
          move: welcoming1
      name: Welcome
    Announce:
      type: ServiceTask
      extensionElements:
        - type: reachy:Interact
      name: Announce readiness
      additionalArguments:
        args:
          - Ready when you are — I'll play this one.
      implementation: shell://say
    Ready_Sent:
      type: IntermediateThrowEvent
      name: Ready
      eventDefinitions:
        Ready_Message:
          type: MessageEventDefinition
    Next_Trial:
      type: EventBasedGateway
      documentation: >-
        Waits for whichever message comes first: the task's next trial goes on to Receive the trial, its "task over" to
        the finale. A trial answered, the robot is back here.
      name: Next trial, or task over?
    Receive:
      type: ReceiveTask
      name: Receive the trial
    Take:
      type: ServiceTask
      extensionElements:
        - type: reachy:Snapshot
      name: Take a camera frame
      dataOutputAssociations:
        Out_Frame:
          targetRef: Frame
    Frame:
      type: DataObjectReference
      uri: reachy/frames/
      name: Frame
    Ask:
      type: ServiceTask
      name: Ask the model
      dataInputAssociations:
        In_Frame:
          sourceRef:
            - Frame
        In_Instructions:
          sourceRef:
            - Instructions
      dataOutputAssociations:
        Out_Choice:
          targetRef: Choice
          transformation: substring after(result, "Answer:")
    Instructions:
      type: DataObjectReference
      extensionElements:
        - type: agentic:Prompt
          template: |
            You are a Reachy Mini robot seated in front of the WhichOne task
            screen, playing a Simon task. The attached image is your view of
            the screen. On each trial one coloured disk appears on the left or
            the right inside the dark panel at the top of the game; the two
            large circles below it are the response buttons (yellow on the
            left, blue on the right), not the stimulus. Answer by the disk's
            colour, not its position: Left when the disk is yellow, Right
            when it is blue.

            Reply with exactly three lines:
            Seen: <the stimulus you see on the screen>
            Rule: <what the instructions say that stimulus calls for>
            Answer: <Left or Right>
      name: Instructions
    Choice:
      type: DataObjectReference
      name: Choice
    Answer:
      type: SendTask
      name: Answer the task
      dataInputAssociations:
        In_Choice:
          sourceRef:
            - Choice
    Show:
      type: ServiceTask
      extensionElements:
        - type: reachy:Interact
          side: "{Choice}"
      name: Show it with the antennas
    Over:
      type: IntermediateCatchEvent
      name: Task over
      eventDefinitions:
        Over_Message:
          type: MessageEventDefinition
    Flow_Next_Receive: Next_Trial -> Receive
    Flow_Receive_Take: Receive -> Take
    Flow_Take_Ask: Take -> Ask
    Flow_Ask_Answer: Ask -> Answer
    Flow_Answer_Show: Answer -> Show
    Flow_Show_Next: Show -> Next_Trial
    Flow_Next_Over: Next_Trial -> Over
    Proud:
      type: ServiceTask
      extensionElements:
        - type: reachy:Interact
          move: proud1
      name: Proud of it
    Thanks:
      type: ServiceTask
      extensionElements:
        - type: reachy:Interact
      name: Ask for feedback
      additionalArguments:
        args:
          - That was fun. How did I do?
      implementation: shell://say
    Celebrate:
      type: ServiceTask
      extensionElements:
        - type: reachy:Interact
          move: cheerful1
      name: Celebrate
    LookBack:
      type: ServiceTask
      extensionElements:
        - type: reachy:LookAt
          target: screen
      name: Back to the screen
    Done:
      type: EndEvent
      name: Done
    Flow_Seated_Look: Seated -> Look
    Flow_Look_Greet: Look -> Greet
    Flow_Greet_Wave: Greet -> Wave
    Flow_Wave_Announce: Wave -> Announce
    Flow_Announce_Sent: Announce -> Ready_Sent
    Flow_Sent_Trials: Ready_Sent -> Next_Trial
    Flow_Over_Proud: Over -> Proud
    Flow_Proud_Thanks: Proud -> Thanks
    Flow_Thanks_Celebrate: Thanks -> Celebrate
    Flow_Celebrate_LookBack: Celebrate -> LookBack
    Flow_LookBack_Done: LookBack -> Done
WhichOne_Task:
  type: Process
  name: WhichOne on the screen
  flowElements:
    Task_Start:
      type: StartEvent
      name: Task loaded
    Participant_Ready:
      type: IntermediateCatchEvent
      name: Participant ready
      eventDefinitions:
        Participant_Ready_Message:
          type: MessageEventDefinition
    Play:
      type: ChoreographyTask
      extensionElements:
        - type: behaverse:Task
          instrument: WO
          timeline: SimonTask
      name: WhichOne, 5 Simon trials
      dataInputAssociations:
        In_Play_Parameters:
          sourceRef:
            - Play_Parameters
      dataOutputAssociations:
        Out_Trials:
          targetRef: Trials
    Play_Parameters:
      type: DataObjectReference
      extensionElements:
        - type: studyflow:Parameters
          values:
            Timelines:
              SimonTask:
                Blocks:
                  - Name: Simon
                    ExitRules:
                      - Trials: 5
            Blocks:
              Simon:
                Parameters:
                  StimulusDisplayDuration: 5
                  MaxResponseTime: 8
      name: Parameters
    Trials:
      type: DataStoreReference
      extensionElements:
        - type: behaverse:BDMDataset
          dataLevel: trials
      uri: Play.events.jsonl
      name: Trial records
    Task_Done:
      type: EndEvent
      name: Task over
      eventDefinitions:
        Done_Message:
          type: MessageEventDefinition
    Flow_Start_Ready: Task_Start -> Participant_Ready
    Flow_Ready_Play: Participant_Ready -> Play
    Flow_Play_Done: Play -> Task_Done
