- description: Wake-word conversation - wait for the wake word, face the speaker, talk, sign off.
  elements:
    Wake_word_conversation:
      type: SubProcess
      name: Wake-word conversation
      studyflow:icon: iconify ph--chats
      documentation: |
        Idle until the wake word, turn toward the speaker, then converse until
        the stop phrase or the turn budget ends it.
      flowElements:
        ww_wake:
          type: IntermediateCatchEvent
          name: Wake word
          extensionElements:
            - type: reachy:SenseEvent
              trigger: wake_word
              wakeWord: Hey Reachy
          bounds: 140 162 36 36
        ww_look:
          type: ServiceTask
          name: Face the speaker
          extensionElements:
            - type: reachy:LookAt
              target: face
          bounds: 240 140 100 80
        ww_talk:
          type: ServiceTask
          name: Chat
          extensionElements:
            - type: reachy:Converse
              model: claude-haiku-4-5
              persona: |
                You are Reachy, a small, curious desktop robot. Keep replies to one
                or two spoken sentences and never pretend to be human.
              stopPhrase: goodbye
          bounds: 400 140 100 80
        ww_bye:
          type: ServiceTask
          name: Sign off
          extensionElements:
            - type: reachy:Gesture
              move: yes1
          bounds: 560 140 100 80
        Flow_ww_wake_ww_look: ww_wake -> ww_look
        Flow_ww_look_ww_talk: ww_look -> ww_talk
        Flow_ww_talk_ww_bye: ww_talk -> ww_bye
