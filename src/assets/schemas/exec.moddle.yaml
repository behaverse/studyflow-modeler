# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Exec
prefix: exec
description: >-
  The minimal executable layer - what an engine reads to run a diagram: a step's
  `implementation` and `additionalArguments`, the associated data elements that are its inputs and outputs, and CEL conditions over the values they bind. Studyflow coordinates the calls;
  it never encodes the computation itself.
uri: https://w3id.org/studyflow/exec
icon: iconify tabler--hexagon-letter-e
core: true   # backs the default elements; always loaded, cannot be disabled
order: 20  # registry position (load precedence + settings order)
xml:
  tagAlias: lowerCase
version: 26.0730


associations: []

enumerations: []

# Most of what follows redefines an attribute BPMN already has, which reads
# like restating the standard until you know what a redefine is *for* here: it
# is how a native attribute becomes visible. bpmn-moddle carries every BPMN
# attribute already, and the inspector shows none of them — a field renders
# only when a schema declares it (an extension-prefixed name, or a `redefines`
# marking a native one as declared; see `getAttributesByCategory`). So these
# traits are not copies of the metamodel. They are this layer's list of which
# BPMN attributes a studyflow author edits, and the place its own semantics are
# written down: that `implementation` holds a versioned `scheme://` reference,
# that the four expression attributes are CEL, that they are authored as flat
# strings and stored in BPMN's own expression elements. Delete one and the
# field disappears from the panel while the attribute stays in the file.
#
# Nothing else here is a duplicate either: `binding` and `uri` are
# additions BPMN has no equivalent for. `Binding` names both association
# subclasses on purpose — targeting their `bpmn:DataAssociation` ancestor
# instead drops the attribute from both, since the trait table resolves
# upward from a concrete type and has no entry for that ancestor.

types:

  # ===========================================================================
  # The software reference. BPMN's own `implementation` attribute ("the
  # technology implementing this task") is redefined once, here, with the
  # versioned reference grammar every executable step uses. The engine
  # resolves the reference, calls it with `additionalArguments` plus the associated inputs, and
  # binds the return value to the associated outputs; there is no other step
  # contract.
  # ===========================================================================
  - name: Implementation
    description: |
      Adds BPMN's own `implementation` to every service task, so the reference grammar is the same wherever a task runs something.
    extends:
      - bpmn:ServiceTask
    isAbstract: true
    properties:
      - name: bpmn:implementation
        description: |
          Software this task runs, as `<scheme>://<ref>[@<version-or-digest>]`.
          Schemes: `python://` (importable callable), `docker://` (image),
          `https://` or `file://` (script).
        isAttr: true
        type: String
        redefines: bpmn:ServiceTask#implementation
        meta:
          order: 1
          categories:
            - Execution

  # ===========================================================================
  # The call's configuration. `additionalArguments` is plan, not data flow:
  # the drawn associations are the ports that move values between steps, and
  # this holds the literals that parameterize one call. It sits here beside
  # `implementation` so the executable layer is one schema — reference,
  # configuration, ports, artifacts — not split across two.
  # ===========================================================================
  - name: Arguments
    description: |
      Adds `additionalArguments` to every activity: the call's literal
      configuration, beyond the associated inputs and outputs the drawn
      associations bind. The name says the contract: these are *additional* -
      the associations fill the signature first.
    extends:
      - bpmn:Activity
    isAbstract: true
    properties:
      - name: additionalArguments
        description: |
          Literal arguments for the software named by `implementation`, as
          YAML (the role GitHub Actions' `with:` plays) - additional to the
          drawn associations, which fill the signature first; these supply
          what is left over. The reserved `args` key lists positional
          arguments.
        isAttr: false
        type: studyflow:YAMLString
        meta:
          order: 3
          categories:
            - Execution
          condition:
            language: json
            body:
              implementation: $set

  - name: Seed
    description: |
      Adds the run's root seed to the process - pinned in the plan, read by
      the engine, echoed on the as-run record.
    extends:
      - bpmn:Process
    isAbstract: true
    properties:
      - name: seed
        description: |
          Root seed for runs of this study; every step derives its own from it.
          Pin it to make runs replayable; leave it unset and the engine draws
          one and records it on the as-run file.
        isAttr: true
        type: Integer
        meta:
          optional: true
          categories:
            - Execution

  # ===========================================================================
  # Bindings. Inputs and outputs are never listed on a task: they are the
  # data associations drawn on the canvas. Connect a data element to a task
  # and it is an input; connect the task to a data element and it is an output.
  # `binding` below only *refines* that detection, with one attribute per
  # association: `slot = selection`, each half optional. The slot names
  # *where* the value goes, the selection *what* value arrives; a selection
  # is member access and indexing that routes a value between ports, never a
  # computation - anything that computes is a step with its own
  # `implementation`, drawn where a reader can see it. Wires coordinate,
  # steps calculate.
  #
  # This is authoring shorthand over BPMN's own spelling, and the two are
  # losslessly interchangeable: every saved XML form (.bpmn, the payload a
  # figure embeds) lowers each associated step to a full `ioSpecification`
  # (a named `bpmn:DataInput` per input association carrying the slot, one
  # `result` `bpmn:DataOutput`, `inputSet`/`outputSet`) with the selection as
  # BPMN's native `transformation` expression; opening any of them folds the
  # structure back to this attribute. Files carry standard BPMN, people edit
  # one field.
  # ===========================================================================
  - name: Binding
    description: >-
      The one binding attribute of a drawn data association: which slot of the
      call the value fills, and what selection of the source arrives there.
      Authoring shorthand only - saved XML always carries the lowered
      standard form instead.
    extends:
      - bpmn:DataInputAssociation
      - bpmn:DataOutputAssociation
    isAbstract: true
    properties:
      - name: binding
        description: |
          `slot = selection`, each half optional. On an *input* association the
          slot is the callable parameter (`X`; blank binds by the element's own
          name; `self` is an unbound method's receiver, `*` appends
          positionally) and the selection narrows the source before it lands
          (`X = folds['train']`; a bare selection like `folds['train']` keeps
          the default slot). On an *output* association there is no slot - the
          drawn target is it - so the whole value is a selection over `result`
          (`result[0]`, `result.figure_`; blank lands the whole return value),
          which is how one call fills several data elements.
        isAttr: true
        type: String
        meta:
          categories:
            - General

  # ===========================================================================
  # Triggers, sensors, and delays are native BPMN, not studyflow concepts: a
  # timer start event is a schedule, a message start event an external event,
  # a conditional catch event a sensor, a timer catch event a delay, and a
  # plain start event a manual run. As for `loopCondition` and
  # `completionCondition`, the event definitions' expressions are authored as
  # flat strings and stored in BPMN's own expression-element form.
  # ===========================================================================
  - name: Timer
    description: |
      Declares the timer event definition's expressions so schedules and
      delays are authored as flat strings, stored in BPMN's own form (an
      expression element, `xsi:type` tFormalExpression). On a start event,
      `timeCycle` launches runs on a schedule; on an intermediate catch
      event, `timeDuration` is a delay and `timeDate` a fixed wake-up.
    extends:
      - bpmn:TimerEventDefinition
    isAbstract: true
    properties:
      - name: bpmn:timeCycle
        description: |
          When to fire, repeatedly: a cron five-field expression (e.g.
          `0 6 * * 1`, Mondays at 06:00) or an ISO 8601 repeating interval
          (e.g. `R/PT24H`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:TimerEventDefinition#timeCycle
        meta:
          categories:
            - Execution
      - name: bpmn:timeDuration
        description: How long to wait, as an ISO 8601 duration (e.g. `PT1H`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:TimerEventDefinition#timeDuration
        meta:
          categories:
            - Execution
      - name: bpmn:timeDate
        description: Fire once, at a fixed time (ISO 8601, e.g. `2026-09-01T06:00Z`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:TimerEventDefinition#timeDate
        meta:
          categories:
            - Execution

  - name: Condition
    description: |
      Declares the conditional event definition's `condition`, authored as a
      flat CEL string and stored as BPMN's own expression element. A
      conditional catch event is the workflow sensor: the token waits here
      until the condition over the run's variables holds - data arrived, a
      metric crossed a line - then passes.
    extends:
      - bpmn:ConditionalEventDefinition
    isAbstract: true
    properties:
      - name: bpmn:condition
        description: |
          CEL expression over the run's variables; the event fires when it
          holds (e.g. `raw_sessions.rowCount > 0`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:ConditionalEventDefinition#condition
        meta:
          categories:
            - Execution

  # Cycles come in two interchangeable forms, both BPMN's own. The compact
  # form is the standard-loop marker (`loopCharacteristics` with
  # `loopCondition`, `loopMaximum`, `testBefore`): one activity retried in
  # place, the canvas ↻. The drawn form is a gateway whose conditioned
  # back-edge returns upstream, exit as the gateway's native `default` - use
  # it when the cycle spans several steps or the exit rule should be a
  # visible edge, bounding it with the engine's run state
  # (`state.visits.<gateway-id>`, the drawn counterpart of the marker's own
  # loopCounter). The declarations below keep the marker's condition and the
  # ad-hoc sub-process's exit test (an Agent's stop rule) authorable as flat
  # CEL strings; on the association they are BPMN's own expression elements
  # (`xsi:type` tFormalExpression), not custom attributes.
  - name: CompletionCondition
    description: |
      Declares the ad-hoc sub-process's own `completionCondition`, authored
      as a flat CEL string (e.g. `answer != null`) and stored as BPMN's own
      expression element.
    extends:
      - bpmn:AdHocSubProcess
    isAbstract: true
    properties:
      - name: bpmn:completionCondition
        description: |
          BPMN's own exit test: the ad-hoc sub-process (an Agent) is complete
          when this holds, evaluated over the run's variables after each turn.
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:AdHocSubProcess#completionCondition
        meta:
          categories:
            - General

  - name: LoopCondition
    description: |
      Declares the standard-loop marker's `loopCondition`, authored as a flat
      CEL string and stored as BPMN's own expression element (as the core
      does for `conditionExpression`). The loop *continues while* it holds,
      and stops at `loopMaximum` regardless.
    extends:
      - bpmn:StandardLoopCharacteristics
    isAbstract: true
    properties:
      - name: bpmn:loopCondition
        description: |
          Continue-while CEL expression over the run's bound values (e.g.
          `score < 0.9` keeps retrying until the score clears 0.9). Evaluated
          after each turn, or before it with `testBefore`.
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:StandardLoopCharacteristics#loopCondition
        meta:
          categories:
            - Execution

  # ===========================================================================
  # Artifacts. One field on every BPMN data element: where the bytes live
  # (`uri`). How they are laid out is `format` - the word the data types
  # already own (Table, Dataset, Timeseries, and domain wrappers all declare
  # one), so this schema does not declare a second: the engine reads the
  # element's `format` wherever its schema put it, and falls back to what the
  # `uri`'s file extension implies. The engine passes associated data in
  # memory and loads/saves an artifact at its `uri` when one is set - nothing
  # more.
  # ===========================================================================
  - name: Artifact
    description: |
      Storage contract, mixed onto every BPMN data element. Unset `uri` means
      the value only flows in memory between steps; set, the engine
      reads/writes the artifact there, in the element's declared `format` (or
      the one the file extension implies).
    extends:
      - bpmn:ItemAwareElement
    isAbstract: true
    properties:
      - name: uri
        description: Where the bytes live (`results/model.joblib`, `s3://...`, a URL).
        isAttr: true
        type: String
        meta:
          order: 1
          categories:
            - Data

  # ===========================================================================
  # The one concrete element: a named configuration group the engine passes
  # to steps like any other associated data.
  # ===========================================================================
  - name: Parameters
    description: |
      A named configuration group - a dict of values associated with the steps that
      read it, so a study varies by editing data, not the flow.
    superClass:
      - bpmn:DataObjectReference
    meta:
      icon: iconify mdi--tune
      bpmnType: bpmn:DataObjectReference
    properties:
      - name: values
        description: The configuration itself, as a YAML mapping.
        isAttr: false
        type: studyflow:YAMLString
        meta:
          order: 1
          categories:
            - Data
          editor: yaml

templates:
  - description: Compose a hierarchical workflow with BPMN's native sub-process.
    object:
      bpmn:name: Composite workflow
      type: bpmn:SubProcess
      bpmn:documentation: |
        A BPMN sub-process coordinates an internal workflow. It has no
        `implementation`: its child flow elements are the work. Connect data
        to its boundary with BPMN associations when the composite has explicit
        inputs or outputs.
      icon: iconify mdi--sitemap-outline
      keywords:
        - subprocess
        - composite
        - workflow
        - hierarchy
  - description: Launch the flow on a schedule - BPMN's own timer start event, with a cron or ISO 8601 cycle.
    object:
      bpmn:name: Scheduled start
      type: bpmn:StartEvent
      bpmn:documentation: |
        A native BPMN timer start event. `timeCycle` holds a cron five-field
        expression (`0 6 * * *`) or an ISO 8601 repeating interval (`R/PT24H`).
        The other launch conditions are also native BPMN: a message start
        event for external events, a conditional start event for data arrival,
        a plain start event for manual runs.
      icon: iconify mdi--clock-start
      keywords:
        - schedule
        - cron
        - trigger
        - timer
        - nightly
        - periodic
      eventDefinitions:
        - type: bpmn:TimerEventDefinition
          timeCycle: "0 6 * * *"

  - description: Wait for data - a sensor that holds the token until a condition over the variables holds.
    object:
      bpmn:name: Wait for data
      type: bpmn:IntermediateCatchEvent
      bpmn:documentation: |
        A native BPMN conditional catch event: the run pauses here until the
        `condition` holds (data arrived, a metric crossed a line), then
        continues.
      icon: iconify mdi--radar
      keywords:
        - sensor
        - wait
        - condition
        - data
        - poll
      eventDefinitions:
        - type: bpmn:ConditionalEventDefinition
          condition: raw_sessions.rowCount > 0

  - description: Wait for a duration - a drawn delay (cooldown, rate limit, settling time).
    object:
      bpmn:name: Wait
      type: bpmn:IntermediateCatchEvent
      bpmn:documentation: |
        A native BPMN timer catch event holding the token for `timeDuration`
        (ISO 8601, e.g. `PT1H`). The drawn form of a delay, for when the wait
        is part of the protocol rather than an implementation detail.
      icon: iconify mdi--timer-sand
      keywords:
        - wait
        - delay
        - timer
        - cooldown
        - backoff
      eventDefinitions:
        - type: bpmn:TimerEventDefinition
          timeDuration: PT1H

  - description: Gate - continue only when a measured value clears the criterion.
    object:
      bpmn:name: Gate
      type: bpmn:ExclusiveGateway
      bpmn:documentation: |
        A decision on a measured value: promotion gates ("keep the model only
        if accuracy clears the bar"), data-quality gates, and safety gates are
        all a native exclusive gateway. The rule is BPMN's own: type it as the
        pass flow's `conditionExpression` - a CEL expression over the bound
        values, the field the engine's branch rule reads - and mark the reject
        flow as the gateway's native `default`.
        Write the rationale for the threshold here in `documentation`, where
        reviewers read it; there is no second place to write the rule.
        A retry loop is this same gateway drawn into a cycle: condition the
        back-edge (`score < 0.9 && state.visits.Gate_1 < 5` - the engine
        exposes per-gateway visit counts in its run state) and keep the exit
        as the `default`. For a one-activity retry, the standard-loop marker
        on the activity is the compact equivalent.
      icon: iconify mdi--gate-arrow-right
      keywords:
        - gate
        - threshold
        - promote
        - policy
        - quality

  - description: Retry-until-good loop, drawn - a cycle whose exit rule and budget are visible edges.
    object:
      bpmn:name: Repeat until
      type: bpmn:SubProcess
      bpmn:documentation: |
        The promoted loop idiom, stamped as standard visual BPMN: do the
        work, test it at the gateway, and take the conditioned back-edge
        while the criterion fails - bounded by the engine's per-gateway
        visit count - then leave through the exit. Mark the exit as the
        gateway's native `default`, rename the pieces, and repoint the
        condition; nothing here is studyflow-specific.
      icon: iconify mdi--repeat-variant
      keywords:
        - loop
        - repeat
        - until
        - retry
        - cycle
      flowElements:
        - id: loop_start
          type: bpmn:StartEvent
          x: 140
          y: 150
        - id: loop_work
          type: bpmn:Task
          bpmn:name: Do the work
          x: 220
          y: 130
        - id: loop_gate
          type: bpmn:ExclusiveGateway
          bpmn:name: Good enough?
          x: 400
          y: 140
        - id: loop_done
          type: bpmn:EndEvent
          x: 520
          y: 150
        - type: bpmn:SequenceFlow
          sourceRef: loop_start
          targetRef: loop_work
        - type: bpmn:SequenceFlow
          sourceRef: loop_work
          targetRef: loop_gate
        - type: bpmn:SequenceFlow
          bpmn:name: retry
          conditionExpression: score < 0.9 && state.visits.loop_gate < 5
          sourceRef: loop_gate
          targetRef: loop_work
        - type: bpmn:SequenceFlow
          bpmn:name: good enough
          sourceRef: loop_gate
          targetRef: loop_done
