# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Core
prefix: studyflow
description: >-
  Core BPMN extension for modeling research processes - the study container,
  events, flows, generic activities, the data-infrastructure types shared by
  every use case, and the executable layer an engine reads (`implementation`,
  `transformation`, `uri`, `additionalArguments`, and the expression attributes).
uri: http://behaverse.org/schemas/studyflow/v1
icon: https://raw.githubusercontent.com/behaverse/schemas/main/assets/img/schema_S.png
core: true   # backs the default elements; always loaded, cannot be disabled
order: 10  # registry position (load precedence + settings order)
xml:
  tagAlias: lowerCase
version: 26.0811

# Inspector tabs, in the order they appear. These are the ones shared by every
# schema; a schema may declare its own (as `cognitive` does with "Behaverse").
# An attribute joins a tab by naming it in `meta.categories`; a tab a schema
# names without declaring lands after every declared one. `synthetic` tabs are
# drawn by a dedicated section over nested BPMN state, so they show with no
# attributes.
#
# A tab has to earn its name. These five (plus the run record) are the
# questions a modeller asks of any element, so they recur across every schema;
# a tab holding one type's own fields would mostly repeat what the panel header
# already says the element is, so those fields go to General. That is why an
# OpenBCI recording has no "OpenBCI" tab and an LLM call has no "Model call"
# tab: on those elements, their own fields *are* the general ones.
categories:
  - name: General
    order: 10
    description: What this element is — identity, and the fields particular to its type.
  - name: Documentation
    order: 20
    description: Prose about the element — documentation, checklist, categories.
  - name: Gantt
    order: 30
    description: Where the element sits on the schedule — onset, duration, progress.
  - name: Data
    order: 40
    description: How a value is laid out — format and schema.
  - name: Execution
    order: 50
    synthetic: true
    description: >-
      What runs and how — its function and arguments, the data it reads and
      writes, how often it repeats, and the `bpmn:Property` state it carries.
  - name: Run record
    # Engine-written state (`meta.readonly`): always the last tab, so run
    # records sit apart from the fields people author.
    order: 9000
    description: What a run wrote back onto the element.

enumerations:
  - name: DatasetFormatEnum
    description: Format of the dataset (BDM, BIDS, Psych-DS, etc).
    literalValues:
      - name: BDM (Behaverse Data Model)
        value: bdm
        icon: iconify bi--hexagon
      - name: BIDS (Brain Imaging Data Structure)
        value: bids
        icon: bids-dataset-icon
      - name: Psych-DS
        value: psych-ds
        icon: iconify uil--flask
      - name: Kedro
        value: kedro
  - name: BDMDataLevelEnum
    description: BDM level of the data (events, trials, models).
    literalValues:
      - name: Events
        value: events
      - name: Trials
        value: trials
      - name: Models
        value: models
  - name: BIDSDataTypeEnum
    description: BIDS data type (e.g., anat, func, etc).
    literalValues:
      - name: anat (anatomical MRI)
        value: anat
      - name: beh (behavioral)
        value: beh
      - name: dwi (diffusion MRI)
        value: dwi
      - name: eeg (electroencephalography)
        value: eeg
      - name: func (functional MRI)
        value: func
      - name: ieeg (intracranial EEG)
        value: ieeg
      - name: meg (magnetoencephalography)
        value: meg
      - name: micr (microscopy)
        value: micr
      - name: motion (motion capture)
        value: motion
      - name: mrs (magnetic resonance spectroscopy)
        value: mrs
      - name: nirs (near-infrared spectroscopy)
        value: nirs
      - name: perf (arterial spin labeling)
        value: perf
      - name: pet (positron emission tomography)
        value: pet
  - name: TableFormatEnum
    description: On-disk format of a tabular dataset.
    literalValues:
      - name: CSV
        value: csv
      - name: TSV
        value: tsv
      - name: Parquet
        value: parquet
      - name: Arrow
        value: arrow
      - name: JSON Lines
        value: jsonl
  - name: TimeseriesFormatEnum
    description: On-disk format of a time-series recording.
    literalValues:
      - name: EDF (European Data Format)
        value: edf
      - name: BDF (Biosemi Data Format)
        value: bdf
      - name: FIF (MNE/Elekta)
        value: fif
      - name: SET (EEGLAB)
        value: set
      - name: Parquet
        value: parquet
      - name: Zarr
        value: zarr
  - name: CompletionCodeTypeEnum
    description: How the completion code is generated when the study ends.
    literalValues:
      - name: None
        value: none
        description: No completion code is issued.
      - name: Static
        value: static
        description: A fixed code configured by the researcher.
      - name: Dynamic
        value: dynamic
        description: A code extracted from a URL pattern at runtime (e.g. Prolific).
  - name: RuntimeEnum
    description: Execution environment in which the study runs.
    literalValues:
      - name: Browser
        value: browser
      - name: Cloud
        value: cloud
      - name: Local
        value: local
      - name: HPC
        value: hpc
  - name: AssignmentAlgorithmEnum
    description: The scheduling algorithm used for the assignment.
    literalValues:
      - name: Probabilistic
        value: probabilistic
      - name: Round Robin
        value: round-robin
  - name: ItemTypeEnum
    description: |
      Scalar types offered first when typing a `bpmn:Property` (the State tab).
      A BPMN `itemSubjectRef` points at an `ItemDefinition` whose `structureRef`
      is free text - `pandas.DataFrame` and `sklearn.pipeline.Pipeline` are as
      valid as `string` - so this list seeds the picker rather than bounding it.
    literalValues:
      - name: string
        value: string
      - name: integer
        value: integer
      - name: number
        value: number
      - name: boolean
        value: boolean
  - name: ProbabilityDistributionEnum
    description: The random statistical distribution used for the assignment.
    literalValues:
      - name: Uniform
        value: uniform
      - name: Normal
        value: normal
      - name: Exponential
        value: exponential
      - name: Poisson
        value: poisson
types:
  - name: MarkdownString
    description: A string that contains markdown formatting
    superClass:
      - String
    meta:
      # Every attribute of this type gets the markdown editor; an attribute
      # may still name a different one in its own `meta.editor`.
      editor: markdown
  - name: YAMLString
    description: A string that contains YAML-formatted content
    superClass:
      - String
    meta:
      editor: code
  - name: BaseElement
    description: Extends BPMN's BaseElement to include common properties of the Studyflow.
    extends:
      - bpmn:BaseElement
    isAbstract: true
    properties:
      - name: bpmn:documentation
        description: |
          Human-readable description for the element, in markdown - authored
          as a flat string, stored as BPMN's own `<documentation>` child
          element.
        redefines: bpmn:BaseElement#documentation
        isMany: true
        type: bpmn:Documentation
        meta:
          editor: markdown
          categories:
            - Documentation
  - name: ChecklistDocumentation
    description: |
      Marks one `bpmn:documentation` entry as the element's checklist:
      markdown task items (`- [ ]` / `- [x]`) reviewers tick off. The text
      lives in BPMN's own documentation container - every BPMN tool shows
      it - and this one Boolean marker is the only extension involved.
    extends:
      - bpmn:Documentation
    isAbstract: true
    properties:
      - name: checklist
        description: True marks this documentation entry as the element's checklist.
        isAttr: true
        type: Boolean
  - name: Study
    description: Process definition for a Studyflow study.
    superClass:
      - bpmn:Process
    meta:
      bpmnType: bpmn:Process
    properties:
      - name: runtime
        description: Execution runtime in which the study runs (e.g., cloud, local, HPC).
        isAttr: true
        type: RuntimeEnum
        default: cloud
        meta:
          categories:
            - Execution
      - name: authors
        description: Authors of the study.
        isAttr: false
        isMany: true
        type: String
      - name: version
        description: |
          Human-facing version of the study spec (e.g. `1.2`, a git tag).
          Diffing two versions is the audit trail.
        isAttr: true
        type: String
        meta:
          optional: true
      # `seed` is declared by the `Seed` trait below, with the rest of the
      # executable layer.
      - name: isExecutable
        redefines: bpmn:Process#isExecutable
        isAttr: true
        type: Boolean
        default: true
        meta:
          pinned: true
  - name: Classification
    description: |
      Augments a diagram's root with the kind of thing it is. A study says so
      itself: nothing outside the file - no gallery manifest, no index -
      decides which shelf it belongs on, and the Examples gallery builds its
      filter chips from whatever the shipped diagrams declare.
    extends:
      - bpmn:Process
      - bpmn:Collaboration
      - bpmn:Choreography
    isAbstract: true
    properties:
      - name: tags
        description: |
          What kind of study this is, as short free-text labels (`Study
          designs`, `Machine learning`). A study may declare more than one.
        isMany: true
        type: String
        meta:
          categories:
            - Documentation
  # The call configuration (`additionalArguments`) is declared by the `Arguments`
  # trait below, beside `implementation` — one call contract, one place.
  - name: StartEvent
    extends:
      - bpmn:StartEvent
    isAbstract: true
    meta:
      icon: iconify bpmn--start-event
    properties:
      - name: consentFormUri
        description: Link to the consent form. Untick to skip the consent step entirely.
        isAttr: true
        type: String
        meta:
          # Overlay icon drawn on the event when this attribute is set.
          icon: iconify fluent--shield-task-24-regular
          optional: true
  - name: SequenceFlow
    extends:
      - bpmn:SequenceFlow
    isAbstract: true
    properties:
      - name: bpmn:conditionExpression
        description: |
          Condition for sequence flows (e.g., in gateways): an expression over
          the run's bound values (`mean_cv_accuracy >= 0.9`), authored as a
          flat string and stored as BPMN's own expression element (`xsi:type`
          tFormalExpression). Python or JavaScript, named per expression by
          BPMN's own `language` field; unset runs in the evaluating engine's
          own language (Python in the reference runner, JavaScript in the
          browser) and is checked only at run time.
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:SequenceFlow#conditionExpression
        meta:
          expression: true
  - name: EndEvent
    extends:
      - bpmn:EndEvent
    isAbstract: true
    meta:
      icon: iconify bpmn--end-event
    properties:
      - name: redirectTo
        description: |
          URL to send the participant to on completion; untick to skip it.
          `{COMPLETION_CODE}` is replaced with the code at run time.
        isAttr: true
        type: String
        meta:
          optional: true
          # Overlay icon drawn on the event when this attribute is set.
          icon: iconify fluent--arrow-exit-24-regular
      - name: completionCodeType
        description: How the completion code is issued when the study ends.
        isAttr: true
        type: CompletionCodeTypeEnum
        default: none
        meta:
          condition:
            body:
              redirectTo: $set
      - name: completionCode
        description: Fixed completion code to embed in the redirect URL.
        isAttr: true
        type: String
        meta:
          condition:
            body:
              redirectTo: $set
              completionCodeType: static
      - name: attritionCount
        description: |
          How many participants left the study through this exit. Written by
          the runner, not by hand, so the diff against the registered file is
          the CONSORT attrition table.
        isAttr: true
        type: Integer
        meta:
          readonly: true
          categories:
            - Run record
  - name: Scheduling
    description: |
      The Gantt axis, on anything that can sit on it: BPMN says nothing about
      when a flow element happens, and the Gantt view is these attributes' only
      consumer. Declared once over both activities and events, since a
      milestone is the same three attributes read as a point.
    extends:
      - bpmn:Activity
      - bpmn:Event
    isAbstract: true
    properties:
      - name: onset
        description: |
          When this starts, or when the event occurs. Free text, so it can be
          a timestamp, a relative offset (`T0+30min`), or a label.
        isAttr: true
        type: String
        meta:
          categories:
            - Gantt
      - name: duration
        description: |
          How long it lasts (`30min`, `PT1H`); the Gantt bar starts at `onset`
          and extends by this. Events need it only when not instantaneous.
        isAttr: true
        type: String
        meta:
          categories:
            - Gantt
      - name: progress
        description: |
          Optional progress indicator (percentage or a free-form label such as
          `done`/`blocked`). The Gantt view shades the bar accordingly.
        isAttr: true
        type: String
        meta:
          categories:
            - Gantt
  - name: ChoreographyTask
    description: |
      One interaction between two participants, drawn with a band above and
      below the label. Use it when the interaction itself is the unit of
      analysis - a dyadic decision round, an experimenter administering a task.
    extends:
      - bpmn:ChoreographyTask
    isAbstract: true
    meta:
      icon: iconify fluent--people-team-24-regular
  - name: Schema
    description: |
      A formal description of the structure of a named collection of types.
      Typically used as column definitions for tables (CSVW), or dimensions/types for arrays.
    superClass:
      - bpmn:DataObjectReference
    meta:
      # An attribute that references a Schema (`Dataset#schema`) edits it as text.
      editor: code
      bpmnType: bpmn:DataObjectReference
    properties:
      - name: format
        description: Schema format identifier (e.g., csvw, linkml, jsonschema).
        isAttr: true
        type: String
        meta:
          categories:
            - Data
      - name: body
        description: Schema content as a string (e.g., JSON, YAML). This can also be a URL/path to the schema definition.
        isAttr: true
        type: YAMLString
        meta:
          categories:
            - Data
          editor: csvw-table
  - name: Dataset
    description: >-
      A collection of data - table, array, or any structured dataset -
      registered in a `DataCatalog`, optionally described by a `Schema`.
    superClass:
      - bpmn:DataStoreReference
    isAbstract: false
    meta:
      icon: iconify bi--database
      bpmnType: bpmn:DataStoreReference
    properties:
      - name: catalog
        description: Identifier of the `DataCatalog` that registers this dataset.
        isAttr: true
        type: DataCatalog
        meta:
          categories:
            - Data
      - name: storage
        description: |
          The `bpmn:DataStoreReference` where this dataset is physically stored -
          BPMN's own construct for persistent storage (it points at a
          `bpmn:DataStore`). There is no studyflow storage type; the native one
          carries the same meaning.
        isAttr: true
        type: bpmn:DataStoreReference
        meta:
          categories:
            - Data
      - name: schema
        description: |
          Path to the schema describing the dataset structure (e.g., CSVW).
          This can also refer to an optional ontology/vocabulary reference (URL/CURIE) for semantic alignment.
        isAttr: true
        type: Schema
        meta:
          categories:
            - Data
      - name: format
        description: Format of the dataset (BDM, BIDS, Psych-DS, etc).
        isAttr: true
        type: DatasetFormatEnum
        meta:
          categories:
            - Data
      - name: bdmDataLevel
        description: Level of the data (events, trials, summary, models).
        isAttr: true
        type: BDMDataLevelEnum
        default: events
        meta:
          categories:
            - Data
          condition:
            body:
              format: bdm
      - name: bidsDataType
        description: BIDS data type (e.g., anat, func, eeg, beh).
        isAttr: true
        type: BIDSDataTypeEnum
        default: beh
        meta:
          categories:
            - Data
          condition:
            body:
              format: bids
  # (There is no studyflow DataStorage type: persistent physical storage is
  # BPMN's own `bpmn:DataStore` / `bpmn:DataStoreReference` - a zero-property
  # `studyflow:DataStorage` renamed the native element and added nothing, so
  # `Dataset#storage` references the native `bpmn:DataStoreReference` directly.)
  # (There is no studyflow DataObjectReference trait: BPMN's own `dataState`
  # already annotates the state of any data element - a `bpmn:DataState` child
  # whose `name` is the state, e.g. `dataState: {name: processed}`. The former
  # `studyflow:DataObjectReference#state` string attribute duplicated it and is
  # dropped in favour of the native field.)
  - name: DataCatalog
    description: A persistent repository/registry of datasets (e.g., openneuro, behaverse).
    superClass:
      - bpmn:BaseElement
    isAbstract: false
    properties:
      - name: url
        description: Base URL of the catalog.
        isAttr: true
        type: String
        meta:
          categories:
            - Data
  - name: Table
    description: |
      Tabular data: rows and columns, described by CSVW or LinkML. Unlike a
      `Dataset`, it commits to that structure rather than staying opaque.
    superClass:
      - bpmn:DataObjectReference
    isAbstract: false
    meta:
      icon: iconify bi--table
      bpmnType: bpmn:DataObjectReference
    properties:
      - name: format
        description: On-disk format of the table (csv, tsv, parquet, arrow, jsonl).
        isAttr: true
        type: TableFormatEnum
        default: csv
        meta:
          categories:
            - Data
      - name: schema
        description: |
          Reference to the table's schema. Typically a `Schema` element carrying
          CSVW JSON-LD or a LinkML class definition.
        isAttr: true
        type: Schema
        meta:
          categories:
            - Data
      - name: rowCount
        description: Expected or declared number of rows.
        isAttr: true
        type: Integer
        meta:
          categories:
            - Data
  - name: Timeseries
    description: |
      Continuous physiological or behavioural recording sampled over time
      (e.g., EEG, EMG, eye-tracking gaze stream, accelerometer). Channels and
      sampling rate are first-class so downstream operations can validate them.
    superClass:
      - bpmn:DataObjectReference
    isAbstract: false
    meta:
      icon: iconify mdi--chart-line
      bpmnType: bpmn:DataObjectReference
    properties:
      - name: samplingRate
        description: Sampling rate in samples per second (Hz).
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: channelCount
        description: Number of channels in the recording.
        isAttr: true
        type: Integer
        meta:
          categories:
            - Data
      - name: units
        description: Physical units of the recorded values (e.g., uV, mV, deg).
        isAttr: true
        type: String
        meta:
          categories:
            - Data
      - name: recordingDuration
        description: Duration of the recording in seconds.
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: format
        description: On-disk format of the time-series file (edf, bdf, fif, set, parquet, zarr).
        isAttr: true
        type: TimeseriesFormatEnum
        meta:
          categories:
            - Data
  - name: EventMarker
    description: |
      Sparse time-stamped occurrences in a recording - trial markers, stimulus
      onsets, button presses. Its recording-time fields are not the Gantt axis's
      `onset`/`duration`.
    superClass:
      - bpmn:DataObjectReference
    isAbstract: false
    meta:
      icon: iconify mdi--lightning-bolt-outline
      bpmnType: bpmn:DataObjectReference
    properties:
      - name: eventType
        description: Category of event (e.g., stimulus, response, artifact).
        isAttr: true
        type: String
        meta:
          categories:
            - Data
      - name: eventOnset
        description: Onset time of the event in seconds, relative to the recording start.
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: eventOffset
        description: Offset time of the event in seconds, relative to the recording start.
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: eventCount
        description: Expected or declared number of events.
        isAttr: true
        type: Integer
        meta:
          categories:
            - Data

  # ===========================================================================
  # The executable layer - what an engine reads to run a diagram: a step's
  # `implementation` and `additionalArguments`, the associated data elements
  # that are its inputs and outputs, and conditions over the values they
  # bind. Studyflow coordinates the calls; it never encodes the computation.
  #
  # Most of these redefine an attribute BPMN already has, which reads like
  # restating the standard until you know what a redefine is *for* here: it is
  # how a native attribute becomes visible. bpmn-moddle carries every BPMN
  # attribute already, and the inspector shows none of them - a field renders
  # only when a schema declares it. `uri` is an addition BPMN has
  # no equivalent for.
  # ===========================================================================

  # ===========================================================================
  # The software reference. BPMN's own `implementation` attribute ("the
  # technology implementing this task") is redefined once, here, with the
  # versioned reference grammar every executable step uses. The engine
  # resolves the reference, calls it with `additionalArguments` plus the associated inputs, and
  # binds the return value to the associated outputs; there is no other step
  # contract.
  # ===========================================================================
  - name: Implementation
    description: |
      Adds BPMN's own `implementation` to every task type that natively
      carries it, so the reference grammar is the same wherever a task runs
      something.
    extends:
      - bpmn:ServiceTask
      - bpmn:UserTask
      - bpmn:SendTask
      - bpmn:ReceiveTask
      - bpmn:BusinessRuleTask
    isAbstract: true
    properties:
      - name: bpmn:implementation
        description: |
          Software this task runs, as `<scheme>://<ref>[@<version-or-digest>]`.
          Schemes: `python://` (importable callable), `docker://` (image),
          `https://` or `file://` (script).
        isAttr: true
        type: String
        # moddle resolves the target by attribute name within each extended
        # type, so this one ref redefines each type's own native attribute.
        redefines: bpmn:ServiceTask#implementation
        meta:
          order: 1
          categories:
            - Execution

  # A ScriptTask's computation is inline, as the standard defines it (§10.3.3):
  # the native `script` child carries the code and `scriptFormat` names its
  # language. No `implementation` here — software that lives outside the
  # diagram is a service task. The redefine surfaces the script in the
  # inspector; `scriptFormat` needs no field of its own, since the code
  # editor's language select edits it (`languageAttr` below).
  - name: Script
    description: |
      Surfaces BPMN's own inline script on script tasks: the code this step
      runs, written in the diagram itself.
    extends:
      - bpmn:ScriptTask
    isAbstract: true
    properties:
      - name: bpmn:script
        description: |
          The inline script this task runs. Its language is BPMN's own
          `scriptFormat`, edited in the code editor's language select; left
          unset, the evaluating engine's own language applies.
        type: String
        redefines: bpmn:ScriptTask#script
        meta:
          order: 1
          categories:
            - Execution
          editor: code
          languageAttr: bpmn:scriptFormat

  # ===========================================================================
  # The call's configuration. `additionalArguments` is plan, not data flow:
  # the drawn associations are the ports that move values between steps, and
  # this holds the literals that parameterize one call. It sits here beside
  # `implementation` so the executable layer is one schema — reference,
  # configuration, ports, artifacts — not split across two.
  # ===========================================================================
  - name: Arguments
    description: |
      Adds `additionalArguments` to every activity: the call's literal
      configuration, beyond the associated inputs and outputs the drawn
      associations bind. The name says the contract: these are *additional* -
      the associations fill the signature first.
    extends:
      - bpmn:Activity
    isAbstract: true
    properties:
      - name: additionalArguments
        description: |
          Literal arguments for the software named by `implementation`, as
          YAML (the role GitHub Actions' `with:` plays) - additional to the
          drawn associations, which fill the signature first; these supply
          what is left over. The reserved `args` key lists positional
          arguments.
        isAttr: false
        type: YAMLString
        meta:
          order: 3
          categories:
            - Execution
          condition:
            body:
              implementation: $set

  - name: Seed
    description: |
      Adds the run's root seed to the process - pinned in the plan, read by
      the engine, echoed on the as-run record.
    extends:
      - bpmn:Process
    isAbstract: true
    properties:
      - name: seed
        description: |
          Root seed for runs of this study; every step derives its own from it.
          Pin it to make runs replayable; leave it unset and the engine draws
          one and records it on the as-run file.
        isAttr: true
        type: Integer
        meta:
          optional: true
          categories:
            - Execution

  # ===========================================================================
  # Bindings. Inputs and outputs are never listed on a task: they are the
  # data associations drawn on the canvas. Connect a data element to a task
  # and it is an input; connect the task to a data element and it is an
  # output. BPMN's own `transformation` element on the association refines
  # that detection - its body is `slot = selection`, each half optional. The
  # slot names *where* the value goes, the selection *what* value arrives; a
  # selection is member access and indexing that routes a value between
  # ports, never a computation. Wires coordinate, steps calculate. Nothing to
  # declare here: `transformation` is the standard's own element, used as-is,
  # and it carries its own per-expression `language`.
  # ===========================================================================

  # ===========================================================================
  # Triggers, sensors, and delays are native BPMN, not studyflow concepts: a
  # timer start event is a schedule, a message start event an external event,
  # a conditional catch event a sensor, a timer catch event a delay, and a
  # plain start event a manual run. As for `loopCondition` and
  # `completionCondition`, the event definitions' expressions are authored as
  # flat strings and stored in BPMN's own expression-element form.
  # ===========================================================================
  - name: Timer
    description: |
      Declares the timer event definition's expressions so schedules and
      delays are authored as flat strings, stored in BPMN's own form (an
      expression element, `xsi:type` tFormalExpression). On a start event,
      `timeCycle` launches runs on a schedule; on an intermediate catch
      event, `timeDuration` is a delay and `timeDate` a fixed wake-up.
    extends:
      - bpmn:TimerEventDefinition
    isAbstract: true
    properties:
      - name: bpmn:timeCycle
        description: |
          When to fire, repeatedly: a cron five-field expression (e.g.
          `0 6 * * 1`, Mondays at 06:00) or an ISO 8601 repeating interval
          (e.g. `R/PT24H`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:TimerEventDefinition#timeCycle
        meta:
          categories:
            - Execution
          expression: true
      - name: bpmn:timeDuration
        description: How long to wait, as an ISO 8601 duration (e.g. `PT1H`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:TimerEventDefinition#timeDuration
        meta:
          categories:
            - Execution
          expression: true
      - name: bpmn:timeDate
        description: Fire once, at a fixed time (ISO 8601, e.g. `2026-09-01T06:00Z`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:TimerEventDefinition#timeDate
        meta:
          categories:
            - Execution
          expression: true

  - name: Condition
    description: |
      Declares the conditional event definition's `condition`, authored as a
      flat string and stored as BPMN's own expression element. A
      conditional catch event is the workflow sensor: the token waits here
      until the condition over the run's variables holds - data arrived, a
      metric crossed a line - then passes.
    extends:
      - bpmn:ConditionalEventDefinition
    isAbstract: true
    properties:
      - name: bpmn:condition
        description: |
          Expression over the run's variables; the event fires when it
          holds (e.g. `raw_sessions.rowCount > 0`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:ConditionalEventDefinition#condition
        meta:
          categories:
            - Execution
          expression: true

  # Cycles come in two interchangeable forms, both BPMN's own. The compact
  # form is the standard-loop marker (`loopCharacteristics` with
  # `loopCondition`, `loopMaximum`, `testBefore`): one activity retried in
  # place, the canvas ↻. The drawn form is a gateway whose conditioned
  # back-edge returns upstream, exit as the gateway's native `default` - use
  # it when the cycle spans several steps or the exit rule should be a
  # visible edge, bounding it with the engine's run state
  # (`state.trace.count('<gateway-id>')`, the drawn counterpart of the marker's own
  # loopCounter). The declarations below keep the marker's condition and the
  # ad-hoc sub-process's exit test (an Agent's stop rule) authorable as flat
  # strings; on the association they are BPMN's own expression elements
  # (`xsi:type` tFormalExpression), not custom attributes.
  - name: CompletionCondition
    description: |
      Declares the ad-hoc sub-process's own `completionCondition`, authored
      as a flat string (e.g. `answer is not None`) and stored as BPMN's own
      expression element.
    extends:
      - bpmn:AdHocSubProcess
    isAbstract: true
    properties:
      - name: bpmn:completionCondition
        description: |
          BPMN's own exit test: the ad-hoc sub-process (an Agent) is complete
          when this holds, evaluated over the run's variables after each turn.
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:AdHocSubProcess#completionCondition
        meta:
          expression: true

  - name: LoopCondition
    description: |
      Declares the standard-loop marker's `loopCondition`, authored as a flat
      string and stored as BPMN's own expression element (as the core
      does for `conditionExpression`). The loop *continues while* it holds,
      and stops at `loopMaximum` regardless.
    extends:
      - bpmn:StandardLoopCharacteristics
    isAbstract: true
    properties:
      - name: bpmn:loopCondition
        description: |
          Continue-while expression over the run's bound values (e.g.
          `score < 0.9` keeps retrying until the score clears 0.9). Evaluated
          after each turn, or before it with `testBefore`.
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:StandardLoopCharacteristics#loopCondition
        meta:
          categories:
            - Execution
          expression: true

  # ===========================================================================
  # Artifacts. One field on every BPMN data element: where the bytes live
  # (`uri`). How they are laid out is `format` - the word the data types
  # already own (Table, Dataset, Timeseries, and domain wrappers all declare
  # one), so this schema does not declare a second: the engine reads the
  # element's `format` wherever its schema put it, and falls back to what the
  # `uri`'s file extension implies. The engine passes associated data in
  # memory and loads/saves an artifact at its `uri` when one is set - nothing
  # more.
  # ===========================================================================
  - name: Artifact
    description: |
      Storage contract, mixed onto every BPMN data element. Unset `uri` means
      the value only flows in memory between steps; set, the engine
      reads/writes the artifact there, in the element's declared `format` (or
      the one the file extension implies).
    extends:
      - bpmn:ItemAwareElement
    isAbstract: true
    properties:
      - name: uri
        description: Where the bytes live (`results/model.joblib`, `s3://...`, a URL).
        isAttr: true
        type: String
        meta:
          order: 1

  # ===========================================================================
  # The one concrete element: a named configuration group the engine passes
  # to steps like any other associated data.
  # ===========================================================================
  - name: Parameters
    description: |
      A named configuration group - a dict of values associated with the steps that
      read it, so a study varies by editing data, not the flow.
    superClass:
      - bpmn:DataObjectReference
    meta:
      icon: iconify mdi--tune
      bpmnType: bpmn:DataObjectReference
    properties:
      - name: values
        description: The configuration itself, as a YAML mapping.
        isAttr: false
        type: YAMLString
        meta:
          order: 1
          categories:
            - Data
          editor: code

