# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Core
prefix: studyflow
description: Core BPMN extension for modeling research processes - the study container, events, flows, generic activities, and the data-infrastructure types shared by every use case.
uri: http://behaverse.org/schemas/studyflow/v1
# Namespaces written by older releases. Still read so an old file stays
# legible; rewritten to `uri` on load.
legacyUris:
  - http://behaverse.org/schemas/studyflow
icon: https://raw.githubusercontent.com/behaverse/schemas/main/assets/img/schema_S.png
core: true   # backs the default elements; always loaded, cannot be disabled
order: 10  # registry position (load precedence + settings order)
xml:
  tagAlias: lowerCase
version: 26.0730

# Inspector tabs, in the order they appear, declared here for every schema.
# An attribute joins a tab by naming it in `meta.categories`; a tab a schema
# names without declaring lands after every declared one. `synthetic` tabs are
# drawn by a dedicated section over nested BPMN state, so they show with no
# attributes.
#
# A tab has to earn its name. These five (plus the run record) are the
# questions a modeller asks of any element, so they recur across every schema;
# a tab holding one type's own fields would only repeat what the panel header
# already says the element is, so those fields go to General. That is why an
# OpenBCI recording has no "OpenBCI" tab and an LLM call has no "Model call"
# tab: on those elements, their own fields *are* the general ones.
categories:
  - name: General
    order: 10
    description: What this element is — identity, and the fields particular to its type.
  - name: Documentation
    order: 20
    description: Prose about the element — documentation, checklist, version, categories.
  - name: Gantt
    order: 30
    description: Where the element sits on the schedule — onset, duration, progress.
  - name: Data
    order: 40
    description: What a value is and where it lives — format, schema, storage, uri.
  - name: Execution
    order: 50
    synthetic: true
    description: >-
      What runs and how — its function and arguments, the data it reads and
      writes, how often it repeats, and the `bpmn:Property` state it carries.
  - name: Run record
    # Engine-written state (`meta.readonly`): always the last tab, so run
    # records sit apart from the fields people author.
    order: 9000
    description: What a run wrote back onto the element.

associations: []
enumerations:
  - name: DatasetFormatEnum
    isAbstract: true
    description: Format of the dataset (BDM, BIDS, Psych-DS, etc).
    literalValues:
      - name: BDM (Behaverse Data Model)
        value: bdm
        icon: iconify bi--hexagon
      - name: BIDS (Brain Imaging Data Structure)
        value: bids
        icon: bids-dataset-icon
      - name: Psych-DS
        value: psych-ds
        icon: iconify uil--flask
      - name: Kedro
        value: kedro
  - name: BDMDataLevelEnum
    isAbstract: true
    description: BDM level of the data (events, trials, models).
    literalValues:
      - name: Events
        value: events
      - name: Trials
        value: trials
      - name: Models
        value: models
  - name: BIDSDataTypeEnum
    isAbstract: true
    description: BIDS data type (e.g., anat, func, etc).
    literalValues:
      - name: anat (anatomical MRI)
        value: anat
      - name: beh (behavioral)
        value: beh
      - name: dwi (diffusion MRI)
        value: dwi
      - name: eeg (electroencephalography)
        value: eeg
      - name: func (functional MRI)
        value: func
      - name: ieeg (intracranial EEG)
        value: ieeg
      - name: meg (magnetoencephalography)
        value: meg
      - name: micr (microscopy)
        value: micr
      - name: motion (motion capture)
        value: motion
      - name: mrs (magnetic resonance spectroscopy)
        value: mrs
      - name: nirs (near-infrared spectroscopy)
        value: nirs
      - name: perf (arterial spin labeling)
        value: perf
      - name: pet (positron emission tomography)
        value: pet
  - name: TableFormatEnum
    isAbstract: true
    description: On-disk format of a tabular dataset.
    literalValues:
      - name: CSV
        value: csv
      - name: TSV
        value: tsv
      - name: Parquet
        value: parquet
      - name: Arrow
        value: arrow
      - name: JSON Lines
        value: jsonl
  - name: TimeseriesFormatEnum
    isAbstract: true
    description: On-disk format of a time-series recording.
    literalValues:
      - name: EDF (European Data Format)
        value: edf
      - name: BDF (Biosemi Data Format)
        value: bdf
      - name: FIF (MNE/Elekta)
        value: fif
      - name: SET (EEGLAB)
        value: set
      - name: Parquet
        value: parquet
      - name: Zarr
        value: zarr
  - name: CompletionCodeTypeEnum
    isAbstract: true
    description: How the completion code is generated when the study ends.
    literalValues:
      - name: None
        value: none
        description: No completion code is issued.
      - name: Static
        value: static
        description: A fixed code configured by the researcher.
      - name: Dynamic
        value: dynamic
        description: A code extracted from a URL pattern at runtime (e.g. Prolific).
  - name: RuntimeEnum
    isAbstract: true
    description: Execution environment in which the study runs.
    literalValues:
      - name: Browser
        value: browser
      - name: Cloud
        value: cloud
      - name: Local
        value: local
      - name: HPC
        value: hpc
  - name: AssignmentAlgorithmEnum
    isAbstract: true
    description: The scheduling algorithm used for the assignment.
    literalValues:
      - name: Probabilistic
        value: probabilistic
      - name: Round Robin
        value: round-robin
  - name: ItemTypeEnum
    isAbstract: true
    description: |
      Scalar types offered first when typing a `bpmn:Property` (the State tab).
      A BPMN `itemSubjectRef` points at an `ItemDefinition` whose `structureRef`
      is free text - `pandas.DataFrame` and `sklearn.pipeline.Pipeline` are as
      valid as `string` - so this list seeds the picker rather than bounding it.
    literalValues:
      - name: string
        value: string
      - name: integer
        value: integer
      - name: number
        value: number
      - name: boolean
        value: boolean
  - name: ProbabilityDistributionEnum
    isAbstract: true
    description: The random statistical distribution used for the assignment.
    literalValues:
      - name: Uniform
        value: uniform
      - name: Normal
        value: normal
      - name: Exponential
        value: exponential
      - name: Poisson
        value: poisson
types:
  - name: MarkdownString
    description: A string that contains markdown formatting
    superClass:
      - String
    meta:
      # Every attribute of this type gets the markdown editor; an attribute
      # may still name a different one in its own `meta.editor`.
      editor: markdown
  - name: YAMLString
    description: A string that contains YAML-formatted content
    superClass:
      - String
    meta:
      editor: code
  - name: BaseElement
    description: Extends BPMN's BaseElement to include common properties of the Studyflow.
    extends:
      - bpmn:BaseElement
    isAbstract: true
    properties:
      - name: bpmn:documentation
        description: |
          Human-readable description for the element, in markdown - authored
          as a flat string, stored as BPMN's own `<documentation>` child
          element.
        redefines: bpmn:BaseElement#documentation
        isMany: true
        type: bpmn:Documentation
        meta:
          editor: markdown
          categories:
            - Documentation
  - name: ChecklistDocumentation
    description: |
      Marks one `bpmn:documentation` entry as the element's checklist:
      markdown task items (`- [ ]` / `- [x]`) reviewers tick off. The text
      lives in BPMN's own documentation container - every BPMN tool shows
      it - and this one Boolean marker is the only extension involved.
    extends:
      - bpmn:Documentation
    isAbstract: true
    properties:
      - name: checklist
        description: True marks this documentation entry as the element's checklist.
        isAttr: true
        type: Boolean
  - name: Study
    description: Process definition for a Studyflow study.
    superClass:
      - bpmn:Process
    meta:
      bpmnType: bpmn:Process
    properties:
      - name: runtime
        description: Execution runtime in which the study runs (e.g., cloud, local, HPC).
        isAttr: true
        type: RuntimeEnum
        default: cloud
        meta:
          categories:
            - Execution
      - name: authors
        description: Authors of the study.
        isAttr: false
        isMany: true
        type: String
      - name: version
        description: |
          Human-facing version of the study spec (e.g. `1.2`, a git tag).
          Diffing two versions is the audit trail.
        isAttr: true
        type: String
        meta:
          optional: true
          categories:
            - Documentation
      # `seed` lives in the exec schema (`exec:Seed`), with the rest of the
      # executable layer.
      - name: isExecutable
        redefines: bpmn:Process#isExecutable
        isAttr: true
        type: Boolean
        default: true
        meta:
          pinned: true
  - name: Classification
    description: |
      Augments a diagram's root with the kind of thing it is. A study says so
      itself: nothing outside the file - no gallery manifest, no index -
      decides which shelf it belongs on, and the Examples gallery builds its
      filter chips from whatever the shipped diagrams declare.
    extends:
      - bpmn:Process
      - bpmn:Collaboration
      - bpmn:Choreography
    isAbstract: true
    properties:
      - name: tags
        description: |
          What kind of study this is, as short free-text labels (`Study
          designs`, `Machine learning`). A study may declare more than one.
        isMany: true
        type: String
        meta:
          categories:
            - Documentation
          # Earlier spellings, still read and rewritten as `tags` on save:
          # `categories` (renamed because that word also names the inspector's
          # tabs and the palette's groups, which these are not), and before
          # that a single `category` attribute.
          legacyNames:
            - categories
            - category
  # The call configuration (`exec:additionalArguments`) lives in the exec
  # schema, beside `implementation` — one call contract, one schema.
  - name: StartEvent
    extends:
      - bpmn:StartEvent
    meta:
      icon: iconify bpmn--start-event
    properties:
      - name: consentFormUri
        description: Link to the consent form. Untick to skip the consent step entirely.
        isAttr: true
        type: String
        meta:
          pinned: false
          # Overlay icon drawn on the event when this attribute is set.
          icon: iconify fluent--shield-task-24-regular
          optional: true
          categories:
            - General
  - name: SequenceFlow
    extends:
      - bpmn:SequenceFlow
    properties:
      - name: bpmn:conditionExpression
        description: |
          Condition for sequence flows (e.g., in gateways): a CEL expression
          over the run's bound values (`CV_Summary.test_accuracy.mean >= 0.9`),
          authored as a flat string and stored as BPMN's own expression
          element (`xsi:type` tFormalExpression). The language is declared by
          BPMN's own `expressionLanguage` attribute on `bpmn:Definitions`.
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:SequenceFlow#conditionExpression
        meta:
          categories:
            - General
          pinned: false
  - name: EndEvent
    extends:
      - bpmn:EndEvent
    meta:
      icon: iconify bpmn--end-event
    properties:
      - name: redirectTo
        description: |
          URL to send the participant to on completion; untick to skip it.
          `{COMPLETION_CODE}` is replaced with the code at run time.
        isAttr: true
        type: String
        meta:
          optional: true
          # Overlay icon drawn on the event when this attribute is set.
          icon: iconify fluent--arrow-exit-24-regular
          categories:
            - General
      - name: completionCodeType
        description: How the completion code is issued when the study ends.
        isAttr: true
        type: CompletionCodeTypeEnum
        default: none
        meta:
          categories:
            - General
          condition:
            language: json
            body:
              redirectTo: $set
      - name: completionCode
        description: Fixed completion code to embed in the redirect URL.
        isAttr: true
        type: String
        meta:
          categories:
            - General
          condition:
            language: json
            body:
              redirectTo: $set
              completionCodeType: static
      - name: attritionCount
        description: |
          How many participants left the study through this exit. Written by
          the runner, not by hand, so the diff against the registered file is
          the CONSORT attrition table.
        isAttr: true
        type: String
        meta:
          readonly: true
          categories:
            - Run record
  - name: Scheduling
    description: |
      The Gantt axis, on anything that can sit on it: BPMN says nothing about
      when a flow element happens, and the Gantt view is these attributes' only
      consumer. Declared once over both activities and events, since a
      milestone is the same three attributes read as a point.
    extends:
      - bpmn:Activity
      - bpmn:Event
    isAbstract: true
    properties:
      - name: onset
        description: |
          When this starts, or when the event occurs. Free text, so it can be
          a timestamp, a relative offset (`T0+30min`), or a label.
        isAttr: true
        type: String
        meta:
          categories:
            - Gantt
      - name: duration
        description: |
          How long it lasts (`30min`, `PT1H`); the Gantt bar starts at `onset`
          and extends by this. Events need it only when not instantaneous.
        isAttr: true
        type: String
        meta:
          categories:
            - Gantt
      - name: progress
        description: |
          Optional progress indicator (percentage or a free-form label such as
          `done`/`blocked`). The Gantt view shades the bar accordingly.
        isAttr: true
        type: String
        meta:
          categories:
            - Gantt
  - name: ChoreographyTask
    description: |
      One interaction between two participants, drawn with a band above and
      below the label. Use it when the interaction itself is the unit of
      analysis - a dyadic decision round, an experimenter administering a task.
    extends:
      - bpmn:ChoreographyTask
    meta:
      icon: iconify fluent--people-team-24-regular
  - name: Schema
    description: |
      A formal description of the structure of a named collection of types.
      Typically used as column definitions for tables (CSVW), or dimensions/types for arrays.
    superClass:
      - bpmn:DataObjectReference
    meta:
      # An attribute that references a Schema (`Dataset#schema`) edits it as text.
      editor: code
      bpmnType: bpmn:DataObjectReference
    properties:
      - name: format
        description: Schema format identifier (e.g., csvw, linkml, jsonschema).
        isAttr: true
        type: String
        meta:
          categories:
            - Data
      - name: body
        description: Schema content as a string (e.g., JSON, YAML). This can also be a URL/path to the schema definition.
        isAttr: true
        type: YAMLString
        meta:
          categories:
            - Data
          editor: csvw-table
  - name: Dataset
    description: >-
      A collection of data - table, array, or any structured dataset -
      registered in a `DataCatalog`, optionally described by a `Schema`.
    superClass:
      - bpmn:DataStoreReference
    isAbstract: false
    meta:
      icon: iconify bi--database
      bpmnType: bpmn:DataStoreReference
    properties:
      - name: catalog
        description: Identifier of the `DataCatalog` that registers this dataset.
        isAttr: true
        type: DataCatalog
        meta:
          categories:
            - Data
      - name: storage
        description: |
          The `bpmn:DataStoreReference` where this dataset is physically stored -
          BPMN's own construct for persistent storage (it points at a
          `bpmn:DataStore`). There is no studyflow storage type; the native one
          carries the same meaning.
        isAttr: true
        type: bpmn:DataStoreReference
        meta:
          categories:
            - Data
      - name: schema
        description: |
          Path to the schema describing the dataset structure (e.g., CSVW).
          This can also refer to an optional ontology/vocabulary reference (URL/CURIE) for semantic alignment.
        isAttr: true
        type: Schema
        meta:
          categories:
            - Data
      - name: format
        description: Format of the dataset (BDM, BIDS, Psych-DS, etc).
        isAttr: true
        type: DatasetFormatEnum
        meta:
          categories:
            - Data
      - name: bdmDataLevel
        description: Level of the data (events, trials, summary, models).
        isAttr: true
        type: BDMDataLevelEnum
        default: events
        meta:
          categories:
            - Data
          condition:
            language: json
            body:
              format: bdm
      - name: bidsDataType
        description: BIDS data type (e.g., anat, func, eeg, beh).
        isAttr: true
        type: BIDSDataTypeEnum
        default: beh
        meta:
          categories:
            - Data
          condition:
            language: json
            body:
              format: bids
  # (There is no studyflow DataStorage type: persistent physical storage is
  # BPMN's own `bpmn:DataStore` / `bpmn:DataStoreReference` - a zero-property
  # `studyflow:DataStorage` renamed the native element and added nothing, so
  # `Dataset#storage` references the native `bpmn:DataStoreReference` directly.)
  # (There is no studyflow DataObjectReference trait: BPMN's own `dataState`
  # already annotates the state of any data element - a `bpmn:DataState` child
  # whose `name` is the state, e.g. `dataState: {name: processed}`. The former
  # `studyflow:DataObjectReference#state` string attribute duplicated it and is
  # dropped in favour of the native field.)
  - name: DataCatalog
    description: A persistent repository/registry of datasets (e.g., openneuro, behaverse).
    superClass:
      - bpmn:BaseElement
    isAbstract: false
    properties:
      - name: url
        description: Base URL of the catalog.
        isAttr: true
        type: String
        meta:
          categories:
            - Data
  - name: Table
    description: |
      Tabular data: rows and columns, described by CSVW or LinkML. Unlike a
      `Dataset`, it commits to that structure rather than staying opaque.
    superClass:
      - bpmn:DataObjectReference
    isAbstract: false
    meta:
      icon: iconify bi--table
      bpmnType: bpmn:DataObjectReference
    properties:
      - name: format
        description: On-disk format of the table (csv, tsv, parquet, arrow, jsonl).
        isAttr: true
        type: TableFormatEnum
        default: csv
        meta:
          categories:
            - Data
      - name: schema
        description: |
          Reference to the table's schema. Typically a `Schema` element carrying
          CSVW JSON-LD or a LinkML class definition.
        isAttr: true
        type: Schema
        meta:
          categories:
            - Data
      - name: rowCount
        description: Expected or declared number of rows.
        isAttr: true
        type: Integer
        meta:
          categories:
            - Data
  - name: Timeseries
    description: |
      Continuous physiological or behavioural recording sampled over time
      (e.g., EEG, EMG, eye-tracking gaze stream, accelerometer). Channels and
      sampling rate are first-class so downstream operations can validate them.
    superClass:
      - bpmn:DataObjectReference
    isAbstract: false
    meta:
      icon: iconify mdi--chart-line
      bpmnType: bpmn:DataObjectReference
    properties:
      - name: samplingRate
        description: Sampling rate in samples per second (Hz).
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: channelCount
        description: Number of channels in the recording.
        isAttr: true
        type: Integer
        meta:
          categories:
            - Data
      - name: units
        description: Physical units of the recorded values (e.g., uV, mV, deg).
        isAttr: true
        type: String
        meta:
          categories:
            - Data
      - name: recordingDuration
        description: Duration of the recording in seconds.
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: format
        description: On-disk format of the time-series file (edf, bdf, fif, set, parquet, zarr).
        isAttr: true
        type: TimeseriesFormatEnum
        meta:
          categories:
            - Data
  - name: EventMarker
    description: |
      Sparse time-stamped occurrences in a recording - trial markers, stimulus
      onsets, button presses. Its recording-time fields are not the Gantt axis's
      `onset`/`duration`.
    superClass:
      - bpmn:DataObjectReference
    isAbstract: false
    meta:
      icon: iconify mdi--lightning-bolt-outline
      bpmnType: bpmn:DataObjectReference
    properties:
      - name: eventType
        description: Category of event (e.g., stimulus, response, artifact).
        isAttr: true
        type: String
        meta:
          categories:
            - Data
      - name: eventOnset
        description: Onset time of the event in seconds, relative to the recording start.
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: eventOffset
        description: Offset time of the event in seconds, relative to the recording start.
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: eventCount
        description: Expected or declared number of events.
        isAttr: true
        type: Integer
        meta:
          categories:
            - Data
