project:
  type: website
  output-dir: ../dist/docs

website:
  title: "Studyflow Modeler"
  description: "Documentation for Studyflow and Studyflow Modeler"
  site-url: https://behaverse.org/studyflow-modeler/docs/
  favicon: assets/img/logo.png
  llms-txt: true
  search: true
  bread-crumbs: true
  page-navigation: true
  # Four reader sections, then Develop; each link opens that section's entry page.
  navbar:
    left:
      - text: Start
        href: index.qmd
      - text: Design
        href: design/relations.qmd
      - text: Run
        href: run/participants.qmd
      - text: Reference
        href: reference/elements.qmd
      - text: Develop
        href: develop/architecture.qmd
    right:
      - text: Open Modeler
        href: https://behaverse.org/studyflow-modeler/app.html
        icon: box-arrow-up-right
        target: _blank
  sidebar:
    id: default
    title: Studyflow Docs
    logo: assets/img/logo.png
    alignment: center
    style: docked
    pinned: true
    collapse-level: 1
    search: true
    footer: '&copy; 2025 [xCIT.org](https://xcit.org)'
    tools:
      - icon: github
        href: https://github.com/behaverse/studyflow-modeler
        text: GitHub
    # Explicit contents, ordered by teaching order -- never alphabetically.
    contents:
      - section: Start
        contents:
          - text: Introduction
            href: index.qmd
          - text: Get started
            href: start/quickstart.qmd
          - text: Reading a studyflow
            href: start/reading-studyflows.qmd
      - section: Design
        contents:
          - text: The eleven relations
            href: design/relations.qmd
          - text: Modeler app
            href: design/modeler.qmd
          - text: Cognitive tasks
            href: design/tasks.qmd
          - text: Randomize and counterbalance
            href: design/randomization.qmd
          - text: Data in and out
            href: design/data.qmd
          - text: Analysis pipelines
            href: design/analysis.qmd
          - text: Models as participants
            href: design/agents.qmd
          - text: Trials and protocols
            href: design/protocols.qmd
          - text: Example gallery
            href: design/gallery.qmd
      - section: Run
        contents:
          - text: With participants
            href: run/participants.qmd
          - text: What actually runs
            href: run/execution.qmd
          - text: Views and the record
            href: run/provenance.qmd
          - text: Keep, share, and publish
            href: run/share.qmd
      - section: Reference
        contents:
          - text: Elements
            href: reference/elements.qmd
          - text: Data
            href: reference/data.qmd
          - text: File format
            href: reference/file-format.qmd
          - text: BPMN mapping
            href: reference/bpmn.qmd
          - text: Command line and URLs
            href: reference/cli.qmd
          - text: Formal model
            href: reference/formal-model.qmd
          - text: Glossary
            href: reference/glossary.qmd
      - section: Develop
        contents:
          - text: Architecture
            href: develop/architecture.qmd
          - text: Authoring schemas
            href: develop/authoring-schemas.qmd
          - text: Add a node kind
            href: develop/runner-nodes.qmd
      - text: "---"
      - text: FAQ
        href: faq.qmd
  open-graph: true

format:
  html:
    theme:
      light:
        - default
        - assets/css/theme.scss
      dark:
        - default
        - assets/css/theme-dark.scss
    css:
      - assets/css/custom.css
      - assets/css/figures.css
    toc: true
    reference-location: block
    mainfont: "IBM Plex Sans"
    highlight-style: github
    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: '^(?:http://|https://)(?:[^/]*\.)?behaverse\.org/studyflow-modeler/docs/'
