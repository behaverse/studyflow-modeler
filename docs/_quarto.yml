project:
  type: website
  output-dir: ../dist/docs

website:
  title: "Studyflow"
  description: "The specification of Studyflow, a coordination notation for experimental research"
  site-url: https://behaverse.org/studyflow-modeler/docs/
  favicon: assets/img/logo.png
  llms-txt: true
  search: true
  bread-crumbs: true
  page-navigation: true
  # Three pages: the argument, the object it rests on, and what ships.
  navbar:
    left:
      - text: Overview
        href: index.qmd
      - text: Specification
        href: specification.qmd
      - text: Reference
        href: reference.qmd
    right:
      - text: Open Modeler
        href: https://behaverse.org/studyflow-modeler/app.html
        icon: box-arrow-up-right
        target: _blank
      - icon: github
        href: https://github.com/behaverse/studyflow-modeler
  page-footer:
    center: '&copy; 2025 [xCIT.org](https://xcit.org)'
  open-graph: true

format:
  html:
    theme:
      light:
        - default
        - assets/css/theme.scss
      dark:
        - default
        - assets/css/theme-dark.scss
    css:
      - assets/css/custom.css
      - assets/css/figures.css
    toc: true
    reference-location: block
    mainfont: "IBM Plex Sans"
    highlight-style: github
    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: '^(?:http://|https://)(?:[^/]*\.)?behaverse\.org/studyflow-modeler/docs/'
