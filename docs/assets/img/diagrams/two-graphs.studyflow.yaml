id: two_graphs
schemas:
  cognitive: http://behaverse.org/schemas/studyflow/cognitive
  studyflow: http://behaverse.org/schemas/studyflow/v1

Two_Graphs:
  type: Process
  name: Two graphs in one file
  extensions:
    studyflow:Study: {}
  documentation: >-
    A studyflow is a graph with two kinds of edges: solid sequence flows carry the session a participant goes through,
    and dotted data associations carry the data. Drawn for docs/reference.qmd.
  elements:
    Start:
      type: StartEvent
      name: Start

    Pre:
      type: Task
      name: 2-Back, pre-test
      extensions:
        cognitive:CognitiveTask: {}
      outputs:
        Out_Pre:
          target: $Responses

    Allocation:
      type: ExclusiveGateway
      name: Allocation
      extensions:
        cognitive:RandomGateway: {}

    Training:
      type: Task
      name: Training

    No_Training:
      type: Task
      name: No training

    Post:
      type: Task
      name: 2-Back, post-test
      extensions:
        cognitive:CognitiveTask: {}
      outputs:
        Out_Post:
          target: $Responses

    Fit:
      type: ServiceTask
      name: Fit the model
      inputs:
        In_Fit:
          source: $Responses
      outputs:
        Out_Fit:
          target: $Fitted_Model

    End:
      type: EndEvent
      name: End

    Responses:
      type: DataStoreReference
      name: Responses

    Fitted_Model:
      type: DataObjectReference
      name: Fitted model

    Flow_Start:
      source: $Start
      target: $Pre

    Flow_Pre:
      source: $Pre
      target: $Allocation

    Flow_Arm_1:
      source: $Allocation
      target: $Training

    Flow_Arm_2:
      source: $Allocation
      target: $No_Training

    Flow_Train:
      source: $Training
      target: $Post

    Flow_No_Train:
      source: $No_Training
      target: $Post

    Flow_Post:
      source: $Post
      target: $Fit

    Flow_Fit:
      source: $Fit
      target: $End

