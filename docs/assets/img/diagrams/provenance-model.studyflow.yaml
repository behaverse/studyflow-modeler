id: provenance_model
schemas:
  studyflow: http://behaverse.org/schemas/studyflow/v1

Provenance_Model:
  type: Process
  name: Where the record is kept
  extensions:
    studyflow:Study: {}
  documentation: >-
    Where the record of a run is kept. The studyflow document holds the plan and what its runs left: a trail of entries
    on its root, one record per element, and the state. The modeler appends to the trail and voids records. The local
    runtime appends each event of the run to its record, events.jsonl, commits every checkpoint into the run repository,
    whose commits restate the step, and reads the trail entry, the element records and the state off the record when the
    run ends. Drawn for docs/developers.qmd.
  laneSets:
    Lanes:
      lanes:
        Lane_Modeler:
          name: Modeler
          nodes:
            - $Edit_Start
            - $Export
            - $Saved
            - $Stale_Start
            - $Void
            - $Voided

        Lane_Local:
          name: Local runtime
          nodes:
            - $Run_Start
            - $Execute
            - $Commit
            - $Read_Off
            - $Run_Finished
  elements:
    Edit_Start:
      type: StartEvent
      name: The author edits

    Export:
      type: Task
      name: "Export: stamp created, modified"
      outputs:
        Out_Export:
          target: $Trail

    Saved:
      type: EndEvent
      name: Saved

    Stale_Start:
      type: StartEvent
      name: A step marked stale

    Void:
      type: Task
      name: Void its record (invalidated)
      outputs:
        Out_Void:
          target: $Records

    Voided:
      type: EndEvent
      name: Voided

    Trail:
      type: DataObjectReference
      name: "Trail, on the study's root: action, when, who, with, what, run, seed, note"

    Records:
      type: DataObjectReference
      name: Records, one per element

    Run_Start:
      type: StartEvent
      name: studyflow run

    Execute:
      type: Task
      name: "Execute a step: append its events to the record"
      outputs:
        Out_Events:
          target: $Run_Record

    Run_Record:
      type: DataStoreReference
      name: "events.jsonl, the run's record: one event a line"

    Read_Off:
      type: Task
      name: Read the trail, the records and the state off it
      outputs:
        Out_Trail:
          target: $Trail

        Out_Records:
          target: $Records

    Commit:
      type: Task
      name: Commit each checkpoint
      outputs:
        Out_Commit:
          target: $Repository

    Run_Finished:
      type: EndEvent
      name: Run finished

    Repository:
      type: DataStoreReference
      name: Run repository, runs/STAMP/.git

    Flow_Edited:
      source: $Edit_Start
      target: $Export

    Flow_Exported:
      source: $Export
      target: $Saved

    Flow_Stale:
      source: $Stale_Start
      target: $Void

    Flow_Void:
      source: $Void
      target: $Voided

    Flow_Run:
      source: $Run_Start
      target: $Execute

    Flow_Executed:
      source: $Execute
      target: $Commit

    Flow_Committed:
      source: $Commit
      target: $Read_Off

    Flow_Read:
      source: $Read_Off
      target: $Run_Finished
  artifacts:
    Document:
      type: Group
      categoryValue: $Document_Value

    Commit_Note:
      text: >-
        One commit per checkpoint: its trailers restate the step (Prov-Action, Prov-When, Prov-Run, Prov-Node). The
        record is committed with the run's started and finished commits.

    Sidecar_Note:
      text: "One record, events.jsonl: what the study keeps of a run is read off it."

Document_Category:
  type: Category
  categoryValue:
    Document_Value:
      value: "The studyflow document: the plan, and what its runs left"

