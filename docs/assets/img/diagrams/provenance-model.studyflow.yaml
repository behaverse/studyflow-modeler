id: provenance_model
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Provenance_Model:
  type: Process
  documentation: >-
    Where the record of a run is kept. The studyflow document holds the plan and what its runs left: a trail of entries
    on its root, one record per element, and the state. The modeler appends to the trail and voids records. The local
    runtime appends each event of the run to its record, events.jsonl, commits every checkpoint into the run repository,
    whose commits restate the step, and reads the trail entry, the element records and the state off the record when
    the run ends. Drawn for docs/developers.qmd.
  extensionElements:
    - type: studyflow:Study
  name: Where the record is kept
  laneSets:
    Lanes:
      lanes:
        Lane_Modeler:
          name: Modeler
          flowNodeRef:
            - Edit_Start
            - Export
            - Saved
            - Stale_Start
            - Void
            - Voided
          bounds: 40 20 1110 175
        Lane_Local:
          name: Local runtime
          flowNodeRef:
            - Run_Start
            - Execute
            - Commit
            - Read_Off
            - Run_Finished
          bounds: 40 195 1110 345
  flowElements:
    Edit_Start:
      type: StartEvent
      name: The author edits
      bounds: 110 62 36 36
    Export:
      type: Task
      name: "Export: stamp created, modified"
      dataOutputAssociations:
        Out_Export:
          targetRef: Trail
          waypoint: 318,120 318,232
      bounds: 190 40 170 80
    Saved:
      type: EndEvent
      name: Saved
      bounds: 410 62 36 36
    Stale_Start:
      type: StartEvent
      name: A step marked stale
      bounds: 520 62 36 36
    Void:
      type: Task
      name: Void its record (invalidated)
      dataOutputAssociations:
        Out_Void:
          targetRef: Records
          waypoint: 620,120 620,170 590,170 590,232
      bounds: 600 40 170 80
    Voided:
      type: EndEvent
      name: Voided
      bounds: 820 62 36 36
    Trail:
      type: DataObjectReference
      name: "Trail, on the study's root: action, when, who, with, what, run, seed, note"
      bounds: 300 232 36 50
      label: 342 232 170 60
    Records:
      type: DataObjectReference
      name: Records, one per element
      bounds: 560 232 36 50
      label: 602 242 100 30
    Run_Start:
      type: StartEvent
      name: studyflow run
      bounds: 110 382 36 36
    Execute:
      type: Task
      name: "Execute a step: append its events to the record"
      dataOutputAssociations:
        Out_Events:
          targetRef: Run_Record
          waypoint: 283,440 283,460
      bounds: 190 360 170 80
    Run_Record:
      type: DataStoreReference
      name: "events.jsonl, the run's record: one event a line"
      bounds: 258 460 50 50
      label: 312 470 130 45
    Read_Off:
      type: Task
      name: Read the trail, the records and the state off it
      dataOutputAssociations:
        Out_Trail:
          targetRef: Trail
          waypoint: 700,360 700,338 318,338 318,282
        Out_Records:
          targetRef: Records
          waypoint: 780,360 780,322 578,322 578,282
      bounds: 640 360 170 80
    Commit:
      type: Task
      name: Commit each checkpoint
      dataOutputAssociations:
        Out_Commit:
          targetRef: Repository
          waypoint: 500,440 500,460
      bounds: 420 360 160 80
    Run_Finished:
      type: EndEvent
      name: Run finished
      bounds: 870 382 36 36
    Repository:
      type: DataStoreReference
      name: Run repository, runs/STAMP/.git
      bounds: 475 460 50 50
      label: 430 513 140 30
    Flow_Edited:
      sourceRef: Edit_Start
      targetRef: Export
      waypoint: 146,80 190,80
    Flow_Exported:
      sourceRef: Export
      targetRef: Saved
      waypoint: 360,80 410,80
    Flow_Stale:
      sourceRef: Stale_Start
      targetRef: Void
      waypoint: 556,80 600,80
    Flow_Void:
      sourceRef: Void
      targetRef: Voided
      waypoint: 770,80 820,80
    Flow_Run:
      sourceRef: Run_Start
      targetRef: Execute
      waypoint: 146,400 190,400
    Flow_Executed:
      sourceRef: Execute
      targetRef: Commit
      waypoint: 360,400 420,400
    Flow_Committed:
      sourceRef: Commit
      targetRef: Read_Off
      waypoint: 580,400 640,400
    Flow_Read:
      sourceRef: Read_Off
      targetRef: Run_Finished
      waypoint: 810,400 870,400
  artifacts:
    Document:
      type: Group
      categoryValueRef: Document_Value
      bounds: 190 200 520 112
    Commit_Note:
      text: >-
        One commit per checkpoint: its trailers restate the step (Prov-Action, Prov-When, Prov-Run, Prov-Node). The record is
        committed with the run's started and finished commits.
      bounds: 560 460 330 60
    Sidecar_Note:
      text: "One record, events.jsonl: what the study keeps of a run is read off it."
      bounds: 900 45 230 45
Document_Category:
  type: Category
  categoryValue:
    Document_Value:
      value: "The studyflow document: the plan, and what its runs left"
state:
  _meta:
    prov:
      - action: created
        when: "2026-09-29T21:38:03+02:00"
        with: studyflow-modeler/26.9.29
