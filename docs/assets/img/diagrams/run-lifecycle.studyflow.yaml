id: run_lifecycle
schemas:
  studyflow: http://behaverse.org/schemas/studyflow/v1

Run_Lifecycle:
  type: Process
  name: One run
  studyflow:Study: {}
  documentation: >-
    What happens in one run. The study is validated first, and its runtime attribute decides who runs it: the browser
    runner, which can post sessions and events to a data server, or the local runtime, which archives the plan into a
    run repository and commits every checkpoint. A later run skips each step whose record still stands, and an
    invalidated record branches the repository at that step's parent. Drawn for docs/developers.qmd.
  elements:
    Save:
      type: StartEvent
      name: The author saves the study

    Validate:
      type: Task
      name: Validate it

    Runtime:
      type: ExclusiveGateway
      name: Which runtime?

    Browser_Run:
      type: Task
      name: Run the participant's steps in the page
      outputs:
        Out_Events:
          target: $Data_Server

    Data_Server:
      type: DataStoreReference
      name: Data server, sessions and events (opt-in)

    Session_Over:
      type: EndEvent
      name: Session over

    Archive:
      type: Task
      name: Archive the plan into runs/STAMP/

    Walk:
      type: Task
      name: Walk the steps, committing each checkpoint
      outputs:
        Out_Commits:
          target: $Repository

    Repository:
      type: DataStoreReference
      name: Run repository (git)

    Run_Finished:
      type: EndEvent
      name: Run finished

    Run_Again:
      type: StartEvent
      name: Run again after an edit

    Invalidated:
      type: ExclusiveGateway
      name: A record invalidated?

    Branch:
      type: Task
      name: Branch at that step's parent

    Flow_Saved:
      source: $Save
      target: $Validate

    Flow_Valid:
      source: $Validate
      target: $Runtime

    Flow_Browser:
      name: browser
      source: $Runtime
      target: $Browser_Run

    Flow_Local:
      name: local
      source: $Runtime
      target: $Archive

    Flow_Session:
      source: $Browser_Run
      target: $Session_Over

    Flow_Archived:
      source: $Archive
      target: $Walk

    Flow_Walked:
      source: $Walk
      target: $Run_Finished

    Flow_Again:
      source: $Run_Again
      target: $Invalidated

    Flow_Branch:
      name: "yes"
      source: $Invalidated
      target: $Branch

    Flow_Branched:
      source: $Branch
      target: $Walk

    Flow_In_Place:
      name: "no"
      source: $Invalidated
      target: $Walk
  artifacts:
    Skip_Note:
      text: A later run skips each step whose record still stands.

    Skip_Link:
      source: $Skip_Note
      target: $Walk

