id: runner_contract
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Runner_Contract:
  type: Collaboration
  documentation: >-
    A local run, from a partial runner's side. The walk asks every runner for its claims before the first step, and a
    runner that fails to answer stops the run. It then hands each claimed element to its runner with the plan and the
    state file, adopts the state that comes back, and commits the run directory. The runner speaks the walk's contract
    on one side and its tool's own protocol on the other. Drawn for docs/developers.qmd.
  extensionElements:
    - type: studyflow:Study
  name: A run, from the runner's side
  participants:
    Pool_Walk:
      name: Local runtime, the walk
      processRef: Walk
      bounds: 40 20 1320 250
    Pool_Runner:
      name: Partial runner, in its skill
      processRef: Runner
      bounds: 40 310 1320 250
    Pool_Tool:
      name: The tool
      bounds: 40 600 1320 100
  messageFlows:
    Msg_Claims:
      name: "--claims"
      sourceRef: Ask_Claims
      targetRef: Claims_Start
      waypoint: 215,205 215,417
      label: 222 278 60 15
    Msg_Claimed:
      name: claimed ids
      sourceRef: Claims_End
      targetRef: Ask_Claims
      waypoint: 465,417 465,290 320,290 320,205
      label: 472 330 80 15
    Msg_Element:
      name: "--element <id>"
      sourceRef: Hand_Over
      targetRef: Element_Start
      waypoint: 545,205 545,417
      label: 552 330 105 15
    Msg_State:
      name: updated state
      sourceRef: Element_End
      targetRef: Hand_Over
      waypoint: 1218,417 1218,290 620,290 620,205
      label: 1225 330 95 15
    Msg_Protocol:
      name: its own protocol
      sourceRef: Run_Tool
      targetRef: Pool_Tool
      waypoint: 850,475 850,600
      label: 735 530 110 15
    Msg_Report:
      name: what it reports
      sourceRef: Pool_Tool
      targetRef: Run_Tool
      waypoint: 900,600 900,475
      label: 907 530 110 15
