id: runner_contract
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Runner_Contract:
  type: Collaboration
  documentation: >-
    A local run, from a partial runner's side. The walk asks every runner for its claims before the first step, and a
    runner that fails to answer stops the run. It then hands each claimed element to its runner with the plan and the
    state file, adopts the state that comes back, and commits the run directory. The runner speaks the walk's contract
    on one side and its tool's own protocol on the other. Drawn for docs/developers.qmd.
  extensionElements:
    - type: studyflow:Study
  name: A run, from the runner's side
  participants:
    Pool_Walk:
      name: Local runtime, the walk
      processRef: Walk
      bounds: 40 20 1040 230
    Pool_Runner:
      name: Partial runner, in its skill
      processRef: Runner
      bounds: 40 290 1040 200
    Pool_Tool:
      name: The tool
      bounds: 40 540 1040 80
  messageFlows:
    Msg_Claims:
      name: "--claims"
      sourceRef: Ask_Claims
      targetRef: Claims_Start
      waypoint: 190,190 190,392
      label: 197 262 55 15
    Msg_Claimed:
      name: claimed ids
      sourceRef: Claims_End
      targetRef: Ask_Claims
      waypoint: 416,392 416,270 280,270 280,190
      label: 423 300 75 15
    Msg_Element:
      name: "--element <id>"
      sourceRef: Hand_Over
      targetRef: Element_Start
      waypoint: 490,190 490,392
      label: 497 330 100 15
    Msg_State:
      name: updated state
      sourceRef: Element_End
      targetRef: Hand_Over
      waypoint: 1008,392 1008,270 545,270 545,190
      label: 915 300 88 15
    Msg_Protocol:
      name: its own protocol
      sourceRef: Run_Tool
      targetRef: Pool_Tool
      waypoint: 730,450 730,540
      label: 620 505 105 15
    Msg_Report:
      name: what it reports
      sourceRef: Pool_Tool
      targetRef: Run_Tool
      waypoint: 770,540 770,450
      label: 777 505 100 15
