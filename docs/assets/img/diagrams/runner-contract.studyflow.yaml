id: runner_contract
schemas:
  studyflow: http://behaverse.org/schemas/studyflow/v1

Runner_Contract:
  type: Collaboration
  name: A run, from the runner's side
  studyflow:Study: {}
  documentation: >-
    A local run, from a partial runner's side. The walk starts every runner and asks for its claims before the first
    step, and a runner that refuses stops the run. It then hands each claimed element to its runner with the run's
    values, adopts what the runner hands back, and commits the run directory. The runner speaks the walk's contract on
    one side and its tool's own protocol on the other. Drawn for docs/developers.qmd.
  pools:
    Pool_Walk:
      name: Local runtime, the walk
      process: $Walk

    Pool_Runner:
      name: Partial runner, in its skill
      process: $Runner

    Pool_Tool:
      name: The tool
  messageFlows:
    Msg_Claims:
      name: initialize
      source: $Ask_Claims
      target: $Claims_Start

    Msg_Claimed:
      name: claimed ids
      source: $Claims_End
      target: $Ask_Claims

    Msg_Element:
      name: execute
      source: $Hand_Over
      target: $Element_Start

    Msg_State:
      name: what it binds
      source: $Element_End
      target: $Hand_Over

    Msg_Protocol:
      name: its own protocol
      source: $Run_Tool
      target: $Pool_Tool

    Msg_Report:
      name: what it reports
      source: $Pool_Tool
      target: $Run_Tool

Walk:
  type: Process
  name: Local runtime, the walk
  elements:
    Walk_Start:
      type: StartEvent
      name: studyflow run

    Ask_Claims:
      type: Task
      name: Ask every runner for its claims

    Claims_Gate:
      type: ExclusiveGateway
      name: Every runner answered?

    Stop:
      type: EndEvent
      name: The run stops before any step
      error:
        id: Stop_Error

    Hand_Over:
      type: Task
      name: Hand over the next claimed element

    Adopt:
      type: Task
      name: Adopt what it binds, commit the run directory
      outputs:
        Out_Commit:
          target: $Run_Dir

    Run_Dir:
      type: DataStoreReference
      name: Run directory (git)

    More_Gate:
      type: ExclusiveGateway
      name: Another element?

    Walk_End:
      type: EndEvent
      name: Run finished, .cache/ removed

    Flow_Start:
      source: $Walk_Start
      target: $Ask_Claims

    Flow_Claims:
      source: $Ask_Claims
      target: $Claims_Gate

    Flow_Refused:
      name: "no"
      source: $Claims_Gate
      target: $Stop

    Flow_Answered:
      name: "yes"
      source: $Claims_Gate
      target: $Hand_Over

    Flow_Handed:
      source: $Hand_Over
      target: $Adopt

    Flow_Adopted:
      source: $Adopt
      target: $More_Gate

    Flow_Again:
      name: "yes"
      source: $More_Gate
      target: $Hand_Over

    Flow_Done:
      name: "no"
      source: $More_Gate
      target: $Walk_End

Runner:
  type: Process
  name: Partial runner, in its skill
  elements:
    Claims_Start:
      type: StartEvent
      name: Asked for claims
      message:
        id: Claims_Start_Message

    Print_Ids:
      type: Task
      name: Answer with the ids it takes

    Claims_End:
      type: EndEvent
      name: Answered
      message:
        id: Claims_End_Message

    Element_Start:
      type: StartEvent
      name: Handed an element
      message:
        id: Element_Start_Message

    Read_Plan:
      type: Task
      name: Read the plan and the values

    Run_Tool:
      type: Task
      name: Run the element with the tool

    Write_Back:
      type: Task
      name: Hand back result, record, files

    Element_End:
      type: EndEvent
      name: Done
      message:
        id: Element_End_Message

    Flow_Asked:
      source: $Claims_Start
      target: $Print_Ids

    Flow_Printed:
      source: $Print_Ids
      target: $Claims_End

    Flow_Handed_In:
      source: $Element_Start
      target: $Read_Plan

    Flow_Read:
      source: $Read_Plan
      target: $Run_Tool

    Flow_Ran:
      source: $Run_Tool
      target: $Write_Back

    Flow_Written:
      source: $Write_Back
      target: $Element_End

