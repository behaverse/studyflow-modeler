name: Release

# Tag a release and this publishes the standalone `studyflow` binaries and
# refreshes the Homebrew formula. Bun cross-compiles all.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v26.9.5)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build binaries and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          cache: 'npm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci

      - name: Check the tag matches the CLI version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match packages/cli/package.json version $version." >&2
            exit 1
          fi

      - run: npm run cli:package
        env:
          STUDYFLOW_REPO: ${{ github.repository }}

      - name: Smoke-test the host binary
        run: |
          set -euo pipefail
          tar -xzf packages/cli/dist/release/*-darwin-arm64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/studyflow" --version
          "$RUNNER_TEMP/studyflow" info "assets/schemas/examples/AI & ML/sklearn_pipeline.studyflow.png"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" \
            packages/cli/dist/release/*.tar.gz packages/cli/dist/release/*.sha256 --clobber

      # `brew tap` reads the default branch, so the formula naming the assets just
      # uploaded has to land there — not on the tag.
      - name: Push the refreshed formula to the default branch
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          cp Formula/studyflow.rb "$RUNNER_TEMP/studyflow.rb"
          rm -f Formula/studyflow.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p Formula
          cp "$RUNNER_TEMP/studyflow.rb" Formula/studyflow.rb
          git add Formula/studyflow.rb
          if git diff --cached --quiet -- Formula/studyflow.rb; then
            echo "Formula/studyflow.rb on $BRANCH is already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "studyflow $TAG formula [skip ci]"
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            echo '```bash'
            echo "brew tap ${{ github.repository_owner }}/studyflow https://github.com/${{ github.repository }}"
            echo 'brew install studyflow'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
