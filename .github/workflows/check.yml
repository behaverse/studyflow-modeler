name: Check

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          cache: 'npm'
      - uses: astral-sh/setup-uv@v10  # the local runtime's unit tests drive uv
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
