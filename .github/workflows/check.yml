name: Check

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          cache: 'npm'
      - uses: astral-sh/setup-uv@v10.0.1
      # `studyflow validate` checks a study's BPMN XML against the BPMN 2.0 schema with xmllint, which the runner
      # lacks; without it, validate warns, and the specs that expect a clean validation fail.
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
