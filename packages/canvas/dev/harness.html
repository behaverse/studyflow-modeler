<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>studyflow-canvas — P1 renderer harness</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid #8883;
        flex: 0 0 auto;
      }
      header strong { font-weight: 600; }
      header .grow { flex: 1 1 auto; }
      select { font: inherit; padding: 4px 6px; }
      #status { opacity: 0.7; font-variant-numeric: tabular-nums; }
      #status.error { color: #c0392b; opacity: 1; }
      #stage {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      /* The canvas mounts its own <svg width=100% height=100%> into this host. */
      #stage > div { width: 100%; height: 100%; }
      .sf-canvas { background: #fff; }
      @media (prefers-color-scheme: dark) { .sf-canvas { background: #14161a; } }
    </style>
  </head>
  <body>
    <header>
      <strong>studyflow-canvas</strong>
      <span>P1 read-only renderer</span>
      <label>example <select id="picker"></select></label>
      <span class="grow"></span>
      <span id="status">loading schemas…</span>
    </header>
    <div id="stage"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
