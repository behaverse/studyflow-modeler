id: state_probe
schemas:
  studyflow: http://behaverse.org/schemas/studyflow/v1

Item_Arm:
  type: ItemDefinition
  structure: string

Item_Count:
  type: ItemDefinition
  structure: integer

Probe:
  type: Process
  studyflow:Study: {}
  properties:
    Arm:
      name: arm
      item: $Item_Arm
      dataState:
        name: allocated
  elements:
    Start:
      type: StartEvent

    Battery:
      type: SubProcess
      name: Cognitive battery
      properties:
        Failed_Trials:
          name: failed_trials
          item: $Item_Count
          value: 0
      elements:
        Trial_Start:
          type: StartEvent

        Run_Trial:
          type: ServiceTask
          name: Administer one trial
          implementation: python://battery.run_trial@1.0
          inputs:
            Wire_Arm_In:
              source: $Arm
          outputs:
            Wire_Failed_Out:
              target: $Failed_Trials

        Trial_End:
          type: EndEvent

        Flow_Trial:
          source: $Trial_Start
          target: $Run_Trial

        Flow_Trial_End:
          source: $Run_Trial
          target: $Trial_End

    End:
      type: EndEvent

    Flow_Start_Battery:
      source: $Start
      target: $Battery

    Flow_Battery_End:
      source: $Battery
      target: $End
