id: state_probe
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Item_Arm:
  type: ItemDefinition
  structureRef: string
Item_Count:
  type: ItemDefinition
  structureRef: integer
Probe:
  type: Process
  extensionElements:
    - type: studyflow:Study
  properties:
    Arm:
      itemSubjectRef: Item_Arm
      dataState:
        name: allocated
      name: arm
  flowElements:
    Start:
      type: StartEvent
    Battery:
      type: SubProcess
      name: Cognitive battery
      properties:
        Failed_Trials:
          itemSubjectRef: Item_Count
          name: failed_trials
      flowElements:
        Trial_Start:
          type: StartEvent
        Run_Trial:
          type: ServiceTask
          name: Administer one trial
          dataInputAssociations:
            Wire_Arm_In:
              sourceRef:
                - Arm
          dataOutputAssociations:
            Wire_Failed_Out:
              targetRef: Failed_Trials
          implementation: python://battery.run_trial@1.0
        Trial_End:
          type: EndEvent
        Flow_Trial: Trial_Start -> Run_Trial
        Flow_Trial_End: Run_Trial -> Trial_End
    End:
      type: EndEvent
    Flow_Start_Battery: Start -> Battery
    Flow_Battery_End: Battery -> End
