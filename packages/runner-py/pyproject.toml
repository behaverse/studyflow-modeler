[project]
name = "studyflow-runner"
version = "26.0615"
description = "Python runner for studyflow files — executes the analysis half of the notation (steps bound to software)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
studyflow-run = "studyflow_run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["studyflow_run.py"]

# `studyflow_run.py` is also directly runnable with zero setup — it carries a
# PEP 723 header and a `uv run --script` shebang:
#
#     ./studyflow_run.py ../../assets/examples/sklearn_pipeline.studyflow.png
