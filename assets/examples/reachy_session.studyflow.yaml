id: reachy_session
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn

Reachy_Session:
  type: bpmn:Process
  name: Robot-proctored session
  documentation: >-
    A Reachy Mini proctors an N-Back session: wake word, seat check, spoken
    instructions, encouragement, and a short debrief conversation. The
    participant's verbal feedback lands in the interaction recording.
  tags:
    - Experimental Design
  extensionElements:
    - type: studyflow:Study
  flowElements:

    Enrolled:
      type: bpmn:StartEvent
      name: Enrolled and consented
      consentFormUri: https://example.org/protocols/reachy-session/consent.md

    Wake:
      type: bpmn:IntermediateCatchEvent
      name: Wake word
      extensionElements:
        - type: reachy:SenseEvent
          trigger: wake_word
          wakeWord: Hey Reachy

    Seated:
      type: bpmn:ExclusiveGateway
      name: Anyone there?
      default: Flow_Seated_Greet
      extensionElements:
        - type: reachy:PerceptionGateway
          channel: face_count

    Ask_To_Sit:
      type: bpmn:ServiceTask
      name: Ask them to sit down
      extensionElements:
        - type: reachy:Say
          text: Please take a seat in front of me and say my wake word again.

    Greet:
      type: bpmn:ServiceTask
      name: Greet & instruct
      extensionElements:
        - type: reachy:Say
          text: >-
            Hello! I'm Reachy. You'll now see a short memory task on the
            screen; press the key whenever the current letter matches the one
            before it.

    Watch:
      type: bpmn:ServiceTask
      name: Face the participant
      extensionElements:
        - type: reachy:LookAt
          target: face

    NBack:
      type: bpmn:Task
      name: N-Back
      extensionElements:
        - type: cognitive:BehaverseTask
          behaverseScene: NB
          configurations:
            Timelines:
              XCIT_NB_01:

    Celebrate:
      type: bpmn:ServiceTask
      name: Celebrate completion
      extensionElements:
        - type: reachy:Gesture
          move: happy

    Debrief:
      type: bpmn:ServiceTask
      name: Spoken debrief
      extensionElements:
        - type: reachy:Converse
          model: claude-haiku-4-5
          maxTurns: 6
          stopPhrase: goodbye
          persona: >-
            You are Reachy, a small desktop robot who just proctored a memory
            task. Ask how it went, answer questions about the study, and keep
            replies to one or two spoken sentences.

    Feedback:
      type: bpmn:ReceiveTask
      name: Verbal feedback
      extensionElements:
        - type: reachy:Listen
          timeoutSeconds: 20
      dataOutputAssociations:
        - type: bpmn:DataOutputAssociation
          id: Feedback_To_Recording
          targetRef: Recording

    Recording:
      type: bpmn:DataStoreReference
      name: Interaction recording
      extensionElements:
        - type: reachy:InteractionRecording
          streams:
            - audio
            - transcript

    Done:
      type: bpmn:EndEvent
      name: Done

    Flow_Enrolled_Wake:
      type: bpmn:SequenceFlow
      sourceRef: Enrolled
      targetRef: Wake
    Flow_Wake_Seated:
      type: bpmn:SequenceFlow
      sourceRef: Wake
      targetRef: Seated
    Flow_Seated_Ask:
      type: bpmn:SequenceFlow
      name: no one seated
      conditionExpression: face_count == 0
      sourceRef: Seated
      targetRef: Ask_To_Sit
    Flow_Ask_Wake:
      type: bpmn:SequenceFlow
      sourceRef: Ask_To_Sit
      targetRef: Wake
    Flow_Seated_Greet:
      type: bpmn:SequenceFlow
      sourceRef: Seated
      targetRef: Greet
    Flow_Greet_Watch:
      type: bpmn:SequenceFlow
      sourceRef: Greet
      targetRef: Watch
    Flow_Watch_NBack:
      type: bpmn:SequenceFlow
      sourceRef: Watch
      targetRef: NBack
    Flow_NBack_Celebrate:
      type: bpmn:SequenceFlow
      sourceRef: NBack
      targetRef: Celebrate
    Flow_Celebrate_Debrief:
      type: bpmn:SequenceFlow
      sourceRef: Celebrate
      targetRef: Debrief
    Flow_Debrief_Feedback:
      type: bpmn:SequenceFlow
      sourceRef: Debrief
      targetRef: Feedback
    Flow_Feedback_Done:
      type: bpmn:SequenceFlow
      sourceRef: Feedback
      targetRef: Done
