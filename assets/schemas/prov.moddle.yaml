# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Prov
prefix: prov
description: >-
  The provenance trail - who acted on this studyflow, with what tool, and when.
uri: https://w3id.org/studyflow/prov
icon: iconify tabler--history
core: true   # always loaded
order: 15  # registry position (load precedence + settings order)
xml:
  tagAlias: lowerCase
version: 26.0731


enumerations: []


types:

  - name: Activity
    description: >-
      One entry of the trail - who did something to this studyflow, and when;
      entries run oldest first.
    superClass:
      - Element
    properties:
      - name: action
        description: >-
          What happened, in one word - `created`, `modified`, `imported`,
          `executed`, `invalidated`, or `reused`.
        isAttr: true
        type: String
      - name: when
        description: >-
          When it happened, as an ISO 8601 timestamp
          (`2026-08-01T09:12:04+02:00`).
        isAttr: true
        type: String
      - name: who
        description: Who acted - a name, an email, or an ORCID.
        isAttr: true
        type: String
        meta:
          optional: true
      - name: with
        description: >-
          The tool that acted, as `name/version` (`studyflow-modeler/26.0731`).
        isAttr: true
        type: String
        meta:
          optional: true
      - name: what
        description: >-
          What the action touched - element ids, space-separated; for
          `invalidated` and `reused`, the `when` of the entry it refers to.
        isAttr: true
        type: String
        meta:
          optional: true
      - name: run
        description: >-
          For an `executed` action, the id of the run - the name of the
          repository holding what that run produced.
        isAttr: true
        type: String
        meta:
          optional: true
      - name: seed
        description: For an `executed` action, the root seed the run used.
        isAttr: true
        type: Integer
        meta:
          optional: true
      - name: note
        description: One line of free text about the event.
        isAttr: true
        type: String
        meta:
          optional: true
