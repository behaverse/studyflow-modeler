# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: EEG
prefix: eeg
description: >-
  EEG and biosignal studies: acquisition sessions, the recordings they produce,
  and preprocessing presets.
uri: https://w3id.org/studyflow/eeg
icon: iconify tabler--hexagon-letter-e
order: 70  # registry position (load precedence + settings order)
xml:
  tagAlias: lowerCase
version: 26.0812

enumerations:
  - name: DeviceEnum
    description: Acquisition board used to record a session.
    literalValues:
      - name: Cyton (8-channel)
        value: cyton
      - name: Cyton + Daisy (16-channel)
        value: cyton_daisy
      - name: Ganglion (4-channel)
        value: ganglion
      - name: Galea (VR headset)
        value: galea
        description: A VR headset with built-in biosignal sensors and eye tracking.

  - name: ModalityEnum
    description: Biosignal/sensor modality recorded in a session.
    literalValues:
      - name: EEG (electroencephalography)
        value: eeg
      - name: EMG (electromyography)
        value: emg
      - name: ECG (electrocardiography)
        value: ecg
      - name: EOG (electrooculography)
        value: eog
      - name: EDA (electrodermal activity)
        value: eda
      - name: PPG (photoplethysmography / heart rate)
        value: ppg
      - name: Eye tracking (camera-based gaze and pupil)
        value: eye_tracking
      - name: Head IMU
        value: head_imu
      - name: Audio
        value: audio

types:
  - name: Session
    description: >-
      One acquisition session, carrying the device settings shared by every
      phase inside it.
    superClass:
      - bpmn:Participant
    meta:
      icon: iconify mdi--chip
    properties:
      - name: device
        description: Acquisition board used in this session; a custom identifier is also accepted.
        isAttr: true
        type: DeviceEnum
        default: cyton
        meta:
          order: 0
          editable: true
      - name: modalities
        description: Biosignal/sensor modalities active in this session.
        isAttr: false
        isMany: true
        type: ModalityEnum
        meta:
          order: 1

  - name: Recording
    description: The biosignal data a session produces.
    superClass:
      - studyflow:Dataset
    meta:
      roles:
        - acquisition
        - signal
      icon: iconify mdi--database
    properties:
      - name: modalities
        description: Biosignal/sensor modalities included in this recording.
        isAttr: false
        isMany: true
        type: ModalityEnum
      - name: channels
        description: Number of EEG channels recorded.
        isAttr: true
        type: Integer
        default: 8
      - name: samplingRateHz
        description: EEG sampling rate, in Hz.
        isAttr: true
        type: Real
        default: 250

templates:
  - description: An EEG session - fit the cap, record a baseline, run a task, export.
    object:
      type: Session
      bpmn:name: EEG session
      bpmn:documentation: An EEG session covering headset fitting through data export.
      icon: iconify mdi--chip
      keywords:
        - eeg
        - openbci
        - session
        - biosignal
        - acquisition
      device: cyton
      modalities:
        - eeg
      flowElements:
        - id: eeg_start
          type: bpmn:StartEvent
          bpmn:name: Start
          x: 100
          y: 200
        - id: eeg_mount
          type: bpmn:ManualTask
          bpmn:name: Mount cap & check impedance
          icon: iconify mdi--head-plus-outline
          bpmn:documentation: |
            Fit the cap, place the electrodes, and check that every one of them
            makes good contact before recording starts.
          x: 200
          y: 178
        - id: eeg_baseline
          type: cognitive:Rest
          bpmn:name: Resting baseline
          icon: iconify mdi--brain
          configurations: |
            condition: eyes_closed   # eyes_open | eyes_closed | alternating
            durationSeconds: 120
          x: 360
          y: 178
        - id: eeg_task
          type: cognitive:CognitiveTask
          bpmn:name: Cognitive task
          icon: iconify bi--puzzle
          instrument: psychopy
          configurations: |
            triggerChannel: markers  # stimulus marker stream sent with biosignals
          x: 520
          y: 178
        - id: eeg_export
          type: functional:Transform
          bpmn:name: Export recording
          icon: iconify mdi--database-arrow-down-outline
          bpmn:documentation: Persist the recording to a structured dataset (BIDS, BDM, or custom).
          operationType: write
          implementation: python://datatrove.pipeline.writers.ParquetWriter
          additionalArguments: "output_folder: bids/"
          x: 680
          y: 178
        - id: eeg_end
          type: bpmn:EndEvent
          bpmn:name: End
          x: 840
          y: 200
        - type: bpmn:SequenceFlow
          sourceRef: eeg_start
          targetRef: eeg_mount
        - type: bpmn:SequenceFlow
          sourceRef: eeg_mount
          targetRef: eeg_baseline
        - type: bpmn:SequenceFlow
          sourceRef: eeg_baseline
          targetRef: eeg_task
        - type: bpmn:SequenceFlow
          sourceRef: eeg_task
          targetRef: eeg_export
        - type: bpmn:SequenceFlow
          sourceRef: eeg_export
          targetRef: eeg_end

  - description: Filter EEG data and remove artifacts in one step.
    object:
      bpmn:name: EEGPrep
      type: functional:Map
      bpmn:documentation: |
        Filters, cleans, and normalizes EEG data; the input has to be in BIDS
        format.
      icon: iconify fluent--pulse-20-filled
      keywords:
        - eeg
        - eegprep
        - preprocess
        - cleanartifacts
        - neuroimaging
      implementation: docker://sccn/eegprep
      additionalArguments: |
        flatline_criterion: 5    # seconds of flatline tolerated per channel
        highpass_hz: 1
        lowpass_hz: 100
        asr_criterion: 20        # ASR burst-removal cutoff
        ica: true                # run ICA + ICLabel artifact classification

  - description: Preprocess fMRI data for a single subject.
    object:
      bpmn:name: fMRIPrep
      type: functional:Map
      bpmn:documentation: "Filters, cleans, and normalizes fMRI data; the input has to be in BIDS format."
      icon: iconify streamline--brain
      keywords:
        - fmri
        - fmriprep
        - preprocess
        - bids
        - neuroimaging
      implementation: docker://nipreps/fmriprep@23.2.0
      additionalArguments: |
        output_spaces: MNI152NLin2009cAsym   # normalized-output space(s)
        skull_strip_t1w: force               # auto | force | skip
        use_aroma: false                     # ICA-AROMA denoising
        use_syn_sdc: false                   # fieldmap-less SDC (SyN)
