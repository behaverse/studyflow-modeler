# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Cognitive
prefix: cognitive
description: Cognitive and behavioral research - tasks, questionnaires, instructions, rest periods, and participant-assignment gateways.
uri: http://behaverse.org/schemas/studyflow/cognitive
icon: iconify tabler--hexagon-letter-c
core: true   # backs the default elements; always loaded, cannot be disabled
order: 40  # registry position (load precedence + settings order)
xml:
  tagAlias: lowerCase
version: 26.0811

# Tabs this schema adds to the ones `studyflow` declares (see the note there).
categories:
  - name: Behaverse
    order: 15
    description: How a `BehaverseTask` is delivered, and who answers it.

enumerations:
  - name: AssignmentAlgorithmEnum
    description: The scheduling algorithm used for the assignment.
    literalValues:
      - name: Probabilistic
        value: probabilistic
      - name: Round Robin
        value: round-robin
  - name: ProbabilityDistributionEnum
    description: The random statistical distribution used for the assignment.
    literalValues:
      - name: Uniform
        value: uniform
      - name: Normal
        value: normal
      - name: Exponential
        value: exponential
      - name: Poisson
        value: poisson
  - name: InstrumentEnum
    description: Software that delivers a cognitive task.
    literalValues:
      - name: PsychoPy
        value: psychopy
      - name: jsPsych
        value: jspsych
      - name: lab.js
        value: labjs
      - name: OpenSesame
        value: opensesame
      - name: Behaverse
        value: behaverse
  - name: QuestionnaireInstrumentEnum
    description: Standardized questionnaires in common use.
    literalValues:
      - name: PHQ-9
        value: phq-9
      - name: GAD-7
        value: gad-7
      - name: BDI-II
        value: bdi-ii
      - name: STAI
        value: stai
      - name: PSS
        value: pss
      - name: WHO-5
        value: who-5
      - name: Big Five Inventory
        value: bfi
      - name: DASS-21
        value: dass-21
      - name: PANAS
        value: panas
  - name: ActorTypeEnum
    description: What a participant pool stands for.
    literalValues:
      - name: Human
        value: human
      - name: Large Language Model
        value: llm
      - name: Software Agent
        value: agent
        description: Non-LLM software agent (e.g., a reinforcement-learning policy or rule-based bot).
      - name: Instrument
        value: instrument
        description: Apparatus or recording device that participates in the study (e.g., an EEG amplifier triggering events).
  - name: BehaverseSceneEnum
    description: Behaverse assessment scene delivered by a `BehaverseTask`.
    literalValues:
      - name: Belval Card Sorting (BCS)
        value: BCS
      - name: Belval Matrices (BM)
        value: BM
      - name: Button Spatial Attention Cueing (BSAC)
        value: BSAC
      - name: Digit Span (DS)
        value: DS
      - name: Monkey Ladder (ML)
        value: ML
      - name: Multiple Object Tracking (MOT)
        value: MOT
      - name: N-Back (NB)
        value: NB
      - name: Ordered Click (OC)
        value: OC
      - name: Odd One Out (OOO)
        value: OOO
      - name: Polygon Comparison (PC)
        value: PC
      - name: Regular Expression (RE)
        value: RE
      - name: Reflexive Spatial Attention Cueing (RSAC)
        value: RSAC
      - name: Sustained Attention to Response Task (SART)
        value: SART
      - name: Symbolic Matrix Comparison (SMC)
        value: SMC
      - name: Self-Ordered Search (SOS)
        value: SOS
      - name: Stimulus-Response Mapping (SRM)
        value: SRM
      - name: Serial Reaction Time (SRT)
        value: SRT
      - name: Spatial Span (SS)
        value: SS
      - name: Target Hit (TH)
        value: TH
      - name: Test of Variable Attention (TOVA)
        value: TOVA
      - name: Useful Field of View (UFOV)
        value: UFOV
      - name: Which One (WO)
        value: WO
  - name: AgentTypeEnum
    description: Whether a human or a bot plays the task.
    literalValues:
      - name: Human
        value: human
      - name: Bot
        value: bot
types:
  - name: Configurations
    description: Instrument-specific configuration, carried as a YAML body.
    properties:
      - name: value
        isBody: true
        type: studyflow:YAMLString
  - name: BotConfigurations
    # Its own subclass so it serializes as `<cognitive:botConfigurations>`, not a second `configurations`.
    description: Bot configuration for a `BehaverseTask`, carried as a YAML body.
    superClass:
      - Configurations
  - name: CognitiveTask
    description: A cognitive test taken by a participant (e.g., a working-memory or attention task).
    superClass:
      - bpmn:Task
    meta:
      icon: iconify bi--puzzle
    properties:
      - name: instrument
        description: Software that delivers the task and reads its `configurations`.
        isAttr: true
        type: InstrumentEnum
        meta:
          editable: true
      - name: implementation
        description: >-
          Where the delivering software lives, as
          `<scheme>://<ref>[@<version-or-digest>]` (e.g. a jsPsych plugin URL).
        isAttr: true
        type: String
        meta:
          categories:
            - Execution
      - name: configurations
        description: >-
          Settings the instrument reads, in YAML (e.g., number of trials,
          stimulus duration, block structure).
        type: Configurations
        meta:
          categories:
            - Execution
  - name: Rest
    description: >-
      A period of inactivity: a break between activities, or a resting-state
      recording (resting EEG/fMRI).
    superClass:
      - CognitiveTask
    meta:
      icon: iconify solar--armchair-2-linear
    properties:
      - name: configurations
        description: Rest configuration in YAML format (e.g., duration, eyes-open/closed).
        type: Configurations
        redefines: CognitiveTask#configurations
        meta:
          categories:
            - Execution
  - name: Questionnaire
    description: A self-report questionnaire or form filled in by a participant (e.g., PHQ-9, GAD-7).
    superClass:
      - bpmn:Task
    meta:
      icon: iconify fluent--clipboard-text-edit-32-regular
    properties:
      - name: instrument
        description: Which questionnaire is shown - a standard one (PHQ-9, GAD-7) or a name of your own.
        isAttr: true
        type: QuestionnaireInstrumentEnum
        meta:
          editable: true
  - name: Instruction
    description: >-
      Something for the participant to read (e.g., task instructions, a briefing
      or debrief screen).
    superClass:
      - bpmn:Task
    meta:
      icon: iconify material-symbols--info-outline-rounded
    properties:
      - name: content
        description: The text the participant reads.
        isAttr: true
        type: studyflow:MarkdownString
  - name: BehaverseTask
    description: A task from the Behaverse assessment battery (e.g., N-Back, UFOV).
    superClass:
      - CognitiveTask
    meta:
      icon: iconify bi--hexagon
    properties:
      - name: instrument
        default: behaverse
        type: String
        isAttr: true
        redefines: CognitiveTask#instrument
        meta:
          order: 0
          pinned: true
      - name: implementation
        description: Not used here - `behaverseScene` already names what runs.
        isAttr: true
        type: String
        redefines: CognitiveTask#implementation
        meta:
          pinned: true
      - name: behaverseScene
        description: Which Behaverse assessment this task runs (e.g., `NB`, `UFOV`, `DS`).
        isAttr: true
        type: BehaverseSceneEnum
        meta:
          order: 1
          categories:
            - Execution
      - name: configurations
        description: >-
          The task's `GameConfig` as YAML - name a timeline that ships with the
          build, or define one inline.
        type: Configurations
        redefines: CognitiveTask#configurations
        meta:
          order: 2
          categories:
            - Execution
      - name: agentType
        description: Whether a human participant or an automated bot plays the task.
        isAttr: true
        type: AgentTypeEnum
        default: human
        meta:
          order: 4
          categories:
            - Execution
      - name: botConfigurations
        description: >-
          How the bot plays, as YAML (e.g. `Speed: 100`,
          `ResponseSource: llm`).
        type: BotConfigurations
        meta:
          order: 5
          categories:
            - Execution
          condition:
            body:
              agentType: bot
  - name: RandomGateway
    description: Sends each participant down one of the outgoing branches at random.
    superClass:
      - bpmn:ExclusiveGateway
    meta:
      icon: iconify streamline-flex--dice-5
      # The runner reads this and picks a branch at random instead of evaluating conditions.
      branching: random
    properties:
      - name: algorithm
        description: Algorithm used for the assignment.
        isAttr: true
        type: AssignmentAlgorithmEnum
        default: probabilistic
      - name: probabilityFunction
        description: Distribution the random draw comes from.
        isAttr: true
        type: ProbabilityDistributionEnum
        default: uniform
        meta:
          editable: true
          condition:
            body:
              algorithm: probabilistic
      - name: stratifyBy
        description: >-
          Variable to randomize within, so the branches stay balanced on it
          (e.g. `age_band`).
        isAttr: true
        type: String
        meta:
          optional: true
      - name: strata
        description: >-
          The strata to allocate within, one per entry (e.g. `age_band: 18-29`).
        isAttr: false
        type: studyflow:MarkdownString
        isMany: true
        meta:
          condition:
            body:
              stratifyBy: $set
  - name: EligibilityGateway
    description: >-
      Lets eligible participants carry on and sends everyone else down a
      screen-out branch.
    superClass:
      - bpmn:ExclusiveGateway
    meta:
      icon: iconify mdi--filter-check-outline
    properties:
      - name: inclusionCriteria
        description: What a participant must meet to carry on, one per entry (e.g. `Age between 18 and 65`).
        isAttr: false
        type: studyflow:MarkdownString
        isMany: true
      - name: exclusionCriteria
        description: What rules a participant out, one per entry (e.g. `History of neurological disorder`).
        isAttr: false
        type: studyflow:MarkdownString
        isMany: true
  - name: Actor
    description: A pool of participants - who or what takes part in the study.
    superClass:
      - bpmn:Participant
    meta:
      icon: iconify mdi--account-group
    properties:
      - name: actorType
        description: Kind of actor this pool represents.
        isAttr: true
        type: ActorTypeEnum
        default: human
      - name: spec
        description: >-
          Which model, agent, or device this pool stands for (e.g.
          `claude-opus-4-8`, a checkpoint hash, an LSL stream name).
        isAttr: true
        type: String
        meta:
          condition:
            body:
              actorType:
                - llm
                - agent
                - instrument
      - name: promptTemplate
        description: >-
          Prompt sent to the LLM each turn, with placeholders like
          `{{stimulus}}` filled in as it runs.
        isAttr: true
        type: studyflow:MarkdownString
        meta:
          condition:
            body:
              actorType: llm

templates:
  # Stratified allocation is a RandomGateway with `stratifyBy` set, not its own type.
  - description: Stratified random assignment - allocate independently within each stratum to balance covariates across arms.
    object:
      bpmn:name: Stratified allocation
      type: RandomGateway
      bpmn:documentation: |
        Partitions the cohort by `stratifyBy` and randomizes within each
        stratum, so allocation stays balanced across the covariate. List the
        strata (one entry per stratum, e.g. `age_band: 18-29`) in `strata`.
      icon: iconify mdi--layers-outline
      keywords:
        - stratified
        - allocation
        - randomization
        - covariate
        - balance
      stratifyBy: age_band
      strata:
        - "age_band: 18-29"
        - "age_band: 30-44"
        - "age_band: 45-65"
  # A video game is a CognitiveTask whose instrument is a game engine, not its own type.
  - description: An interactive video game used as an experimental paradigm or measurement instrument.
    object:
      bpmn:name: Video Game
      type: CognitiveTask
      bpmn:documentation: An interactive video game used as an experimental paradigm or measurement instrument. Set the game engine in `instrument` and its level set / difficulty / scoring in `configurations`.
      icon: iconify bi--controller
      keywords:
        - game
        - videogame
        - paradigm
        - instrument
      configurations: |
        levels:
        difficulty:
        scoring:
  # Behaverse assessment-task presets.
  - description: N-Back task running a timeline that ships with the Behaverse build, named under `Timelines`.
    object:
      type: BehaverseTask
      bpmn:name: N-Back (XCIT_NB_01)
      behaverseScene: NB
      configurations: |
        Timelines:
          XCIT_NB_01:
  - description: N-Back task with an inline timeline - author only the blocks that differ from the built-in defaults.
    object:
      type: BehaverseTask
      bpmn:name: N-Back (inline)
      behaverseScene: NB
      configurations: |
        Blocks:
          LabLink_InlineBlock:
            Name: LabLink_InlineBlock
            Inherits: Default
            Parameters:
              NValue: 1
              Feature: Letters
              Streams:
                - Feature:
                    Reference: Feature
                  StimulusValue:
                    Generate: OncePerBlock
                    Sequence:
                      Type: Ordered
                      Values: [3, 1, 2, 1, 3, 2, 3, 2]
              StreamSize: 8
              FeatureValuesCount: 3
              MaxResponseTime: 3
              StimulusDisplayDuration: 0.5
              InterStimulusInterval: 2.2
        Timelines:
          LabLink_Inline:
            Name: LabLink_Inline
            blocks:
              - name: LabLink_InlineBlock
