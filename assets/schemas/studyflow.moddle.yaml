# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Core
prefix: studyflow
description: >-
  The building blocks every studyflow uses - the study itself, its events,
  flows, activities, data elements, and what an engine needs to run them.
uri: http://behaverse.org/schemas/studyflow/v1
icon: https://raw.githubusercontent.com/behaverse/schemas/main/assets/img/schema_S.png
core: true   # always loaded, cannot be disabled
order: 10  # registry position (load precedence + settings order)
xml:
  tagAlias: lowerCase
version: 26.0811

# Inspector tabs, in the order they appear; an attribute joins one by naming it in `meta.categories`.
# A `synthetic` tab is drawn by its own section rather than from attributes.
categories:
  - name: General
    order: 10
    description: What this element is — identity, and the fields particular to its type.
  - name: Documentation
    order: 20
    description: Prose about the element — documentation, checklist, categories.
  - name: Gantt
    order: 30
    description: Where the element sits on the schedule — onset, duration, progress.
  - name: Data
    order: 40
    description: How a value is laid out — format and schema.
  - name: Execution
    order: 50
    synthetic: true
    description: >-
      What runs and how — the software, its arguments, the data it reads and
      writes, and the state it carries.

enumerations:
  - name: DatasetFormatEnum
    description: The dataset-format vocabulary.
    literalValues:
      - name: BDM (Behaverse Data Model)
        value: bdm
        icon: iconify bi--hexagon
      - name: BIDS (Brain Imaging Data Structure)
        value: bids
        icon: bids-dataset-icon
      - name: Psych-DS
        value: psych-ds
        icon: iconify uil--flask
      - name: Kedro
        value: kedro
  - name: BDMDataLevelEnum
    description: BDM level of the data.
    literalValues:
      - name: Events
        value: events
      - name: Trials
        value: trials
      - name: Models
        value: models
  - name: BIDSDataTypeEnum
    description: BIDS data type.
    literalValues:
      - name: anat (anatomical MRI)
        value: anat
      - name: beh (behavioral)
        value: beh
      - name: dwi (diffusion MRI)
        value: dwi
      - name: eeg (electroencephalography)
        value: eeg
      - name: func (functional MRI)
        value: func
      - name: ieeg (intracranial EEG)
        value: ieeg
      - name: meg (magnetoencephalography)
        value: meg
      - name: micr (microscopy)
        value: micr
      - name: motion (motion capture)
        value: motion
      - name: mrs (magnetic resonance spectroscopy)
        value: mrs
      - name: nirs (near-infrared spectroscopy)
        value: nirs
      - name: perf (arterial spin labeling)
        value: perf
      - name: pet (positron emission tomography)
        value: pet
  - name: TableFormatEnum
    description: On-disk format of a tabular dataset.
    literalValues:
      - name: CSV
        value: csv
      - name: TSV
        value: tsv
      - name: Parquet
        value: parquet
      - name: Arrow
        value: arrow
      - name: JSON Lines
        value: jsonl
  - name: TimeseriesFormatEnum
    description: On-disk format of a time-series recording.
    literalValues:
      - name: EDF (European Data Format)
        value: edf
      - name: BDF (Biosemi Data Format)
        value: bdf
      - name: FIF (MNE/Elekta)
        value: fif
      - name: SET (EEGLAB)
        value: set
      - name: Parquet
        value: parquet
      - name: Zarr
        value: zarr
  - name: CompletionCodeTypeEnum
    description: How the completion code is generated when the study ends.
    literalValues:
      - name: None
        value: none
        description: No completion code is issued.
      - name: Static
        value: static
        description: A fixed code configured by the researcher.
      - name: Dynamic
        value: dynamic
        description: A code extracted from a URL pattern at runtime (e.g. Prolific).
  - name: RuntimeEnum
    description: Execution environment in which the study runs.
    literalValues:
      - name: Browser
        value: browser
      - name: Cloud
        value: cloud
      - name: Local
        value: local
      - name: HPC
        value: hpc
  - name: ItemTypeEnum
    description: >-
      Common types offered when typing a state value; any other type name is
      accepted too (`pandas.DataFrame`).
    literalValues:
      - name: string
        value: string
      - name: integer
        value: integer
      - name: number
        value: number
      - name: boolean
        value: boolean
types:
  - name: MarkdownString
    description: A string that contains markdown formatting
    superClass:
      - String
    meta:
      # Attributes of this type get the markdown editor unless they name their own.
      editor: markdown
  - name: YAMLString
    description: A string that contains YAML-formatted content
    superClass:
      - String
    meta:
      editor: code
  - name: BaseElement
    description: What every element of a studyflow carries.
    extends:
      - bpmn:BaseElement
    isAbstract: true
    properties:
      - name: bpmn:documentation
        description: Notes about this element, written in markdown.
        redefines: bpmn:BaseElement#documentation
        isMany: true
        type: bpmn:Documentation
        meta:
          editor: markdown
          categories:
            - Documentation
  - name: ChecklistDocumentation
    description: >-
      A documentation entry read as a checklist of markdown task items
      (`- [ ]` / `- [x]`) reviewers tick off.
    extends:
      - bpmn:Documentation
    isAbstract: true
    properties:
      - name: checklist
        description: True marks this documentation entry as the element's checklist.
        isAttr: true
        type: Boolean
  - name: Study
    description: Process definition for a Studyflow study.
    superClass:
      - bpmn:Process
    properties:
      - name: runtime
        description: Execution runtime in which the study runs.
        isAttr: true
        type: RuntimeEnum
        default: cloud
        meta:
          categories:
            - Execution
      - name: authors
        description: Authors of the study.
        isAttr: false
        isMany: true
        type: String
      - name: version
        description: Version of the study, as the researcher labels it (`1.2`, a git tag).
        isAttr: true
        type: String
        meta:
          optional: true
      - name: isExecutable
        redefines: bpmn:Process#isExecutable
        isAttr: true
        type: Boolean
        default: true
        meta:
          pinned: true
  - name: Classification
    description: What kind of study a diagram is, declared by the diagram itself.
    extends:
      - bpmn:Process
      - bpmn:Collaboration
      - bpmn:Choreography
    isAbstract: true
    properties:
      - name: tags
        description: >-
          Short labels for the kind of study (`Experimental Design`,
          `AI/ML`, `Demos`).
        isMany: true
        type: String
        meta:
          categories:
            - Documentation
  - name: StartEvent
    extends:
      - bpmn:StartEvent
    isAbstract: true
    meta:
      icon: iconify bpmn--start-event
    properties:
      - name: consentFormUri
        description: Link to the consent form; untick to skip the consent step.
        isAttr: true
        type: String
        meta:
          # Overlay icon drawn on the event when this attribute is set.
          icon: iconify fluent--shield-task-24-regular
          optional: true
  - name: SequenceFlow
    extends:
      - bpmn:SequenceFlow
    isAbstract: true
    properties:
      - name: bpmn:conditionExpression
        description: >-
          Condition for taking this flow, as an expression over the run's
          values (`mean_cv_accuracy >= 0.9`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:SequenceFlow#conditionExpression
        meta:
          expression: true
  - name: EndEvent
    extends:
      - bpmn:EndEvent
    isAbstract: true
    meta:
      icon: iconify bpmn--end-event
    properties:
      - name: redirectTo
        description: >-
          URL the participant lands on when the study ends;
          `{COMPLETION_CODE}` is replaced with the code at run time.
        isAttr: true
        type: String
        meta:
          optional: true
          # Overlay icon drawn on the event when this attribute is set.
          icon: iconify fluent--arrow-exit-24-regular
      - name: completionCodeType
        description: How the completion code is issued when the study ends.
        isAttr: true
        type: CompletionCodeTypeEnum
        default: none
        meta:
          condition:
            body:
              redirectTo: $set
      - name: completionCode
        description: Fixed completion code to embed in the redirect URL.
        isAttr: true
        type: String
        meta:
          condition:
            body:
              redirectTo: $set
              completionCodeType: static
  - name: Scheduling
    description: Where an activity or event sits on the schedule.
    extends:
      - bpmn:Activity
      - bpmn:Event
    isAbstract: true
    properties:
      - name: onset
        description: >-
          When this starts, as a timestamp, an offset (`T0+30min`), or a
          label.
        isAttr: true
        type: String
        meta:
          categories:
            - Gantt
      - name: duration
        description: How long it lasts (`30min`, `PT1H`).
        isAttr: true
        type: String
        meta:
          categories:
            - Gantt
      - name: progress
        description: How far along it is, as a percentage or a label (`done`, `blocked`).
        isAttr: true
        type: String
        meta:
          categories:
            - Gantt
  - name: ChoreographyTask
    description: One interaction between two participants.
    extends:
      - bpmn:ChoreographyTask
    isAbstract: true
    meta:
      icon: iconify fluent--people-team-24-regular
  - name: Schema
    description: A description of how some data is structured - table columns, array dimensions.
    superClass:
      - bpmn:DataObjectReference
    meta:
      # An attribute that references a Schema (`Dataset#schema`) edits it as text.
      editor: code
    properties:
      - name: format
        description: Schema format identifier (e.g., csvw, linkml, jsonschema).
        isAttr: true
        type: String
        meta:
          categories:
            - Data
      - name: body
        description: The schema itself, or a path or URL to it.
        isAttr: true
        type: YAMLString
        meta:
          categories:
            - Data
          editor: csvw-table
  - name: Dataset
    description: A collection of data - a table, an array, or any structured dataset.
    superClass:
      - bpmn:DataStoreReference
    isAbstract: false
    meta:
      icon: iconify bi--database
    properties:
      - name: catalog
        description: The catalog this dataset is registered in.
        isAttr: true
        type: DataCatalog
        meta:
          categories:
            - Data
      - name: storage
        description: The data store where this dataset physically lives.
        isAttr: true
        type: bpmn:DataStoreReference
        meta:
          categories:
            - Data
      - name: schema
        description: The schema describing how this dataset is structured.
        isAttr: true
        type: Schema
        meta:
          categories:
            - Data
      - name: format
        description: Format of the dataset.
        isAttr: true
        type: DatasetFormatEnum
        meta:
          categories:
            - Data
      - name: bdmDataLevel
        description: Level of the data in this BDM dataset.
        isAttr: true
        type: BDMDataLevelEnum
        default: events
        meta:
          categories:
            - Data
          condition:
            body:
              format: bdm
      - name: bidsDataType
        description: BIDS data type of this dataset.
        isAttr: true
        type: BIDSDataTypeEnum
        default: beh
        meta:
          categories:
            - Data
          condition:
            body:
              format: bids
  - name: DataCatalog
    description: A registry that datasets are published in (openneuro, behaverse).
    superClass:
      - bpmn:BaseElement
    isAbstract: false
    properties:
      - name: url
        description: Base URL of the catalog.
        isAttr: true
        type: String
        meta:
          categories:
            - Data
  - name: Table
    description: Tabular data - rows and columns.
    superClass:
      - bpmn:DataObjectReference
    isAbstract: false
    meta:
      icon: iconify bi--table
    properties:
      - name: format
        description: On-disk format of the table.
        isAttr: true
        type: TableFormatEnum
        default: csv
        meta:
          categories:
            - Data
      - name: schema
        description: The schema describing this table's columns.
        isAttr: true
        type: Schema
        meta:
          categories:
            - Data
  - name: Timeseries
    description: >-
      A recording sampled continuously over time (EEG, EMG, eye tracking,
      accelerometer).
    superClass:
      - bpmn:DataObjectReference
    isAbstract: false
    meta:
      icon: iconify mdi--chart-line
    properties:
      - name: samplingRate
        description: Sampling rate in samples per second (Hz).
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: channelCount
        description: Number of channels in the recording.
        isAttr: true
        type: Integer
        meta:
          categories:
            - Data
      - name: units
        description: Physical units of the recorded values (e.g., uV, mV, deg).
        isAttr: true
        type: String
        meta:
          categories:
            - Data
      - name: recordingDuration
        description: Duration of the recording in seconds.
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: format
        description: On-disk format of the recording.
        isAttr: true
        type: TimeseriesFormatEnum
        meta:
          categories:
            - Data
  - name: EventMarker
    description: >-
      Time-stamped occurrences within a recording - trial markers, stimulus
      onsets, button presses.
    superClass:
      - bpmn:DataObjectReference
    isAbstract: false
    meta:
      icon: iconify mdi--lightning-bolt-outline
    properties:
      - name: eventType
        description: Kind of event (stimulus, response, artifact).
        isAttr: true
        type: String
        meta:
          categories:
            - Data
      - name: eventOnset
        description: Onset time of the event in seconds, relative to the recording start.
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: eventOffset
        description: Offset time of the event in seconds, relative to the recording start.
        isAttr: true
        type: Real
        meta:
          categories:
            - Data
      - name: eventCount
        description: Expected or declared number of events.
        isAttr: true
        type: Integer
        meta:
          categories:
            - Data

  # The executable layer: what an engine reads to run a diagram.

  - name: Implementation
    description: Lets a task name the software it runs.
    extends:
      - bpmn:ServiceTask
      - bpmn:UserTask
      - bpmn:SendTask
      - bpmn:ReceiveTask
      - bpmn:BusinessRuleTask
    isAbstract: true
    properties:
      - name: bpmn:implementation
        description: >-
          Software this task runs, as `<scheme>://<ref>[@<version>]` -
          `python://`, `docker://`, `https://`, or `file://`.
        isAttr: true
        type: String
        # One ref is enough: moddle resolves it per extended type.
        redefines: bpmn:ServiceTask#implementation
        meta:
          order: 1
          categories:
            - Execution

  - name: Script
    description: Lets a script task carry its code in the diagram itself.
    extends:
      - bpmn:ScriptTask
    isAbstract: true
    properties:
      - name: bpmn:script
        description: The code this task runs, in the language picked in the editor.
        type: String
        redefines: bpmn:ScriptTask#script
        meta:
          order: 1
          categories:
            - Execution
          editor: code
          languageAttr: bpmn:scriptFormat

  - name: Arguments
    description: Lets an activity carry literal arguments for the software it calls.
    extends:
      - bpmn:Activity
    isAbstract: true
    properties:
      - name: additionalArguments
        description: >-
          Arguments for the software this activity runs, as YAML; the reserved
          `args` key lists positional ones.
        isAttr: false
        type: YAMLString
        meta:
          order: 3
          categories:
            - Execution
          condition:
            body:
              implementation: $set

  - name: Seed
    description: |
      Adds the run's root seed to the process - pinned in the plan, read by
      the engine, echoed on the archived copy.
    extends:
      - bpmn:Process
    isAbstract: true
    properties:
      - name: seed
        description: |
          Root seed for runs of this study; every step derives its own from it.
          Pin it to make runs replayable; leave it unset and the engine draws
          one and records it on the archived copy.
        isAttr: true
        type: Integer
        meta:
          optional: true
          categories:
            - Execution

  # ===========================================================================
  # Bindings. Inputs and outputs are never listed on a task: they are the
  # data associations drawn on the canvas. Connect a data element to a task
  # and it is an input; connect the task to a data element and it is an
  # output. BPMN's own `transformation` element on the association refines
  # that detection: its body is `slot = selection`, each half optional. The
  # slot names *where* the value goes, the selection *what* value arrives; a
  # selection is member access and indexing that routes a value between
  # ports, never a computation. Wires coordinate, steps calculate. Nothing to
  # declare here: `transformation` is the standard's own element, used as-is,
  # and it carries its own per-expression `language`.
  # ===========================================================================

  # ===========================================================================
  # Triggers, sensors, and delays are native BPMN, not studyflow concepts: a
  # timer start event is a schedule, a message start event an external event,
  # a conditional catch event a sensor, a timer catch event a delay, and a
  # plain start event a manual run. As for `loopCondition` and
  # `completionCondition`, the event definitions' expressions are authored as
  # flat strings and stored in BPMN's own expression-element form.
  # ===========================================================================
  - name: Timer
    description: |
      Declares the timer event definition's expressions so schedules and
      delays are authored as flat strings, stored in BPMN's own form (an
      expression element, `xsi:type` tFormalExpression). On a start event,
      `timeCycle` launches runs on a schedule; on an intermediate catch
      event, `timeDuration` is a delay and `timeDate` a fixed wake-up.
    extends:
      - bpmn:TimerEventDefinition
    isAbstract: true
    properties:
      - name: bpmn:timeCycle
        description: |
          When to fire, repeatedly: a cron five-field expression (e.g.
          `0 6 * * 1`, Mondays at 06:00) or an ISO 8601 repeating interval
          (e.g. `R/PT24H`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:TimerEventDefinition#timeCycle
        meta:
          categories:
            - Execution
          expression: true
      - name: bpmn:timeDuration
        description: How long to wait, as an ISO 8601 duration (e.g. `PT1H`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:TimerEventDefinition#timeDuration
        meta:
          categories:
            - Execution
          expression: true
      - name: bpmn:timeDate
        description: Fire once, at a fixed time (ISO 8601, e.g. `2026-09-01T06:00Z`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:TimerEventDefinition#timeDate
        meta:
          categories:
            - Execution
          expression: true

  - name: Condition
    description: |
      Declares the conditional event definition's `condition`, authored as a
      flat string and stored as BPMN's own expression element. A
      conditional catch event is the workflow sensor: the token waits here
      until the condition over the run's variables holds - data arrived, a
      metric crossed a line - then passes.
    extends:
      - bpmn:ConditionalEventDefinition
    isAbstract: true
    properties:
      - name: bpmn:condition
        description: |
          Expression over the run's variables; the event fires when it
          holds (e.g. `raw_sessions.rowCount > 0`).
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:ConditionalEventDefinition#condition
        meta:
          categories:
            - Execution
          expression: true

  # Cycles come in two interchangeable forms, both BPMN's own. The compact
  # form is the standard-loop marker (`loopCharacteristics` with
  # `loopCondition`, `loopMaximum`, `testBefore`): one activity retried in
  # place, the canvas ↻. The drawn form is a gateway whose conditioned
  # back-edge returns upstream, exit as the gateway's native `default`. Use
  # it when the cycle spans several steps or the exit rule should be a
  # visible edge, bounding it with the engine's run state
  # (`state.trace.count('<gateway-id>')`, the drawn counterpart of the marker's own
  # loopCounter). The declarations below keep the marker's condition and the
  # ad-hoc sub-process's exit test (an Agent's stop rule) authorable as flat
  # strings; on the association they are BPMN's own expression elements
  # (`xsi:type` tFormalExpression), not custom attributes.
  - name: CompletionCondition
    description: |
      Declares the ad-hoc sub-process's own `completionCondition`, authored
      as a flat string (e.g. `answer is not None`) and stored as BPMN's own
      expression element.
    extends:
      - bpmn:AdHocSubProcess
    isAbstract: true
    properties:
      - name: bpmn:completionCondition
        description: |
          BPMN's own exit test: the ad-hoc sub-process (an Agent) is complete
          when this holds, evaluated over the run's variables after each turn.
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:AdHocSubProcess#completionCondition
        meta:
          expression: true

  - name: LoopCondition
    description: |
      Declares the standard-loop marker's `loopCondition`, authored as a flat
      string and stored as BPMN's own expression element (as the core
      does for `conditionExpression`). The loop *continues while* it holds,
      and stops at `loopMaximum` regardless.
    extends:
      - bpmn:StandardLoopCharacteristics
    isAbstract: true
    properties:
      - name: bpmn:loopCondition
        description: |
          Continue-while expression over the run's bound values (e.g.
          `score < 0.9` keeps retrying until the score clears 0.9). Evaluated
          after each turn, or before it with `testBefore`.
        type: bpmn:Expression
        xml:
          serialize: xsi:type
        redefines: bpmn:StandardLoopCharacteristics#loopCondition
        meta:
          categories:
            - Execution
          expression: true

  # ===========================================================================
  # Artifacts. One field on every BPMN data element: where the bytes live
  # (`uri`). How they are laid out is `format`, the word the data types
  # already own (Table, Dataset, Timeseries, and domain wrappers all declare
  # one), so this schema does not declare a second: the engine reads the
  # element's `format` wherever its schema put it, and falls back to what the
  # `uri`'s file extension implies. The engine passes associated data in
  # memory and loads/saves an artifact at its `uri` when one is set, nothing
  # more.
  # ===========================================================================
  - name: Artifact
    description: |
      Storage contract, mixed onto every BPMN data element. Unset `uri` means
      the value only flows in memory between steps; set, the engine
      reads/writes the artifact there, in the element's declared `format` (or
      the one the file extension implies).
    extends:
      - bpmn:ItemAwareElement
    isAbstract: true
    properties:
      - name: uri
        description: Where the bytes live (`results/model.joblib`, `s3://...`, a URL).
        isAttr: true
        type: String
        meta:
          order: 1

  # ===========================================================================
  # The one concrete element: a named configuration group the engine passes
  # to steps like any other associated data.
  # ===========================================================================
  - name: Parameters
    description: |
      A named configuration group - a dict of values associated with the steps that
      read it, so a study varies by editing data, not the flow.
    superClass:
      - bpmn:DataObjectReference
    meta:
      icon: iconify mdi--tune
    properties:
      - name: values
        description: The configuration itself, as a YAML mapping.
        isAttr: false
        type: YAMLString
        meta:
          order: 1
          categories:
            - Data

