# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Agentic
prefix: agentic
description: >-
  LLM and agent workflows: model calls, tools, branches, and
  human approval steps.
uri: https://w3id.org/studyflow/agentic
icon: iconify tabler--hexagon-letter-a
order: 60  # registry position (load precedence + settings order)
xml:
  tagAlias: lowerCase
version: 26.0717


enumerations:
  - name: ToolChoiceEnum
    description: How freely the model may call the tools available to it.
    literalValues:
      - name: Auto
        value: auto
        description: The model decides whether and which tool to call.
      - name: Required
        value: required
        description: The model must call a tool on this turn.
      - name: None
        value: none
        description: Tools are visible but may not be called.

  - name: ToolKindEnum
    description: What kind of capability a tool exposes.
    literalValues:
      - name: Function call
        value: function
      - name: Retrieval
        value: retrieval
      - name: Code execution
        value: code
      - name: Web search
        value: search
      - name: MCP server
        value: mcp
      - name: Ask a human
        value: human
        description: A person answers it, and the run waits for them.
      - name: Sub-flow
        value: subflow
        description: A tool whose implementation is another studyflow.

  - name: MemoryScopeEnum
    description: How long a memory store lives.
    literalValues:
      - name: Turn
        value: turn
      - name: Run
        value: run
      - name: Participant
        value: participant
      - name: Global
        value: global

types:

  - name: Agent
    description: A sub-process whose contained tools the model calls in an order it decides.
    superClass:
      - bpmn:AdHocSubProcess
    meta:
      icon: iconify mdi--robot-outline
    properties:
      - name: model
        description: Model identifier (e.g. `claude-opus-4-8`, `gpt-5`, `ollama/llama3.3`).
        isAttr: true
        type: String
        meta:
          order: 1
      - name: systemPrompt
        description: The agent's standing instructions, in markdown.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 3
      - name: toolChoice
        description: How freely the agent may call the tools drawn inside it.
        isAttr: true
        type: ToolChoiceEnum
        default: auto
        meta:
          order: 4
      - name: temperature
        description: Sampling temperature; lower values make the agent less exploratory.
        isAttr: true
        type: Real
        default: 1
        meta:
          order: 5
      - name: maxTurns
        description: Hard ceiling on how many turns the agent may take.
        isAttr: true
        type: Integer
        default: 10
        meta:
          order: 7

  # The runner refuses `meta.branching: model` at run time; it is not implemented yet.
  - name: Router
    description: A branch the model picks, choosing among the outgoing flows' labels.
    superClass:
      - bpmn:ExclusiveGateway
    meta:
      icon: iconify mdi--sign-direction
      branching: model
    properties:
      - name: model
        description: Model that classifies the input and picks a branch.
        isAttr: true
        type: String
        meta:
          order: 1
      - name: instructions
        description: How to choose a branch, in markdown.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 2

  - name: LLMCall
    description: One model call - a prompt in, a response out.
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--message-processing-outline
    properties:
      - name: model
        description: Model identifier (e.g. `ollama/llama3.3`, `claude-opus-4-8`).
        isAttr: true
        type: String
        meta:
          order: 1
      - name: prompt
        description: The prompt, in markdown, with `{{name}}` placeholders.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 3
      - name: temperature
        description: Sampling temperature; 0 gives a repeatable call.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 4
      - name: maxTokens
        description: Ceiling on the response length.
        isAttr: true
        type: Integer
        meta:
          order: 5
          optional: true

  - name: Tool
    description: A capability an agent may call, run like any other step.
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--tools
    properties:
      # `implementation` comes from the `studyflow:Implementation` trait on bpmn:ServiceTask.
      - name: kind
        description: What kind of capability this exposes.
        isAttr: true
        type: ToolKindEnum
        default: function
        meta:
          order: 1
      - name: purpose
        description: What the tool does and when to use it, written for the model to read.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 2

  - name: HumanApproval
    description: Pauses the run until a person approves, edits, or rejects.
    superClass:
      - bpmn:UserTask
    meta:
      icon: iconify mdi--account-check-outline
    properties:
      - name: question
        description: What the reviewer is being asked, in markdown.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 1

  - name: Prompt
    description: A prompt kept as a data element, associated into the calls that read it.
    superClass:
      - bpmn:DataObjectReference
    meta:
      icon: iconify mdi--text-box-outline
    properties:
      - name: template
        description: The prompt text, in markdown, with `{{name}}` placeholders.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 1

  - name: Memory
    description: State an agent carries across turns, such as history or retrieved facts.
    superClass:
      - bpmn:DataStoreReference
    meta:
      icon: iconify mdi--memory
    properties:
      - name: scope
        description: How long the memory lives.
        isAttr: true
        type: MemoryScopeEnum
        default: run
        meta:
          order: 1

templates:

  - description: An autonomous agent with tools - the model decides what to call and when.
    object:
      bpmn:name: Agent (tool loop)
      type: Agent
      bpmn:documentation: |
        The model chooses which of the tools drawn inside to call on each turn,
        until it is done or the turn budget runs out.
      icon: iconify mdi--robot-outline
      keywords:
        - agent
        - autonomous
        - tools
        - loop
        - adhoc
      model: ollama/llama3.3
      systemPrompt: |
        You are a research assistant. Use the available tools to answer the
        question. Stop as soon as you can answer it.
      toolChoice: auto
      maxTurns: 12
      completionCondition: answer != null
      flowElements:
        - id: agent_search
          type: Tool
          bpmn:name: Search Wikipedia
          kind: search
          purpose: |
            Look up background facts. Use it when the question needs knowledge
            you do not already have.
          implementation: python://wikipedia.search
          additionalArguments: "results: 5"
          x: 200
          y: 140

  - description: Evaluator-optimizer - generate, judge, revise until the score clears the bar.
    object:
      bpmn:name: Evaluator-optimizer
      type: bpmn:SubProcess
      bpmn:documentation: |
        A generator drafts, a judge scores it against a rubric, and the
        back-edge revises until the score clears the bar.
      icon: iconify mdi--autorenew
      keywords:
        - evaluator
        - optimizer
        - critique
        - refine
        - loop
      flowElements:
        - id: eo_generate
          type: LLMCall
          bpmn:name: Draft
          model: ollama/llama3.3
          temperature: 0.7
          x: 200
          y: 140
        - id: eo_judge
          type: LLMCall
          bpmn:name: Judge the draft
          model: claude-opus-4-8
          prompt: |
            Score the draft 1-5 against the rubric and name the deciding
            criterion. Reply as `score: <n>` on the first line.
          x: 380
          y: 140
        - id: eo_gate
          type: bpmn:ExclusiveGateway
          bpmn:name: Good enough?
          x: 560
          y: 140
        - type: bpmn:SequenceFlow
          sourceRef: eo_generate
          targetRef: eo_judge
        - type: bpmn:SequenceFlow
          sourceRef: eo_judge
          targetRef: eo_gate
        - type: bpmn:SequenceFlow
          bpmn:name: revise
          conditionExpression: score < 4 and state.trace.count('eo_gate') < 4
          sourceRef: eo_gate
          targetRef: eo_generate

  - description: Model-decided routing - a classifier picks one of the outgoing branches.
    object:
      bpmn:name: Route by intent
      type: Router
      bpmn:documentation: |
        The classifier chooses among the outgoing branch labels, and the flow
        marked `default` is taken when it is unsure or fails.
      icon: iconify mdi--sign-direction
      keywords:
        - router
        - routing
        - classify
        - dispatch
        - handoff
      model: claude-haiku-4-5
      instructions: |
        Read the request and route it to exactly one branch, using the branch
        labels on the outgoing flows. If none clearly applies, say so; the
        default branch is taken.

  - description: Human approval gate - stop, show the artifact, wait for a person.
    object:
      bpmn:name: Human approval
      type: HumanApproval
      bpmn:documentation: |
        Pauses the run until the reviewer answers.
      icon: iconify mdi--account-check-outline
      keywords:
        - approval
        - human
        - hitl
        - review
        - interrupt
      question: |
        Review the proposed action and approve, edit, or reject it.

  - description: Prompt chain with a quality gate between the steps.
    object:
      bpmn:name: Prompt chain
      type: bpmn:SubProcess
      bpmn:documentation: |
        Fixed steps in the order the diagram sets, with a check on the
        intermediate result between them.
      icon: iconify mdi--link-variant
      keywords:
        - chain
        - prompt
        - sequential
        - workflow
      flowElements:
        - id: chain_a
          type: LLMCall
          bpmn:name: Extract
          model: claude-haiku-4-5
          temperature: 0
          x: 180
          y: 140
        - id: chain_gate
          type: bpmn:ExclusiveGateway
          icon: iconify mdi--gate-arrow-right
          bpmn:name: Complete?
          x: 340
          y: 145
        - id: chain_b
          type: LLMCall
          bpmn:name: Summarize
          model: ollama/llama3.3
          temperature: 0
          x: 460
          y: 140
        - type: bpmn:SequenceFlow
          sourceRef: chain_a
          targetRef: chain_gate
        - type: bpmn:SequenceFlow
          sourceRef: chain_gate
          targetRef: chain_b
