# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Reachy Mini
prefix: reachy
description: >-
  Human-robot interaction with the Reachy Mini desktop robot: robot sessions,
  expressive behaviors, spoken dialogue, perception-driven branching, and
  interaction recordings. Motion, media, and sensing elements map one-to-one
  onto the robot daemon's REST API (`http://<host>:8000/api`).
uri: https://w3id.org/studyflow/reachy
# The Reachy Mini silhouette, inlined so the badge needs no icon service or external host.
icon: &reachy-icon "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%233f3f46' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 8.5 6.5 2.5M22 8.5 25.5 2.5M15 14.5h2M10.5 21C8.3 23.6 7 26.3 7 29.2h18c0-2.9-1.3-5.6-3.5-8.2'/%3E%3Crect x='5' y='8' width='22' height='13' rx='5.5'/%3E%3Ccircle cx='12' cy='14.5' r='3'/%3E%3Ccircle cx='20' cy='14.5' r='3'/%3E%3C/svg%3E"
order: 104
xml:
  tagAlias: lowerCase
version: 26.0831

enumerations:
  - name: VariantEnum
    description: Which Reachy Mini build runs the session.
    literalValues:
      - name: Reachy Mini (wireless)
        value: wireless
        description: Battery, on-board computer, and Wi-Fi; runs untethered.
      - name: Reachy Mini Lite
        value: lite
        description: USB-tethered to a host computer.
      - name: Simulation
        value: simulation
        description: No hardware; the session runs in the simulator.

  - name: MoveEnum
    description: >-
      Recorded expressive move played on the head, body, and antennas - a
      curated pick from the SDK's emotions library
      (`pollen-robotics/reachy-mini-emotions-library`, 81 moves in all),
      plus the daemon's two built-in moves.
    literalValues:
      - name: Cheerful
        value: cheerful1
      - name: Sad
        value: sad1
      - name: Curious
        value: curious1
      - name: Surprised
        value: surprised1
      - name: Nod (yes)
        value: yes1
      - name: Shake (no)
        value: no1
      - name: Attentive
        value: attentive1
      - name: Dance
        value: dance1
      - name: Sleep
        value: sleep1
      - name: Wake up
        value: wake_up
        description: The daemon's built-in wake-up move (`POST /api/move/play/wake_up`).
      - name: Go to sleep
        value: goto_sleep
        description: The daemon's built-in sleep move (`POST /api/move/play/goto_sleep`).

  - name: InterpolationEnum
    description: How the daemon interpolates a motion toward its target.
    literalValues:
      - name: Min-jerk
        value: minjerk
      - name: Linear
        value: linear
      - name: Ease in-out
        value: ease_in_out
      - name: Cartoon
        value: cartoon

  - name: LookTargetEnum
    description: What the robot orients its head toward.
    literalValues:
      - name: Nearest face
        value: face
      - name: Sound source
        value: sound
      - name: Home pose
        value: home

  - name: TriggerEnum
    description: What the robot senses to fire the event.
    literalValues:
      - name: Wake word
        value: wake_word
        description: A spoken phrase, recognized app-side (the daemon exposes no wake-word API).
      - name: Face detected
        value: face_detected
        description: The daemon's face tracker reports a face (`GET /api/media/tracking/face`).
      - name: Speech detected
        value: speech_detected
        description: The mic array hears speech (`GET /api/state/doa`).

  - name: PerceptionChannelEnum
    description: Perception feed a gateway's branch conditions read.
    literalValues:
      - name: Face count
        value: face_count
        description: >-
          Faces currently seen - 0 or 1 from the daemon's single-face tracker
          (`GET /api/media/tracking/face`).
      - name: Speech detected
        value: speech_detected
        description: Whether the mic array currently hears speech (`GET /api/state/doa`).
      - name: Sound angle
        value: sound_angle
        description: >-
          Direction the sound comes from, in radians - 0 left, π/2 front,
          π right (`GET /api/state/doa`).
      - name: Speech intent
        value: speech_intent
        description: What the participant's last utterance (from Listen or Converse) asked for.

types:
  - name: Robot
    description: >-
      The Reachy Mini as an actor - a pool for what the robot does, carrying
      the device settings shared by every step inside it.
    superClass:
      - bpmn:Participant
    meta:
      icon: *reachy-icon
    properties:
      - name: variant
        description: Which Reachy Mini build runs the session; a custom identifier is also accepted.
        isAttr: true
        type: VariantEnum
        default: wireless
        meta:
          order: 0
          editable: true
      - name: host
        description: >-
          Hostname or IP where the robot's daemon serves its REST API
          (`http://<host>:8000/api`) - `reachy-mini.local` for a wireless
          unit, `localhost` for a Lite or a simulation.
        isAttr: true
        type: String
        default: reachy-mini.local
        meta:
          order: 1
      - name: voice
        description: Text-to-speech voice the robot speaks with.
        isAttr: true
        type: String
        meta:
          order: 2
          optional: true
      - name: language
        description: Language the robot speaks and listens in, as a BCP-47 tag (`en-US`).
        isAttr: true
        type: String
        meta:
          order: 3
          optional: true
      - name: volume
        description: Speaker volume, 0-100, applied at session start (`POST /api/volume/set`).
        isAttr: true
        type: Integer
        default: 80
        meta:
          order: 4

  # Actuation steps are service tasks: `studyflow:Implementation` lets a runner bind each to a Python entry point over the reachy_mini SDK.
  - name: Say
    description: >-
      The robot speaks a text aloud. The daemon has no TTS endpoint: a runner
      synthesizes the audio and plays it through the robot's speaker (SDK
      media stream, or upload + `POST /api/media/play_sound`).
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--account-voice
    properties:
      - name: text
        description: What the robot says, with `{{name}}` placeholders filled in as it runs.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 1

  - name: Gesture
    description: >-
      The robot plays a recorded expressive move - head, body rotation, and
      antennas (`POST /api/move/play/recorded-move-dataset/{dataset}/{move}`;
      `wake_up` and `goto_sleep` use their own endpoints).
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--hand-wave-outline
    properties:
      - name: move
        description: >-
          Recorded move to play; any name from the dataset or a custom
          recorded move is also accepted.
        isAttr: true
        type: MoveEnum
        default: cheerful1
        meta:
          order: 1
          editable: true
      - name: dataset
        description: >-
          Hugging Face dataset the move comes from
          (`GET /api/move/recorded-move-datasets/list/{dataset}` lists its moves).
        isAttr: true
        type: String
        default: pollen-robotics/reachy-mini-emotions-library
        meta:
          order: 2

  - name: Goto
    description: >-
      The robot moves head, antennas, and body to a target pose in one smooth
      motion - the daemon's motion primitive (`POST /api/move/goto`).
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--axis-arrow
    properties:
      - name: roll
        description: Head roll, radians.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 1
      - name: pitch
        description: Head pitch, radians.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 2
      - name: yaw
        description: Head yaw, radians.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 3
      - name: x
        description: Head position x, meters.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 4
      - name: y
        description: Head position y, meters.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 5
      - name: z
        description: Head position z, meters.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 6
      - name: leftAntenna
        description: Left antenna joint position, radians.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 7
      - name: rightAntenna
        description: Right antenna joint position, radians.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 8
      - name: bodyYaw
        description: Body rotation, radians.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 9
      - name: durationSeconds
        description: How long the motion takes, seconds.
        isAttr: true
        type: Real
        default: 2
        meta:
          order: 10
      - name: interpolation
        description: How the motion is interpolated toward the target.
        isAttr: true
        type: InterpolationEnum
        default: minjerk
        meta:
          order: 11

  - name: PlaySound
    description: >-
      The robot plays a sound from its sound library
      (`POST /api/media/play_sound`; `GET /api/media/sounds` lists the files,
      `POST /api/media/sounds/upload` adds one).
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--music-note
    properties:
      - name: file
        description: Sound file name from the robot's sound library (e.g. `chime.wav`).
        isAttr: true
        type: String
        meta:
          order: 1

  - name: LookAt
    description: >-
      The robot orients its head toward a target and holds or tracks it -
      faces via the daemon's tracker (`POST /api/media/tracking/enable`),
      sounds via the mic array's direction of arrival (`GET /api/state/doa`).
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--eye-outline
    properties:
      - name: target
        description: What to orient toward; tracking holds until another step moves the head.
        isAttr: true
        type: LookTargetEnum
        default: face
        meta:
          order: 1
      - name: trackingWeight
        description: How strongly face tracking pulls the head, 0-1.
        isAttr: true
        type: Real
        default: 1
        meta:
          order: 2
          condition:
            body:
              target: face

  - name: Listen
    description: >-
      Waits for the participant to speak and transcribes it; the transcript
      flows out through the data association drawn from this task.
    superClass:
      - bpmn:ReceiveTask
    meta:
      icon: iconify mdi--ear-hearing
    properties:
      - name: timeoutSeconds
        description: Give up if no speech starts within this many seconds.
        isAttr: true
        type: Real
        default: 10
        meta:
          order: 1

  - name: Converse
    description: >-
      A spoken exchange driven by a model - the robot listens, replies, and
      gestures until the conversation ends.
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--forum-outline
    properties:
      # `implementation` (e.g. an `hf://` app) comes from the `studyflow:Implementation` trait;
      # a runner starts it through the apps API (`POST /api/apps/start-app/{app}`) and stops it
      # after (`POST /api/apps/stop-current-app`).
      - name: model
        description: Model identifier that drives the dialogue (e.g. `claude-haiku-4-5`, `ollama/llama3.3`).
        isAttr: true
        type: String
        meta:
          order: 1
      - name: persona
        description: The robot's character and standing instructions, in markdown.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 2
      - name: maxTurns
        description: Ceiling on how many spoken exchanges the conversation may take.
        isAttr: true
        type: Integer
        default: 10
        meta:
          order: 3
      - name: stopPhrase
        description: Participant phrase that ends the conversation early (e.g. `goodbye`).
        isAttr: true
        type: String
        meta:
          order: 4
          optional: true

  - name: Teleoperation
    description: An operator drives the robot by hand - the Wizard-of-Oz condition.
    superClass:
      - bpmn:UserTask
    meta:
      icon: iconify mdi--gamepad-variant-outline
    properties:
      - name: instructions
        description: What the operator does at this step, in markdown.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 1

  - name: PerceptionGateway
    description: >-
      A branch decided by what the robot perceives - the outgoing flows'
      conditions read the chosen channel (e.g. `face_count > 1`), and the flow
      marked default is taken when none matches.
    superClass:
      - bpmn:ExclusiveGateway
    meta:
      icon: iconify mdi--eye-check-outline
    properties:
      - name: channel
        description: Perception feed the branch conditions read.
        isAttr: true
        type: PerceptionChannelEnum
        default: face_count
        meta:
          order: 1

  - name: SenseEvent
    description: Waits until the robot senses something - a wake word, a face, or speech.
    superClass:
      - bpmn:IntermediateCatchEvent
    meta:
      icon: iconify mdi--motion-sensor
    properties:
      - name: trigger
        description: What the robot listens or watches for; a custom trigger name is also accepted.
        isAttr: true
        type: TriggerEnum
        default: wake_word
        meta:
          order: 1
          editable: true
      - name: wakeWord
        description: The phrase to listen for (e.g. `Hey Reachy`).
        isAttr: true
        type: String
        meta:
          order: 2
          condition:
            body:
              trigger: wake_word

  - name: InteractionRecording
    description: The multimodal record an interaction produces - what was seen, heard, said, and moved.
    superClass:
      - studyflow:Dataset
    meta:
      icon: iconify mdi--record-rec
    properties:
      # Plain strings, one per entry: a non-attribute enum list cannot serialize through moddle.
      - name: streams
        description: >-
          Data streams captured in this recording, one per entry (`video`,
          `audio`, `transcript`, `motion`, `imu`).
        isAttr: false
        isMany: true
        type: String

templates:
  - description: Wake-word conversation - wait for the wake word, face the speaker, talk, sign off.
    object:
      bpmn:name: Wake-word conversation
      type: bpmn:SubProcess
      bpmn:documentation: |
        The robot idles until it hears its wake word, turns toward the
        speaker, and holds a spoken conversation until the participant says
        the stop phrase or the turn budget runs out.
      icon: iconify mdi--forum-outline
      keywords:
        - reachy
        - conversation
        - wake
        - dialogue
        - speech
      flowElements:
        - id: ww_wake
          type: SenseEvent
          bpmn:name: Wake word
          trigger: wake_word
          wakeWord: Hey Reachy
          x: 140
          y: 162
        - id: ww_look
          type: LookAt
          bpmn:name: Face the speaker
          target: face
          x: 240
          y: 140
        - id: ww_talk
          type: Converse
          bpmn:name: Chat
          model: claude-haiku-4-5
          persona: |
            You are Reachy, a small, curious desktop robot. Keep replies to one
            or two spoken sentences and never pretend to be human.
          stopPhrase: goodbye
          x: 400
          y: 140
        - id: ww_bye
          type: Gesture
          bpmn:name: Sign off
          move: yes1
          x: 560
          y: 140
        - type: bpmn:SequenceFlow
          sourceRef: ww_wake
          targetRef: ww_look
        - type: bpmn:SequenceFlow
          sourceRef: ww_look
          targetRef: ww_talk
        - type: bpmn:SequenceFlow
          sourceRef: ww_talk
          targetRef: ww_bye
