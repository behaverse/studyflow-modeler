# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

# Motion, media, and sensing elements map one-to-one onto the robot daemon's
# REST API, served at `http://<host>:8000/api`; the endpoint each element uses
# is noted in a comment beside it. Actuation steps are service tasks, so
# `studyflow:Implementation` lets a runner bind each to a Python entry point
# over the `reachy_mini` SDK. `packages/cli/src/studyflow-reachy.py` is the
# reference runner; it reads every attribute declared here by name.

name: Reachy Mini
prefix: reachy
description: >-
  Human-robot interaction with the Reachy Mini: behaviors, dialogue, sensing,
  and interaction recordings.
uri: https://w3id.org/studyflow/reachy
# The Reachy Mini silhouette, inlined so the badge needs no icon service or external host.
icon: &reachy-icon "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%233f3f46' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 8.5 6.5 2.5M22 8.5 25.5 2.5M15 14.5h2M10.5 21C8.3 23.6 7 26.3 7 29.2h18c0-2.9-1.3-5.6-3.5-8.2'/%3E%3Crect x='5' y='8' width='22' height='13' rx='5.5'/%3E%3Ccircle cx='12' cy='14.5' r='3'/%3E%3Ccircle cx='20' cy='14.5' r='3'/%3E%3C/svg%3E"
order: 104
xml:
  tagAlias: lowerCase
version: 26.0902

enumerations:
  - name: VariantEnum
    description: Which Reachy Mini build runs the session.
    literalValues:
      - name: Reachy Mini (wireless)
        value: wireless
        description: Battery, on-board computer, and Wi-Fi; runs untethered.
      - name: Reachy Mini Lite
        value: lite
        description: USB-tethered to a host computer.
      - name: Simulation
        value: simulation
        description: No hardware; the session runs in the simulator.

  # A curated pick from the SDK's emotions library
  # (`pollen-robotics/reachy-mini-emotions-library`, 81 moves in all) plus the
  # daemon's two built-in moves. `Gesture#move` is editable, so any other move
  # name in the dataset works too.
  - name: MoveEnum
    description: Recorded expressive move played on the head, body, and antennas.
    literalValues:
      - name: Cheerful
        value: cheerful1
      - name: Sad
        value: sad1
      - name: Curious
        value: curious1
      - name: Surprised
        value: surprised1
      - name: Nod (yes)
        value: yes1
      - name: Shake (no)
        value: no1
      - name: Attentive
        value: attentive1
      - name: Dance
        value: dance1
      - name: Sleep
        value: sleep1
      # Built-in: `POST /api/move/play/wake_up`.
      - name: Wake up
        value: wake_up
        description: The daemon's built-in wake-up move.
      # Built-in: `POST /api/move/play/goto_sleep`.
      - name: Go to sleep
        value: goto_sleep
        description: The daemon's built-in sleep move.

  - name: InterpolationEnum
    description: Velocity profile of a motion toward its target.
    literalValues:
      - name: Min-jerk
        value: minjerk
      - name: Linear
        value: linear
      - name: Ease in-out
        value: ease_in_out
      - name: Cartoon
        value: cartoon

  - name: LookTargetEnum
    description: What the robot orients its head toward.
    literalValues:
      - name: Nearest face
        value: face
      - name: Sound source
        value: sound
      - name: Home pose
        value: home

  - name: TriggerEnum
    description: What the robot senses to fire the event.
    literalValues:
      # Recognized app-side: the daemon exposes no wake-word API.
      - name: Wake word
        value: wake_word
        description: A spoken phrase, recognized by the runner.
      # `GET /api/media/tracking/face`.
      - name: Face detected
        value: face_detected
        description: The face tracker reports a face.
      # `GET /api/state/doa`.
      - name: Speech detected
        value: speech_detected
        description: The microphone array hears speech.

  - name: PerceptionChannelEnum
    description: Perception feed a gateway's branch conditions read.
    literalValues:
      # 0 or 1: the daemon tracks a single face (`GET /api/media/tracking/face`).
      - name: Face count
        value: face_count
        description: Faces currently seen (0 or 1).
      # `GET /api/state/doa`.
      - name: Speech detected
        value: speech_detected
        description: Whether the microphone array currently hears speech.
      # `GET /api/state/doa`.
      - name: Sound angle
        value: sound_angle
        description: Direction of the sound in radians (0 left, π/2 front, π right).
      - name: Speech intent
        value: speech_intent
        description: What the participant's last utterance asked for.

types:
  - name: Robot
    description: The robot as a pool of the steps it performs and the device settings they share.
    superClass:
      - bpmn:Participant
    meta:
      icon: *reachy-icon
    properties:
      - name: variant
        description: Which Reachy Mini build runs the session; a custom id is also accepted.
        isAttr: true
        type: VariantEnum
        default: wireless
        meta:
          order: 0
          editable: true
      # The daemon serves its REST API at `http://<host>:8000/api`.
      - name: host
        description: Hostname or IP of the robot (`reachy-mini.local`; `localhost` for Lite or sim).
        isAttr: true
        type: String
        default: reachy-mini.local
        meta:
          order: 1
      - name: voice
        description: Text-to-speech voice the robot speaks with.
        isAttr: true
        type: String
        meta:
          order: 2
          optional: true
      - name: language
        description: Language the robot speaks and listens in, as a BCP-47 tag (`en-US`).
        isAttr: true
        type: String
        meta:
          order: 3
          optional: true
      # Applied once at session start: `POST /api/volume/set`.
      - name: volume
        description: Speaker volume, 0 to 100.
        isAttr: true
        type: Integer
        default: 80
        meta:
          order: 4
          unit: "%"

  # The daemon has no TTS endpoint: the runner synthesizes the audio and plays
  # it through the speaker (SDK media stream, or upload + `POST /api/media/play_sound`).
  - name: Say
    description: The robot speaks a text aloud.
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--account-voice
    properties:
      - name: text
        description: What the robot says; `{{name}}` placeholders are filled in at run time.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 1

  # `POST /api/move/play/recorded-move-dataset/{dataset}/{move}`;
  # `wake_up` and `goto_sleep` use their own endpoints (see MoveEnum).
  - name: Gesture
    description: The robot plays a recorded expressive move on head, body, and antennas.
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--hand-wave-outline
    properties:
      - name: move
        description: Recorded move to play; any move name in the dataset is also accepted.
        isAttr: true
        type: MoveEnum
        default: cheerful1
        meta:
          order: 1
          editable: true
      # `GET /api/move/recorded-move-datasets/list/{dataset}` lists its moves.
      - name: dataset
        description: Hugging Face dataset the move comes from.
        isAttr: true
        type: String
        default: pollen-robotics/reachy-mini-emotions-library
        meta:
          order: 2

  # The daemon's motion primitive: `POST /api/move/goto`. The attributes map
  # 1:1 onto its body; 0 everywhere is the neutral pose.
  - name: Goto
    description: The robot moves head, antennas, and body to a pose in one smooth motion.
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--axis-arrow
    properties:
      # Head orientation.
      - name: roll
        description: Head roll; 0 is level.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 1
          unit: rad
      - name: pitch
        description: Head pitch; 0 is level.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 2
          unit: rad
      - name: yaw
        description: Head yaw; 0 faces forward.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 3
          unit: rad
      # Head position.
      - name: x
        description: Head offset along x; 0 is neutral.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 4
          unit: m
      - name: y
        description: Head offset along y; 0 is neutral.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 5
          unit: m
      - name: z
        description: Head offset along z; 0 is neutral.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 6
          unit: m
      # Antennas.
      - name: leftAntenna
        description: Left antenna angle; 0 is upright.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 7
          unit: rad
      - name: rightAntenna
        description: Right antenna angle; 0 is upright.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 8
          unit: rad
      # Body.
      - name: bodyYaw
        description: Body rotation; 0 faces forward.
        isAttr: true
        type: Real
        default: 0
        meta:
          order: 9
          unit: rad
      # Timing.
      # Not `duration`: the Scheduling trait already puts a Gantt `duration` on every activity.
      - name: motionDuration
        description: How long the motion takes.
        isAttr: true
        type: Real
        default: 2
        meta:
          order: 10
          unit: s
      - name: interpolation
        description: Velocity profile of the motion.
        isAttr: true
        type: InterpolationEnum
        default: minjerk
        meta:
          order: 11

  # `POST /api/media/play_sound`; `GET /api/media/sounds` lists the files and
  # `POST /api/media/sounds/upload` adds one.
  - name: PlaySound
    description: The robot plays a sound from its sound library.
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--music-note
    properties:
      - name: file
        description: Sound file name in the robot's library (`chime.wav`).
        isAttr: true
        type: String
        meta:
          order: 1

  # Faces via the daemon's tracker (`POST /api/media/tracking/enable`), sounds
  # via the mic array's direction of arrival (`GET /api/state/doa`).
  - name: LookAt
    description: The robot turns its head toward a target and keeps tracking it.
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--eye-outline
    properties:
      - name: target
        description: What to orient toward; tracking holds until another step moves the head.
        isAttr: true
        type: LookTargetEnum
        default: face
        meta:
          order: 1
      - name: trackingWeight
        description: How strongly face tracking pulls the head, 0-1.
        isAttr: true
        type: Real
        default: 1
        meta:
          order: 2
          condition:
            body:
              target: face

  # The transcript flows out through the data association drawn from this
  # task; the language comes from the enclosing Robot pool.
  - name: Listen
    description: Waits for the participant to speak and transcribes it.
    superClass:
      - bpmn:ReceiveTask
    meta:
      icon: iconify mdi--ear-hearing
    properties:
      - name: timeout
        description: Give up when no speech starts within this long.
        isAttr: true
        type: Real
        default: 10
        meta:
          order: 1
          unit: s

  # `implementation` (e.g. an `hf://` app) comes from the `studyflow:Implementation`
  # trait; a runner starts it through the apps API (`POST /api/apps/start-app/{app}`)
  # and stops it after (`POST /api/apps/stop-current-app`).
  - name: Converse
    description: A model-driven spoken exchange; the robot listens, replies, and gestures.
    superClass:
      - bpmn:ServiceTask
    meta:
      icon: iconify mdi--forum-outline
    properties:
      - name: model
        description: Model that drives the dialogue (`claude-haiku-4-5`, `ollama/llama3.3`).
        isAttr: true
        type: String
        meta:
          order: 1
      - name: persona
        description: The robot's character and standing instructions, in markdown.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 2
      - name: maxTurns
        description: Most spoken exchanges the conversation may take.
        isAttr: true
        type: Integer
        default: 10
        meta:
          order: 3
      - name: stopPhrase
        description: Participant phrase that ends the conversation early (`goodbye`).
        isAttr: true
        type: String
        meta:
          order: 4
          optional: true

  - name: Teleoperation
    description: An operator drives the robot by hand, the Wizard-of-Oz condition.
    superClass:
      - bpmn:UserTask
    meta:
      icon: iconify mdi--gamepad-variant-outline
    properties:
      - name: instructions
        description: What the operator does at this step, in markdown.
        isAttr: false
        type: studyflow:MarkdownString
        meta:
          order: 1

  # The outgoing flows' conditions read the chosen channel (`face_count > 1`);
  # the flow marked default is taken when none matches.
  - name: PerceptionGateway
    description: A branch decided by what the robot perceives.
    superClass:
      - bpmn:ExclusiveGateway
    meta:
      icon: iconify mdi--eye-check-outline
    properties:
      - name: channel
        description: Perception feed the branch conditions read.
        isAttr: true
        type: PerceptionChannelEnum
        default: face_count
        meta:
          order: 1

  - name: SenseEvent
    description: Waits until the robot senses a wake word, a face, or speech.
    superClass:
      - bpmn:IntermediateCatchEvent
    meta:
      icon: iconify mdi--motion-sensor
    properties:
      - name: trigger
        description: What the robot listens or watches for; a custom trigger is also accepted.
        isAttr: true
        type: TriggerEnum
        default: wake_word
        meta:
          order: 1
          editable: true
      - name: wakeWord
        description: The phrase to listen for (`Hey Reachy`).
        isAttr: true
        type: String
        meta:
          order: 2
          condition:
            body:
              trigger: wake_word

  # A Dataset, not a Timeseries: video, audio, transcript, and motion share one record.
  - name: InteractionRecording
    description: The multimodal record of an interaction, what was seen, heard, said, and moved.
    superClass:
      - studyflow:Dataset
    meta:
      icon: iconify mdi--record-rec
    properties:
      # Plain strings, one per entry: a non-attribute enum list cannot serialize through moddle.
      - name: streams
        description: Streams captured, one per entry (`video`, `audio`, `transcript`, `motion`).
        isAttr: false
        isMany: true
        type: String

templates:
  - description: Wake-word conversation - wait for the wake word, face the speaker, talk, sign off.
    object:
      bpmn:name: Wake-word conversation
      type: bpmn:SubProcess
      bpmn:documentation: |
        Idle until the wake word, turn toward the speaker, then converse until
        the stop phrase or the turn budget ends it.
      icon: iconify mdi--forum-outline
      keywords:
        - reachy
        - conversation
        - wake
        - dialogue
        - speech
      flowElements:
        - id: ww_wake
          type: SenseEvent
          bpmn:name: Wake word
          trigger: wake_word
          wakeWord: Hey Reachy
          x: 140
          y: 162
        - id: ww_look
          type: LookAt
          bpmn:name: Face the speaker
          target: face
          x: 240
          y: 140
        - id: ww_talk
          type: Converse
          bpmn:name: Chat
          model: claude-haiku-4-5
          persona: |
            You are Reachy, a small, curious desktop robot. Keep replies to one
            or two spoken sentences and never pretend to be human.
          stopPhrase: goodbye
          x: 400
          y: 140
        - id: ww_bye
          type: Gesture
          bpmn:name: Sign off
          move: yes1
          x: 560
          y: 140
        - type: bpmn:SequenceFlow
          sourceRef: ww_wake
          targetRef: ww_look
        - type: bpmn:SequenceFlow
          sourceRef: ww_look
          targetRef: ww_talk
        - type: bpmn:SequenceFlow
          sourceRef: ww_talk
          targetRef: ww_bye
