# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: ML Templates
prefix: ml
description: Presets for statistical and machine learning pipelines.
uri: https://w3id.org/studyflow/ml
icon: iconify tabler--hexagon-letter-m
order: 105
xml:
  tagAlias: lowerCase
version: 26.0812

enumerations: []
types: []

templates:

  - description: Load a bundled sample dataset (scikit-learn's digits) as a table.
    object:
      bpmn:name: Load sample dataset
      type: functional:Transform
      bpmn:documentation: |
        Loads a bundled sample dataset, so a pipeline can run before the real
        data exists.
      icon: iconify mdi--database-import-outline
      keywords:
        - load
        - dataset
        - sample
        - sklearn
        - digits
        - iris
      operationType: load
      implementation: python://sklearn.datasets.load_digits
      additionalArguments: "as_frame: true"

  - description: Group-aware train/test split - keeps every row from a participant on one side.
    object:
      bpmn:name: Train/test split
      type: functional:Transform
      bpmn:documentation: |
        Holds out 20% of the data for testing, grouped so that no participant
        appears in both parts.
      icon: iconify mdi--call-split
      keywords:
        - split
        - train
        - test
        - holdout
        - sklearn
        - leakage
      operationType: splitData
      implementation: python://sklearn.model_selection.GroupShuffleSplit
      additionalArguments: "n_splits: 1\ntest_size: 0.2"

  - description: Project features onto fewer dimensions (PCA) before fitting.
    object:
      bpmn:name: Reduce dimensions
      type: functional:Map
      bpmn:documentation: |
        Builds a PCA projector that maps rows into a lower-dimensional space.
      icon: iconify mdi--arrow-collapse
      keywords:
        - pca
        - dimensionality
        - reduce
        - projection
        - features
      operationType: project
      implementation: python://sklearn.decomposition.PCA
      additionalArguments: "n_components: 16\nwhiten: false"

  - description: Build an unfitted estimator for a later fitting or cross-validation step.
    object:
      bpmn:name: Build estimator
      type: functional:Transform
      bpmn:documentation: |
        Builds an unfitted estimator - here a PCA step followed by a support
        vector classifier - that later steps fit or cross-validate.
      icon: iconify mdi--school-outline
      keywords:
        - build
        - estimator
        - pipeline
        - sklearn
        - classifier
        - model
      operationType: build
      implementation: python://sklearn.pipeline.make_pipeline
      additionalArguments: "args:\n  - implementation: python://sklearn.decomposition.PCA\n    arguments:\n      n_components: 16\n  - implementation: python://sklearn.svm.SVC\n    arguments:\n      kernel: rbf\n      C: 1.0"

  - description: Fit an estimator on data to produce a trained model.
    object:
      bpmn:name: Fit estimator
      type: functional:Reduce
      bpmn:documentation: |
        Trains the incoming estimator on the incoming data and hands on the
        fitted model.
      icon: iconify mdi--sigma
      keywords:
        - fit
        - train
        - estimator
        - sklearn
        - model
      operationType: fit
      implementation: python://sklearn.pipeline.Pipeline.fit

  - description: Build a statistical model from a Wilkinson formula (mixed-effects).
    object:
      bpmn:name: Formula model
      type: functional:Transform
      bpmn:documentation: |
        Builds a mixed-effects model from a formula over the incoming table; a
        later fitting step estimates it.
      icon: iconify mdi--math-integral
      keywords:
        - formula
        - wilkinson
        - lmer
        - mixed
        - regression
        - statsmodels
      operationType: build
      implementation: python://statsmodels.formula.api.mixedlm
      additionalArguments: "formula: rt ~ condition\ngroups: participant_id"

  - description: Score a model on held-out data and report the metrics.
    object:
      bpmn:name: Evaluate
      type: functional:Reduce
      bpmn:documentation: |
        Turns true and predicted labels into a report of the metrics.
      icon: iconify mdi--check-decagram-outline
      keywords:
        - evaluate
        - score
        - metrics
        - report
        - audit
      operationType: evaluate
      implementation: python://sklearn.metrics.classification_report
      additionalArguments: "output_dict: true"

  - description: Fit and score an estimator across cross-validation folds in one step.
    object:
      bpmn:name: Cross-validate
      type: functional:Reduce
      bpmn:documentation: |
        Runs the whole fit-and-score loop over the folds and hands on the
        per-fold scores.
      icon: iconify mdi--layers-triple-outline
      keywords:
        - crossvalidation
        - cv
        - kfold
        - sklearn
        - validate
      operationType: crossValidate
      implementation: python://sklearn.model_selection.cross_validate
      additionalArguments: "cv: 5\nscoring: [accuracy, f1_macro]\nreturn_train_score: false"

  - description: Search a grid of hyperparameter settings for the best one.
    object:
      bpmn:name: Grid search
      type: functional:Transform
      bpmn:documentation: |
        Wraps the incoming estimator in a search over the parameter grid;
        fitting it runs the sweep and keeps the winner.
      icon: iconify mdi--tune-variant
      keywords:
        - gridsearch
        - sweep
        - hyperparameter
        - tuning
        - sklearn
      operationType: build
      implementation: python://sklearn.model_selection.GridSearchCV
      additionalArguments: "param_grid:\n  C: [0.1, 1, 10]\n  kernel: [linear, rbf]\ncv: 5\nscoring: accuracy"

  - description: Persist a fitted model to disk.
    object:
      bpmn:name: Save model
      type: functional:Transform
      bpmn:documentation: |
        Writes the incoming fitted model to the file named by `filename`.
      icon: iconify mdi--content-save-outline
      keywords:
        - save
        - store
        - persist
        - joblib
        - export
      operationType: save
      implementation: python://joblib.dump
      additionalArguments: "filename: results/model.joblib\ncompress: 3"

  - description: A fitted model, produced by a fitting step.
    object:
      bpmn:name: Model
      type: bpmn:DataObjectReference
      bpmn:documentation: |
        The fitted model a step produces; set `uri` to keep it on disk.
      icon: iconify mdi--cube-outline
      keywords:
        - model
        - artifact
        - estimator
        - checkpoint

  - description: A measured quantity - name it after the metric.
    object:
      bpmn:name: Metric
      type: bpmn:DataObjectReference
      bpmn:documentation: |
        A measured value such as `accuracy` or `rmse`, written when the step
        that measures it runs.
      icon: iconify mdi--gauge
      keywords:
        - metric
        - score
        - measure
        - auc
        - accuracy
