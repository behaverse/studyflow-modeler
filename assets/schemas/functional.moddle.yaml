# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Functional
prefix: functional
description: >-
  Generic data operations - transform, map, reduce, and filter - plus presets
  for reading, writing, anonymizing, and grouping data.
uri: https://w3id.org/studyflow/functional
icon: iconify tabler--hexagon-letter-f
core: true   # backs the default elements; always loaded, cannot be disabled
order: 103
xml:
  tagAlias: lowerCase
version: 26.0812


enumerations: []

types:
  - name: Transform
    description: Apply a function to data.
    superClass:
      - bpmn:ServiceTask
    properties:
      # `implementation` comes from the `studyflow:Implementation` trait on bpmn:ServiceTask.
      - name: operationType
        isAttr: true
        default: transform
        type: String
        meta:
          pinned: true
  - name: Map
    description: Apply a function to every item in a data stream.
    superClass:
      - functional:Transform
    properties:
      - name: operationType
        isAttr: true
        type: String
        meta:
          pinned: true
        default: map
        redefines: functional:Transform#operationType
  - name: Reduce
    description: Combine a data stream into a single value.
    superClass:
      - functional:Transform
    meta:
      icon: iconify mdi--sigma
    properties:
      - name: operationType
        isAttr: true
        type: String
        meta:
          pinned: true
        default: reduce
        redefines: functional:Transform#operationType
  - name: Filter
    description: Keep only the items in a data stream that match a condition.
    superClass:
      - functional:Transform
    meta:
      icon: iconify mdi--filter-variant
    properties:
      - name: operationType
        isAttr: true
        type: String
        meta:
          pinned: true
        default: filter
        redefines: functional:Transform#operationType

templates:
  - description: Run the enclosed steps once per item in a collection.
    object:
      bpmn:name: For each
      type: bpmn:SubProcess
      bpmn:documentation: |
        One instance of the enclosed steps per item in the associated
        collection, with the instance outputs collected in order.
      icon: iconify mdi--arrow-split-vertical
      keywords:
        - foreach
        - map
        - fanout
        - items
        - parallel
      loopCharacteristics:
        type: bpmn:MultiInstanceLoopCharacteristics

  - description: Read a file, folder, URL, or dataset into a stream of rows.
    object:
      bpmn:name: Read data
      type: Transform
      bpmn:documentation: |
        Reads the source named by `data_folder` into a stream of rows.
      icon: iconify mdi--input
      keywords:
        - read
        - load
        - import
        - reader
        - csv
        - parquet
        - jsonl
      operationType: read
      implementation: python://datatrove.pipeline.readers.CsvReader
      additionalArguments: "data_folder: data/"

  - description: Write a stream of rows to a file, folder, URL, or dataset.
    object:
      bpmn:name: Write data
      type: Transform
      bpmn:documentation: |
        Writes the incoming rows to the destination named by `output_folder`.
      icon: iconify mdi--output
      keywords:
        - write
        - save
        - export
        - writer
        - persist
      operationType: write
      implementation: python://datatrove.pipeline.writers.ParquetWriter
      additionalArguments: "output_folder: results/"

  - description: Remove or pseudonymize identifying fields before sharing data.
    object:
      bpmn:name: Anonymize Data
      type: Map
      bpmn:documentation: |
        Scrubs emails and IP addresses from each document's text.
      icon: iconify mdi--incognito
      keywords:
        - anonymize
        - pseudonymize
        - deidentify
        - privacy
      operationType: anonymizeData
      implementation: python://datatrove.pipeline.formatters.PIIFormatter
      additionalArguments: "remove_emails: true\nremove_ips: true"

  - description: Split a data stream into groups by a key, such as participant.
    object:
      bpmn:name: Group
      type: Map
      bpmn:documentation: |
        Splits the stream into groups by `key`; the stream has to be sorted by
        that key first.
      icon: iconify mdi--group
      keywords:
        - group
        - groupby
        - partition
      operationType: group
      implementation: python://itertools.groupby
      additionalArguments: "key: participant"
