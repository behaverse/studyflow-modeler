# yaml-language-server: $schema=https://unpkg.com/moddle/resources/schema/moddle.json

name: Functional
prefix: functional
description: >-
  Transform, map, reduce, and filter over data - the generic anchors every domain
  layer binds its verbs onto - plus the generic IO presets (read, write,
  anonymize). What a step does is the software named by `implementation`; a
  fan-out is BPMN's own multi-instance marker.
uri: https://w3id.org/studyflow/functional
icon: iconify tabler--hexagon-letter-f
core: true   # backs the default elements; always loaded, cannot be disabled
order: 30  # registry position (load precedence + settings order)
xml:
  tagAlias: lowerCase
version: 26.0812


enumerations: []

types:
  # ---------------------------------------------------------------------------
  # The functional core: composing functions over data.
  # ---------------------------------------------------------------------------
  - name: Transform
    description: Apply a function to data - the generic step every operation specializes.
    superClass:
      - bpmn:ServiceTask
    meta:
      bpmnType: bpmn:ServiceTask
    properties:
      # `implementation` (the versioned function reference) comes from the
      # `studyflow:Implementation` trait on bpmn:ServiceTask - declared once there.
      - name: operationType
        isAttr: true
        default: transform
        type: String
        meta:
          pinned: true
  - name: Map
    description: Map a function over each element of a data stream, producing a new stream.
    superClass:
      - functional:Transform
    properties:
      - name: operationType
        isAttr: true
        type: String
        meta:
          pinned: true
        default: map
        redefines: functional:Transform#operationType
  - name: Reduce
    description: Reduce a data stream to a single value (a statistic, a fitted model, a report).
    superClass:
      - functional:Transform
    meta:
      icon: iconify mdi--sigma
    properties:
      - name: operationType
        isAttr: true
        type: String
        meta:
          pinned: true
        default: reduce
        redefines: functional:Transform#operationType
  - name: Filter
    description: |
      Filter a data stream based on a condition. Elements that satisfy the predicate are kept; those that don't are removed.
    superClass:
      - functional:Transform
    meta:
      icon: iconify mdi--filter-variant
    properties:
      - name: operationType
        isAttr: true
        type: String
        meta:
          pinned: true
        default: filter
        redefines: functional:Transform#operationType
  # (There is no FlatMap or Compose type: both are a `Transform` bound to a
  # different function, which is what `implementation` is for. A record or a
  # collection is BPMN's own `bpmn:DataObjectReference` - with
  # `isCollection: true` for the native collection marker; a hierarchical
  # workflow is BPMN's native `bpmn:SubProcess`.)

  # ---------------------------------------------------------------------------
  # (There is no fan-out trait either: the multi-instance marker is BPMN's own
  # `loopCharacteristics` child, the collection is the associated data element, the
  # per-instance item is named by the input association's `parameter`, and
  # instance outputs assemble in order into the associated output. Joining them
  # differently - concatenating tables, folding to a statistic - is an
  # explicit downstream step, not workflow configuration.)

templates:
  - description: Fan out over a collection - one instance of the body per item, joined when all finish.
    object:
      bpmn:name: For each
      type: bpmn:SubProcess
      bpmn:documentation: |
        A native sub-process with BPMN's own multi-instance marker: one
        instance per element of the associated collection input (the association's
        `parameter` names the current item inside the body), instance outputs
        assembled in order into the associated collection output - the map step of
        a pipeline (per participant, per file, per eval item). Joining the
        outputs differently (concatenate tables, fold to a statistic) is an
        explicit downstream step.
      icon: iconify mdi--arrow-split-vertical
      keywords:
        - foreach
        - map
        - fanout
        - items
        - parallel
      loopCharacteristics:
        type: bpmn:MultiInstanceLoopCharacteristics

  - description: Read data from a file, folder, URL, or dataset into a stream of rows/documents.
    object:
      bpmn:name: Read data
      type: Transform
      bpmn:documentation: |
        Read a source into a stream of rows/documents. Bound to the datatrove
        library's `CsvReader`; repoint `implementation` at any of its readers
        (`ParquetReader`, `JsonlReader`, `HuggingFaceDatasetReader`,
        `WarcReader`) or your own loader without changing the step's shape.
        The source location is the `data_folder` argument (a folder path, glob
        pattern, URL, or dataset identifier).
      icon: iconify mdi--input
      keywords:
        - read
        - load
        - import
        - reader
        - csv
        - parquet
        - jsonl
      operationType: read
      implementation: python://datatrove.pipeline.readers.CsvReader
      additionalArguments: "data_folder: data/"

  - description: Write a stream of rows/documents to a file, folder, URL, or dataset.
    object:
      bpmn:name: Write data
      type: Transform
      bpmn:documentation: |
        Persist a stream of rows/documents. Bound to the datatrove library's
        `ParquetWriter`; repoint `implementation` at any of its writers
        (`JsonlWriter`, `HuggingFaceDatasetWriter`) or your own saver without
        changing the step's shape. The destination is the `output_folder`
        argument (a folder path, URL, or dataset identifier).
      icon: iconify mdi--output
      keywords:
        - write
        - save
        - export
        - writer
        - persist
      operationType: write
      implementation: python://datatrove.pipeline.writers.ParquetWriter
      additionalArguments: "output_folder: results/"

  - description: Remove or pseudonymize identifying fields (datatrove's PII formatter).
    object:
      bpmn:name: Anonymize Data
      type: Map
      bpmn:documentation: |
        Remove or pseudonymize identifying fields before sharing or further
        processing. Bound to the datatrove library's `PIIFormatter` block,
        which scrubs emails and IP addresses from each document's text.
      icon: iconify mdi--incognito
      keywords:
        - anonymize
        - pseudonymize
        - deidentify
        - privacy
      operationType: anonymizeData
      implementation: python://datatrove.pipeline.formatters.PIIFormatter
      additionalArguments: "remove_emails: true\nremove_ips: true"

  - description: Partition a data stream into named groups by a key (e.g., participant, condition, block).
    object:
      bpmn:name: Group
      type: Map
      bpmn:documentation: |
        Partition a data stream into named groups by a key (e.g., participant,
        condition, block). Bound to Python's own `itertools.groupby(iterable,
        key)` - the stream is sorted by the key first, as groupby requires.
      icon: iconify mdi--group
      keywords:
        - group
        - groupby
        - partition
      operationType: group
      implementation: python://itertools.groupby
      additionalArguments: "key: participant"
